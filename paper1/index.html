બ્દ UNESCO એ 2002 માં વાપર્યો; MOOC શબ્દ 2008 માં (Dave Cormier).</span></div>"]],"1-5":[["મૂલ્યાંકન (Evaluation) – પરિચય","<p>મૂલ્યાંકન એ અધ્યેતાએ શૈક્ષણિક હેતુઓ કેટલા પ્રમાણમાં પ્રાપ્ત કર્યા છે તે નક્કી કરવાની <b>સતત અને વ્યાપક પ્રક્રિયા</b> છે.</p><ul><li><b>માપન (Measurement)</b>: સંખ્યાત્મક વર્ણન (દા.ત. 70 ગુણ) – માત્રાત્મક</li><li><b>મૂલ્યાંકન (Evaluation)</b>: માપન + મૂલ્ય નિર્ણય (Value judgement) – ગુણાત્મક + માત્રાત્મક</li><li><b>આકારણી (Assessment)</b>: અધ્યયન સુધારવા માહિતી એકઠી કરવી</li></ul><div class=\"tk\"><i>★</i><span>સૂત્ર: <b>Evaluation = Measurement + Value judgement</b></span></div>"],["મૂલ્યાંકનનાં તત્ત્વો (Elements)","<ul><li><b>શૈક્ષણિક હેતુઓ</b> (Objectives) – શું પ્રાપ્ત કરવું છે</li><li><b>અધ્યયન અનુભવો</b> (Learning experiences) – કેવી રીતે શીખવ્યું</li><li><b>વર્તન પરિવર્તન</b> (Behaviour change) – શું બદલાયું</li><li>આ ત્રણનો સંબંધ = <b>મૂલ્યાંકન ત્રિકોણ</b> (Triangular relationship) – B.S. Bloom</li><li>સારી કસોટીના ગુણો: <b>વિશ્વસનીયતા (Reliability)</b>, <b>યથાર્થતા (Validity)</b>, <b>વસ્તુલક્ષિતા (Objectivity)</b>, <b>વ્યવહારુતા (Usability)</b></li></ul>"],["સારી કસોટીના ગુણધર્મો","<div class=\"tw\"><table><thead><tr><th>ગુણ</th><th>અર્થ</th></tr></thead><tbody><tr><td>યથાર્થતા (Validity)</td><td>જે માપવાનું છે તે જ માપે</td></tr><tr><td>વિશ્વસનીયતા (Reliability)</td><td>વારંવાર માપતાં સમાન પરિણામ</td></tr><tr><td>વસ્તુલક્ષિતા (Objectivity)</td><td>પરીક્ષકના પૂર્વગ્રહથી મુક્ત</td></tr><tr><td>વિભેદકતા (Discrimination)</td><td>હોશિયાર અને નબળા વચ્ચે ભેદ</td></tr><tr><td>વ્યાપકતા (Comprehensiveness)</td><td>સમગ્ર અભ્યાસક્રમ આવરે</td></tr><tr><td>વ્યવહારુતા (Practicability)</td><td>સમય, ખર્ચ, સરળતા</td></tr></tbody></table></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: વિશ્વસનીય કસોટી યથાર્થ ન પણ હોય; પણ યથાર્થ કસોટી વિશ્વસનીય હોવી જ જોઈએ.</span></div>"],["મૂલ્યાંકનના પ્રકારો","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ક્યારે</th><th>હેતુ</th></tr></thead><tbody><tr><td>Placement (સ્થાન નિર્ધારણ)</td><td>શરૂઆતમાં</td><td>યોગ્ય વર્ગ/કોર્સમાં મૂકવા</td></tr><tr><td>Diagnostic (નિદાનાત્મક)</td><td>દરમિયાન</td><td>મુશ્કેલીનું કારણ શોધવા</td></tr><tr><td>Formative (રચનાત્મક)</td><td>દરમિયાન, સતત</td><td>અધ્યયન સુધારવા</td></tr><tr><td>Summative (સંકલિત/સત્રાંત)</td><td>અંતે</td><td>ગ્રેડ, પ્રમાણપત્ર</td></tr></tbody></table></div><ul><li>Formative/Summative શબ્દ: <b>Michael Scriven (1967)</b></li><li><b>Assessment FOR learning</b> = Formative; <b>Assessment OF learning</b> = Summative; <b>Assessment AS learning</b> = Self-assessment</li></ul>"],["Norm-referenced vs Criterion-referenced","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>Norm-referenced</th><th>Criterion-referenced</th></tr></thead><tbody><tr><td>તુલના</td><td>જૂથના બીજા સાથે</td><td>નિશ્ચિત ધોરણ સાથે</td></tr><tr><td>પરિણામ</td><td>ક્રમ, Percentile</td><td>પાસ/નાપાસ, Mastery</td></tr><tr><td>ઉદાહરણ</td><td>સ્પર્ધાત્મક પરીક્ષા (NET Top %)</td><td>ડ્રાઇવિંગ ટેસ્ટ</td></tr></tbody></table></div><ul><li><b>CCE</b> (Continuous and Comprehensive Evaluation): શૈક્ષિક + સહ-શૈક્ષિક બંને પાસાં</li><li><b>Ipsative assessment</b>: અધ્યેતાની પોતાની અગાઉની કામગીરી સાથે તુલના</li></ul>"],["CBCS – Choice Based Credit System","<ul><li>UGC દ્વારા <b>2015-16</b> થી અમલ</li><li>અભ્યાસક્રમના પ્રકાર: <b>Core</b>, <b>Elective</b> (Discipline Specific, Generic), <b>Ability Enhancement (AECC)</b>, <b>Skill Enhancement (SEC)</b></li><li><b>Credit</b>: સામાન્ય રીતે 1 ક્રેડિટ = પ્રતિ સપ્તાહ 1 કલાક થિયરી (અથવા 2 કલાક પ્રેક્ટિકલ) એક સત્ર સુધી</li><li>ગ્રેડિંગ: <b>10-પોઇન્ટ સ્કેલ</b> – O (10), A+ (9), A (8), B+ (7), B (6), C (5), P (4), F (0)</li><li><b>SGPA</b> = સત્રનો સરેરાશ; <b>CGPA</b> = સમગ્ર કાર્યક્રમનો સરેરાશ</li><li>ફાયદો: ગતિશીલતા, પસંદગી, ક્રેડિટ ટ્રાન્સફર</li></ul><div class=\"tk\"><i>★</i><span>SGPA = Σ(ક્રેડિટ × ગ્રેડ પોઇન્ટ) ÷ Σ ક્રેડિટ</span></div>"],["Computer Based Test (CBT) અને નવીનતાઓ","<ul><li><b>CBT</b>: કમ્પ્યુટર પર લેવાતી પરીક્ષા – NTA દ્વારા UGC NET (2018 થી CBT)</li><li><b>Computer Adaptive Test (CAT)</b>: જવાબ પ્રમાણે આગળના પ્રશ્નની કઠિનતા બદલાય (દા.ત. GRE)</li><li><b>Online proctoring</b>: AI આધારિત દેખરેખ</li><li><b>Open book exam</b>, <b>On-demand exam</b></li><li><b>e-Portfolio</b>, <b>Rubrics</b>, Peer assessment, Self assessment</li><li><b>Item bank / Question bank</b>, <b>OMR</b> આધારિત તપાસ</li><li><b>ABC (Academic Bank of Credits)</b> – NEP 2020 હેઠળ ડિજિટલ ક્રેડિટ સંગ્રહ</li></ul>"],["પ્રશ્નોના પ્રકાર અને Blueprint","<ul><li><b>વસ્તુલક્ષી (Objective)</b>: MCQ, ખરા-ખોટા, જોડકાં, ખાલી જગ્યા</li><li><b>ટૂંકા જવાબી (Short answer)</b>, <b>નિબંધાત્મક (Essay type)</b></li><li><b>Blueprint</b> (નીલનકશો): હેતુ × વિષયવસ્તુ × પ્રશ્ન પ્રકાર × ગુણભાર નું કોષ્ટક</li><li><b>Item analysis</b>: કઠિનતા સૂચક (Difficulty index) અને વિભેદકતા સૂચક (Discrimination index)</li><li>Difficulty index (p) = સાચા જવાબ આપનારની સંખ્યા ÷ કુલ સંખ્યા; p ઊંચો = સરળ પ્રશ્ન</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Difficulty index જેટલો વધુ, પ્રશ્ન એટલો <b>સરળ</b>.</span></div>"],["Grading અને Rubrics","<ul><li><b>Absolute grading</b>: નિશ્ચિત ગુણ મર્યાદા</li><li><b>Relative grading</b>: જૂથના દેખાવ પ્રમાણે (Curve)</li><li><b>Rubric</b>: માપદંડ (Criteria) અને સ્તર (Levels) સાથેનું ગુણાંકન માર્ગદર્શન – વસ્તુલક્ષિતા વધારે</li><li><b>Holistic rubric</b>: એકંદર ગુણ; <b>Analytic rubric</b>: દરેક માપદંડના અલગ ગુણ</li><li>Continuous Internal Assessment (CIA) + End Semester Exam (ESE)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Formative assessment</b></td><td>Assessment supporting ongoing improvement</td></tr><tr><td><b>Summative assessment</b></td><td>Assessment at the end of instruction</td></tr><tr><td><b>Diagnostic assessment</b></td><td>Assessment identifying specific difficulties</td></tr><tr><td><b>Criterion-referenced test</b></td><td>Performance compared with defined standards</td></tr><tr><td><b>Norm-referenced test</b></td><td>Performance compared with a reference group</td></tr><tr><td><b>Validity</b></td><td>Measuring the intended construct</td></tr><tr><td><b>Reliability</b></td><td>Consistency of measurement</td></tr><tr><td><b>Rubric</b></td><td>Criteria with described performance levels</td></tr><tr><td><b>Portfolio</b></td><td>Collection of evidence of learning</td></tr><tr><td><b>CBCS</b></td><td>Choice Based Credit System</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>\"અધ્યાપન દરમિયાન સુધારા માટે\" → <b>Formative</b></li><li>\"સત્રના અંતે ગ્રેડ\" → <b>Summative</b></li><li>\"મુશ્કેલીનું કારણ\" → <b>Diagnostic</b></li><li>\"જૂથ સાથે તુલના\" → <b>Norm-referenced</b>; \"નિશ્ચિત ધોરણ\" → <b>Criterion-referenced</b></li><li>CBCS: UGC 2015, 10-point grade, O = 10</li><li>માપન = સંખ્યા; મૂલ્યાંકન = સંખ્યા + નિર્ણય</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>P D F S</b>\" – Placement, Diagnostic, Formative, Summative (ક્રમ પ્રમાણે)</span></div>"]],"2-0":[["સંશોધન એટલે શું? (Meaning of Research)","<p>સંશોધન (Research) એટલે નવું જ્ઞાન મેળવવા, હકીકતો ચકાસવા અથવા સમસ્યા ઉકેલવા માટેની <b>વ્યવસ્થિત, તાર્કિક અને વસ્તુલક્ષી તપાસ</b>.</p><ul><li>Re + Search = ફરીથી શોધવું</li><li><b>Redman &amp; Mory</b>: નવું જ્ઞાન મેળવવાનો વ્યવસ્થિત પ્રયાસ</li><li><b>Clifford Woody</b>: સમસ્યા વ્યાખ્યાયિત કરવી, ઉત્કલ્પના રચવી, માહિતી એકઠી કરવી, નિષ્કર્ષ કાઢવા અને ચકાસવા</li><li><b>John W. Best</b>: વૈજ્ઞાનિક પદ્ધતિનો ઔપચારિક, વ્યવસ્થિત અને સઘન ઉપયોગ</li></ul><div class=\"nt\">સંશોધન = પ્રશ્ન → પદ્ધતિ → પુરાવા → નિષ્કર્ષ</div>"],["સંશોધનની લાક્ષણિકતાઓ","<ul><li><b>વ્યવસ્થિત (Systematic)</b> અને <b>તાર્કિક (Logical)</b></li><li><b>અનુભવજન્ય (Empirical)</b>: અવલોકન આધારિત પુરાવા</li><li><b>વસ્તુલક્ષી (Objective)</b>: પૂર્વગ્રહ મુક્ત</li><li><b>પુનરાવર્તનીય (Replicable)</b>: બીજા સંશોધક ફરી કરી શકે</li><li><b>નિયંત્રિત (Controlled)</b> અને <b>ચોક્કસ (Precise)</b></li><li><b>સામાન્યીકરણ યોગ્ય (Generalisable)</b></li><li><b>ચકાસણી યોગ્ય (Verifiable)</b> અને મિથ્યાકરણ યોગ્ય (Falsifiable – Karl Popper)</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>S-E-O-R</b>\" – Systematic, Empirical, Objective, Replicable</span></div>"],["સંશોધનના પ્રકારો – હેતુ આધારિત","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>હેતુ</th></tr></thead><tbody><tr><td>મૂળભૂત/શુદ્ધ (Basic/Pure/Fundamental)</td><td>સિદ્ધાંત રચના, જ્ઞાન વિસ્તરણ</td></tr><tr><td>પ્રયુક્ત (Applied)</td><td>વ્યવહારુ સમસ્યા ઉકેલ</td></tr><tr><td>ક્રિયાત્મક (Action)</td><td>સ્થાનિક, તાત્કાલિક સુધારણા</td></tr><tr><td>મૂલ્યાંકનાત્મક (Evaluation)</td><td>કાર્યક્રમની અસરકારકતા</td></tr></tbody></table></div><ul><li><b>Action research</b> શબ્દ: <b>Kurt Lewin (1946)</b>; શિક્ષણમાં <b>Stephen Corey (1953)</b></li><li>Action research ચક્ર: <b>Plan → Act → Observe → Reflect</b></li></ul><div class=\"tk\"><i>★</i><span>Lewin = Action research ના પિતા</span></div>"],["સંશોધનના અન્ય વર્ગીકરણ","<ul><li><b>પદ્ધતિ આધારે</b>: સંખ્યાત્મક (Quantitative), ગુણાત્મક (Qualitative), મિશ્ર (Mixed)</li><li><b>સમય આધારે</b>: Cross-sectional (એક સમયે) vs Longitudinal (લાંબા સમય સુધી)</li><li><b>તપાસના સ્વરૂપે</b>: Exploratory (શોધાત્મક), Descriptive (વર્ણનાત્મક), Explanatory/Causal (કારણાત્મક)</li><li><b>સ્થળ આધારે</b>: Laboratory, Field, Library/Desk research</li><li><b>Conceptual</b> (વિચાર/સિદ્ધાંત) vs <b>Empirical</b> (માહિતી આધારિત)</li><li><b>Analytical</b>: ઉપલબ્ધ હકીકતોનું વિશ્લેષણ</li></ul>"],["પ્રત્યક્ષવાદ (Positivism)","<ul><li>પ્રવર્તક: <b>Auguste Comte</b> (ફ્રેન્ચ; સમાજશાસ્ત્રના પિતા)</li><li>જ્ઞાન માત્ર <b>અવલોકનક્ષમ અને માપી શકાય તેવા પુરાવા</b> પરથી</li><li>વાસ્તવિકતા એક અને વસ્તુલક્ષી (Objective reality)</li><li>સંશોધક તટસ્થ, મૂલ્યમુક્ત (Value-free)</li><li>પદ્ધતિ: <b>નિગમનાત્મક (Deductive)</b>, પ્રયોગ, સર્વે, આંકડાશાસ્ત્ર</li><li>સંખ્યાત્મક સંશોધનનો આધાર</li><li><b>Logical positivism</b>: Vienna Circle</li></ul>"],["ઉત્તર પ્રત્યક્ષવાદ (Post-positivism) અને અન્ય દૃષ્ટિકોણ","<ul><li><b>Post-positivism</b>: વાસ્તવિકતા છે, પણ સંપૂર્ણ રીતે જાણી શકાતી નથી; જ્ઞાન <b>કામચલાઉ અને ભૂલપાત્ર (Tentative &amp; Fallible)</b></li><li>Karl Popper: <b>મિથ્યાકરણ (Falsification)</b> – સિદ્ધાંતને સાબિત નહીં, ખોટો ઠેરવવાનો પ્રયાસ</li><li><b>Interpretivism/Constructivism</b>: વાસ્તવિકતા સામાજિક રીતે રચાયેલી, બહુવિધ; ગુણાત્મક સંશોધન</li><li><b>Critical theory</b>: સત્તા, અસમાનતા અને પરિવર્તન પર ભાર (Frankfurt School)</li><li><b>Pragmatism</b>: \"જે કામ કરે તે સાચું\" – મિશ્ર પદ્ધતિનો આધાર (Dewey, Peirce, James)</li></ul>"],["તુલના: પ્રત્યક્ષવાદ vs ઉત્તર પ્રત્યક્ષવાદ vs અર્થઘટનવાદ","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>પ્રત્યક્ષવાદ</th><th>ઉત્તર પ્રત્યક્ષવાદ</th><th>અર્થઘટનવાદ</th></tr></thead><tbody><tr><td>વાસ્તવિકતા</td><td>એક, નિશ્ચિત</td><td>એક, પણ અપૂર્ણ રીતે જાણી શકાય</td><td>બહુવિધ, રચિત</td></tr><tr><td>જ્ઞાન</td><td>નિશ્ચિત સત્ય</td><td>સંભાવના, કામચલાઉ</td><td>સંદર્ભગત અર્થ</td></tr><tr><td>સંશોધક</td><td>તટસ્થ</td><td>પૂર્વગ્રહ ઘટાડવાનો પ્રયાસ</td><td>સહભાગી</td></tr><tr><td>પદ્ધતિ</td><td>સંખ્યાત્મક</td><td>મુખ્યત્વે સંખ્યાત્મક + ગુણાત્મક</td><td>ગુણાત્મક</td></tr></tbody></table></div>"],["Ontology, Epistemology અને Methodology","<ul><li><b>Ontology (સત્તામીમાંસા)</b>: વાસ્તવિકતાનું સ્વરૂપ શું છે?</li><li><b>Epistemology (જ્ઞાનમીમાંસા)</b>: આપણે કેવી રીતે જાણીએ છીએ? જ્ઞાન શું છે?</li><li><b>Axiology (મૂલ્યમીમાંસા)</b>: સંશોધનમાં મૂલ્યોની ભૂમિકા</li><li><b>Methodology (પદ્ધતિશાસ્ત્ર)</b>: જ્ઞાન મેળવવાની વ્યૂહરચના</li><li><b>Method (પદ્ધતિ)</b>: માહિતી એકઠી કરવાનું ચોક્કસ સાધન (પ્રશ્નાવલિ, મુલાકાત)</li><li><b>Paradigm</b> (Thomas Kuhn, 1962 – \"The Structure of Scientific Revolutions\")</li></ul><div class=\"tk\"><i>★</i><span>Ontology = \"<b>શું છે?</b>\", Epistemology = \"<b>કેવી રીતે જાણીએ?</b>\"</span></div>"],["મહત્વની પરિભાષા","<ul><li><b>Theory</b>: હકીકતો સમજાવતો વ્યવસ્થિત વિચારસમૂહ</li><li><b>Concept / Construct</b>: અમૂર્ત વિચાર (બુદ્ધિ, વલણ)</li><li><b>Variable (ચલ)</b>: જે મૂલ્ય બદલાય – સ્વતંત્ર (Independent), આશ્રિત (Dependent), મધ્યસ્થ (Moderator), હસ્તક્ષેપી (Intervening), બાહ્ય (Extraneous)</li><li><b>Empirical</b>: અવલોકન/અનુભવ આધારિત</li><li><b>Inductive</b>: વિશેષથી સામાન્ય તરફ; <b>Deductive</b>: સામાન્યથી વિશેષ તરફ</li><li><b>Serendipity</b>: અણધારી શોધ</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Basic research</b></td><td>Research developing fundamental understanding</td></tr><tr><td><b>Applied research</b></td><td>Research addressing a practical problem</td></tr><tr><td><b>Action research</b></td><td>Local systematic inquiry for improvement</td></tr><tr><td><b>Positivism</b></td><td>Emphasis on observable measurable evidence</td></tr><tr><td><b>Postpositivism</b></td><td>Knowledge viewed as tentative and fallible</td></tr><tr><td><b>Empirical research</b></td><td>Inquiry based on observed evidence</td></tr><tr><td><b>Research problem</b></td><td>Issue requiring systematic investigation</td></tr><tr><td><b>Hypothesis</b></td><td>Testable proposed relationship</td></tr><tr><td><b>Theory</b></td><td>Organised explanatory framework</td></tr><tr><td><b>Replication</b></td><td>Repeating a study to examine findings</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>\"<b>સિદ્ધાંત રચના, જ્ઞાન વિસ્તરણ</b>\" → મૂળભૂત સંશોધન</li><li>\"<b>વ્યવહારુ સમસ્યા</b>\" → પ્રયુક્ત સંશોધન</li><li>\"<b>વર્ગખંડની તાત્કાલિક સમસ્યા, શિક્ષક પોતે</b>\" → ક્રિયાત્મક સંશોધન</li><li>\"<b>માપી શકાય તેવા પુરાવા, Comte</b>\" → પ્રત્યક્ષવાદ</li><li>\"<b>જ્ઞાન કામચલાઉ, ભૂલપાત્ર, Popper</b>\" → ઉત્તર પ્રત્યક્ષવાદ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Paradigm shift = Thomas Kuhn; Falsification = Karl Popper; Positivism = Comte.</span></div>"]],"2-1":[["સંશોધન પદ્ધતિઓ – પરિચય","<p>સંશોધન પદ્ધતિ (Research method) એટલે સંશોધન પ્રશ્નનો જવાબ મેળવવા અપનાવાતી વ્યૂહરચના. GSET અભ્યાસક્રમની મુખ્ય પદ્ધતિઓ:</p><ul><li><b>પ્રયોગાત્મક (Experimental)</b></li><li><b>વર્ણનાત્મક (Descriptive)</b></li><li><b>ઐતિહાસિક (Historical)</b></li><li><b>ગુણાત્મક (Qualitative)</b> અને <b>સંખ્યાત્મક (Quantitative)</b></li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: John W. Best – ત્રણ મુખ્ય: <b>Historical (ભૂતકાળ), Descriptive (વર્તમાન), Experimental (ભવિષ્ય – શું થશે)</b></span></div>"],["પ્રયોગાત્મક પદ્ધતિ (Experimental Method)","<ul><li><b>કારણ-અસર (Cause-effect)</b> સંબંધ તપાસવાની સૌથી શક્તિશાળી પદ્ધતિ</li><li>સ્વતંત્ર ચલમાં <b>હેરફેર (Manipulation)</b>, બાહ્ય ચલનું <b>નિયંત્રણ (Control)</b>, આશ્રિત ચલનું <b>માપન</b></li><li><b>પ્રાયોગિક જૂથ (Experimental group)</b> – સારવાર મળે; <b>નિયંત્રિત જૂથ (Control group)</b> – સારવાર ન મળે</li><li><b>Random assignment</b> (યાદૃચ્છિક ફાળવણી)</li><li>ડિઝાઇન: Pre-experimental, <b>True experimental</b>, <b>Quasi-experimental</b> (random assignment વગર)</li><li><b>J.S. Mill</b> ની પદ્ધતિઓ: Agreement, Difference, Concomitant variation</li></ul>"],["પ્રયોગની યથાર્થતા (Validity)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th></tr></thead><tbody><tr><td>આંતરિક યથાર્થતા (Internal)</td><td>પરિણામ ખરેખર સ્વતંત્ર ચલને કારણે છે?</td></tr><tr><td>બાહ્ય યથાર્થતા (External)</td><td>પરિણામ બીજી પરિસ્થિતિમાં સામાન્યીકૃત થઈ શકે?</td></tr></tbody></table></div><ul><li>આંતરિક યથાર્થતાના ભય (Campbell &amp; Stanley): <b>History, Maturation, Testing, Instrumentation, Regression, Selection, Mortality</b></li><li><b>Hawthorne effect</b>: અવલોકન થાય છે તે જાણવાથી વર્તન બદલાય</li><li><b>Placebo effect</b>, <b>John Henry effect</b> (નિયંત્રિત જૂથ વધુ મહેનત કરે)</li></ul><div class=\"tk\"><i>★</i><span>ભય ટ્રિક: \"<b>HMT-IRSM</b>\"</span></div>"],["વર્ણનાત્મક પદ્ધતિ (Descriptive Method)","<ul><li><b>\"શું છે\" (What is)</b> – વર્તમાન સ્થિતિનું વર્ણન; ચલમાં હેરફેર નહીં</li><li>પ્રકારો: <b>સર્વેક્ષણ (Survey)</b>, <b>વ્યક્તિ અભ્યાસ (Case study)</b>, <b>સહસંબંધ અભ્યાસ (Correlational)</b>, <b>વિકાસાત્મક (Developmental)</b>, <b>કારણાત્મક-તુલનાત્મક (Ex-post facto)</b>, <b>વિષયવસ્તુ વિશ્લેષણ (Content analysis)</b></li><li><b>Ex-post facto</b>: ઘટના બની ગયા પછી કારણ શોધવું (હેરફેર શક્ય નથી)</li><li><b>Case study</b>: Frederic Le Play ને પ્રણેતા માનવામાં આવે છે</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: સહસંબંધ ≠ કારણ (Correlation does not imply causation).</span></div>"],["ઐતિહાસિક પદ્ધતિ (Historical Method)","<ul><li><b>ભૂતકાળ</b>ની ઘટનાઓનો વ્યવસ્થિત અભ્યાસ</li><li><b>પ્રાથમિક સ્રોત (Primary)</b>: મૂળ દસ્તાવેજ, શિલાલેખ, પ્રત્યક્ષદર્શી</li><li><b>ગૌણ સ્રોત (Secondary)</b>: બીજાએ લખેલ વર્ણન, પાઠ્યપુસ્તક</li><li><b>બાહ્ય ટીકા (External criticism)</b>: દસ્તાવેજ <b>અસલી (Genuine)</b> છે?</li><li><b>આંતરિક ટીકા (Internal criticism)</b>: વિષયવસ્તુ <b>વિશ્વસનીય/સાચી (Credible)</b> છે?</li></ul><div class=\"tk\"><i>★</i><span>બાહ્ય = \"<b>Authenticity</b>\" (અસલીપણું), આંતરિક = \"<b>Accuracy</b>\" (સચ્ચાઈ)</span></div>"],["ગુણાત્મક સંશોધન (Qualitative Research)","<ul><li>અર્થ, અનુભવ, દૃષ્ટિકોણની <b>ઊંડાણપૂર્વક</b> સમજ</li><li>માહિતી: શબ્દો, ચિત્રો, વર્ણન; નાનો, હેતુપૂર્ણ નમૂનો</li><li>પ્રકારો / અભિગમો:</li><li><b>Ethnography</b> (સંસ્કૃતિ – Malinowski), <b>Phenomenology</b> (જીવંત અનુભવ – Husserl)</li><li><b>Grounded theory</b> (માહિતી પરથી સિદ્ધાંત – <b>Glaser &amp; Strauss, 1967</b>)</li><li><b>Narrative</b>, <b>Case study</b>, <b>Action research</b></li><li>સાધનો: સહભાગી અવલોકન, ઊંડાણ મુલાકાત, Focus group discussion</li><li>વિશ્વસનીયતા = <b>Trustworthiness</b> (Lincoln &amp; Guba): Credibility, Transferability, Dependability, Confirmability</li></ul>"],["સંખ્યાત્મક સંશોધન (Quantitative Research)","<ul><li>સંખ્યા, માપન, આંકડાકીય વિશ્લેષણ</li><li>ઉત્કલ્પના ચકાસણી, મોટો યાદૃચ્છિક નમૂનો, સામાન્યીકરણ</li><li>સાધનો: પ્રશ્નાવલિ, માનક કસોટી, rating scale</li><li>વિશ્લેષણ: વર્ણનાત્મક આંકડાશાસ્ત્ર (Mean, SD) અને અનુમાનાત્મક (t-test, ANOVA, Chi-square, Correlation, Regression)</li><li><b>Triangulation</b> (Denzin): એકથી વધુ સ્રોત/પદ્ધતિ/સંશોધક દ્વારા ચકાસણી</li></ul>"],["ગુણાત્મક vs સંખ્યાત્મક – તુલના","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>ગુણાત્મક</th><th>સંખ્યાત્મક</th></tr></thead><tbody><tr><td>હેતુ</td><td>સમજ, અર્થ</td><td>માપન, ચકાસણી</td></tr><tr><td>તર્ક</td><td>આગમનાત્મક (Inductive)</td><td>નિગમનાત્મક (Deductive)</td></tr><tr><td>નમૂનો</td><td>નાનો, હેતુપૂર્ણ</td><td>મોટો, યાદૃચ્છિક</td></tr><tr><td>માહિતી</td><td>શબ્દો</td><td>સંખ્યા</td></tr><tr><td>સંશોધક</td><td>સાધન પોતે</td><td>તટસ્થ</td></tr><tr><td>દૃષ્ટિકોણ</td><td>અર્થઘટનવાદ</td><td>પ્રત્યક્ષવાદ</td></tr></tbody></table></div><ul><li><b>Mixed methods</b>: બંનેનું સંયોજન (Creswell) – Convergent, Explanatory sequential, Exploratory sequential</li></ul>"],["નમૂના પદ્ધતિઓ (Sampling)","<div class=\"tw\"><table><thead><tr><th>સંભાવના (Probability)</th><th>બિન-સંભાવના (Non-probability)</th></tr></thead><tbody><tr><td>સાદી યાદૃચ્છિક (Simple random)</td><td>સગવડ (Convenience)</td></tr><tr><td>વ્યવસ્થિત (Systematic – દર kમો)</td><td>હેતુપૂર્ણ (Purposive/Judgement)</td></tr><tr><td>સ્તરીકૃત (Stratified)</td><td>કોટા (Quota)</td></tr><tr><td>ગુચ્છ (Cluster)</td><td>Snowball (સાંકળ)</td></tr><tr><td>બહુ-તબક્કા (Multi-stage)</td><td>Self-selection</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>સંભાવના = \"<b>દરેકને સમાન તક</b>\"; Snowball = છુપી વસ્તી (Hidden population)</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Experimental research</b></td><td>Manipulation to investigate causal effects</td></tr><tr><td><b>Descriptive research</b></td><td>Description of existing characteristics</td></tr><tr><td><b>Historical research</b></td><td>Investigation using evidence from the past</td></tr><tr><td><b>Qualitative research</b></td><td>Inquiry into meanings and experiences</td></tr><tr><td><b>Quantitative research</b></td><td>Inquiry using numerical measurement</td></tr><tr><td><b>Mixed methods</b></td><td>Combining qualitative and quantitative inquiry</td></tr><tr><td><b>Case study</b></td><td>Intensive study of a bounded case</td></tr><tr><td><b>Survey</b></td><td>Collecting responses from a defined sample</td></tr><tr><td><b>Ethnography</b></td><td>Study of a cultural group in context</td></tr><tr><td><b>Phenomenology</b></td><td>Study of lived experience</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>\"<b>કારણ-અસર, હેરફેર, નિયંત્રિત જૂથ</b>\" → પ્રયોગાત્મક</li><li>\"<b>વર્તમાન સ્થિતિ, સર્વે</b>\" → વર્ણનાત્મક</li><li>\"<b>ભૂતકાળ, દસ્તાવેજ, બાહ્ય-આંતરિક ટીકા</b>\" → ઐતિહાસિક</li><li>\"<b>અર્થ, અનુભવ, ઊંડાણ</b>\" → ગુણાત્મક</li><li>\"<b>સંખ્યા, આંકડા, સામાન્યીકરણ</b>\" → સંખ્યાત્મક</li><li>Grounded theory = Glaser &amp; Strauss (1967)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Quasi-experimental માં random assignment નથી હોતું.</span></div>"]],"2-2":[["સંશોધનનાં સોપાનો – પરિચય","<p>સંશોધન એક ક્રમિક પ્રક્રિયા છે. દરેક સોપાન આગળના સોપાનનો આધાર બને છે.</p><ul><li>સામાન્ય ક્રમ: <b>સમસ્યા ઓળખ → સાહિત્ય સમીક્ષા → હેતુ/ઉત્કલ્પના → સંશોધન ડિઝાઇન → નમૂના પસંદગી → માહિતી એકત્રીકરણ → વિશ્લેષણ → અર્થઘટન → અહેવાલ લેખન</b></li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>સ સા ઉ ડિ ન મા વિ અ અ</b>\"</span></div><div class=\"nt\">પ્રથમ સોપાન = સમસ્યાની ઓળખ; અંતિમ = અહેવાલ/શોધનિબંધ લેખન.</div>"],["1. સંશોધન સમસ્યાની પસંદગી અને વ્યાખ્યા","<ul><li>સમસ્યાના સ્રોત: અનુભવ, સાહિત્ય, સિદ્ધાંત, નિષ્ણાત, સામાજિક જરૂરિયાત</li><li>સારી સમસ્યાના માપદંડ: <b>નવીનતા, મહત્વ, સંશોધનક્ષમતા (Researchable), સંસાધનો, સમય, સંશોધકનો રસ, નૈતિકતા</b></li><li><b>FINER માપદંડ</b>: Feasible, Interesting, Novel, Ethical, Relevant</li><li>સમસ્યા કથન (Problem statement) – સ્પષ્ટ, ચોક્કસ, ચલો દર્શાવે</li><li><b>કાર્યાત્મક વ્યાખ્યા (Operational definition)</b>: ચલને કેવી રીતે માપવો તે સ્પષ્ટ કરે</li></ul>"],["2. સંબંધિત સાહિત્યની સમીક્ષા (Review of Literature)","<ul><li>હેતુ: <b>સંશોધન અંતર (Research gap)</b> શોધવું, પુનરાવર્તન ટાળવું, પદ્ધતિ પસંદ કરવી, સૈદ્ધાંતિક માળખું</li><li>સ્રોત: સામયિકો, શોધનિબંધ (Shodhganga), પુસ્તકો, ડેટાબેઝ (Scopus, Web of Science, JSTOR, ERIC)</li><li><b>Systematic review</b>: પૂર્વ નિર્ધારિત પદ્ધતિથી સમીક્ષા (PRISMA)</li><li><b>Meta-analysis</b>: અનેક અભ્યાસોના પરિણામોનું આંકડાકીય સંયોજન (Gene Glass, 1976)</li></ul><div class=\"tk\"><i>★</i><span>Literature review નો મુખ્ય લાભ = <b>Research gap</b></span></div>"],["3. હેતુઓ અને ઉત્કલ્પના (Hypothesis)","<ul><li><b>ઉત્કલ્પના</b>: બે કે વધુ ચલ વચ્ચેના સંબંધ વિશેનું <b>ચકાસી શકાય તેવું કામચલાઉ વિધાન</b></li><li><b>શૂન્ય ઉત્કલ્પના (H₀ – Null)</b>: કોઈ તફાવત/સંબંધ નથી – <b>R.A. Fisher</b></li><li><b>વૈકલ્પિક/સંશોધન ઉત્કલ્પના (H₁)</b>: તફાવત/સંબંધ છે</li><li><b>દિશાત્મક (Directional – One-tailed)</b> vs <b>બિન-દિશાત્મક (Two-tailed)</b></li><li>સારી ઉત્કલ્પના: ચકાસણી યોગ્ય, સ્પષ્ટ, સરળ, સિદ્ધાંત સાથે સુસંગત</li><li>ગુણાત્મક સંશોધનમાં સામાન્ય રીતે ઉત્કલ્પના નહીં, <b>સંશોધન પ્રશ્નો</b></li></ul>"],["Type I અને Type II ભૂલ","<div class=\"tw\"><table><thead><tr><th></th><th>H₀ સાચી છે</th><th>H₀ ખોટી છે</th></tr></thead><tbody><tr><td>H₀ નકારી</td><td><b>Type I ભૂલ (α)</b></td><td>સાચો નિર્ણય (Power)</td></tr><tr><td>H₀ સ્વીકારી</td><td>સાચો નિર્ણય</td><td><b>Type II ભૂલ (β)</b></td></tr></tbody></table></div><ul><li>Type I = સાચી H₀ ને નકારવી (False positive); α = સાર્થકતા સ્તર (0.05 / 0.01)</li><li>Type II = ખોટી H₀ ને સ્વીકારવી (False negative)</li><li><b>Power = 1 − β</b></li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: Type <b>I</b> = \"<b>I</b>nnocent ને સજા\", Type II = \"ગુનેગાર છૂટ્યો\"</span></div>"],["4. સંશોધન ડિઝાઇન અને 5. નમૂના પસંદગી","<ul><li><b>સંશોધન ડિઝાઇન</b>: સંશોધનની રૂપરેખા/નકશો (Blueprint) – Kerlinger</li><li>ડિઝાઇન નક્કી કરે: શું, ક્યાં, ક્યારે, કેટલું, કેવી રીતે</li><li><b>વસ્તી (Population/Universe)</b>: અભ્યાસના તમામ એકમો</li><li><b>નમૂનો (Sample)</b>: વસ્તીમાંથી પસંદ કરેલો પ્રતિનિધિ ભાગ</li><li><b>Sampling frame</b>: વસ્તીના એકમોની યાદી</li><li><b>Sampling error</b>: નમૂના અને વસ્તી વચ્ચેનો તફાવત; નમૂનાનું કદ વધે → ભૂલ ઘટે</li></ul>"],["6. માહિતી એકત્રીકરણનાં સાધનો","<div class=\"tw\"><table><thead><tr><th>સાધન</th><th>લક્ષણ</th></tr></thead><tbody><tr><td>પ્રશ્નાવલિ (Questionnaire)</td><td>લેખિત, મોટો નમૂનો, ઓછો ખર્ચ</td></tr><tr><td>અનુસૂચિ (Schedule)</td><td>સંશોધક પોતે ભરે, અભણ ઉત્તરદાતા માટે</td></tr><tr><td>મુલાકાત (Interview)</td><td>Structured, Semi-structured, Unstructured</td></tr><tr><td>અવલોકન (Observation)</td><td>સહભાગી / બિન-સહભાગી</td></tr><tr><td>માપદંડ (Scale)</td><td>Likert (1932), Thurstone, Guttman, Semantic differential (Osgood)</td></tr><tr><td>કસોટી (Test)</td><td>સિદ્ધિ, બુદ્ધિ, અભિયોગ્યતા</td></tr></tbody></table></div><ul><li><b>Likert scale</b>: Rensis Likert – સામાન્ય રીતે 5 બિંદુ (સંપૂર્ણ સંમત → સંપૂર્ણ અસંમત)</li><li><b>Pilot study</b>: સાધનની પૂર્વ ચકાસણી</li></ul>"],["7-8. વિશ્લેષણ અને અર્થઘટન","<ul><li><b>માહિતી સંપાદન (Editing) → સંકેતીકરણ (Coding) → વર્ગીકરણ → કોષ્ટકીકરણ (Tabulation)</b></li><li><b>વર્ણનાત્મક આંકડાશાસ્ત્ર</b>: Mean, Median, Mode, SD, Range</li><li><b>અનુમાનાત્મક આંકડાશાસ્ત્ર</b>: t-test (2 જૂથ), ANOVA (3+ જૂથ – Fisher), Chi-square (આવૃત્તિ/સ્વતંત્રતા – Karl Pearson), Correlation (Pearson r, Spearman ρ), Regression</li><li><b>Parametric</b> (સામાન્ય વિતરણ ધારણા) vs <b>Non-parametric</b> (ધારણા વગર: Chi-square, Mann-Whitney)</li><li>સોફ્ટવેર: SPSS, R, Excel, NVivo/ATLAS.ti (ગુણાત્મક)</li></ul>"],["9. અહેવાલ લેખન (Report Writing)","<ul><li>અહેવાલનું માળખું: <b>શીર્ષક પૃષ્ઠ → પ્રમાણપત્ર/ઘોષણા → આભાર → અનુક્રમણિકા → પ્રકરણો → સંદર્ભસૂચિ → પરિશિષ્ટ</b></li><li>મુખ્ય પ્રકરણો: પરિચય, સાહિત્ય સમીક્ષા, પદ્ધતિ, વિશ્લેષણ, તારણો-સૂચનો</li><li><b>IMRAD</b>: Introduction, Methods, Results, And Discussion</li><li>ભાષા: વસ્તુલક્ષી, ભૂતકાળ, તૃતીય પુરુષ</li><li>અંતે: મર્યાદાઓ અને ભાવિ સંશોધન માટે સૂચનો</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Problem identification</b></td><td>Defining what needs investigation</td></tr><tr><td><b>Literature review</b></td><td>Examining existing relevant research</td></tr><tr><td><b>Research question</b></td><td>Specific question guiding the inquiry</td></tr><tr><td><b>Operational definition</b></td><td>Specifying how a variable is measured</td></tr><tr><td><b>Research design</b></td><td>Plan for conducting a study</td></tr><tr><td><b>Sampling</b></td><td>Selecting units from a population</td></tr><tr><td><b>Data collection</b></td><td>Obtaining evidence for analysis</td></tr><tr><td><b>Data analysis</b></td><td>Examining data to address questions</td></tr><tr><td><b>Interpretation</b></td><td>Explaining the meaning of findings</td></tr><tr><td><b>Reporting</b></td><td>Communicating methods and results</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>પ્રથમ સોપાન = <b>સમસ્યાની ઓળખ</b></li><li>Research gap = <b>સાહિત્ય સમીક્ષા</b> થી</li><li>H₀ = કોઈ તફાવત નહીં; Type I = સાચી H₀ નકારી</li><li>2 જૂથ સરખામણી = t-test; 3+ = ANOVA; આવૃત્તિ = Chi-square</li><li>Pilot study = સાધનની પૂર્વ ચકાસણી</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Hypothesis \"સાબિત\" થતી નથી; તે \"સમર્થિત\" (Supported) અથવા \"નકારાય\" (Rejected) છે.</span></div>"]],"2-3":[["શોધનિબંધ અને સંશોધન પેપર – પરિચય","<ul><li><b>શોધનિબંધ (Thesis/Dissertation)</b>: પદવી (M.Phil/Ph.D) માટે રજૂ થતો વિસ્તૃત સંશોધન અહેવાલ</li><li><b>સંશોધન પેપર (Research Paper/Article)</b>: સામયિકમાં પ્રકાશિત ટૂંકો, કેન્દ્રિત અહેવાલ</li><li>UK માં: Ph.D = Thesis, Master = Dissertation; USA માં ઘણી વાર ઊલટું</li><li>બંનેનો હેતુ: નવા જ્ઞાનનું સંચાર, પારદર્શકતા, પુનરાવર્તનીયતા</li></ul>"],["શોધનિબંધનું માળખું","<div class=\"tw\"><table><thead><tr><th>ભાગ</th><th>સમાવિષ્ટ</th></tr></thead><tbody><tr><td>પ્રારંભિક (Preliminary)</td><td>શીર્ષક, ઘોષણા, પ્રમાણપત્ર, આભાર, અનુક્રમણિકા, કોષ્ટક/આકૃતિ યાદી, સંક્ષેપ</td></tr><tr><td>મુખ્ય (Main body)</td><td>પરિચય, સાહિત્ય સમીક્ષા, પદ્ધતિ, વિશ્લેષણ, તારણો, ચર્ચા</td></tr><tr><td>અંતિમ (Reference matter)</td><td>સંદર્ભસૂચિ, પરિશિષ્ટ (Appendix), સૂચિ (Index)</td></tr></tbody></table></div><ul><li>સામાન્ય રીતે 5-6 પ્રકરણો</li><li><b>Synopsis</b>: સંશોધન શરૂ કરતાં પહેલાં રજૂ થતી રૂપરેખા (Proposal)</li></ul>"],["સંશોધન પેપરનું માળખું (IMRAD)","<ul><li><b>Title</b> – ટૂંકું, માહિતીપ્રદ</li><li><b>Abstract</b> – 150-300 શબ્દ: હેતુ, પદ્ધતિ, તારણ, નિષ્કર્ષ</li><li><b>Keywords</b> – 4-6</li><li><b>Introduction</b> – પૃષ્ઠભૂમિ, અંતર, હેતુ</li><li><b>Methods</b> – પદ્ધતિ, નમૂનો, સાધનો</li><li><b>Results</b> – તારણો, કોષ્ટકો</li><li><b>Discussion</b> – અર્થઘટન, મર્યાદા</li><li><b>Conclusion</b>, <b>References</b></li></ul><div class=\"tk\"><i>★</i><span>IMRAD = \"<b>I M R A D</b>\" – Introduction, Methods, Results And Discussion</span></div>"],["Abstract, Synopsis અને Summary","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ક્યાં</th><th>લક્ષણ</th></tr></thead><tbody><tr><td>Abstract</td><td>પેપર/શોધનિબંધની શરૂઆતમાં</td><td>ટૂંકો સાર</td></tr><tr><td>Synopsis</td><td>સંશોધન પહેલાં</td><td>યોજના/પ્રસ્તાવ</td></tr><tr><td>Executive summary</td><td>અહેવાલની શરૂઆતમાં</td><td>નીતિ ઘડનારા માટે</td></tr><tr><td>Summary</td><td>અંતે</td><td>મુખ્ય તારણો</td></tr></tbody></table></div><ul><li><b>Structured abstract</b>: Background, Objective, Methods, Results, Conclusion શીર્ષકો સાથે</li></ul>"],["સંદર્ભલેખન (Referencing) – મહત્વ","<ul><li>અન્યના વિચારોને <b>શ્રેય (Credit)</b> આપવો</li><li><b>સાહિત્યચોરી (Plagiarism)</b> ટાળવી</li><li>વાચકને મૂળ સ્રોત સુધી પહોંચાડવો</li><li><b>In-text citation</b>: લખાણની અંદર ટૂંકો ઉલ્લેખ – (Patel, 2020)</li><li><b>Reference list</b>: માત્ર ઉલ્લેખિત સ્રોતો; <b>Bibliography</b>: વાંચેલા બધા સ્રોતો</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Reference list = ઉલ્લેખિત જ; Bibliography = ઉલ્લેખિત + વાંચેલા.</span></div>"],["મુખ્ય સંદર્ભ શૈલીઓ","<div class=\"tw\"><table><thead><tr><th>શૈલી</th><th>પૂરું નામ</th><th>ક્ષેત્ર</th><th>પદ્ધતિ</th></tr></thead><tbody><tr><td>APA</td><td>American Psychological Association</td><td>મનોવિજ્ઞાન, શિક્ષણ, સામાજિક વિજ્ઞાન</td><td>Author-date</td></tr><tr><td>MLA</td><td>Modern Language Association</td><td>ભાષા, સાહિત્ય, માનવવિદ્યા</td><td>Author-page</td></tr><tr><td>Chicago/Turabian</td><td>Univ. of Chicago Press</td><td>ઇતિહાસ</td><td>Notes-bibliography / Author-date</td></tr><tr><td>Harvard</td><td>—</td><td>વ્યાપક</td><td>Author-date</td></tr><tr><td>IEEE</td><td>Inst. of Electrical &amp; Electronics Engineers</td><td>ઇજનેરી</td><td>ક્રમાંક [1]</td></tr><tr><td>Vancouver</td><td>—</td><td>તબીબી વિજ્ઞાન</td><td>ક્રમાંક</td></tr></tbody></table></div><ul><li>APA ની વર્તમાન આવૃત્તિ: <b>7મી (2019)</b>; MLA: <b>9મી (2021)</b>; Chicago: <b>17મી (2017)</b> (18મી 2024)</li></ul>"],["APA અને MLA ઉદાહરણ","<p><b>APA 7 (પુસ્તક)</b>:</p><ul><li>Patel, D. N. (2020). *Research methodology*. Sanvi Publications.</li></ul><p><b>APA (In-text)</b>: (Patel, 2020) અથવા Patel (2020)</p><p><b>MLA 9 (પુસ્તક)</b>:</p><ul><li>Patel, Dinesh N. *Research Methodology*. Sanvi Publications, 2020.</li></ul><p><b>MLA (In-text)</b>: (Patel 45) – પૃષ્ઠ ક્રમાંક, વર્ષ નહીં</p><div class=\"tk\"><i>★</i><span>APA = <b>વર્ષ</b> મહત્વ (Author-date); MLA = <b>પૃષ્ઠ</b> મહત્વ (Author-page)</span></div>"],["લેખન શૈલી અને અન્ય પરિભાષા","<ul><li><b>Ibid.</b> (Ibidem) – તે જ સ્રોત, તરત પહેલાનો</li><li><b>Op. cit.</b> (Opere citato) – અગાઉ ઉલ્લેખિત કૃતિમાં</li><li><b>Loc. cit.</b> (Loco citato) – તે જ સ્થાને</li><li><b>et al.</b> – અને અન્ય (3+ લેખક APA 7 માં પહેલેથી et al.)</li><li><b>sic</b> – મૂળમાં જેમ છે તેમ</li><li><b>cf.</b> – સરખાવો; <b>viz.</b> – એટલે કે; <b>e.g.</b> – ઉદાહરણ તરીકે; <b>i.e.</b> – એટલે કે</li><li><b>Footnote</b> (પાના નીચે), <b>Endnote</b> (પ્રકરણ/પુસ્તક અંતે)</li></ul>"],["સંશોધન પ્રકાશન અને માપદંડ","<ul><li><b>Peer review</b>: નિષ્ણાતો દ્વારા સમીક્ષા – Single blind, Double blind, Open</li><li><b>Impact Factor</b>: Eugene Garfield; Clarivate (Journal Citation Reports)</li><li><b>h-index</b>: <b>J.E. Hirsch (2005)</b> – h પેપરને ઓછામાં ઓછા h ઉલ્લેખ</li><li><b>i10-index</b>: Google Scholar – 10+ ઉલ્લેખવાળા પેપરની સંખ્યા</li><li><b>DOI</b>: Digital Object Identifier; <b>ISSN</b> (સામયિક – 8 અંક), <b>ISBN</b> (પુસ્તક – 13 અંક)</li><li><b>ORCID</b>: સંશોધકનો અનન્ય ID (16 અંક)</li><li><b>UGC-CARE</b>: Consortium for Academic and Research Ethics (2019)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>In-text citation</b></td><td>Source acknowledgement within the text</td></tr><tr><td><b>Reference list</b></td><td>Details of sources cited in the work</td></tr><tr><td><b>Bibliography</b></td><td>List of sources consulted or relevant</td></tr><tr><td><b>Abstract</b></td><td>Concise overview of a study</td></tr><tr><td><b>Method section</b></td><td>Description of procedures and design</td></tr><tr><td><b>Results section</b></td><td>Presentation of study findings</td></tr><tr><td><b>Discussion section</b></td><td>Interpretation of results and implications</td></tr><tr><td><b>Paraphrase</b></td><td>Restating an idea with source acknowledgement</td></tr><tr><td><b>Quotation</b></td><td>Reproducing exact words with attribution</td></tr><tr><td><b>DOI</b></td><td>Persistent identifier for a digital object</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>APA = મનોવિજ્ઞાન/શિક્ષણ, Author-date, 7th ed.</li><li>MLA = સાહિત્ય/ભાષા, Author-page, 9th ed.</li><li>IEEE = ઇજનેરી, ક્રમાંક [1]</li><li>Ibid = તરત પહેલાનો સ્રોત</li><li>ISSN = 8 અંક, ISBN = 13 અંક, ORCID = 16 અંક</li><li>h-index = Hirsch 2005</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Abstract પેપરની શરૂઆતમાં આવે છે, પણ સામાન્ય રીતે <b>છેલ્લે લખાય</b> છે.</span></div>"]],"2-4":[["સંશોધનમાં ICT – પરિચય","<p>માહિતી અને પ્રત્યાયન ટેકનોલોજી (ICT) એ સંશોધનના દરેક તબક્કાને ઝડપી, ચોક્કસ અને વ્યાપક બનાવ્યો છે.</p><ul><li>સાહિત્ય શોધ → માહિતી એકત્રીકરણ → વિશ્લેષણ → લેખન → સંદર્ભ વ્યવસ્થાપન → સાહિત્યચોરી તપાસ → પ્રકાશન → પ્રસાર</li></ul><div class=\"nt\">ICT = Hardware + Software + Internet + Databases + Communication tools</div>"],["સાહિત્ય શોધ માટે ICT","<ul><li><b>Search engines</b>: Google Scholar, Microsoft Academic (બંધ 2021), Semantic Scholar</li><li><b>Databases</b>: Scopus (Elsevier, 2004), Web of Science (Clarivate), JSTOR, ERIC (શિક્ષણ), PubMed (તબીબી), ProQuest</li><li><b>Boolean operators</b>: <b>AND</b> (બંને – પરિણામ ઘટે), <b>OR</b> (કોઈ એક – પરિણામ વધે), <b>NOT</b> (બાકાત)</li><li>Truncation (*) – teach* → teacher, teaching; Phrase search (\"...\")</li></ul><div class=\"tk\"><i>★</i><span>AND = \"<b>સંકુચિત</b>\", OR = \"<b>વિસ્તૃત</b>\"</span></div>"],["ભારતીય ઓનલાઇન સંશોધન સંસાધનો (INFLIBNET)","<div class=\"tw\"><table><thead><tr><th>સંસાધન</th><th>ઉપયોગ</th></tr></thead><tbody><tr><td><b>Shodhganga</b></td><td>Ph.D શોધનિબંધોનો ભંડાર (Reservoir)</td></tr><tr><td><b>Shodhgangotri</b></td><td>સંશોધન પ્રસ્તાવ/Synopsis નો ભંડાર</td></tr><tr><td><b>Shodhshuddhi</b></td><td>સાહિત્યચોરી તપાસ (URKUND/Ouriginal → હવે DrillBit)</td></tr><tr><td><b>e-ShodhSindhu</b></td><td>e-journals, e-books નું consortium</td></tr><tr><td><b>Vidwan</b></td><td>નિષ્ણાતોનો ડેટાબેઝ</td></tr><tr><td><b>IRINS</b></td><td>સંસ્થાકીય સંશોધન માહિતી પ્રણાલી</td></tr><tr><td><b>e-PG Pathshala</b></td><td>અનુસ્નાતક e-content</td></tr></tbody></table></div><ul><li><b>INFLIBNET</b>: Information and Library Network Centre, <b>ગાંધીનગર</b>, UGC નું સ્વાયત્ત કેન્દ્ર (1991)</li></ul><div class=\"tk\"><i>★</i><span>ગંગા = શોધનિબંધ (પૂર્ણ), ગંગોત્રી = પ્રસ્તાવ (શરૂઆત – નદીનું ઉદ્ગમ)</span></div>"],["માહિતી એકત્રીકરણ માટે ICT","<ul><li>Online survey: <b>Google Forms, SurveyMonkey, Microsoft Forms, Qualtrics, KoboToolbox</b></li><li>Video interview: Zoom, Google Meet, MS Teams</li><li>Mobile data collection apps, GPS/GIS</li><li>Social media data, Web scraping</li><li>Big data અને Open data portals (data.gov.in)</li></ul>"],["માહિતી વિશ્લેષણ સોફ્ટવેર","<div class=\"tw\"><table><thead><tr><th>સોફ્ટવેર</th><th>ઉપયોગ</th></tr></thead><tbody><tr><td>SPSS (IBM)</td><td>સંખ્યાત્મક આંકડાકીય વિશ્લેષણ</td></tr><tr><td>R</td><td>મુક્ત (Open-source) આંકડાકીય ભાષા</td></tr><tr><td>Python</td><td>Data science, Machine learning</td></tr><tr><td>SAS, STATA</td><td>આંકડાકીય વિશ્લેષણ</td></tr><tr><td>AMOS, SmartPLS, LISREL</td><td>SEM (Structural Equation Modelling)</td></tr><tr><td>MS Excel</td><td>મૂળભૂત ગણતરી, ચાર્ટ</td></tr><tr><td><b>NVivo, ATLAS.ti, MAXQDA</b></td><td><b>ગુણાત્મક</b> માહિતી વિશ્લેષણ</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>NVivo/ATLAS.ti = \"<b>Qualitative</b>\"; SPSS/R = \"<b>Quantitative</b>\"</span></div>"],["સંદર્ભ વ્યવસ્થાપન સોફ્ટવેર","<ul><li><b>Mendeley</b> (Elsevier), <b>Zotero</b> (મુક્ત, open-source), <b>EndNote</b> (Clarivate), <b>RefWorks</b>, JabRef (LaTeX માટે)</li><li>કાર્ય: સંદર્ભ સંગ્રહ, PDF વ્યવસ્થાપન, આપોઆપ citation અને bibliography (APA/MLA)</li><li><b>LaTeX / Overleaf</b>: વૈજ્ઞાનિક લેખન; <b>BibTeX</b> સંદર્ભ ફાઇલ</li><li>Grammarly, MS Word – ભાષા સુધારણા</li></ul>"],["સાહિત્યચોરી તપાસ સોફ્ટવેર","<ul><li><b>Turnitin</b>, <b>iThenticate</b>, <b>URKUND/Ouriginal</b>, <b>DrillBit</b> (ભારતમાં INFLIBNET દ્વારા)</li><li><b>Viper</b>, Plagscan, Copyleaks</li><li>UGC Regulations 2018 મુજબ સમાનતા મર્યાદા:</li></ul><div class=\"tw\"><table><thead><tr><th>સ્તર</th><th>સમાનતા</th><th>પરિણામ</th></tr></thead><tbody><tr><td>Level 0</td><td>10% સુધી</td><td>નાની સમાનતા – દંડ નહીં</td></tr><tr><td>Level 1</td><td>10% થી 40%</td><td>સુધારેલી હસ્તપ્રત 6 મહિનામાં</td></tr><tr><td>Level 2</td><td>40% થી 60%</td><td>1 વર્ષ સુધી સુધારેલી હસ્તપ્રત રજૂ કરવાની મનાઈ</td></tr><tr><td>Level 3</td><td>60% થી વધુ</td><td>નોંધણી રદ</td></tr></tbody></table></div>"],["Cloud, સહયોગ અને પ્રસારના સાધનો","<ul><li><b>Cloud storage</b>: Google Drive, OneDrive, Dropbox</li><li><b>સહયોગ</b>: Google Docs, Overleaf, Slack, GitHub</li><li><b>Academic social networks</b>: ResearchGate, Academia.edu</li><li><b>Researcher IDs</b>: ORCID, Scopus Author ID, ResearcherID (Web of Science), Google Scholar profile, Vidwan ID</li><li><b>Open Access</b>: Gold (પ્રકાશક દ્વારા મુક્ત), Green (Repository માં self-archive), Diamond (લેખક/વાચક બંને માટે મફત)</li><li><b>Preprint servers</b>: arXiv, SSRN, bioRxiv</li></ul>"],["AI અને નવા ટ્રેન્ડ","<ul><li>AI writing tools, Literature mapping (Connected Papers, ResearchRabbit), Elicit</li><li>AI ના ઉપયોગમાં પારદર્શકતા અને જવાબદારી જરૂરી</li><li><b>Predatory journals</b>: ફી લઈ ગુણવત્તા વગર પ્રકાશિત કરતા સામયિકો (Jeffrey Beall ની યાદી)</li><li><b>Data repository</b>: Zenodo, Figshare, Dryad</li><li><b>FAIR data principles</b>: Findable, Accessible, Interoperable, Reusable</li></ul><div class=\"tk\"><i>★</i><span>FAIR = \"<b>F A I R</b>\" – માહિતી વહેંચણી નિયમ</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Reference manager</b></td><td>Software organising sources and citations</td></tr><tr><td><b>Spreadsheet</b></td><td>Software arranging data in cells</td></tr><tr><td><b>Statistical software</b></td><td>Software performing data analysis</td></tr><tr><td><b>Database search</b></td><td>Retrieval of indexed information</td></tr><tr><td><b>Cloud backup</b></td><td>Remote copy supporting data recovery</td></tr><tr><td><b>Version control</b></td><td>Tracking changes to files</td></tr><tr><td><b>Online survey</b></td><td>Questionnaire distributed digitally</td></tr><tr><td><b>Data visualisation</b></td><td>Graphical representation of data</td></tr><tr><td><b>Encrypted storage</b></td><td>Storage protecting data using cryptography</td></tr><tr><td><b>Repository</b></td><td>Managed collection of research outputs</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Shodhganga = Ph.D thesis; Shodhgangotri = synopsis; INFLIBNET = ગાંધીનગર</li><li>Mendeley/Zotero/EndNote = સંદર્ભ વ્યવસ્થાપન</li><li>Turnitin/URKUND/DrillBit = સાહિત્યચોરી તપાસ</li><li>NVivo/ATLAS.ti = ગુણાત્મક; SPSS/R = સંખ્યાત્મક</li><li>UGC 2018: 10% સુધી સલામત; 60%+ = નોંધણી રદ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Boolean \"AND\" વાપરવાથી પરિણામ <b>ઘટે</b> છે, વધતા નથી.</span></div>"]],"2-5":[["સંશોધન આચારસંહિતા (Research Ethics) – પરિચય","<p>સંશોધન આચારસંહિતા એટલે સંશોધન દરમિયાન <b>પ્રામાણિકતા, જવાબદારી, આદર અને ન્યાય</b> જાળવવા માટેના નૈતિક સિદ્ધાંતો અને નિયમો.</p><ul><li>સંશોધન સહભાગીઓનું રક્ષણ</li><li>વૈજ્ઞાનિક સત્યતા અને વિશ્વસનીયતા જાળવવી</li><li>સમાજનો સંશોધન પરનો વિશ્વાસ ટકાવવો</li></ul><div class=\"nt\">Research integrity = સત્ય, પારદર્શકતા, જવાબદારી</div>"],["Belmont Report (1979) – ત્રણ મૂળભૂત સિદ્ધાંતો","<div class=\"tw\"><table><thead><tr><th>સિદ્ધાંત</th><th>અર્થ</th><th>અમલ</th></tr></thead><tbody><tr><td>વ્યક્તિ પ્રત્યે આદર (Respect for persons)</td><td>સ્વાયત્તતા, નબળાનું રક્ષણ</td><td>જાણકાર સંમતિ (Informed consent)</td></tr><tr><td>હિતકારિતા (Beneficence)</td><td>નુકસાન નહીં, લાભ મહત્તમ</td><td>જોખમ-લાભ મૂલ્યાંકન</td></tr><tr><td>ન્યાય (Justice)</td><td>લાભ-ભારનું સમાન વિતરણ</td><td>સહભાગીઓની ન્યાયી પસંદગી</td></tr></tbody></table></div><ul><li><b>Nuremberg Code (1947)</b>: સ્વૈચ્છિક સંમતિ આવશ્યક</li><li><b>Declaration of Helsinki (1964)</b>: World Medical Association – માનવ પર તબીબી સંશોધન</li></ul><div class=\"tk\"><i>★</i><span>Belmont = \"<b>R B J</b>\" – Respect, Beneficence, Justice</span></div>"],["સહભાગીઓના અધિકારો","<ul><li><b>જાણકાર સંમતિ (Informed consent)</b>: હેતુ, પ્રક્રિયા, જોખમ જાણ્યા પછી સ્વૈચ્છિક સંમતિ</li><li><b>સ્વૈચ્છિક ભાગીદારી</b> અને ગમે ત્યારે <b>પાછા હટવાનો અધિકાર (Right to withdraw)</b></li><li><b>ગોપનીયતા (Confidentiality)</b>: માહિતી ખાનગી રાખવી</li><li><b>અનામિતા (Anonymity)</b>: ઓળખ જ ન જાણી શકાય</li><li><b>નુકસાનથી રક્ષણ (No harm)</b> – શારીરિક, માનસિક, સામાજિક</li><li><b>Debriefing</b>: છેતરપિંડીવાળા અભ્યાસ પછી સાચી માહિતી આપવી</li><li>બાળકો માટે: વાલીની સંમતિ (Consent) + બાળકની સ્વીકૃતિ (Assent)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Anonymity = સંશોધક પણ ઓળખ જાણતો નથી; Confidentiality = જાણે છે પણ જાહેર નથી કરતો.</span></div>"],["સંશોધન ગેરવર્તન – FFP","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th></tr></thead><tbody><tr><td><b>Fabrication</b> (બનાવટ)</td><td>માહિતી/પરિણામ ઉપજાવી કાઢવા</td></tr><tr><td><b>Falsification</b> (ખોટીકરણ)</td><td>માહિતી, સાધન, પ્રક્રિયામાં હેરફેર</td></tr><tr><td><b>Plagiarism</b> (સાહિત્યચોરી)</td><td>બીજાના વિચાર/શબ્દો શ્રેય વગર વાપરવા</td></tr></tbody></table></div><ul><li>અન્ય ગેરવર્તન: Duplicate publication, Salami slicing, Ghost/Gift authorship, Citation manipulation, Data cooking/trimming</li><li><b>Self-plagiarism</b>: પોતાનું અગાઉનું કામ ઉલ્લેખ વગર ફરી વાપરવું</li></ul><div class=\"tk\"><i>★</i><span>FFP = \"<b>Fake, Fudge, Plagiarise</b>\"</span></div>"],["પ્રકાશન નીતિશાસ્ત્ર (Publication Ethics)","<ul><li><b>COPE</b>: Committee on Publication Ethics (UK, 1997)</li><li><b>Authorship criteria (ICMJE)</b>: મહત્વપૂર્ણ યોગદાન, લેખન/સુધારણા, અંતિમ મંજૂરી, જવાબદારી</li><li><b>Gift/Honorary authorship</b>: યોગદાન વગર નામ ઉમેરવું – અનૈતિક</li><li><b>Ghost authorship</b>: યોગદાન આપનારનું નામ ન લખવું</li><li><b>Salami slicing</b>: એક અભ્યાસને અનેક નાના પેપરમાં વહેંચવું</li><li><b>Conflict of interest</b> જાહેર કરવો</li><li><b>Retraction</b>: ગંભીર ભૂલ/ગેરવર્તન પર પેપર પાછું ખેંચવું (Retraction Watch)</li></ul>"],["સંસ્થાકીય માળખું","<ul><li><b>IEC/IRB</b>: Institutional Ethics Committee / Institutional Review Board – માનવ સંશોધન મંજૂરી</li><li><b>IAEC</b>: Institutional Animal Ethics Committee (પ્રાણી સંશોધન)</li><li><b>ICMR National Ethical Guidelines (2017)</b>: બાયોમેડિકલ અને આરોગ્ય સંશોધન</li><li><b>CPCSEA</b>: પ્રાણી પ્રયોગ નિયંત્રણ સમિતિ</li><li>પ્રાણી સંશોધનના <b>3R</b>: Replacement, Reduction, Refinement (Russell &amp; Burch, 1959)</li></ul><div class=\"tk\"><i>★</i><span>3R = \"<b>બદલો, ઘટાડો, સુધારો</b>\"</span></div>"],["UGC Regulations 2018 (Academic Integrity &amp; Plagiarism)","<ul><li>પૂરું નામ: <b>UGC (Promotion of Academic Integrity and Prevention of Plagiarism in HEIs) Regulations, 2018</b></li><li>દરેક સંસ્થામાં <b>APC</b> (Academic Misconduct Panel) અને <b>IAIP</b> (Institutional Academic Integrity Panel)</li><li>સંશોધક માટે ઘોષણા પત્ર ફરજિયાત</li><li><b>Core work</b> (સારાંશ, પરિણામ, ચર્ચા, નિષ્કર્ષ) માં સાહિત્યચોરી સહન ન થાય</li><li>ફેકલ્ટી દંડ: Level 1 – પેપર પાછું ખેંચવું; Level 2 – 1 વર્ષ ઇન્ક્રીમેન્ટ નહીં, 2 વર્ષ સુપરવાઇઝર નહીં; Level 3 – 2 વર્ષ ઇન્ક્રીમેન્ટ નહીં, 3 વર્ષ સુપરવાઇઝર નહીં</li></ul>"],["UGC-CARE, RPE અને અન્ય પહેલો","<ul><li><b>UGC-CARE</b> (Consortium for Academic and Research Ethics, 2019): ગુણવત્તાપૂર્ણ સામયિકોની યાદી (2025 માં યાદી પ્રથા બંધ કરી માપદંડ આધારિત પ્રણાલી સૂચવાઈ)</li><li><b>RPE કોર્સ</b>: Research and Publication Ethics – Ph.D કોર્સવર્કમાં 2 ક્રેડિટ ફરજિયાત (UGC, 2019 થી)</li><li><b>Predatory journals</b> થી બચવું; <b>Think. Check. Submit.</b> અભિયાન</li><li><b>Open science</b>, <b>Data sharing</b>, <b>Reproducibility</b></li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Informed consent</b></td><td>Voluntary agreement after adequate information</td></tr><tr><td><b>Confidentiality</b></td><td>Protecting information disclosed by participants</td></tr><tr><td><b>Anonymity</b></td><td>Identity not collected or linked to responses</td></tr><tr><td><b>Plagiarism</b></td><td>Presenting another source as one&#x27;s own</td></tr><tr><td><b>Fabrication</b></td><td>Inventing data or results</td></tr><tr><td><b>Falsification</b></td><td>Misrepresenting research data or procedures</td></tr><tr><td><b>Conflict of interest</b></td><td>Interests that may influence judgement</td></tr><tr><td><b>Voluntary participation</b></td><td>Participation without coercion</td></tr><tr><td><b>Right to withdraw</b></td><td>Ability to leave participation as agreed</td></tr><tr><td><b>Ethics review</b></td><td>Independent evaluation of ethical aspects</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Belmont Report (1979): Respect, Beneficence, Justice</li><li>Nuremberg (1947) = સ્વૈચ્છિક સંમતિ; Helsinki (1964) = તબીબી સંશોધન</li><li>FFP = Fabrication, Falsification, Plagiarism</li><li>COPE = પ્રકાશન નીતિશાસ્ત્ર; IEC/IRB = નૈતિક મંજૂરી</li><li>3R = Replacement, Reduction, Refinement (પ્રાણી સંશોધન)</li><li>RPE = 2 ક્રેડિટ ફરજિયાત (UGC)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: યોગ્ય ઉલ્લેખ સાથે અવતરણ (Quotation with citation) સાહિત્યચોરી નથી.</span></div>"]],"3-0":[["આકલન (Comprehension) – પરિચય","<p>GSET પેપર-I માં <b>એક ગદ્યખંડ (Passage)</b> આપીને તેના પર <b>5 પ્રશ્નો (10 ગુણ)</b> પૂછાય છે. આ વિભાગ વાંચન સમજ, તર્ક અને અનુમાન શક્તિ ચકાસે છે.</p><ul><li>ગદ્યખંડ વિષય: શિક્ષણ, પર્યાવરણ, સમાજ, અર્થતંત્ર, વિજ્ઞાન, તત્વજ્ઞાન, સંસ્કૃતિ</li><li>પ્રશ્ન પ્રકાર: <b>મુખ્ય વિચાર, શીર્ષક, હકીકત, અનુમાન, શબ્દાર્થ, લેખકનો સૂર, પુરાવો</b></li><li>જવાબ <b>ગદ્યખંડમાંથી જ</b> – બહારના જ્ઞાનથી નહીં</li></ul><div class=\"nt\">સુવર્ણ નિયમ: \"Passage જે કહે તે જ સાચું – તમારો અભિપ્રાય નહીં.\"</div>"],["વાંચનની વ્યૂહરચના – સોપાનવાર","<ul><li><b>1. પ્રશ્નો પહેલાં ઝડપથી જુઓ</b> – શું શોધવું છે તે ખબર પડે</li><li><b>2. Skimming</b>: ગદ્યખંડ ઝડપથી વાંચી મુખ્ય વિચાર પકડો (પ્રથમ અને છેલ્લો ફકરો ખાસ)</li><li><b>3. Scanning</b>: ચોક્કસ હકીકત, નામ, સંખ્યા શોધો</li><li><b>4. Close reading</b>: મુશ્કેલ ભાગ ધ્યાનથી વાંચો</li><li><b>5. વિકલ્પોની ચકાસણી</b>: Elimination method – ખોટા વિકલ્પ કાઢો</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>પ્ર-સ્કિ-સ્કે-વિ</b>\" – પ્રશ્ન, Skim, Scan, વિકલ્પ નિવારણ</span></div>"],["મુખ્ય વિચાર (Main Idea) અને શીર્ષક","<ul><li>મુખ્ય વિચાર = સમગ્ર ગદ્યખંડ <b>શા વિશે</b> છે</li><li>સામાન્ય રીતે <b>પ્રથમ</b> અથવા <b>અંતિમ</b> વાક્ય/ફકરામાં</li><li>યોગ્ય શીર્ષક: <b>ન ખૂબ વ્યાપક, ન ખૂબ સંકુચિત</b> – સમગ્ર ગદ્યખંડને આવરે</li><li>ખોટા વિકલ્પો: માત્ર એક ફકરાની વિગત, અતિશય સામાન્ય વાક્ય, ગદ્યખંડ બહારનો વિચાર</li></ul><div class=\"tw\"><table><thead><tr><th>વિકલ્પ પ્રકાર</th><th>નિર્ણય</th></tr></thead><tbody><tr><td>એક ઉદાહરણ/વિગત પર આધારિત</td><td>ખૂબ સંકુચિત ✗</td></tr><tr><td>આખા વિષયક્ષેત્રને આવરે</td><td>ખૂબ વ્યાપક ✗</td></tr><tr><td>કેન્દ્રીય દલીલ દર્શાવે</td><td>સાચો ✓</td></tr></tbody></table></div>"],["હકીકત આધારિત પ્રશ્નો (Factual Questions)","<ul><li>\"ગદ્યખંડ અનુસાર...\", \"લેખક મુજબ...\"</li><li>જવાબ <b>સીધો લખાયેલો</b> હોય છે – ફરી ગદ્યખંડમાં જઈ ચકાસો</li><li><b>Paraphrase</b> પર ધ્યાન: વિકલ્પમાં સમાન અર્થ જુદા શબ્દોમાં હોઈ શકે</li><li>\"<b>Not true / EXCEPT</b>\" પ્રશ્નો: ત્રણ વિકલ્પ ગદ્યખંડમાં હોય, એક ન હોય</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: ગદ્યખંડના <b>શબ્દો જેમના તેમ</b> વાપરતો વિકલ્પ હંમેશા સાચો નથી – અર્થ તપાસો.</span></div>"],["અનુમાન (Inference) આધારિત પ્રશ્નો","<ul><li>\"ગદ્યખંડ પરથી અનુમાન કરી શકાય...\", \"લેખક સૂચવે છે...\"</li><li>અનુમાન = <b>સીધું લખેલું નથી, પણ લખાણ પરથી તાર્કિક રીતે નીકળે</b></li><li>સાચું અનુમાન: ગદ્યખંડના પુરાવા દ્વારા <b>સમર્થિત</b>, મધ્યમ ભાષા</li><li>ખોટું અનુમાન: અતિશયોક્તિ, બહારનું જ્ઞાન, વિરોધી વિચાર</li><li>ચરમ શબ્દો સાવધાનીથી: <b>હંમેશા, ક્યારેય નહીં, બધા, સંપૂર્ણ, માત્ર</b> (Always, Never, All, Only)</li></ul><div class=\"tk\"><i>★</i><span>\"<b>મધ્યમ શબ્દ = મોટે ભાગે સાચો</b>\" (કેટલાક, ઘણી વાર, શક્ય છે)</span></div>"],["શબ્દાર્થ અને સંદર્ભ (Vocabulary in Context)","<ul><li>\"રેખાંકિત શબ્દનો અર્થ <b>આ સંદર્ભમાં</b>...\"</li><li>શબ્દકોશીય અર્થ નહીં, <b>સંદર્ભગત અર્થ</b></li><li>પદ્ધતિ: વિકલ્પ શબ્દને વાક્યમાં મૂકી જુઓ – અર્થ જળવાય છે?</li><li>આસપાસના વાક્યો (Context clues): વ્યાખ્યા, ઉદાહરણ, વિરોધ, પુનરાવર્તન</li><li><b>સમાનાર્થી (Synonym)</b> અને <b>વિરોધી (Antonym)</b> પ્રશ્નો</li></ul>"],["લેખકનો સૂર, હેતુ અને વલણ (Tone &amp; Purpose)","<div class=\"tw\"><table><thead><tr><th>સૂર (Tone)</th><th>સંકેત</th></tr></thead><tbody><tr><td>વસ્તુલક્ષી / તટસ્થ (Objective)</td><td>હકીકતો, આંકડા, સંતુલિત</td></tr><tr><td>વિવેચનાત્મક (Critical)</td><td>ખામીઓ, પ્રશ્નો</td></tr><tr><td>આશાવાદી (Optimistic)</td><td>ભવિષ્ય, ઉકેલ, સંભાવના</td></tr><tr><td>નિરાશાવાદી (Pessimistic)</td><td>ભય, નિષ્ફળતા</td></tr><tr><td>વ્યંગાત્મક (Satirical/Ironic)</td><td>ઊલટો અર્થ, કટાક્ષ</td></tr><tr><td>ચિંતાતુર (Concerned)</td><td>સમસ્યા પર ભાર</td></tr></tbody></table></div><ul><li><b>હેતુ (Purpose)</b>: માહિતી આપવી (Inform), સમજાવવું (Explain), મનાવવું (Persuade), ટીકા કરવી, વર્ણન કરવું</li><li>સામાન્ય રીતે શૈક્ષણિક ગદ્યખંડ <b>વસ્તુલક્ષી / વિશ્લેષણાત્મક</b> હોય છે</li></ul>"],["દલીલ અને પુરાવા (Argument &amp; Evidence)","<ul><li><b>દાવો (Claim)</b>: લેખક શું સાબિત કરવા માંગે છે</li><li><b>પુરાવો (Evidence)</b>: આંકડા, ઉદાહરણ, સંશોધન, નિષ્ણાત મત</li><li><b>ધારણા (Assumption)</b>: લેખકે સ્વીકારી લીધેલી પણ ન લખેલી વાત</li><li>\"દલીલને <b>મજબૂત (Strengthen)</b> કરે\" → નવો સહાયક પુરાવો</li><li>\"દલીલને <b>નબળી (Weaken)</b> કરે\" → વિરોધી પુરાવો / વૈકલ્પિક કારણ</li><li><b>હકીકત (Fact)</b> = ચકાસી શકાય; <b>અભિપ્રાય (Opinion)</b> = માન્યતા/મૂલ્ય</li></ul><div class=\"tk\"><i>★</i><span>Fact = \"<b>સાબિત થઈ શકે</b>\", Opinion = \"<b>લાગે છે, જોઈએ, શ્રેષ્ઠ</b>\"</span></div>"],["સમય વ્યવસ્થાપન અને પ્રેક્ટિસ ટિપ્સ","<ul><li>એક ગદ્યખંડ માટે આશરે <b>8-10 મિનિટ</b></li><li>રોજ સંપાદકીય લેખો (Editorials) વાંચો – The Hindu, Indian Express, ગુજરાતી દૈનિકો</li><li>ફકરા દીઠ 3-4 શબ્દોમાં મુખ્ય મુદ્દો હાંસિયામાં લખો (Margin notes)</li><li><b>Transition words</b> પર ધ્યાન: પરંતુ/However (વિરોધ), તેથી/Therefore (નિષ્કર્ષ), ઉપરાંત/Moreover (ઉમેરો), ઉદાહરણ તરીકે (ઉદાહરણ)</li><li>\"However / પરંતુ\" પછીનો ભાગ સામાન્ય રીતે <b>લેખકનો સાચો મત</b></li></ul>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>જવાબ હંમેશા <b>ગદ્યખંડ આધારિત</b> – બહારનું જ્ઞાન નહીં</li><li>મુખ્ય વિચાર → પ્રથમ/અંતિમ ફકરો</li><li>શીર્ષક → ન વ્યાપક, ન સંકુચિત</li><li>અનુમાન → પુરાવા સમર્થિત, મધ્યમ ભાષા</li><li>\"Always/Never/Only\" વાળા વિકલ્પ → મોટે ભાગે ખોટા</li><li>Elimination: 2 સ્પષ્ટ ખોટા કાઢો, બાકીના 2 વચ્ચે ગદ્યખંડમાં પાછા જાઓ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: સાચું લાગતું પણ ગદ્યખંડમાં ન કહેલું વિધાન = ખોટો જવાબ.</span></div>"]],"4-0":[["પ્રત્યાયન (Communication) – અર્થ","<p>પ્રત્યાયન એટલે વિચારો, માહિતી, લાગણીઓ અને અનુભવોનું <b>બે કે વધુ વ્યક્તિઓ વચ્ચે અર્થપૂર્ણ આદાનપ્રદાન</b>.</p><ul><li>અંગ્રેજી શબ્દ <b>Communication</b> લેટિન <b>\"Communis\"</b> (સામાન્ય/Common) અથવા <b>\"Communicare\"</b> (વહેંચવું) પરથી</li><li>પ્રત્યાયન = સહભાગી સમજ (Shared understanding) ઊભી કરવી</li><li><b>Keith Davis</b>: એક વ્યક્તિથી બીજી વ્યક્તિ સુધી માહિતી અને સમજ પહોંચાડવાની પ્રક્રિયા</li><li><b>Louis Allen</b>: બીજાના મનમાં સમજ ઊભી કરવા માટેની તમામ ક્રિયાઓનો સરવાળો</li></ul><div class=\"tk\"><i>★</i><span>Communis = \"<b>Common</b>\" – પ્રત્યાયનનો હેતુ સમાન સમજ</span></div>"],["પ્રત્યાયન પ્રક્રિયાના તત્ત્વો","<div class=\"tw\"><table><thead><tr><th>તત્ત્વ</th><th>અર્થ</th></tr></thead><tbody><tr><td>પ્રેષક (Sender/Source)</td><td>સંદેશ શરૂ કરનાર</td></tr><tr><td>સંકેતીકરણ (Encoding)</td><td>વિચારને પ્રતીક/શબ્દમાં ફેરવવો</td></tr><tr><td>સંદેશ (Message)</td><td>વહેંચાતી સામગ્રી</td></tr><tr><td>માધ્યમ (Channel/Medium)</td><td>સંદેશ વહન કરનાર (વાણી, પત્ર, ઇમેઇલ)</td></tr><tr><td>ગ્રાહક (Receiver)</td><td>સંદેશ મેળવનાર</td></tr><tr><td>વિસંકેતીકરણ (Decoding)</td><td>પ્રતીકોનું અર્થઘટન</td></tr><tr><td>પ્રતિપોષણ (Feedback)</td><td>ગ્રાહકનો પ્રતિભાવ</td></tr><tr><td>ઘોંઘાટ (Noise)</td><td>વિક્ષેપ/અવરોધ</td></tr><tr><td>સંદર્ભ (Context)</td><td>પરિસ્થિતિ, સંસ્કૃતિ</td></tr></tbody></table></div>"],["પ્રત્યાયનના મોડેલ – ભાગ 1","<ul><li><b>Aristotle</b> (સૌથી જૂનું): Speaker → Speech → Audience (રેટરિક, Ethos-Pathos-Logos)</li><li><b>Lasswell (1948)</b>: <b>Who</b> says <b>What</b> in which <b>Channel</b> to <b>Whom</b> with what <b>Effect</b></li><li><b>Shannon &amp; Weaver (1949)</b>: Information source → Transmitter → Channel (+ <b>Noise</b>) → Receiver → Destination – \"<b>Mother of all models</b>\", ગાણિતિક/રેખીય મોડેલ; Noise નો ખ્યાલ આપ્યો</li><li><b>Berlo (1960)</b>: <b>SMCR</b> – Source, Message, Channel, Receiver</li></ul><div class=\"tk\"><i>★</i><span>Lasswell = \"<b>5W</b>\"; Shannon-Weaver = \"<b>Noise</b>\"; Berlo = \"<b>SMCR</b>\"</span></div>"],["પ્રત્યાયનના મોડેલ – ભાગ 2","<ul><li><b>Osgood &amp; Schramm (1954)</b>: <b>વર્તુળાકાર (Circular)</b> મોડેલ – બંને પક્ષ encoder, decoder, interpreter</li><li><b>Schramm (1954)</b>: <b>Field of experience</b> – સમાન અનુભવક્ષેત્ર હોય ત્યારે જ પ્રત્યાયન સફળ</li><li><b>Westley &amp; MacLean (1957)</b>: Gatekeeper નો ખ્યાલ (સમૂહ માધ્યમ)</li><li><b>Dance (1967)</b>: <b>Helical (Spiral)</b> મોડેલ – પ્રત્યાયન સતત વિકસે</li><li><b>Barnlund (1970)</b>: <b>Transactional</b> મોડેલ – એકસાથે મોકલવું અને મેળવવું</li></ul><div class=\"tw\"><table><thead><tr><th>મોડેલ પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>રેખીય (Linear)</td><td>Aristotle, Lasswell, Shannon-Weaver, Berlo</td></tr><tr><td>આંતરક્રિયાત્મક (Interactive)</td><td>Osgood-Schramm</td></tr><tr><td>વ્યવહારાત્મક (Transactional)</td><td>Barnlund</td></tr></tbody></table></div>"],["પ્રત્યાયનના પ્રકારો – સંખ્યા આધારે","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>આંતરવ્યક્તિગત (Intrapersonal)</td><td>પોતાની સાથે</td><td>ચિંતન, આત્મસંવાદ, ડાયરી</td></tr><tr><td>આંતરવ્યક્તિક (Interpersonal)</td><td>બે વ્યક્તિ</td><td>વાતચીત, મુલાકાત</td></tr><tr><td>જૂથ (Group)</td><td>નાનું જૂથ (3-15)</td><td>ચર્ચા, બેઠક</td></tr><tr><td>જાહેર (Public)</td><td>મોટા શ્રોતા</td><td>ભાષણ, વ્યાખ્યાન</td></tr><tr><td>સમૂહ (Mass)</td><td>વિશાળ, વિખરાયેલા</td><td>TV, અખબાર, રેડિયો</td></tr><tr><td>સંગઠનાત્મક (Organisational)</td><td>સંસ્થામાં</td><td>પરિપત્ર, અહેવાલ</td></tr></tbody></table></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: Intra = અંદર (પોતાની સાથે); Inter = વચ્ચે (બે વ્યક્તિ).</span></div>"],["અન્ય પ્રકારો","<ul><li><b>માધ્યમ આધારે</b>: શાબ્દિક (Verbal – મૌખિક/લેખિત), અશાબ્દિક (Non-verbal)</li><li><b>દિશા આધારે (સંગઠનમાં)</b>:</li><li>ઊર્ધ્વગામી (<b>Upward</b>) – કર્મચારી → અધિકારી (સૂચન, ફરિયાદ)</li><li>અધોગામી (<b>Downward</b>) – અધિકારી → કર્મચારી (આદેશ, સૂચના)</li><li>સમાંતર (<b>Horizontal/Lateral</b>) – સમાન સ્તરે</li><li>ત્રાંસુ (<b>Diagonal</b>) – જુદા વિભાગ, જુદા સ્તરે</li><li><b>ઔપચારિક (Formal)</b> vs <b>અનૌપચારિક (Informal – Grapevine)</b></li><li><b>Grapevine</b>: અનૌપચારિક, ઝડપી, અફવા ફેલાવી શકે (Keith Davis)</li></ul>"],["પ્રત્યાયનની લાક્ષણિકતાઓ","<ul><li><b>દ્વિમાર્ગી પ્રક્રિયા</b> (Two-way) – પ્રતિપોષણ જરૂરી</li><li><b>સતત (Continuous)</b> અને <b>ગતિશીલ (Dynamic)</b></li><li><b>અનિવાર્ય (Inevitable)</b>: \"<b>One cannot not communicate</b>\" – Paul Watzlawick</li><li><b>અપરિવર્તનીય (Irreversible)</b>: કહેલું પાછું લઈ શકાતું નથી</li><li><b>સંદર્ભગત (Contextual)</b> અને <b>સાંસ્કૃતિક</b></li><li><b>હેતુપૂર્ણ (Purposeful)</b></li><li>સંદેશનો અર્થ શબ્દોમાં નહીં, <b>લોકોમાં</b> હોય છે (Meanings are in people)</li></ul><div class=\"tk\"><i>★</i><span>Watzlawick = \"<b>મૌન પણ પ્રત્યાયન છે</b>\"</span></div>"],["પ્રત્યાયનના હેતુઓ અને 7C","<ul><li>હેતુ: માહિતી, શિક્ષણ, મનોરંજન, મનાવવું (Persuasion), પ્રેરણા, નિયંત્રણ, સામાજિક સંબંધ</li><li><b>અસરકારક પ્રત્યાયનના 7 C</b>:</li><li><b>Clear</b> (સ્પષ્ટ), <b>Concise</b> (સંક્ષિપ્ત), <b>Concrete</b> (મૂર્ત), <b>Correct</b> (સાચું), <b>Coherent</b> (સુસંગત), <b>Complete</b> (સંપૂર્ણ), <b>Courteous</b> (વિનમ્ર)</li><li>(કેટલાક લેખકો Considerate પણ ગણે)</li></ul><div class=\"tk\"><i>★</i><span>7C યાદ રાખવા: \"<b>Clear Concise Concrete Correct Coherent Complete Courteous</b>\"</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Sender</b></td><td>Originator of a message</td></tr><tr><td><b>Receiver</b></td><td>Person interpreting a message</td></tr><tr><td><b>Message</b></td><td>Content being communicated</td></tr><tr><td><b>Encoding</b></td><td>Turning an idea into symbols</td></tr><tr><td><b>Decoding</b></td><td>Interpreting received symbols</td></tr><tr><td><b>Channel</b></td><td>Medium carrying a message</td></tr><tr><td><b>Noise</b></td><td>Interference with communication</td></tr><tr><td><b>Context</b></td><td>Situation influencing meaning</td></tr><tr><td><b>Two-way communication</b></td><td>Exchange including response</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Communis = Common; પ્રત્યાયનનો અંતિમ તત્ત્વ = <b>Feedback</b></li><li>Lasswell = 5W; Berlo = SMCR; Shannon-Weaver = Noise (1949)</li><li>Osgood-Schramm = Circular; Barnlund = Transactional; Dance = Helical</li><li>Encoding = વિચાર → પ્રતીક; Decoding = પ્રતીક → અર્થ</li><li>Upward = નીચેથી ઉપર; Grapevine = અનૌપચારિક</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Shannon-Weaver મોડેલમાં મૂળ Feedback નહોતું – તે રેખીય છે.</span></div>"]],"4-1":[["અસરકારક પ્રત્યાયન – પરિચય","<p>અસરકારક પ્રત્યાયન એટલે સંદેશ <b>ઇચ્છિત અર્થ સાથે</b> ગ્રાહક સુધી પહોંચે અને અપેક્ષિત પ્રતિભાવ મળે.</p><ul><li>અભ્યાસક્રમમાં પાંચ સ્વરૂપ: <b>શાબ્દિક, અશાબ્દિક, આંતર-સાંસ્કૃતિક, જૂથ અને વર્ગખંડ પ્રત્યાયન</b></li><li><b>Albert Mehrabian (1971)</b>: લાગણી/વલણ સંબંધિત સંદેશમાં – <b>7% શબ્દો, 38% અવાજ, 55% શરીર ભાષા</b></li></ul><div class=\"tk\"><i>★</i><span>Mehrabian = \"<b>7-38-55</b>\"</span></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: 7-38-55 નિયમ માત્ર લાગણી/વલણ વ્યક્ત કરતા સંદેશ માટે છે, દરેક પ્રત્યાયન માટે નહીં.</span></div>"],["શાબ્દિક પ્રત્યાયન (Verbal Communication)","<ul><li><b>શબ્દો</b>નો ઉપયોગ – મૌખિક (Oral) અને લેખિત (Written)</li></ul><div class=\"tw\"><table><thead><tr><th>મૌખિક</th><th>લેખિત</th></tr></thead><tbody><tr><td>ઝડપી, તાત્કાલિક પ્રતિપોષણ</td><td>કાયમી રેકોર્ડ</td></tr><tr><td>લવચીક, વ્યક્તિગત</td><td>ચોક્કસ, વિચારપૂર્વક</td></tr><tr><td>રેકોર્ડ નથી</td><td>ધીમું, પ્રતિપોષણ મોડું</td></tr><tr><td>ઉદા: વ્યાખ્યાન, ફોન</td><td>ઉદા: પત્ર, અહેવાલ, ઇમેઇલ</td></tr></tbody></table></div><ul><li>સારા શાબ્દિક પ્રત્યાયનના ગુણ: સરળ ભાષા, યોગ્ય શબ્દ પસંદગી, તાર્કિક ક્રમ, ઉદાહરણો</li></ul>"],["અશાબ્દિક પ્રત્યાયન (Non-verbal Communication)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th></tr></thead><tbody><tr><td><b>Kinesics</b> (હાવભાવશાસ્ત્ર)</td><td>શરીર હલનચલન, મુદ્રા, હાવભાવ, ચહેરાના ભાવ – Ray Birdwhistell</td></tr><tr><td><b>Proxemics</b> (અંતરશાસ્ત્ર)</td><td>જગ્યા/અંતરનો ઉપયોગ – <b>Edward T. Hall</b></td></tr><tr><td><b>Paralanguage</b> (પરાભાષા)</td><td>અવાજનો સ્વર, ગતિ, ઊંચાઈ, વિરામ</td></tr><tr><td><b>Chronemics</b></td><td>સમયનો ઉપયોગ (સમયપાલન)</td></tr><tr><td><b>Haptics</b></td><td>સ્પર્શ દ્વારા પ્રત્યાયન</td></tr><tr><td><b>Oculesics</b></td><td>આંખનો સંપર્ક, નજર</td></tr><tr><td><b>Artifacts/Objectics</b></td><td>કપડાં, ઘરેણાં, વસ્તુઓ</td></tr><tr><td><b>Olfactics</b></td><td>ગંધ</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: Kine = <b>ગતિ (Kinetic)</b>, Proxi = <b>નજીક (Proximity)</b>, Haptic = <b>સ્પર્શ</b>, Chrono = <b>સમય</b></span></div>"],["Edward T. Hall ના અંતર ઝોન (Proxemics)","<div class=\"tw\"><table><thead><tr><th>ઝોન</th><th>અંતર (આશરે)</th><th>સંબંધ</th></tr></thead><tbody><tr><td>ઘનિષ્ઠ (Intimate)</td><td>0 – 18 ઇંચ (0–45 cm)</td><td>કુટુંબ, નજીકના</td></tr><tr><td>વ્યક્તિગત (Personal)</td><td>1.5 – 4 ફૂટ (45–120 cm)</td><td>મિત્રો</td></tr><tr><td>સામાજિક (Social)</td><td>4 – 12 ફૂટ (1.2–3.6 m)</td><td>ઔપચારિક, કાર્યસ્થળ</td></tr><tr><td>જાહેર (Public)</td><td>12 ફૂટથી વધુ</td><td>વ્યાખ્યાન, ભાષણ</td></tr></tbody></table></div><ul><li>વર્ગખંડમાં શિક્ષણ સામાન્ય રીતે <b>સામાજિક/જાહેર</b> અંતરમાં</li></ul>"],["આંતર-સાંસ્કૃતિક પ્રત્યાયન (Intercultural)","<ul><li>જુદી સંસ્કૃતિના લોકો વચ્ચે પ્રત્યાયન</li><li><b>Edward T. Hall</b>: <b>High-context</b> (અર્થ સંદર્ભમાં, આડકતરું – ભારત, જાપાન, અરબ) vs <b>Low-context</b> (સ્પષ્ટ, સીધું – USA, જર્મની)</li><li><b>Geert Hofstede</b> ના સાંસ્કૃતિક પરિમાણો: Power distance, Individualism-Collectivism, Masculinity-Femininity, Uncertainty avoidance, Long-term orientation, Indulgence</li><li>અવરોધો: <b>Ethnocentrism</b> (પોતાની સંસ્કૃતિ શ્રેષ્ઠ), Stereotyping, ભાષા, હાવભાવના જુદા અર્થ</li><li>ઉકેલ: સાંસ્કૃતિક સંવેદનશીલતા, સહાનુભૂતિ, સક્રિય શ્રવણ</li></ul>"],["જૂથ પ્રત્યાયન (Group Communication)","<ul><li><b>Bruce Tuckman (1965)</b> – જૂથ વિકાસના તબક્કા: <b>Forming → Storming → Norming → Performing</b> (+ <b>Adjourning</b>, 1977)</li><li>જૂથ ચર્ચાના પ્રકાર: Panel, Symposium, Seminar, Brainstorming, Buzz session, Round table</li><li><b>Groupthink</b> (Irving Janis, 1972): સર્વસંમતિ માટે વિવેચનાત્મક વિચાર દબાઈ જવો</li><li><b>Brainstorming</b>: Alex Osborn – ટીકા વગર વધુમાં વધુ વિચારો</li><li><b>Delphi technique</b>: નિષ્ણાતોની અનામી, બહુ-તબક્કાની સર્વસંમતિ</li></ul><div class=\"tk\"><i>★</i><span>Tuckman = \"<b>F S N P A</b>\" – Form, Storm, Norm, Perform, Adjourn</span></div>"],["વર્ગખંડ પ્રત્યાયન (Classroom Communication)","<ul><li>શિક્ષક-વિદ્યાર્થી, વિદ્યાર્થી-વિદ્યાર્થી આંતરક્રિયા</li><li><b>Flanders Interaction Analysis (FIAC)</b>: 10 વર્ગ – શિક્ષક વાણી (પરોક્ષ 1-4, પ્રત્યક્ષ 5-7), વિદ્યાર્થી વાણી (8-9), મૌન/ગૂંચવણ (10)</li><li>અસરકારક વર્ગ પ્રત્યાયન: સ્પષ્ટ અવાજ, આંખનો સંપર્ક, પ્રશ્નો, ઉદાહરણ, હાવભાવ, પ્રશંસા, Wait time</li><li><b>Wait time</b> (Mary Budd Rowe): પ્રશ્ન પછી 3-5 સેકન્ડ રાહ જોવાથી સારા જવાબ</li><li>પ્રત્યાયન દિશા: એક-માર્ગી (વ્યાખ્યાન) → દ્વિ-માર્ગી (ચર્ચા) → બહુ-માર્ગી (જૂથ કાર્ય)</li></ul>"],["સક્રિય શ્રવણ (Active Listening)","<ul><li>સાંભળવું (Hearing) = શારીરિક; શ્રવણ (Listening) = માનસિક, ધ્યાનપૂર્વક</li><li>શ્રવણના પ્રકાર: Appreciative, Empathic (સહાનુભૂતિપૂર્ણ), Comprehensive (સમજ), Critical (વિવેચનાત્મક), Discriminative</li><li>સક્રિય શ્રવણ: ધ્યાન, પ્રશ્ન પૂછવા, પુનઃકથન (Paraphrasing), પ્રતિપોષણ, વચ્ચે ન બોલવું</li><li><b>HURIER model</b> (Judi Brownell): Hearing, Understanding, Remembering, Interpreting, Evaluating, Responding</li></ul><div class=\"tk\"><i>★</i><span>સાંભળવું ≠ શ્રવણ; Listening = Hearing + Attention + Understanding</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Verbal communication</b></td><td>Communication using words</td></tr><tr><td><b>Nonverbal communication</b></td><td>Communication through non-word cues</td></tr><tr><td><b>Kinesics</b></td><td>Study of body movements as communication</td></tr><tr><td><b>Proxemics</b></td><td>Study of space in communication</td></tr><tr><td><b>Paralanguage</b></td><td>Vocal qualities beyond spoken words</td></tr><tr><td><b>Eye contact</b></td><td>Gaze as a communication cue</td></tr><tr><td><b>Intercultural communication</b></td><td>Communication across cultural backgrounds</td></tr><tr><td><b>Group communication</b></td><td>Interaction among members of a group</td></tr><tr><td><b>Classroom interaction</b></td><td>Exchange supporting teaching and learning</td></tr><tr><td><b>Active listening</b></td><td>Attentive listening with checks of understanding</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Kinesics = શરીર હલનચલન; Proxemics = અંતર (Hall); Paralanguage = અવાજના ગુણ</li><li>Haptics = સ્પર્શ; Chronemics = સમય; Oculesics = આંખ</li><li>Mehrabian = 7-38-55</li><li>High-context = ભારત/જાપાન; Low-context = USA/જર્મની</li><li>Tuckman = Forming-Storming-Norming-Performing</li><li>Groupthink = Janis</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"Tone of voice / pitch\" = Paralanguage છે, Kinesics નહીં.</span></div>"]],"4-2":[["પ્રત્યાયનના અવરોધો – પરિચય","<p>પ્રત્યાયન અવરોધ (Barrier) એટલે એવું કોઈ પણ પરિબળ જે સંદેશના <b>મોકલવા, મેળવવા કે સમજવામાં</b> વિક્ષેપ ઊભો કરે અને અર્થ વિકૃત કરે.</p><ul><li>Shannon-Weaver મોડેલમાં તેને <b>ઘોંઘાટ (Noise)</b> કહ્યો છે</li><li>અવરોધ પ્રત્યાયનની <b>કોઈ પણ કડી</b> (પ્રેષક, સંદેશ, માધ્યમ, ગ્રાહક) પર આવી શકે</li></ul><div class=\"nt\">અવરોધ = અર્થનું વિકૃતીકરણ (Distortion of meaning)</div>"],["અવરોધોનું વર્ગીકરણ","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>ભૌતિક (Physical)</td><td>ઘોંઘાટ, અંતર, ખરાબ પ્રકાશ, નેટવર્ક સમસ્યા</td></tr><tr><td>ભાષાકીય/અર્થગત (Semantic)</td><td>અસ્પષ્ટ શબ્દ, Jargon, અનુવાદ ભૂલ</td></tr><tr><td>મનોવૈજ્ઞાનિક (Psychological)</td><td>પૂર્વગ્રહ, ભય, ગુસ્સો, ધ્યાનનો અભાવ</td></tr><tr><td>શારીરિક (Physiological)</td><td>બહેરાશ, થાક, બીમારી, દૃષ્ટિ ખામી</td></tr><tr><td>સાંસ્કૃતિક (Cultural)</td><td>મૂલ્યો, રીતરિવાજ, હાવભાવના જુદા અર્થ</td></tr><tr><td>સંગઠનાત્મક (Organisational)</td><td>વંશવેલો, કડક નિયમો, લાંબી સાંકળ</td></tr><tr><td>તકનિકી (Technical)</td><td>સાધન ખામી, Software સમસ્યા</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>ભૌ-ભા-મ-શા-સાં-સં-ત</b>\"</span></div>"],["ભૌતિક અને તકનિકી અવરોધો","<ul><li>વાતાવરણનો ઘોંઘાટ (Noise), અવાજ પ્રદૂષણ</li><li>અંતર, ખરાબ બેઠક વ્યવસ્થા</li><li>અપૂરતો પ્રકાશ, ગરમી, હવા-ઉજાસ</li><li>ખામીયુક્ત માઇક, પ્રોજેક્ટર, ઇન્ટરનેટ</li><li>સમય ક્ષેત્ર (Time zone) તફાવત</li><li>ઉકેલ: શાંત જગ્યા, યોગ્ય સાધનો, પૂર્વ ચકાસણી</li></ul>"],["ભાષાકીય / અર્થગત અવરોધો (Semantic)","<ul><li><b>Jargon</b>: વિશિષ્ટ ક્ષેત્રના તકનિકી શબ્દો જે સામાન્ય લોકો ન સમજે</li><li><b>સમાન ઉચ્ચાર, જુદા અર્થ</b> (Homonyms)</li><li><b>અસ્પષ્ટ (Ambiguous)</b> અને બહુઅર્થી શબ્દો</li><li>ખોટો અનુવાદ, ભાષા પ્રાવીણ્યનો અભાવ</li><li><b>Denotation</b> (શાબ્દિક અર્થ) vs <b>Connotation</b> (સૂચિત/ભાવનાત્મક અર્થ) નો તફાવત</li><li>ઉકેલ: સરળ ભાષા, વ્યાખ્યા, ઉદાહરણ, પ્રતિપોષણ લેવું</li></ul><div class=\"tk\"><i>★</i><span>Semantic = \"<b>શબ્દ અને અર્થ</b>\" સંબંધિત અવરોધ</span></div>"],["મનોવૈજ્ઞાનિક અવરોધો","<ul><li><b>પસંદગીયુક્ત દ્રષ્ટિ (Selective perception)</b>: જે માનવું હોય તે જ જોવું/સાંભળવું</li><li><b>પૂર્વગ્રહ (Prejudice)</b> અને <b>રૂઢિબદ્ધ ધારણા (Stereotyping)</b></li><li><b>Halo effect</b>: એક ગુણના આધારે સમગ્ર વ્યક્તિ વિશે અભિપ્રાય</li><li>ચિંતા, ભય, ગુસ્સો, હતાશા, અહંકાર</li><li><b>અવિશ્વાસ (Distrust)</b> અને નબળી શ્રવણ ટેવ</li><li><b>Premature evaluation</b>: આખો સંદેશ સાંભળ્યા વગર નિર્ણય</li><li><b>Information overload</b>: અતિશય માહિતી</li></ul>"],["સાંસ્કૃતિક અને સામાજિક અવરોધો","<ul><li><b>Ethnocentrism</b>: પોતાની સંસ્કૃતિને શ્રેષ્ઠ માનવી</li><li>જુદા મૂલ્યો, માન્યતાઓ, ધાર્મિક રીતરિવાજ</li><li>હાવભાવ અને પ્રતીકોના જુદા અર્થ (દા.ત. Thumbs up)</li><li>High-context vs Low-context સંસ્કૃતિ</li><li>લિંગ, વય, સામાજિક દરજ્જાના તફાવત</li><li>ઉકેલ: સાંસ્કૃતિક જાગૃતિ, આદર, સહાનુભૂતિ</li></ul>"],["સંગઠનાત્મક અવરોધો","<ul><li>કડક <b>વંશવેલો (Hierarchy)</b> અને સ્તરોની લાંબી સાંકળ</li><li>સંદેશ <b>ફિલ્ટર</b> થવો (Filtering) – અધિકારીને ગમે તે જ પહોંચાડવું</li><li><b>Status difference</b>: ઊંચા-નીચા હોદ્દા વચ્ચે સંકોચ</li><li>અસ્પષ્ટ નીતિઓ, નિયમો</li><li>વિભાગો વચ્ચે સંકલનનો અભાવ</li><li><b>Grapevine</b> થી અફવાઓ</li><li>ઉકેલ: Open-door policy, સપાટ માળખું (Flat structure), નિયમિત બેઠક</li></ul>"],["વર્ગખંડ પ્રત્યાયનના અવરોધો","<ul><li>મોટા વર્ગ, પાછળ બેઠેલા વિદ્યાર્થી</li><li>શિક્ષકની અસ્પષ્ટ ભાષા, ઝડપી ગતિ, એકવિધ (Monotonous) અવાજ</li><li>વિદ્યાર્થીમાં રસ/પ્રેરણાનો અભાવ, ભય</li><li>ભાષા માધ્યમનો તફાવત</li><li>વધુ પડતો Jargon, ઉદાહરણનો અભાવ</li><li><b>ઉકેલ</b>: પ્રશ્નો પૂછવા, દૃશ્ય સાધન, ઉદાહરણ, પ્રતિપોષણ, સક્રિય શ્રવણ, ભયમુક્ત વાતાવરણ</li></ul>"],["અવરોધો દૂર કરવાના ઉપાયો","<ul><li><b>પ્રતિપોષણ (Feedback)</b> મેળવો – સૌથી અસરકારક ઉપાય</li><li>સરળ, સ્પષ્ટ, સંક્ષિપ્ત ભાષા (7C)</li><li><b>સક્રિય શ્રવણ</b> અને સહાનુભૂતિ (Empathy)</li><li>યોગ્ય માધ્યમ પસંદગી (Media richness theory – Daft &amp; Lengel)</li><li>શાબ્દિક અને અશાબ્દિક સંદેશમાં સુસંગતતા</li><li>યોગ્ય સમય અને સ્થળ</li><li>પુનરાવર્તન (Redundancy) – મહત્વના મુદ્દા ફરી કહેવા</li></ul><div class=\"tk\"><i>★</i><span>\"<b>Feedback = અવરોધ નિવારણની ચાવી</b>\"</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Semantic barrier</b></td><td>Different interpretation of words or symbols</td></tr><tr><td><b>Physical barrier</b></td><td>Environmental obstruction to communication</td></tr><tr><td><b>Psychological barrier</b></td><td>Attitudes or emotions obstructing understanding</td></tr><tr><td><b>Language barrier</b></td><td>Difficulty due to language differences</td></tr><tr><td><b>Information overload</b></td><td>More information than can be processed</td></tr><tr><td><b>Selective perception</b></td><td>Interpreting according to existing expectations</td></tr><tr><td><b>Poor listening</b></td><td>Insufficient attention to the message</td></tr><tr><td><b>Ambiguous wording</b></td><td>Language allowing unclear interpretations</td></tr><tr><td><b>Stereotyping</b></td><td>Assuming attributes from group membership</td></tr><tr><td><b>Clarification</b></td><td>Asking to resolve uncertainty in meaning</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>ઘોંઘાટ, અંતર → <b>ભૌતિક</b></li><li>Jargon, અસ્પષ્ટ શબ્દ → <b>ભાષાકીય/અર્થગત (Semantic)</b></li><li>પૂર્વગ્રહ, ભય, Selective perception → <b>મનોવૈજ્ઞાનિક</b></li><li>બહેરાશ, થાક → <b>શારીરિક (Physiological)</b></li><li>વંશવેલો, Filtering → <b>સંગઠનાત્મક</b></li><li>Ethnocentrism → <b>સાંસ્કૃતિક</b></li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"Information overload\" મનોવૈજ્ઞાનિક/સંગઠનાત્મક અવરોધ છે, ભૌતિક નહીં.</span></div>"]],"4-3":[["સમૂહ માધ્યમ (Mass Media) – પરિચય","<p>સમૂહ માધ્યમ એટલે એવા માધ્યમો જે <b>એકસાથે વિશાળ, વિખરાયેલા અને અજાણ્યા શ્રોતાઓ</b> સુધી સંદેશ પહોંચાડે.</p><ul><li>લાક્ષણિકતા: વિશાળ પહોંચ, મોટે ભાગે એક-માર્ગી, પ્રતિપોષણ મોડું/પરોક્ષ, સંસ્થાકીય સ્ત્રોત</li><li>કાર્ય (Harold Lasswell, Charles Wright): <b>દેખરેખ (Surveillance), સહસંબંધ (Correlation), સાંસ્કૃતિક વારસાનું સ્થાનાંતર (Transmission), મનોરંજન (Entertainment)</b></li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>S C T E</b>\" – Surveillance, Correlation, Transmission, Entertainment</span></div>"],["સમૂહ માધ્યમના પ્રકારો","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>મુદ્રિત (Print)</td><td>અખબાર, સામયિક, પુસ્તક</td></tr><tr><td>પ્રસારણ (Broadcast/Electronic)</td><td>રેડિયો, ટેલિવિઝન</td></tr><tr><td>ફિલ્મ (Cinema)</td><td>ચલચિત્ર, દસ્તાવેજી ફિલ્મ</td></tr><tr><td>નવા/ડિજિટલ (New media)</td><td>ઇન્ટરનેટ, સોશિયલ મીડિયા, OTT, Podcast</td></tr><tr><td>પરંપરાગત/લોક માધ્યમ (Folk)</td><td>ભવાઈ, કઠપૂતળી, લોકગીત, ડાયરો</td></tr><tr><td>બહાર (Outdoor)</td><td>હોર્ડિંગ, પોસ્ટર</td></tr></tbody></table></div>"],["ભારતમાં સમૂહ માધ્યમનો ઇતિહાસ – મુખ્ય હકીકતો","<ul><li>પ્રથમ અખબાર: <b>Hicky's Bengal Gazette (1780)</b> – James Augustus Hicky, કોલકાતા</li><li><b>મુંબઈ સમાચાર (1822)</b> – ગુજરાતી, એશિયાનું સૌથી જૂનું સતત ચાલતું અખબાર</li><li>રેડિયો: 1927 (Indian Broadcasting Company), <b>All India Radio નામ 1936</b>, <b>આકાશવાણી 1957</b></li><li>ટેલિવિઝન: <b>દૂરદર્શન 15 સપ્ટેમ્બર 1959</b> (દિલ્હી, પ્રાયોગિક); રંગીન TV <b>1982</b> (એશિયાડ)</li><li><b>SITE (1975-76)</b>: Satellite Instructional Television Experiment – શૈક્ષણિક TV</li><li><b>Prasar Bharati</b>: 1997 (AIR + Doordarshan)</li><li><b>Press Council of India</b>: 1966 (પુનઃ 1978)</li><li>પ્રથમ ભારતીય ફીચર ફિલ્મ: <b>રાજા હરિશ્ચંદ્ર (1913)</b> – દાદાસાહેબ ફાળકે</li></ul>"],["સમૂહ માધ્યમના સિદ્ધાંતો – ભાગ 1","<ul><li><b>Hypodermic Needle / Magic Bullet Theory</b>: માધ્યમ સીધી અને શક્તિશાળી અસર કરે; શ્રોતા નિષ્ક્રિય</li><li><b>Two-step Flow Theory</b> (<b>Lazarsfeld &amp; Katz</b>, 1940s-1955): માધ્યમ → <b>Opinion leaders</b> → જનતા</li><li><b>Agenda Setting Theory</b> (<b>McCombs &amp; Shaw, 1972</b>): માધ્યમ \"શું વિચારવું\" નહીં, પણ \"<b>શેના વિશે વિચારવું</b>\" તે નક્કી કરે</li><li><b>Gatekeeping</b> (Kurt Lewin; David Manning White, 1950): કયા સમાચાર જશે તે નક્કી કરનાર</li></ul><div class=\"tk\"><i>★</i><span>Agenda = \"<b>What to think ABOUT</b>\"</span></div>"],["સમૂહ માધ્યમના સિદ્ધાંતો – ભાગ 2","<ul><li><b>Uses and Gratifications</b> (<b>Blumler &amp; Katz, 1974</b>): શ્રોતા <b>સક્રિય</b>; પોતાની જરૂરિયાત મુજબ માધ્યમ પસંદ કરે</li><li><b>Cultivation Theory</b> (<b>George Gerbner</b>): લાંબા સમયના TV દર્શનથી વાસ્તવિકતાની ધારણા ઘડાય – \"Mean world syndrome\"</li><li><b>Spiral of Silence</b> (<b>Elisabeth Noelle-Neumann, 1974</b>): લઘુમતી મત ધરાવનાર એકલા પડી જવાના ભયથી મૌન રહે</li><li><b>Framing Theory</b> (Erving Goffman, 1974): રજૂઆતની રીત અર્થ ઘડે</li><li><b>Diffusion of Innovations</b> (<b>Everett Rogers, 1962</b>): Innovators → Early adopters → Early majority → Late majority → Laggards</li></ul>"],["Marshall McLuhan અને માધ્યમ વિચારકો","<ul><li><b>Marshall McLuhan</b> (કેનેડા):</li><li>\"<b>The medium is the message</b>\" (Understanding Media, 1964)</li><li>\"<b>Global village</b>\" નો ખ્યાલ</li><li><b>Hot media</b> (ઊંચી વ્યાખ્યા, ઓછી સહભાગિતા – રેડિયો, ફિલ્મ, ફોટો) vs <b>Cool media</b> (ઓછી વ્યાખ્યા, વધુ સહભાગિતા – TV, ટેલિફોન, કાર્ટૂન)</li><li><b>Noam Chomsky &amp; Edward Herman</b>: \"Manufacturing Consent\" (1988) – Propaganda model</li><li><b>Jürgen Habermas</b>: <b>Public sphere</b> (જાહેર ક્ષેત્ર)</li></ul><div class=\"tk\"><i>★</i><span>McLuhan = \"<b>Medium is Message + Global Village</b>\"</span></div>"],["સમૂહ માધ્યમ અને સમાજ – સકારાત્મક ભૂમિકા","<ul><li>માહિતી અને જાગૃતિ (આરોગ્ય, મતદાન, પર્યાવરણ)</li><li>શિક્ષણ: <b>SITE, Gyan Darshan, SWAYAM Prabha, રેડિયો શાળા</b></li><li><b>લોકશાહીનો ચોથો સ્તંભ (Fourth Estate)</b> – Edmund Burke ને આભારી</li><li>સામાજિક પરિવર્તન, વિકાસ પ્રત્યાયન (Development communication)</li><li>સાંસ્કૃતિક એકતા અને રાષ્ટ્રીય ઓળખ</li><li><b>Community radio</b> (ભારતમાં 2002 શૈક્ષણિક સંસ્થાઓ, 2006 NGO): સ્થાનિક સમુદાયનો અવાજ</li></ul>"],["સમૂહ માધ્યમ – નકારાત્મક પાસાં અને નિયમન","<ul><li><b>Fake news</b>, Misinformation, <b>Paid news</b></li><li>Sensationalism, <b>TRP</b> ની દોડ</li><li>હિંસા, ઉપભોક્તાવાદ, સાંસ્કૃતિક સામ્રાજ્યવાદ</li><li><b>Digital divide</b>, Echo chamber, Filter bubble (Eli Pariser)</li><li>ગોપનીયતા ભંગ, Cyberbullying</li><li>નિયમન: <b>Press Council of India</b>, <b>NBDSA</b>, <b>CBFC</b> (ફિલ્મ પ્રમાણન), <b>TRAI</b>, IT Rules 2021</li><li><b>Media literacy</b>: માધ્યમ સંદેશાઓનું વિવેચનાત્મક મૂલ્યાંકન</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Mass communication</b></td><td>Messages reaching a large dispersed audience</td></tr><tr><td><b>Broadcasting</b></td><td>Transmission to a broad audience</td></tr><tr><td><b>Gatekeeping</b></td><td>Selection of information for publication</td></tr><tr><td><b>Agenda setting</b></td><td>Influence on perceived importance of issues</td></tr><tr><td><b>Media literacy</b></td><td>Critical interpretation of media messages</td></tr><tr><td><b>Misinformation</b></td><td>False information irrespective of intent</td></tr><tr><td><b>Disinformation</b></td><td>Deliberately misleading information</td></tr><tr><td><b>Public service media</b></td><td>Media oriented towards public interest</td></tr><tr><td><b>Audience</b></td><td>People receiving media content</td></tr><tr><td><b>Source verification</b></td><td>Checking origin and credibility of a claim</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Agenda setting = McCombs &amp; Shaw (1972)</li><li>Two-step flow = Lazarsfeld &amp; Katz – Opinion leaders</li><li>Uses &amp; Gratifications = Blumler &amp; Katz – સક્રિય શ્રોતા</li><li>Cultivation = Gerbner; Spiral of Silence = Noelle-Neumann</li><li>Medium is the message, Global village = McLuhan</li><li>Hicky's Bengal Gazette = 1780; દૂરદર્શન = 1959; આકાશવાણી = 1957</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: McLuhan મુજબ TV = <b>Cool medium</b>, Radio = <b>Hot medium</b>.</span></div>"]],"5-0":[["તર્ક (Reasoning) – પરિચય","<p>તર્ક એટલે આપેલી માહિતી (આધારવિધાનો – Premises) પરથી <b>તાર્કિક રીતે નિષ્કર્ષ (Conclusion)</b> સુધી પહોંચવાની માનસિક પ્રક્રિયા.</p><ul><li><b>દલીલ (Argument)</b> = આધારવિધાનો + નિષ્કર્ષ</li><li>મુખ્ય પ્રકારો: <b>નિગમન (Deductive)</b>, <b>આગમન (Inductive)</b>, <b>અપહરણ/અનુમાનિક સમજૂતી (Abductive)</b>, <b>સાદૃશ્ય (Analogical)</b></li><li>GSET માં \"Types of reasoning\" એકમ-5 માં અને દલીલ રચના એકમ-6 માં</li></ul><div class=\"nt\">નિષ્કર્ષ સૂચક શબ્દો: તેથી, માટે, આથી, પરિણામે (Therefore, Hence, Thus)</div><div class=\"nt\">આધાર સૂચક શબ્દો: કારણ કે, કેમ કે, ધારો કે (Because, Since, Given that)</div>"],["નિગમનાત્મક તર્ક (Deductive Reasoning)","<ul><li><b>સામાન્ય (General) થી વિશેષ (Particular)</b> તરફ</li><li>આધારવિધાનો સાચા હોય તો નિષ્કર્ષ <b>અનિવાર્ય રીતે (Necessarily)</b> સાચો</li><li>ઉદાહરણ: બધા માણસો મરણશીલ છે. સોક્રેટિસ માણસ છે. → સોક્રેટિસ મરણશીલ છે.</li><li>પ્રણેતા: <b>Aristotle</b> – Syllogism (ન્યાયવાક્ય)</li><li>મૂલ્યાંકન: <b>યથાર્થ (Valid) / અયથાર્થ (Invalid)</b>; <b>સુદૃઢ (Sound)</b> = યથાર્થ + સાચા આધાર</li><li>નવું જ્ઞાન આપતું નથી; આધારમાં છુપાયેલું સ્પષ્ટ કરે</li></ul>"],["આગમનાત્મક તર્ક (Inductive Reasoning)","<ul><li><b>વિશેષ (Particular) થી સામાન્ય (General)</b> તરફ</li><li>નિષ્કર્ષ <b>સંભવિત (Probable)</b> – નિશ્ચિત નહીં</li><li>ઉદાહરણ: મેં જોયેલા બધા કાગડા કાળા છે → બધા કાગડા કાળા છે</li><li>પ્રણેતા: <b>Francis Bacon</b> (Novum Organum, 1620); J.S. Mill</li><li>મૂલ્યાંકન: <b>મજબૂત (Strong) / નબળું (Weak)</b>; <b>Cogent</b> = મજબૂત + સાચા આધાર</li><li>વિજ્ઞાનમાં સામાન્યીકરણ અને આગાહી માટે</li><li><b>Hume નો આગમન પ્રશ્ન (Problem of Induction)</b></li></ul>"],["નિગમન vs આગમન – તુલના","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>નિગમન (Deductive)</th><th>આગમન (Inductive)</th></tr></thead><tbody><tr><td>દિશા
