્વાસ સુધારાથી ઘણા ગુનામાં નાણાકીય દંડ)</li></ul>"],["ભારતના અન્ય પર્યાવરણ કાયદા","<div class=\"tw\"><table><thead><tr><th>કાયદો</th><th>વર્ષ</th></tr></thead><tbody><tr><td><b>વન્યજીવ સંરક્ષણ ધારો</b></td><td><b>1972</b> (સુધારો 2022)</td></tr><tr><td><b>જળ (પ્રદૂષણ નિવારણ અને નિયંત્રણ) ધારો</b></td><td><b>1974</b> – CPCB સ્થાપના</td></tr><tr><td><b>વન (સંરક્ષણ) ધારો</b></td><td><b>1980</b> (2023: વન સંરક્ષણ એવં સંવર્ધન અધિનિયમ)</td></tr><tr><td><b>હવા (પ્રદૂષણ નિવારણ અને નિયંત્રણ) ધારો</b></td><td><b>1981</b></td></tr><tr><td><b>પર્યાવરણ સંરક્ષણ ધારો</b></td><td><b>1986</b></td></tr><tr><td><b>જૈવ વિવિધતા ધારો</b></td><td><b>2002</b> – NBA (ચેન્નઈ)</td></tr><tr><td><b>રાષ્ટ્રીય હરિત ન્યાયાધિકરણ (NGT) ધારો</b></td><td><b>2010</b></td></tr><tr><td><b>વન અધિકાર ધારો (FRA)</b></td><td><b>2006</b></td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ક્રમ ટ્રિક: \"<b>72-74-80-81-86-02-10</b>\"</span></div>"],["NAPCC – National Action Plan on Climate Change","<ul><li><b>30 જૂન 2008</b> – વડાપ્રધાનની આબોહવા પરિવર્તન પરિષદ</li><li><b>8 રાષ્ટ્રીય મિશન</b>:</li><li>1. <b>National Solar Mission</b></li><li>2. <b>Enhanced Energy Efficiency</b></li><li>3. <b>Sustainable Habitat</b></li><li>4. <b>Water Mission</b></li><li>5. <b>Sustaining the Himalayan Ecosystem</b></li><li>6. <b>Green India</b></li><li>7. <b>Sustainable Agriculture</b></li><li>8. <b>Strategic Knowledge for Climate Change</b></li><li>રાજ્યો માટે <b>SAPCC</b>; પછીથી નવા મિશન ઉમેરવાની ચર્ચા (દા.ત. Human health)</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>સૂ-ઊ-આ-પા-હિ-લી-કૃ-જ્ઞા</b>\" – સૂર્ય, ઊર્જા, આવાસ, પાણી, હિમાલય, લીલું ભારત, કૃષિ, જ્ઞાન</span></div>"],["ઓઝોન અને રસાયણ કરારો","<div class=\"tw\"><table><thead><tr><th>કરાર</th><th>વર્ષ</th><th>વિષય</th></tr></thead><tbody><tr><td><b>Vienna Convention</b></td><td>1985</td><td>ઓઝોન સ્તર રક્ષણ માળખું</td></tr><tr><td><b>Montreal Protocol</b></td><td><b>1987</b> (અમલ 1989)</td><td><b>ઓઝોન ક્ષય કરતા પદાર્થો (CFCs)</b> તબક્કાવાર બંધ – સૌથી સફળ કરાર, સાર્વત્રિક બહાલી</td></tr><tr><td><b>Kigali Amendment</b></td><td><b>2016</b></td><td><b>HFCs</b> ઘટાડો (ગ્રીનહાઉસ વાયુ)</td></tr><tr><td><b>Basel Convention</b></td><td>1989</td><td><b>જોખમી કચરાની</b> સરહદ પાર હેરફેર</td></tr><tr><td><b>Rotterdam Convention</b></td><td>1998</td><td>જોખમી રસાયણ વેપારમાં પૂર્વ જાણકાર સંમતિ (PIC)</td></tr><tr><td><b>Stockholm Convention</b></td><td>2001</td><td><b>POPs</b> (Persistent Organic Pollutants)</td></tr><tr><td><b>Minamata Convention</b></td><td>2013</td><td><b>પારો</b></td></tr></tbody></table></div>"],["Rio (1992) અને જૈવ વિવિધતા કરારો","<ul><li><b>Rio Earth Summit (1992)</b>: UNCED – <b>Agenda 21</b>, <b>Rio Declaration</b> (27 સિદ્ધાંત), <b>UNFCCC</b>, <b>CBD</b>, Forest Principles</li><li><b>CBD (Convention on Biological Diversity)</b>: 1992 (અમલ <b>1993</b>)</li><li>ત્રણ હેતુ: <b>સંરક્ષણ, ટકાઉ ઉપયોગ, લાભની ન્યાયી વહેંચણી</b></li><li><b>Cartagena Protocol (2000)</b>: <b>જૈવ સુરક્ષા (Biosafety)</b> – GMOs</li><li><b>Nagoya Protocol (2010)</b>: <b>ABS</b> (Access and Benefit Sharing)</li><li><b>Aichi Targets (2010)</b>: 20 લક્ષ્યો (2011-2020)</li><li><b>Kunming-Montreal Global Biodiversity Framework (2022)</b>: <b>30 by 30</b> – 2030 સુધી 30% જમીન-સમુદ્ર સંરક્ષિત</li><li><b>Ramsar Convention (1971)</b>: <b>ભીની ભૂમિ (Wetlands)</b>; ગુજરાત: નળ સરોવર, થોળ, ખીજડિયા, વઢવાણા</li><li><b>CITES (1973)</b>: લુપ્તપ્રાય પ્રજાતિઓનો વેપાર; <b>CMS (1979)</b>: સ્થળાંતરિત પ્રજાતિઓ</li></ul>"],["આબોહવા કરારો – UNFCCC, Kyoto, Paris","<div class=\"tw\"><table><thead><tr><th>કરાર</th><th>વર્ષ</th><th>મુખ્ય મુદ્દો</th></tr></thead><tbody><tr><td><b>UNFCCC</b></td><td>1992 (અમલ 1994)</td><td>આબોહવા પરિવર્તન માળખું; દર વર્ષે <b>COP</b></td></tr><tr><td><b>Kyoto Protocol</b></td><td><b>1997</b> (COP3; અમલ <b>2005</b>)</td><td><b>વિકસિત દેશો (Annex I)</b> માટે <b>બંધનકારક</b> ઉત્સર્જન ઘટાડો; પ્રથમ તબક્કો 2008-12; CDM, Emission trading, JI</td></tr><tr><td><b>Doha Amendment</b></td><td>2012</td><td>Kyoto બીજો તબક્કો 2013-20</td></tr><tr><td><b>Paris Agreement</b></td><td><b>2015</b> (COP21; અમલ <b>2016</b>)</td><td>તાપમાન વધારો <b>2°C થી નીચે</b>, પ્રયાસ <b>1.5°C</b>; બધા દેશો <b>NDCs</b> (Nationally Determined Contributions)</td></tr></tbody></table></div><ul><li><b>CBDR</b>: Common But Differentiated Responsibilities – Rio 1992 નો સિદ્ધાંત</li><li><b>COP26 (ગ્લાસગો 2021)</b>: ભારતની Panchamrit, Net Zero 2070</li><li><b>COP27 (શર્મ અલ-શેખ 2022)</b>: <b>Loss and Damage Fund</b></li><li><b>COP28 (દુબઈ 2023)</b>: Global Stocktake; <b>COP29 (બાકુ 2024)</b>: Climate finance (NCQG); <b>COP30 (બેલેમ, બ્રાઝિલ 2025)</b></li></ul><div class=\"tk\"><i>★</i><span>Kyoto = \"<b>બંધનકારક, માત્ર વિકસિત</b>\"; Paris = \"<b>સ્વૈચ્છિક NDC, બધા દેશો</b>\"</span></div>"],["ન્યાયિક સક્રિયતા અને સિદ્ધાંતો","<ul><li><b>Polluter Pays Principle</b>: પ્રદૂષણ કરનાર ખર્ચ ભોગવે</li><li><b>Precautionary Principle</b>: વૈજ્ઞાનિક અનિશ્ચિતતા છતાં રક્ષણાત્મક પગલાં</li><li><b>Public Trust Doctrine</b>: સરકાર કુદરતી સંસાધનોની ટ્રસ્ટી (<b>M.C. Mehta vs Kamal Nath, 1997</b>)</li><li><b>Absolute liability</b>: <b>M.C. Mehta vs Union of India (Oleum gas leak, 1986)</b></li><li><b>Vellore Citizens Welfare Forum (1996)</b>: ટકાઉ વિકાસ, Polluter pays, Precautionary સિદ્ધાંત</li><li><b>NGT</b> (2010): ઝડપી પર્યાવરણ ન્યાય; મુખ્ય બેન્ચ દિલ્હી; 6 મહિનામાં નિકાલનો પ્રયાસ</li><li><b>M.C. Mehta</b>: ભારતના \"પર્યાવરણ PIL\" ના અગ્રણી વકીલ</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Environment Protection Act 1986</b></td><td>Indian umbrella legislation on environmental protection</td></tr><tr><td><b>NAPCC</b></td><td>National Action Plan on Climate Change</td></tr><tr><td><b>Montreal Protocol</b></td><td>Agreement protecting the ozone layer</td></tr><tr><td><b>Rio Earth Summit</b></td><td>1992 international environment and development conference</td></tr><tr><td><b>CBD</b></td><td>Convention on Biological Diversity</td></tr><tr><td><b>Kyoto Protocol</b></td><td>Climate treaty with targets for specified developed parties</td></tr><tr><td><b>Paris Agreement</b></td><td>International climate agreement adopted in 2015</td></tr><tr><td><b>International Solar Alliance</b></td><td>International initiative promoting solar-energy cooperation</td></tr><tr><td><b>Ozone depletion</b></td><td>Reduction of stratospheric ozone</td></tr><tr><td><b>Climate mitigation</b></td><td>Action reducing emissions or enhancing carbon sinks</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>EPA = 1986 (ભોપાલ પછી, Umbrella Act)</li><li>NAPCC = 2008, 8 મિશન</li><li>Montreal = 1987 (CFCs, ઓઝોન); Kigali = 2016 (HFCs)</li><li>Kyoto = 1997, અમલ 2005; Paris = 2015, NDCs, 1.5-2°C</li><li>CBD = 1992; Cartagena = Biosafety; Nagoya = ABS</li><li>Ramsar = Wetlands (1971); Basel = જોખમી કચરો</li><li>48A = રાજ્ય; 51A(g) = નાગરિક (42મો સુધારો 1976)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Montreal Protocol = ઓઝોન (CFCs); Kyoto Protocol = ગ્રીનહાઉસ વાયુ – બંને ભેળવશો નહીં.</span></div>"]],"10-0":[["પ્રાચીન ભારતમાં ઉચ્ચ શિક્ષણ – પરિચય","<p>પ્રાચીન ભારત વિશ્વના <b>સૌથી જૂના ઉચ્ચ અધ્યયન કેન્દ્રો</b> માટે પ્રસિદ્ધ હતું. શિક્ષણ <b>ગુરુ-શિષ્ય પરંપરા</b> પર આધારિત હતું.</p><ul><li>શિક્ષણનો હેતુ: <b>ચારિત્ર્ય નિર્માણ, જ્ઞાન, મોક્ષ, ધર્મ અને સામાજિક ફરજ</b></li><li>શિક્ષણ મુખ્યત્વે <b>મૌખિક (Oral tradition)</b> – શ્રવણ, મનન, નિદિધ્યાસન</li><li>શિક્ષણ મફત; અંતે <b>ગુરુદક્ષિણા</b></li><li>વૈદિક, બૌદ્ધ અને જૈન – ત્રણ મુખ્ય પરંપરા</li></ul><div class=\"tk\"><i>★</i><span>અધ્યયનના 3 સોપાન: <b>શ્રવણ → મનન → નિદિધ્યાસન</b></span></div>"],["વૈદિક શિક્ષણ પ્રણાલી","<ul><li><b>ગુરુકુળ</b>: ગુરુના ઘરે/આશ્રમમાં રહી અધ્યયન</li><li><b>ઉપનયન સંસ્કાર</b>: શિક્ષણનો પ્રારંભ (બ્રહ્મચર્ય આશ્રમ)</li><li><b>સમાવર્તન</b>: શિક્ષણનો અંત (દીક્ષાંત)</li><li>વિષયો: <b>4 વેદ, 6 વેદાંગ</b> (શિક્ષા, કલ્પ, વ્યાકરણ, નિરુક્ત, છંદ, જ્યોતિષ), ઉપનિષદ, દર્શન, પુરાણ</li><li>અન્ય સંસ્થાઓ: <b>પરિષદ</b> (વિદ્વાનોની સભા), <b>ઘટિકા</b>, <b>અગ્રહાર</b> (બ્રાહ્મણોને દાન અપાયેલા ગામ), <b>મઠ</b></li><li>પ્રસિદ્ધ સ્ત્રી વિદ્વાનો: <b>ગાર્ગી, મૈત્રેયી, લોપામુદ્રા, અપાલા, ઘોષા</b></li></ul><div class=\"tk\"><i>★</i><span>ઉપનયન = <b>શરૂઆત</b>; સમાવર્તન = <b>અંત</b></span></div>"],["તક્ષશિલા (Takshashila)","<ul><li>સ્થાન: હાલ <b>પાકિસ્તાન</b> (રાવલપિંડી પાસે); પ્રાચીન <b>ગાંધાર</b> રાજ્ય</li><li>સમય: આશરે <b>ઈ.પૂ. 6ઠ્ઠી-5મી સદી</b> થી ઈ.સ. 5મી સદી</li><li>વિશ્વના <b>સૌથી જૂના</b> ઉચ્ચ શિક્ષણ કેન્દ્રોમાંનું એક</li><li>કેન્દ્રીય વહીવટ વગર – સ્વતંત્ર શિક્ષકો</li><li>વિષયો: વેદ, તબીબી (આયુર્વેદ), શસ્ત્રવિદ્યા, ધનુર્વિદ્યા, ખગોળ, રાજનીતિ, કાયદો</li><li>પ્રસિદ્ધ: <b>ચાણક્ય (કૌટિલ્ય)</b> – શિક્ષક; <b>ચંદ્રગુપ્ત મૌર્ય</b>, <b>જીવક</b> (વૈદ્ય), <b>પાણિનિ</b> (વ્યાકરણ), <b>ચરક</b> (કેટલીક પરંપરા મુજબ)</li><li><b>UNESCO World Heritage Site (1980)</b> – તક્ષશિલા</li><li>5મી સદીમાં <b>હૂણો</b> દ્વારા નાશ</li></ul>"],["નાલંદા (Nalanda)","<ul><li>સ્થાન: <b>બિહાર</b> (રાજગીર પાસે)</li><li>સ્થાપક: <b>કુમારગુપ્ત પ્રથમ</b> (ગુપ્ત વંશ, <b>5મી સદી</b>)</li><li><b>વિશ્વની પ્રથમ નિવાસી (Residential) યુનિવર્સિટી</b> ગણાય</li><li>~10,000 વિદ્યાર્થી, ~2,000 શિક્ષકો (પરંપરાગત વર્ણન)</li><li><b>મહાયાન બૌદ્ધ</b> અધ્યયનનું મુખ્ય કેન્દ્ર; પ્રવેશ પરીક્ષા <b>દ્વારપંડિત</b> લેતા</li><li>પુસ્તકાલય: <b>ધર્મગંજ</b> – ત્રણ ઇમારતો <b>રત્નસાગર, રત્નોદધિ, રત્નરંજક</b></li><li>વિદેશી યાત્રી: <b>હ્યુએન ત્સાંગ (Xuanzang)</b> – હર્ષવર્ધન સમયે; <b>ઇત્સિંગ (I-Tsing)</b></li><li>આચાર્યો: <b>નાગાર્જુન, આર્યદેવ, ધર્મપાલ, શીલભદ્ર</b> (હ્યુએન ત્સાંગના ગુરુ)</li><li><b>1193 આસપાસ બખ્તિયાર ખિલજી</b> દ્વારા નાશ</li><li><b>UNESCO Heritage (2016)</b>; નવી <b>નાલંદા યુનિવર્સિટી – 2010 ધારો, 2014 થી શરૂ</b></li></ul><div class=\"tk\"><i>★</i><span>નાલંદા = \"<b>કુમારગુપ્ત, 5મી સદી, ખિલજી 1193</b>\"</span></div>"],["વિક્રમશિલા, વલભી અને અન્ય કેન્દ્રો","<div class=\"tw\"><table><thead><tr><th>કેન્દ્ર</th><th>સ્થાન</th><th>સ્થાપક/સમય</th><th>વિશેષતા</th></tr></thead><tbody><tr><td><b>વિક્રમશિલા</b></td><td>બિહાર (ભાગલપુર)</td><td><b>ધર્મપાલ</b> (પાલ વંશ, 8મી-9મી સદી)</td><td><b>તાંત્રિક (વજ્રયાન) બૌદ્ધ</b>; આતિશ દીપંકર</td></tr><tr><td><b>વલભી</b></td><td><b>ગુજરાત</b> (ભાવનગર)</td><td><b>મૈત્રક વંશ</b> (ભટાર્ક, 5મી-6ઠ્ઠી સદી)</td><td><b>હીનયાન બૌદ્ધ</b>; ઇત્સિંગે નાલંદા સાથે સરખાવી</td></tr><tr><td><b>ઓદંતપુરી</b></td><td>બિહાર</td><td>ગોપાલ (પાલ વંશ, 8મી સદી)</td><td>તિબેટના વિહારોનો નમૂનો</td></tr><tr><td><b>સોમપુરા</b></td><td>બાંગ્લાદેશ</td><td>ધર્મપાલ</td><td>મોટો વિહાર</td></tr><tr><td><b>જગદ્દલ</b></td><td>બંગાળ</td><td>રામપાલ</td><td></td></tr><tr><td><b>કાંચી</b></td><td>તમિલનાડુ</td><td>પલ્લવ</td><td>ઘટિકા કેન્દ્ર</td></tr><tr><td><b>નવદ્વીપ (નદિયા)</b></td><td>બંગાળ</td><td>11મી સદી</td><td><b>નવ્ય ન્યાય</b></td></tr></tbody></table></div><ul><li>★ વલભી = <b>ગુજરાતનું</b> પ્રાચીન વિદ્યાપીઠ</li></ul>"],["બૌદ્ધ અને જૈન શિક્ષણ પ્રણાલી","<ul><li><b>બૌદ્ધ</b>: શિક્ષણ <b>વિહાર/મઠ</b> માં; બધી જાતિ માટે ખુલ્લું</li><li><b>પબ્બજ્જા (Pabbajja)</b>: પ્રારંભિક દીક્ષા (8 વર્ષ આસપાસ)</li><li><b>ઉપસંપદા (Upasampada)</b>: પૂર્ણ ભિક્ષુ દીક્ષા (20 વર્ષ પછી)</li><li>ભાષા: <b>પાલી</b> (લોકભાષા), પછી સંસ્કૃત</li><li><b>જૈન</b>: ઉપાશ્રય, મંદિર; <b>અનેકાંતવાદ, સ્યાદ્વાદ</b>; ભાષા પ્રાકૃત</li><li>બૌદ્ધ શિક્ષણ = વધુ <b>લોકશાહી અને સંસ્થાકીય</b></li></ul><div class=\"tk\"><i>★</i><span>પબ્બજ્જા = <b>શરૂઆત</b>; ઉપસંપદા = <b>પૂર્ણ</b></span></div>"],["પ્રાચીન ભારતીય વિદ્વાનો અને યોગદાન","<div class=\"tw\"><table><thead><tr><th>વિદ્વાન</th><th>યોગદાન</th></tr></thead><tbody><tr><td><b>પાણિનિ</b></td><td>અષ્ટાધ્યાયી (સંસ્કૃત વ્યાકરણ)</td></tr><tr><td><b>ચાણક્ય</b></td><td>અર્થશાસ્ત્ર</td></tr><tr><td><b>આર્યભટ્ટ</b></td><td>આર્યભટીય – ગણિત, ખગોળ (ઈ.સ. 499)</td></tr><tr><td><b>ચરક</b></td><td>ચરક સંહિતા (તબીબી)</td></tr><tr><td><b>સુશ્રુત</b></td><td>સુશ્રુત સંહિતા – <b>શલ્યચિકિત્સાના પિતા</b></td></tr><tr><td><b>બ્રહ્મગુપ્ત</b></td><td>શૂન્યના નિયમો</td></tr><tr><td><b>પતંજલિ</b></td><td>યોગસૂત્ર, મહાભાષ્ય</td></tr><tr><td><b>નાગાર્જુન</b></td><td>માધ્યમિક (શૂન્યવાદ) બૌદ્ધ દર્શન</td></tr></tbody></table></div>"],["પ્રાચીન શિક્ષણની લાક્ષણિકતાઓ","<ul><li><b>ગુરુ-શિષ્ય સંબંધ</b>: ઘનિષ્ઠ, વ્યક્તિગત, આદરપૂર્ણ</li><li><b>મૌખિક પરંપરા</b> અને કંઠસ્થ (Memorisation)</li><li><b>શાસ્ત્રાર્થ (Debate)</b>: વાદ-વિવાદથી અધ્યયન</li><li><b>ચારિત્ર્ય અને નૈતિક શિક્ષણ</b> પર ભાર</li><li><b>વ્યવહારુ શિક્ષણ</b>: કૃષિ, શસ્ત્રવિદ્યા, તબીબી, કલા (64 કલાઓ)</li><li><b>સ્વાયત્તતા</b>: રાજ્ય હસ્તક્ષેપ ઓછો; દાનથી સંચાલન</li><li><b>મફત શિક્ષણ</b>; સમાજ અને રાજાનું આશ્રય</li><li><b>પ્રકૃતિ વચ્ચે</b> શિક્ષણ (આશ્રમ)</li></ul>"],["મધ્યકાલીન શિક્ષણ (ટૂંકમાં)","<ul><li><b>મકતબ</b>: પ્રાથમિક શિક્ષણ (મસ્જિદ સાથે)</li><li><b>મદરેસા</b>: ઉચ્ચ શિક્ષણ – અરબી, ફારસી, ઇસ્લામિક કાયદો</li><li><b>ફિરોઝ શાહ તુઘલક, અકબર</b> – શિક્ષણ આશ્રયદાતા</li><li><b>અકબર</b>: ફતેહપુર સિક્રીમાં <b>ઇબાદતખાના</b> (ધાર્મિક ચર્ચા)</li><li>દિલ્હી, આગ્રા, લાહોર, જૌનપુર – શિક્ષણ કેન્દ્રો</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Nalanda</b></td><td>Ancient centre of higher learning</td></tr><tr><td><b>Takshashila</b></td><td>Ancient centre associated with diverse learning</td></tr><tr><td><b>Gurukula</b></td><td>Learning in association with a teacher&#x27;s household</td></tr><tr><td><b>Guru</b></td><td>Teacher or guide in traditional learning</td></tr><tr><td><b>Shishya</b></td><td>Learner in a traditional teacher-student relationship</td></tr><tr><td><b>Oral tradition</b></td><td>Transmission of knowledge through spoken instruction</td></tr><tr><td><b>Debate</b></td><td>Reasoned discussion of competing viewpoints</td></tr><tr><td><b>Manuscript</b></td><td>Handwritten textual record</td></tr><tr><td><b>Monastic learning</b></td><td>Study associated with religious monastic institutions</td></tr><tr><td><b>Traditional scholarship</b></td><td>Systematic study within inherited knowledge traditions</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>તક્ષશિલા = પાકિસ્તાન, સૌથી જૂનું, ચાણક્ય, હૂણોએ નાશ</li><li>નાલંદા = કુમારગુપ્ત I, 5મી સદી, ધર્મગંજ, ખિલજી 1193</li><li>વિક્રમશિલા = ધર્મપાલ (પાલ), તાંત્રિક બૌદ્ધ</li><li>વલભી = ગુજરાત, મૈત્રક, હીનયાન</li><li>ઉપનયન = પ્રારંભ; સમાવર્તન = અંત; પબ્બજ્જા/ઉપસંપદા = બૌદ્ધ દીક્ષા</li><li>હ્યુએન ત્સાંગ = નાલંદા (હર્ષ સમય)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: નાલંદા = મહાયાન; વિક્રમશિલા = વજ્રયાન (તાંત્રિક); વલભી = હીનયાન.</span></div>"]],"10-1":[["સ્વાતંત્ર્યોત્તર ઉચ્ચ શિક્ષણ – પરિચય","<p>સ્વાતંત્ર્ય (1947) સમયે ભારતમાં આશરે <b>20 યુનિવર્સિટીઓ</b> અને <b>~500 કોલેજો</b> હતી. આજે ભારત <b>વિશ્વની બીજી/ત્રીજી સૌથી મોટી</b> ઉચ્ચ શિક્ષણ પ્રણાલી છે.</p><ul><li>AISHE 2021-22: <b>1,168 યુનિવર્સિટીઓ</b>, <b>45,473 કોલેજો</b>, ~<b>4.33 કરોડ</b> વિદ્યાર્થીઓ</li><li><b>GER</b> (Gross Enrolment Ratio, 18-23 વય): ~<b>28.4%</b> (2021-22)</li><li>NEP 2020 લક્ષ્ય: <b>2035 સુધી GER 50%</b></li></ul><div class=\"tk\"><i>★</i><span>લક્ષ્ય = \"<b>50% GER, 2035</b>\"</span></div>"],["બ્રિટિશકાલીન પૃષ્ઠભૂમિ","<div class=\"tw\"><table><thead><tr><th>વર્ષ</th><th>ઘટના</th></tr></thead><tbody><tr><td>1813</td><td>ચાર્ટર એક્ટ – શિક્ષણ માટે ₹1 લાખ</td></tr><tr><td><b>1835</b></td><td><b>મેકોલે મિનિટ</b> – અંગ્રેજી શિક્ષણ</td></tr><tr><td><b>1854</b></td><td><b>વૂડ્સ ડિસ્પેચ</b> – \"ભારતીય શિક્ષણનો મેગ્નાકાર્ટા\"</td></tr><tr><td><b>1857</b></td><td><b>કલકત્તા, બોમ્બે, મદ્રાસ યુનિવર્સિટી</b> (લંડન યુનિવર્સિટીના નમૂને)</td></tr><tr><td>1882</td><td>હન્ટર કમિશન</td></tr><tr><td><b>1902</b></td><td><b>ભારતીય યુનિવર્સિટી કમિશન (Raleigh)</b> → યુનિવર્સિટી ધારો <b>1904</b></td></tr><tr><td><b>1917-19</b></td><td><b>સેડલર કમિશન</b> (કલકત્તા યુનિવર્સિટી કમિશન)</td></tr><tr><td>1944</td><td>સાર્જન્ટ યોજના</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>વૂડ્સ ડિસ્પેચ = <b>1854, મેગ્નાકાર્ટા</b></span></div>"],["રાધાકૃષ્ણન કમિશન (1948-49)","<ul><li>પૂરું નામ: <b>યુનિવર્સિટી શિક્ષણ પંચ (University Education Commission)</b></li><li>અધ્યક્ષ: <b>ડૉ. એસ. રાધાકૃષ્ણન</b></li><li><b>સ્વતંત્ર ભારતનું પ્રથમ શિક્ષણ પંચ</b></li><li>મુખ્ય ભલામણો:</li><li><b>UGC</b> ની રચના (UK ના નમૂને)</li><li><b>ગ્રામ્ય યુનિવર્સિટીઓ</b> (Rural universities)</li><li>12 વર્ષ શાળા પછી ઉચ્ચ શિક્ષણ; 3 વર્ષ સ્નાતક</li><li>વર્ષમાં ઓછામાં ઓછા <b>180 કાર્ય દિવસ</b></li><li>શિક્ષકોના પગાર ધોરણ સુધારવા; ધાર્મિક/નૈતિક શિક્ષણ</li><li><b>5 સપ્ટેમ્બર</b> (રાધાકૃષ્ણન જન્મદિવસ) = <b>શિક્ષક દિવસ</b></li></ul>"],["મુદલિયાર અને કોઠારી પંચ","<ul><li><b>મુદલિયાર પંચ (1952-53)</b>: <b>માધ્યમિક શિક્ષણ પંચ</b> – ડૉ. એ. લક્ષ્મણસ્વામી મુદલિયાર</li><li><b>કોઠારી પંચ (1964-66)</b>: <b>રાષ્ટ્રીય શિક્ષણ પંચ</b> – <b>ડૉ. ડી.એસ. કોઠારી</b> (UGC અધ્યક્ષ)</li><li><b>તમામ સ્તરના શિક્ષણ</b> પર પ્રથમ વ્યાપક પંચ</li><li>અહેવાલ: \"<b>Education and National Development</b>\"</li><li>\"<b>ભારતનું ભાગ્ય તેના વર્ગખંડોમાં ઘડાઈ રહ્યું છે</b>\"</li><li><b>10+2+3</b> માળખું</li><li>GDP ના <b>6%</b> શિક્ષણ પર ખર્ચ</li><li><b>ત્રિભાષી સૂત્ર</b>, <b>Common School System</b>, કાર્યાનુભવ</li></ul><div class=\"tk\"><i>★</i><span>કોઠારી = \"<b>10+2+3, 6% GDP, Destiny in classrooms</b>\"</span></div>"],["રાષ્ટ્રીય શિક્ષણ નીતિઓ","<div class=\"tw\"><table><thead><tr><th>નીતિ</th><th>વર્ષ</th><th>પ્રધાનમંત્રી</th><th>મુખ્ય મુદ્દા</th></tr></thead><tbody><tr><td><b>NPE 1968</b></td><td>1968</td><td>ઇન્દિરા ગાંધી</td><td>કોઠારી પંચ પર આધારિત, ત્રિભાષી સૂત્ર, 6% GDP</td></tr><tr><td><b>NPE 1986</b></td><td>1986</td><td><b>રાજીવ ગાંધી</b></td><td><b>Operation Blackboard</b>, <b>IGNOU (1985)</b>, Navodaya, સ્વાયત્ત કોલેજો, <b>NAAC</b> ભલામણ</td></tr><tr><td><b>POA 1992</b></td><td>1992</td><td>પી.વી. નરસિંહ રાવ</td><td>NPE 1986 માં સુધારો (આચાર્ય રામમૂર્તિ સમિતિ 1990, જનાર્દન રેડ્ડી 1992)</td></tr><tr><td><b>NEP 2020</b></td><td><b>29 જુલાઈ 2020</b></td><td>નરેન્દ્ર મોદી</td><td><b>ડૉ. કે. કસ્તૂરીરંગન</b> સમિતિ; <b>5+3+3+4</b>; GER 50%</td></tr></tbody></table></div>"],["NEP 2020 – ઉચ્ચ શિક્ષણ જોગવાઈઓ","<ul><li><b>બહુવિધ પ્રવેશ-નિર્ગમન (Multiple Entry-Exit)</b>: 1 વર્ષ – પ્રમાણપત્ર, 2 – ડિપ્લોમા, 3 – ડિગ્રી, 4 – ઓનર્સ/સંશોધન સાથે ડિગ્રી</li><li><b>ABC</b> (Academic Bank of Credits)</li><li><b>M.Phil બંધ</b></li><li><b>HECI</b> (Higher Education Commission of India): એક જ નિયમનકાર – 4 વર્ટિકલ: <b>NHERC</b> (નિયમન), <b>NAC</b> (માન્યતા), <b>HEGC</b> (અનુદાન), <b>GEC</b> (ધોરણો)</li><li><b>NRF</b> (National Research Foundation) – <b>ANRF Act 2023</b></li><li><b>બહુવિદ્યાશાખાકીય (Multidisciplinary)</b> યુનિવર્સિટીઓ – MERU</li><li>શિક્ષણ પર ખર્ચ: GDP ના <b>6%</b></li><li><b>ભારતીય ભાષાઓ</b> માં શિક્ષણ; વિદેશી યુનિવર્સિટીઓના કેમ્પસ</li></ul><div class=\"tk\"><i>★</i><span>HECI = \"<b>NHERC + NAC + HEGC + GEC</b>\"</span></div>"],["UGC અને મુખ્ય નિયમનકારી સંસ્થાઓ","<ul><li><b>UGC</b>: સ્થાપના <b>28 ડિસેમ્બર 1953</b> (મૌલાના આઝાદ દ્વારા ઉદ્ઘાટન); <b>UGC ધારો 1956</b> થી વૈધાનિક દરજ્જો (નવેમ્બર 1956); મુખ્યાલય <b>નવી દિલ્હી</b></li><li><b>AICTE</b>: 1945 (સલાહકાર), <b>1987</b> થી વૈધાનિક – તકનિકી શિક્ષણ</li><li><b>NCTE</b>: 1973 (સલાહકાર), <b>1993</b> વૈધાનિક – શિક્ષક શિક્ષણ</li><li><b>NAAC</b>: <b>1994</b>, <b>બેંગલુરુ</b> – માન્યતા (Accreditation)</li><li><b>NBA</b>: 1994 (AICTE હેઠળ), 2010 થી સ્વાયત્ત – કાર્યક્રમ માન્યતા</li><li><b>ICSSR (1969)</b>, <b>ICHR (1972)</b>, <b>ICPR (1977)</b> – સંશોધન પરિષદો</li><li><b>NMC</b> (2020, MCI ના સ્થાને), <b>BCI</b> (કાયદો), <b>INC</b> (નર્સિંગ), <b>PCI</b> (ફાર્મસી)</li></ul>"],["સંશોધન વિકાસ અને સંસ્થાઓ","<ul><li><b>CSIR</b> (1942), <b>ICAR</b> (1929), <b>ICMR</b> (1911/1949), <b>DRDO</b> (1958), <b>ISRO</b> (1969), <b>DST</b> (1971)</li><li><b>IITs</b>: પ્રથમ <b>IIT ખડગપુર (1951)</b> – સરકાર સમિતિ (N.R. Sarkar); IIT ધારો 1961</li><li><b>IIMs</b>: પ્રથમ <b>IIM કલકત્તા (1961)</b> અને <b>IIM અમદાવાદ (1961)</b> – વિક્રમ સારાભાઈ</li><li><b>IISc બેંગલુરુ</b> (1909 – જમશેદજી ટાટા)</li><li><b>NIRF</b> (2015/16), <b>RUSA</b> (2013), <b>IoE</b> (Institutions of Eminence, 2017)</li><li><b>PMRF</b> (Prime Minister's Research Fellowship, 2018)</li></ul>"],["ઉચ્ચ શિક્ષણ – વર્તમાન આંકડા અને પડકારો","<ul><li><b>પડકારો</b>: ઓછો GER, ગુણવત્તા, ફેકલ્ટી અછત, સંશોધન ખર્ચ ઓછો (~0.6-0.7% GDP R&amp;D), રોજગારક્ષમતા, પ્રાદેશિક અસમાનતા</li><li><b>AISHE 2021-22</b>: સ્ત્રી GER (28.5%) પુરુષ (28.3%) કરતાં થોડો વધુ</li><li>સૌથી વધુ કોલેજ: <b>ઉત્તર પ્રદેશ</b>; કોલેજ ઘનતા સૌથી વધુ: <b>કર્ણાટક</b></li><li><b>GPI</b> (Gender Parity Index) ~ 1.01</li><li><b>ગુણવત્તા પહેલ</b>: NAAC, NIRF, NBA, IQAC, CAS</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Higher education</b></td><td>Education beyond the secondary level</td></tr><tr><td><b>University</b></td><td>Institution providing advanced teaching and research</td></tr><tr><td><b>Research university</b></td><td>University emphasising research alongside teaching</td></tr><tr><td><b>Affiliated college</b></td><td>College linked academically to a university</td></tr><tr><td><b>Accreditation</b></td><td>External evaluation against quality standards</td></tr><tr><td><b>Peer review</b></td><td>Evaluation by relevant subject experts</td></tr><tr><td><b>Academic department</b></td><td>Organisational unit for a discipline</td></tr><tr><td><b>Research funding</b></td><td>Financial support for research activities</td></tr><tr><td><b>Quality assurance</b></td><td>Processes maintaining and improving educational quality</td></tr><tr><td><b>Extension activity</b></td><td>Institutional engagement beyond the campus</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>રાધાકૃષ્ણન = 1948-49, પ્રથમ પંચ, UGC ભલામણ</li><li>મુદલિયાર = 1952-53 (માધ્યમિક)</li><li>કોઠારી = 1964-66, 10+2+3, 6% GDP</li><li>NPE 1968, 1986 (POA 1992), NEP 2020 (કસ્તૂરીરંગન)</li><li>UGC = 1953 સ્થાપના, 1956 ધારો; NAAC = 1994 બેંગલુરુ</li><li>NEP: GER 50% (2035), 5+3+3+4, HECI, ABC, M.Phil બંધ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: UGC ની <b>સ્થાપના 1953</b> પણ <b>વૈધાનિક સંસ્થા 1956</b> માં બની.</span></div>"]],"10-2":[["ભારતમાં અધ્યયન કાર્યક્રમો – પરિચય","<p>ભારતમાં ઉચ્ચ શિક્ષણ ત્રણ પ્રકારના કાર્યક્રમોમાં ઉપલબ્ધ છે:</p><ul><li><b>પૌર્વાત્ય (Oriental)</b>: પ્રાચીન ભારતીય જ્ઞાન – સંસ્કૃત, પાલી, પ્રાકૃત, અરબી, ફારસી, આયુર્વેદ, યોગ</li><li><b>પરંપરાગત (Conventional)</b>: નિયમિત વર્ગખંડ આધારિત – કલા, વિજ્ઞાન, વાણિજ્ય</li><li><b>બિનપરંપરાગત (Non-conventional)</b>: મુક્ત અને દૂરવર્તી શિક્ષણ (ODL), Online, પત્રાચાર</li></ul><div class=\"tk\"><i>★</i><span>પૌર્વાત્ય = <b>પ્રાચ્ય/પરંપરાગત ભારતીય જ્ઞાન</b></span></div>"],["પૌર્વાત્ય (Oriental) અધ્યયન","<ul><li><b>સંસ્કૃત</b>, વેદ, દર્શન, જ્યોતિષ, વ્યાકરણ, ધર્મશાસ્ત્ર</li><li><b>આયુર્વેદ, યોગ, યુનાની, સિદ્ધ, હોમિયોપેથી</b> – <b>AYUSH</b> મંત્રાલય (2014)</li><li><b>અરબી, ફારસી</b>, ઇસ્લામિક અધ્યયન; <b>પાલી, પ્રાકૃત</b>, બૌદ્ધ-જૈન અધ્યયન</li><li>પ્રાચીન <b>પાઠશાળા, મદરેસા</b> પરંપરા</li><li><b>Indian Knowledge Systems (IKS)</b> વિભાગ – શિક્ષણ મંત્રાલય (AICTE, 2020); NEP 2020 માં ભાર</li></ul>"],["સંસ્કૃત અને પૌર્વાત્ય યુનિવર્સિટીઓ","<div class=\"tw\"><table><thead><tr><th>યુનિવર્સિટી</th><th>સ્થાન</th><th>વિશેષ</th></tr></thead><tbody><tr><td><b>સંપૂર્ણાનંદ સંસ્કૃત વિશ્વવિદ્યાલય</b></td><td><b>વારાણસી</b></td><td><b>1791</b> માં <b>Sanskrit College</b> (Jonathan Duncan) તરીકે; 1958 માં યુનિવર્સિટી</td></tr><tr><td><b>કેન્દ્રીય સંસ્કૃત યુનિવર્સિટી</b></td><td>નવી દિલ્હી</td><td>2020 ધારો (અગાઉ RSkS – ડીમ્ડ)</td></tr><tr><td><b>શ્રી લાલ બહાદુર શાસ્ત્રી રાષ્ટ્રીય સંસ્કૃત યુનિવર્સિટી</b></td><td>નવી દિલ્હી</td><td>કેન્દ્રીય (2020)</td></tr><tr><td><b>રાષ્ટ્રીય સંસ્કૃત યુનિવર્સિટી</b></td><td>તિરુપતિ</td><td>કેન્દ્રીય (2020)</td></tr><tr><td><b>શ્રી સોમનાથ સંસ્કૃત યુનિવર્સિટી</b></td><td><b>વેરાવળ (ગુજરાત)</b></td><td>2005</td></tr><tr><td><b>કામેશ્વર સિંહ દરભંગા સંસ્કૃત યુનિ.</b></td><td>બિહાર</td><td>1961</td></tr></tbody></table></div><ul><li><b>Calcutta Madrasah (1781)</b>: <b>વોરેન હેસ્ટિંગ્સ</b> – અરબી/ફારસી</li></ul><div class=\"tk\"><i>★</i><span>\"<b>1781 મદરેસા (હેસ્ટિંગ્સ), 1791 સંસ્કૃત કોલેજ (ડંકન)</b>\"</span></div>"],["AYUSH અને પરંપરાગત તબીબી શિક્ષણ","<ul><li><b>AYUSH</b> = <b>A</b>yurveda, <b>Y</b>oga &amp; Naturopathy, <b>U</b>nani, <b>S</b>iddha, <b>H</b>omoeopathy (+ Sowa-Rigpa)</li><li>AYUSH મંત્રાલય: <b>નવેમ્બર 2014</b></li><li><b>ITRA</b> (Institute of Teaching and Research in Ayurveda), <b>જામનગર (ગુજરાત)</b> – રાષ્ટ્રીય મહત્વની સંસ્થા (2020)</li><li><b>ગુજરાત આયુર્વેદ યુનિવર્સિટી</b>, જામનગર (1967) – ભારતની પ્રથમ આયુર્વેદ યુનિવર્સિટી</li><li><b>NCISM</b> (National Commission for Indian System of Medicine, 2020)</li><li><b>WHO Global Centre for Traditional Medicine</b> – <b>જામનગર</b> (2022)</li><li><b>21 જૂન</b> = આંતરરાષ્ટ્રીય યોગ દિવસ (2015 થી)</li></ul>"],["પરંપરાગત (Conventional) અધ્યયન","<ul><li>નિયમિત <b>વર્ગખંડ, પૂર્ણ સમય</b>, હાજરી ફરજિયાત</li><li>કાર્યક્રમ: <b>UG</b> (B.A., B.Sc., B.Com. – 3/4 વર્ષ), <b>PG</b> (M.A., M.Sc., M.Com. – 2 વર્ષ), <b>Ph.D</b></li><li><b>યુનિવર્સિટીના પ્રકાર</b>: કેન્દ્રીય, રાજ્ય, ડીમ્ડ (UGC ધારા 3), ખાનગી, રાષ્ટ્રીય મહત્વની સંસ્થાઓ (INI)</li><li><b>સંલગ્ન (Affiliated)</b>, <b>ઘટક (Constituent)</b>, <b>સ્વાયત્ત (Autonomous)</b> કોલેજો</li><li><b>CBCS</b>, સેમેસ્ટર પ્રણાલી; NEP 2020 – <b>4 વર્ષ UG (FYUGP)</b></li></ul><div class=\"tk\"><i>★</i><span>ડીમ્ડ યુનિવર્સિટી = <b>UGC ધારો 1956 ની કલમ 3</b></span></div>"],["બિનપરંપરાગત – મુક્ત અને દૂરવર્તી શિક્ષણ (ODL)","<ul><li><b>પત્રાચાર શિક્ષણ (Correspondence)</b>: <b>દિલ્હી યુનિવર્સિટી – 1962</b> (School of Correspondence Courses) – ભારતમાં પ્રથમ</li><li>પ્રથમ <b>મુક્ત યુનિવર્સિટી</b>: <b>ડૉ. બી.આર. આંબેડકર ઓપન યુનિવર્સિટી, હૈદરાબાદ (1982)</b> – અગાઉ Andhra Pradesh Open University</li><li><b>IGNOU</b>: <b>1985</b>, નવી દિલ્હી – <b>વિશ્વની સૌથી મોટી યુનિવર્સિટી</b> (વિદ્યાર્થી સંખ્યા); NPE 1986 પહેલાં</li><li><b>ડૉ. બાબાસાહેબ આંબેડકર ઓપન યુનિવર્સિટી (BAOU)</b>: <b>અમદાવાદ (ગુજરાત), 1994</b></li><li><b>YCMOU</b> (નાસિક, 1989), <b>Kota Open University</b> (1987)</li><li>વિશ્વની પ્રથમ: <b>Open University, UK (1969)</b></li><li>નિયમન: <b>DEB</b> (Distance Education Bureau, UGC) – અગાઉ DEC (IGNOU)</li></ul><div class=\"tk\"><i>★</i><span>પ્રથમ ઓપન યુનિ. = <b>આંબેડકર, હૈદરાબાદ 1982</b>; IGNOU = <b>1985</b></span></div>"],["ODL ની લાક્ષણિકતાઓ અને Online શિક્ષણ","<ul><li><b>સ્વ-ગતિ અધ્યયન (Self-paced)</b>, લવચીક સમય-સ્થળ</li><li><b>Self Learning Material (SLM)</b>, સંપર્ક વર્ગ, અભ્યાસ કેન્દ્રો</li><li>કામ કરતા, ગ્રામ્ય, મહિલા અને વંચિત અધ્યેતાઓ માટે</li><li><b>Open</b>: પ્રવેશ શરતો હળવી; <b>Distance</b>: શિક્ષક-અધ્યેતા ભૌતિક રીતે દૂર</li><li><b>Online degree programmes</b>: UGC (Online Courses) Regulations 2018/2020</li><li><b>MOOCs</b>: SWAYAM (UGC 40% ક્રેડિટ)</li><li><b>Gyan Darshan</b> (IGNOU TV ચેનલ), <b>Gyan Vani</b> (FM રેડિયો)</li></ul>"],["કાર્યક્રમોની તુલના","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>પૌર્વાત્ય</th><th>પરંપરાગત</th><th>બિનપરંપરાગત</th></tr></thead><tbody><tr><td>વિષય</td><td>પ્રાચીન ભારતીય જ્ઞાન</td><td>આધુનિક વિદ્યાશાખાઓ</td><td>બધા</td></tr><tr><td>પદ્ધતિ</td><td>ગુરુ-શિષ્ય, શાસ્ત્ર</td><td>વર્ગખંડ</td><td>સ્વ-અધ્યયન, Online</td></tr><tr><td>હાજરી</td><td>નિયમિત</td><td>ફરજિયાત</td><td>લવચીક</td></tr><tr><td>ઉદાહરણ</td><td>સંસ્કૃત યુનિ., આયુર્વેદ</td><td>ગુજરાત યુનિ.</td><td>IGNOU, BAOU</td></tr></tbody></table></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Formal education</b></td><td>Organised education within a recognised system</td></tr><tr><td><b>Non-formal education</b></td><td>Organised learning outside conventional formal structures</td></tr><tr><td><b>Informal learning</b></td><td>Learning through everyday experience</td></tr><tr><td><b>Distance education</b></td><td>Teaching and learning separate ા વર્તન અને નિર્ણયોને માર્ગદર્શન આપે. <b>મૂલ્ય શિક્ષણ</b> = ઇચ્છનીય મૂલ્યોનો વિકાસ કરતું શિક્ષણ.</p><ul><li>હેતુ: <b>ચારિત્ર્ય નિર્માણ, નૈતિક વિવેક, સામાજિક જવાબદારી, લોકશાહી નાગરિકત્વ</b></li><li><b>ગાંધીજી</b>: \"ચારિત્ર્ય વગરનું જ્ઞાન\" – 7 સામાજિક પાપોમાંનું એક</li><li><b>સ્વામી વિવેકાનંદ</b>: \"શિક્ષણ એ માણસમાં પહેલેથી રહેલી પૂર્ણતાનું પ્રગટીકરણ છે\"</li></ul><div class=\"tk\"><i>★</i><span>મૂલ્ય શિક્ષણ = \"<b>Head + Heart + Hand</b>\"</span></div>"],["મૂલ્યોના પ્રકાર","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>વ્યક્તિગત (Personal)</b></td><td>પ્રામાણિકતા, શિસ્ત, સ્વચ્છતા, આત્મનિયંત્રણ</td></tr><tr><td><b>સામાજિક (Social)</b></td><td>સહકાર, સહિષ્ણુતા, સેવા, સમાનતા</td></tr><tr><td><b>નૈતિક (Moral)</b></td><td>સત્ય, અહિંસા, ન્યાય, કરુણા</td></tr><tr><td><b>આધ્યાત્મિક (Spiritual)</b></td><td>આત્મજ્ઞાન, શાંતિ, પ્રેમ</td></tr><tr><td><b>લોકશાહી/બંધારણીય</b></td><td>સ્વતંત્રતા, સમાનતા, બંધુત્વ, ન્યાય, બિનસાંપ્રદાયિકતા</td></tr><tr><td><b>સૌંદર્યલક્ષી (Aesthetic)</b></td><td>કલા, સંગીત, પ્રકૃતિ પ્રત્યે કદર</td></tr><tr><td><b>પર્યાવરણીય</b></td><td>પ્રકૃતિ સંરક્ષણ, ટકાઉ જીવનશૈલી</td></tr></tbody></table></div><ul><li><b>5 સાર્વત્રિક માનવ મૂલ્યો</b> (સત્ય સાઈ / NCERT સંદર્ભ): <b>સત્ય, ધર્મ (સદાચાર), શાંતિ, પ્રેમ, અહિંસા</b></li></ul>"],["મૂલ્ય શિક્ષણ – સમિતિઓ અને નીતિ","<ul><li><b>રાધાકૃષ્ણન પંચ (1948-49)</b>: ધાર્મિક અને નૈતિક શિક્ષણની ભલામણ</li><li><b>શ્રી પ્રકાશ સમિતિ (1959)</b>: <b>ધાર્મિક અને નૈતિક શિક્ષણ સમિતિ</b></li><li><b>કોઠારી પંચ (1964-66)</b>: સામાજિક, નૈતિક અને આધ્યાત્મિક મૂલ્યો</li><li><b>NPE 1986</b>: \"<b>મૂલ્ય શિક્ષણ</b>\" – સામાજિક અને નૈતિક મૂલ્યોના ઘટાડા પર ચિંતા; 10 <b>મૂળ તત્ત્વો (Core elements)</b></li><li><b>S.B. Chavan સમિતિ (1999)</b>: મૂલ્ય આધારિત શિક્ષણ – સંસદીય સમિતિ</li><li><b>NEP 2020</b>: <b>બંધારણીય મૂલ્યો</b>, નૈતિકતા, ભારતીય જ્ઞાન પરંપરા, વૈશ્વિક નાગરિકત્વ</li></ul><div class=\"tk\"><i>★</i><span>શ્રી પ્રકાશ = <b>1959, ધાર્મિક-નૈતિક</b></span></div>"],["UGC અને મૂલ્ય શિક્ષણ","<ul><li><b>UGC – \"Mulya Pravah\" (2019)</b>: ઉચ્ચ શિક્ષણ સંસ્થાઓમાં માનવ મૂલ્યો અને વ્યાવસાયિક નૈતિકતા; <b>Mulya Pravah 2.0 (2023)</b></li><li><b>\"Guru Dakshta\"</b>: Faculty induction programme</li><li><b>Jeevan Kaushal</b> (Life skills, 2019): UGC અભ્યાસક્રમ – પ્રત્યાયન, વ્યવસાયિક, નેતૃત્વ, સાર્વત્રિક માનવ મૂલ્યો</li><li><b>Deeksharambh</b> (Student Induction Programme, 2019)</li><li><b>NSS</b> (1969), <b>NCC</b> (1948), <b>Unnat Bharat Abhiyan</b> (2014)</li></ul>"],["પર્યાવરણીય શિક્ષણ (Environmental Education) – પરિચય","<ul><li>પર્યાવરણ પ્રત્યે <b>જાગૃતિ, જ્ઞાન, વલણ, કૌશલ્ય અને સહભાગિતા</b> વિકસાવતું શિક્ષણ</li><li><b>Tbilisi Declaration (1977)</b> – UNESCO-UNEP: પર્યાવરણીય શિક્ષણ પરની પ્રથમ આંતરસરકારી પરિષદ</li><li>Tbilisi ના <b>5 હેતુ</b>: <b>જાગૃતિ (Awareness), જ્ઞાન (Knowledge), વલણ (Attitude), કૌશલ્ય (Skills), સહભાગિતા (Participation)</b></li><li><b>Belgrade Charter (1975)</b>: પર્યાવરણીય શિક્ષણનું વૈશ્વિક માળખું</li></ul><div class=\"tk\"><i>★</i><span>Tbilisi = \"<b>A K A S P</b>\" – Awareness, Knowledge, Attitude, Skills, Participation</span></div>"],["ભારતમાં પર્યાવરણીય શિક્ષણ","<ul><li><b>M.C. Mehta vs Union of India (1991)</b>: સર્વોચ્ચ અદાલતે <b>તમામ સ્તરે પર્યાવરણ શિક્ષણ ફરજિયાત</b> કરવા આદેશ</li><li>UGC: <b>UG સ્તરે Environmental Studies (EVS)</b> ફરજિયાત – 2003-04 થી (Core module)</li><li><b>AECC</b> (Ability Enhancement Compulsory Course): Environmental Science – CBCS</li><li><b>CEE (Centre for Environment Education)</b>: <b>અમદાવાદ, 1984</b> – MoEFCC નું Centre of Excellence</li><li><b>National Green Corps (Eco-clubs)</b>: 2001-02</li><li><b>Paryavaran Mitra</b> કાર્યક્રમ</li><li><b>GLOBE</b> કાર્યક્રમ</li></ul>"],["મૂલ્ય અને પર્યાવરણ શિક્ષણની પદ્ધતિઓ","<ul><li><b>મૂલ્ય સ્પષ્ટીકરણ (Values clarification)</b>: Raths, Harmin, Simon (1966) – પસંદગી, કદર, કાર્ય</li><li><b>Kohlberg ની નૈતિક વિકાસ અવસ્થાઓ</b>: 3 સ્તર, 6 અવસ્થા (Pre-conventional, Conventional, Post-conventional)</li><li><b>નૈતિક દ્વિધા (Moral dilemma)</b> ચર્ચા</li><li><b>વાર્તા, પ્રાર્થના, મહાપુરુષોના જીવન</b></li><li><b>ક્ષેત્ર પ્રવાસ, પ્રોજેક્ટ, ઇકો-ક્લબ, વૃક્ષારોપણ</b></li><li><b>Role play, Case study</b>, સમુદાય સેવા</li><li><b>Hidden curriculum</b>: શાળાનું વાતાવરણ અને શિક્ષકનું વર્તન</li></ul><div class=\"tk\"><i>★</i><span>Kohlberg = \"<b>3 સ્તર – 6 અવસ્થા</b>\"</span></div>"],["ટકાઉ વિકાસ માટે શિક્ષણ (ESD)","<ul><li><b>UN Decade of ESD</b>: <b>2005-2014</b> (UNESCO)</li><li><b>Global Action Programme on ESD</b> (2015-2019)</li><li><b>ESD for 2030</b> (UNESCO, 2020-2030)</li><li><b>SDG 4.7</b>: ટકાઉ વિકાસ, માનવ અધિકાર, લિંગ સમાનતા, શાંતિ, વૈશ્વિક નાગરિકત્વ માટે શિક્ષણ</li><li><b>LiFE Mission</b> (Lifestyle for Environment): ભારત, 2021-22</li><li><b>Green campus</b>, Energy audit, Rain water harvesting – NAAC માપદંડ 7 (Institutional values)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Value education</b></td><td>Development of ethical understanding and responsibility</td></tr><tr><td><b>Environmental education</b></td><td>Learning about ecological systems and responsible action</td></tr><tr><td><b>Integrity</b></td><td>Consistency with ethical principles</td></tr><tr><td><b>Empathy</b></td><td>Understanding another person&#x27;s perspective</td></tr><tr><td><b>Respect</b></td><td>Consideration for others and their dignity</td></tr><tr><td><b>Tolerance</b></td><td>Acceptance of legitimate differences</td></tr><tr><td><b>Responsibility</b></td><td>Accountability for one&#x27;s actions</td></tr><tr><td><b>Cooperation</b></td><td>Working together towards shared aims</td></tr><tr><td><b>Civic awareness</b></td><td>Understanding responsibilities in public life</td></tr><tr><td><b>Environmental stewardship</b></td><td>Responsible care of natural systems</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>શ્રી પ્રકાશ સમિતિ = 1959 (ધાર્મિક-નૈતિક શિક્ષણ)</li><li>NPE 1986 = મૂલ્ય શિક્ષણ પર ભાર; S.B. Chavan = 1999</li><li>UGC Mulya Pravah = 2019; Jeevan Kaushal = Life skills</li><li>Tbilisi = 1977, 5 હેતુ (A K A S P); Belgrade = 1975</li><li>M.C. Mehta (1991) = પર્યાવરણ શિક્ષણ ફરજિયાત; CEE = અમદાવાદ 1984</li><li>ESD Decade = 2005-2014</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Tbilisi Declaration (1977) <b>પર્યાવરણીય શિક્ષણ</b> માટે છે; Stockholm (1972) માનવ પર્યાવરણ પરિષદ.</span></div>"]],"10-5":[["નીતિઓ, શાસન અને વહીવટ – પરિચય","<p>ભારતમાં ઉચ્ચ શિક્ષણનું શાસન <b>કેન્દ્ર અને રાજ્ય</b> બંનેની સંયુક્ત જવાબદારી છે.</p><ul><li><b>બંધારણીય જોગવાઈ</b>:</li><li><b>સંઘ યાદી (Union List) – Entry 66</b>: ઉચ્ચ શિક્ષણ અને સંશોધન સંસ્થાઓના <b>ધોરણોનું સંકલન અને નિર્ધારણ</b> (UGC ધારાનો આધાર)</li><li><b>સમવર્તી યાદી (Concurrent List) – Entry 25</b>: શિક્ષણ (ઉચ્ચ શિક્ષણ સહિત)</li><li><b>42મો બંધારણ સુધારો (1976)</b>: શિક્ષણને <b>રાજ્ય યાદીમાંથી સમવર્તી યાદીમાં</b> ખસેડ્યું (<b>સ્વર્ણ સિંહ સમિતિ</b> ભલામણ)</li><li><b>અનુચ્છેદ 21A</b>: 6-14 વર્ષ મફત અને ફરજિયાત શિક્ષણ (86મો સુધારો 2002; RTE 2009)</li></ul><div class=\"tk\"><i>★</i><span>\"<b>Union 66 – Concurrent 25 – 42મો સુધારો 1976</b>\"</span></div>"],["શિક્ષણ સંબંધિત અન્ય બંધારણીય અનુચ્છેદો","<div class=\"tw\"><table><thead><tr><th>અનુચ્છેદ</th><th>જોગવાઈ</th></tr></thead><tbody><tr><td>15(4), 15(5)</td><td>પછાત વર્ગ માટે શૈક્ષણિક સંસ્થામાં અનામત</td></tr><tr><td>21A</td><td>શિક્ષણનો અધિકાર (6-14)</td></tr><tr><td>29</td><td>લઘુમતીઓના ભાષા, લિપિ, સંસ્કૃતિનું રક્ષણ</td></tr><tr><td><b>30</b></td><td><b>લઘુમતીઓને શૈક્ષણિક સંસ્થા સ્થાપવાનો અધિકાર</b></td></tr><tr><td>45</td><td>6 વર્ષથી નીચેના બાળકો માટે પ્રારંભિક સંભાળ (ECCE)</td></tr><tr><td>46</td><td>SC/ST અને નબળા વર્ગોનું શૈક્ષણિક-આર્થિક હિત</td></tr><tr><td>350A</td><td>માતૃભાષામાં પ્રાથમિક શિક્ષણ</td></tr><tr><td>351</td><td>હિન્દી ભાષાનો વિકાસ</td></tr></tbody></table></div><ul><li><b>103મો સુધારો (2019)</b>: <b>EWS</b> માટે 10% અનામત (15(6))</li></ul>"],["શિક્ષણ મંત્રાલય અને કેન્દ્રીય માળખું","<ul><li><b>શિક્ષણ મંત્રાલય (Ministry of Education)</b>: 1947 માં સ્થાપના; <b>1985 માં MHRD</b> નામ; <b>2020 (NEP) માં ફરી Ministry of Education</b></li><li>પ્રથમ શિક્ષણ મંત્રી: <b>મૌલાના અબુલ કલામ આઝાદ</b> – જન્મદિવસ <b>11 નવેમ્બર = રાષ્ટ્રીય શિક્ષણ દિવસ</b></li><li>બે વિભાગ: <b>ઉચ્ચ શિક્ષણ વિભાગ</b> અને <b>શાળા શિક્ષણ અને સાક્ષરતા વિભાગ</b></li><li><b>CABE</b> (Central Advisory Board of Education): <b>1920</b> માં સ્થાપના (1935 પુનર્ગઠન) – કેન્દ્ર-રાજ્ય શિક્ષણ સલાહ</li><li><b>NTA</b> (National Testing Agency, <b>2017/18</b>): UGC NET, NEET, JEE Main, CUET</li></ul><div class=\"tk\"><i>★</i><span>આઝાદ = \"<b>11 નવેમ્બર, રાષ્ટ્રીય શિક્ષણ દિવસ</b>\"</span></div>"],["યુનિવર્સિટીના પ્રકાર","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>સ્થાપના</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>કેન્દ્રીય (Central)</b></td><td>સંસદના ધારાથી</td><td>BHU, JNU, DU, <b>કેન્દ્રીય યુનિ. ગુજરાત</b></td></tr><tr><td><b>રાજ્ય (State)</b></td><td>રાજ્ય વિધાનસભાના ધારાથી</td><td>ગુજરાત યુનિ., MSU, સરદાર પટેલ યુનિ.</td></tr><tr><td><b>ડીમ્ડ (Deemed-to-be)</b></td><td><b>UGC ધારો કલમ 3</b> હેઠળ કેન્દ્ર જાહેર કરે</td><td>IISc, BITS Pilani</td></tr><tr><td><b>ખાનગી (Private)</b></td><td>રાજ્ય ધારાથી</td><td>Nirma, Ahmedabad Univ.</td></tr><tr><td><b>રાષ્ટ્રીય મહત્વની સંસ્થા (INI)</b></td><td>સંસદના ખાસ ધારાથી</td><td>IITs, IIMs, AIIMS, NITs</td></tr></tbody></table></div><ul><li><b>સંલગ્ન કોલેજ</b> માત્ર યુનિવર્સિટીમાંથી ડિગ્રી મેળવે; <b>સ્વાયત્ત કોલેજ</b> પોતાનો અભ્યાસક્રમ અને પરીક્ષા</li><li><b>UGC ધારો કલમ 2(f)</b>: યુનિવર્સિટીની વ્યાખ્યા / માન્ય કોલેજ; <b>કલમ 12(B)</b>: UGC અનુદાન માટે પાત્રતા</li></ul>"],["યુનિવર્સિટી વહીવટી માળખું","<div class=\"tw\"><table><thead><tr><th>પદ/સંસ્થા</th><th>ભૂમિકા</th></tr></thead><tbody><tr><td><b>Visitor</b></td><td><b>રાષ્ટ્રપતિ</b> (કેન્દ્રીય યુનિવર્સિટીઓ)</td></tr><tr><td><b>Chancellor (કુલાધિપતિ)</b></td><td><b>રાજ્યપાલ</b> (રાજ્ય યુનિ. – મોટે ભાગે); ઔપચારિક વડા</td></tr><tr><td><b>Vice-Chancellor (કુલપતિ)</b></td><td><b>મુખ્ય કાર્યકારી અને શૈક્ષણિક અધિકારી</b></td></tr><tr><td><b>Pro-VC (ઉપકુલપતિ)</b></td><td>VC ના સહાયક</td></tr><tr><td><b>Registrar (કુલસચિવ)</b></td><td>વહીવટી વડા, રેકોર્ડ રક્ષક</td></tr><tr><td><b>Controller of Examinations</b></td><td>પરીક્ષા</td></tr><tr><td><b>Finance Officer</b></td><td>નાણાં</td></tr><tr><td><b>Court/Senate</b></td><td>સર્વોચ્ચ નીતિ સંસ્થા</td></tr><tr><td><b>Executive Council / Syndicate</b></td><td>મુખ્ય કાર્યકારી સંસ્થા</td></tr><tr><td><b>Academic Council</b></td><td>સર્વોચ્ચ શૈક્ષણિક સંસ્થા</td></tr><tr><td><b>Board of Studies</b></td><td>વિષયવાર અભ્યાસક્રમ</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>\"<b>Visitor = રાષ્ટ્રપતિ, Chancellor = રાજ્યપાલ, VC = મુખ્ય કાર્યકારી</b>\"</span></div>"],["ગુણવત્તા ખાતરી – NAAC, NIRF, NBA","<ul><li><b>NAAC</b> (1994, બેંગલુરુ): સંસ્થાકીય માન્યતા – <b>7 માપદંડ (Criteria)</b></li><li>1. Curricular aspects, 2. Teaching-learning &amp; evaluation, 3. Research, innovations &amp; extension, 4. Infrastructure &amp; learning resources, 5. Student support &amp; progression, 6. Governance, leadership &amp; management, 7. Institutional values &amp; best practices</li><li>ગ્રેડ: <b>A++, A+, A, B++, B+, B, C, D</b> (CGPA 4-પોઇન્ટ સ્કેલ); <b>2024 થી Binary accreditation</b> (Accredited / Not accredited) અને <b>Maturity-based graded levels (1-5)</b> ની સુધારેલી પ્રણાલી</li><li><b>IQAC</b> (Internal Quality Assurance Cell): દરેક સંસ્થામાં ફરજિયાત; <b>AQAR</b> વાર્ષિક અહેવાલ</li><li><b>NIRF</b> (2015, પ્રથમ ક્રમાંક 2016): 5 પરિમાણ – <b>TLR</b> (Teaching, Learning &amp; Resources), <b>RP</b> (Research &amp; Professional Practice), <b>GO</b> (Graduation Outcomes), <b>OI</b> (Outreach &amp; Inclusivity), <b>PR</b> (Perception)</li><li><b>NBA</b>: કાર્યક્રમ (Program) માન્યતા – ઇજનેરી, મેનેજમેન્ટ; Washington Accord (2014)</li></ul><div class=\"tk\"><i>★</i><span>NIRF = \"<b>TLR – RP – GO – OI – PR</b>\"</span></div>"],["અનુદાન અને મુખ્ય યોજનાઓ","<ul><li><b>UGC અનુદાન</b>: કલમ 12(B) હેઠળ માન્ય સંસ્થાઓને</li><li><b>RUSA</b> (Rashtriya Uchchatar Shiksha Abhiyan): <b>2013</b> – રાજ્ય ઉચ્ચ શિક્ષણ સંસ્થાઓ માટે કેન્દ્ર પ્રાયોજિત યોજના; <b>PM-USHA (2023)</b> માં રૂપાંતર</li><li><b>HEFA</b> (Higher Education Financing Agency): 2017 – માળખાકીય લોન</li><li><b>IoE</b> (Institutions of Eminence): 2017 – 20 સંસ્થાઓ (10 સરકારી + 10 ખાનગી)</li><li><b>PMRF</b> (2018), <b>SPARC</b>, <b>IMPRINT</b>, <b>STRIDE</b> (UGC)</li><li><b>GIAN</b> (Global Initiative of Academic Networks, 2015): વિદેશી ફેકલ્ટી</li><li><b>Study in India</b> (2018)</li></ul>"],["શિક્ષક ભરતી અને કારકિર્દી","<ul><li><b>UGC Regulations 2018</b>: ભરતી અને બઢતી માટે લઘુતમ લાયકાત</li><li>સહાયક પ્રાધ્યાપક: <b>NET/SET/SLET</b> અથવા Ph.D (2023 થી NET/SET/Ph.D – ત્રણમાંથી કોઈ પણ)</li><li><b>CAS</b> (Career Advancement Scheme): બઢતી – <b>API</b> (Academic Performance Indicators) સ્થાને 2018 માં સરળ માપદંડ</li><li><b>7મું પગાર પંચ</b> (UGC, 2017)</li><li><b>Orientation/Induction programme</b> (Guru Dakshta), <b>Refresher course</b>, <b>FDP</b></li><li><b>HRDC</b> (Human Resource Development Centre) – અગાઉ <b>ASC (Academic Staff College, 1987)</b></li><li><b>GSET</b>: ગુજરાતની State Eligibility Test – <b>M.S. University, Vadodara</b> દ્વારા આયોજિત</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Education policy</b></td><td>Principles guiding educational decisions</td></tr><tr><td><b>Governance</b></td><td>Structures and processes guiding institutional decisions</td></tr><tr><td><b>Administration</b></td><td>Implementation and management of institutional functions</td></tr><tr><td><b>Autonomy</b></td><td>Authority to make specified institutional decisions</td></tr><tr><td><b>Academic freedom</b></td><td>Freedom of responsible scholarly inquiry and expression</td></tr><tr><td><b>Participatory decision-making</b></td><td>Decision processes including relevant stakeholders</td></tr><tr><td><b>Strategic planning</b></td><td>Setting long-term goals and means to achieve them</td></tr><tr><td><b>Grievance mechanism</b></td><td>Process for addressing complaints</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Union List Entry 66 = ધોરણો; Concurrent Entry 25 = શિક્ષણ; 42મો સુધારો 1976</li><li>અનુચ્છેદ 30 = લઘુમતી શૈક્ષણિક સંસ્થા; 21A = RTE</li><li>Visitor = રાષ્ટ્રપતિ; Chancellor = રાજ્યપાલ; VC = મુખ્ય કાર્યકારી</li><li>Academic Council = સર્વોચ્ચ શૈક્ષણિક; Executive Council = કાર્યકારી</li><li>NAAC = 7 માપદંડ; NIRF = 5 પરિમાણ; IQAC = આંતરિક ગુણવત્તા</li><li>RUSA = 2013 (PM-USHA 2023); CABE = 1920; NTA = 2017</li><li>ડીમ્ડ યુનિ. = UGC ધારો કલમ 3; અનુદાન = કલમ 12(B)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: કુલપતિ (Vice-Chancellor) મુખ્ય કાર્યકારી છે; કુલાધિપતિ (Chancellor) ઔપચારિક વડા છે.</span></div>"]]};
S.read=S.read||{};
const ST={u:0};
function renderStudy(){const f=$('uFilter');f.innerHTML=`<button data-u="0" class="${!ST.u?'on':''}">${t('all')}</button>`+BANK.map(u=>`<button data-u="${u.n}" class="${ST.u===u.n?'on':''}">${um(u.n).ic} ${u.n}</button>`).join('');
 f.querySelectorAll('button').forEach(b=>b.onclick=()=>{ST.u=+b.dataset.u;renderStudy()});
 $('studyList').innerHTML=BANK.filter(u=>!ST.u||u.n===ST.u).map(u=>{const m=um(u.n);return `<div class="ublock" style="--c:${m.c}"><div class="uhead"><div class="ic">${m.ic}</div><div><b>${t('unit')} ${u.n} — ${esc(uname(u.n))}</b><small>${t('mcqs_topics',fmt(Q.filter(x=>x.u===u.n).length),u.topics.length).replace(/<\/?b>/g,'')}</small></div></div>
<div class="tgrid">${u.topics.map((tp,ti)=>{const k=u.n+'-'+ti,pg=(TH_DATA[k]||[]).length,rd=S.read[k]||0,pct=pg?Math.min(100,rd/pg*100):0;return `<div class="card tcard" style="--d:${ti*50}ms"><div class="tn">${t('unit')} ${u.n}.${ti+1}</div>${rd>=pg&&pg?`<span class="done-badge">${t('th_read')}</span>`:''}<h5>${esc(tp.name)}</h5>
<div class="tm"><span>📖 ${t('th_pages',pg)}</span><span>🎯 ${t('th_mcq',tp.questions.length)}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
<div class="tb"><button class="btn pri sm" data-th="${k}">${t('read_th')}</button><button class="btn sm" data-mq="${k}">${t('start_mcq')}</button></div></div>`}).join('')}</div></div>`}).join('');
 $('studyList').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const [u,ti]=b.dataset.th.split('-').map(Number);openTheory(u,ti)});
 $('studyList').querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{const [u,ti]=b.dataset.mq.split('-').map(Number);startTopicMCQ(u,ti)})}
const TH={u:0,ti:0,i:0,dir:1};
function openTheory(u,ti){TH.u=u;TH.ti=ti;TH.i=0;TH.dir=1;go('theory')}
function startTopicMCQ(u,ti){const tp=BANK.find(b=>b.n===u).topics[ti];$('pUnit').value=u;fillTopics('pUnit','pTopic');$('pTopic').value=u+'|'+tp.name;startPractice();go('practice')}
let thObs=null;
function renderTheory(){const k=TH.u+'-'+TH.ti,pages=TH_DATA[k]||[],n=pages.length;if(!n)return;const tp=BANK.find(b=>b.n===TH.u).topics[TH.ti];
 $('thUnit').textContent=`${um(TH.u).ic} ${t('unit')} ${TH.u} — ${uname(TH.u)} · ${n} ${LANG==='gu'?'વિભાગ':'sections'}`;$('thTitle').textContent=tp.name;
 $('thToc').innerHTML=`<h6>${LANG==='gu'?'અનુક્રમણિકા':'Contents'}</h6>`+pages.map(([h],j)=>`<a data-j="${j}"><i>${j+1}</i><span>${h}</span></a>`).join('');
 $('thChips').innerHTML=pages.map(([h],j)=>`<button data-j="${j}">${j+1}. ${h.replace(/<[^>]+>/g,'').split('(')[0].slice(0,28)}</button>`).join('');
 $('thDoc').innerHTML=pages.map(([h,body],j)=>`<section class="ts" id="ts-${j}" data-j="${j}"><h2><span class="n">${j+1}</span><span>${h}</span></h2><div class="th-body">${body}</div></section>`).join('')+
  `<div class="th-end"><div class="big">🏆</div><div><b>${t('th_done_h')}</b><small>${t('th_done_p',n)}</small></div><button class="btn gold glow" id="thGo">${t('th_go')}</button></div>`;
 $('thDoc').querySelectorAll('.th-body').forEach(bd=>[...bd.children].forEach((el,i)=>el.style.animationDelay=(0.08+i*0.05)+'s'));
 const jump=j=>{const el=$('ts-'+j);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
 document.querySelectorAll('#thToc a,#thChips button').forEach(x=>x.onclick=()=>jump(+x.dataset.j));
 $('thGo').onclick=()=>startTopicMCQ(TH.u,TH.ti);
 if(thObs)thObs.disconnect();
 const setActive=j=>{document.querySelectorAll('#thToc a').forEach(a=>{const jj=+a.dataset.j;a.classList.toggle('on',jj===j);a.classList.toggle('seen',jj<(S.read[k]||0))});
  document.querySelectorAll('#thChips button').forEach(b=>b.classList.toggle('on',+b.dataset.j===j));const c=document.querySelector('#thChips button.on');c&&c.scrollIntoView({inline:'center',block:'nearest'});
  const ta=document.querySelector('#thToc a.on');ta&&ta.scrollIntoView({block:'nearest'})};
 thObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');const j=+e.target.dataset.j;if(j+1>(S.read[k]||0)){S.read[k]=j+1;save()}}})},{threshold:.12});
 document.querySelectorAll('#thDoc .ts').forEach(x=>thObs.observe(x));
 const onScroll=()=>{if(cur!=='theory')return;const doc=$('thDoc'),r=doc.getBoundingClientRect(),total=r.height-innerHeight*.6,done=Math.min(1,Math.max(0,(-r.top+innerHeight*.35)/Math.max(1,total)));$('thBar').style.width=(done*100)+'%';
  let act=0;document.querySelectorAll('#thDoc .ts').forEach(x=>{if(x.getBoundingClientRect().top<innerHeight*.4)act=+x.dataset.j});if(act!==TH.i){TH.i=act;setActive(act)}};
 window.removeEventListener('scroll',window.__thScroll||(()=>{}));window.__thScroll=onScroll;window.addEventListener('scroll',onScroll,{passive:true});
 TH.i=-1;onScroll();setActive(0);
 requestAnimationFrame(()=>{const f=$('ts-0');f&&f.classList.add('vis')})}
$('thSkip').onclick=()=>startTopicMCQ(TH.u,TH.ti);$('thBack').onclick=()=>{ST.u=TH.u;go('study')};

/* ================= boot ================= */
applyLang();
$('lbtn').disabled=false;$('lbtn').classList.remove('busy');$('lload').style.display='none';
dataReady.then(()=>{if(S.last&&byId.has(S.last.id)){const x=byId.get(S.last.id);$('pUnit').value=x.u;fillTopics('pUnit','pTopic');$('pTopic').value=x.u+'|'+x.t;startPractice();const k=P.list.findIndex(q=>q.id===x.id);if(k>=0)P.i=k}});
let remembered=false;try{remembered=localStorage.getItem(AUTH_KEY)==='1'}catch(e){}
if(remembered){$('login').classList.remove('on');enterApp()}else{startLoginAnim();setTimeout(()=>{if(stage===-1&&innerWidth>900)$('lu').focus({preventScroll:true})},1300)}
document.fonts&&document.fonts.ready.then(()=>{moveKnobs();movePill()});
})();
</script>
