</td><td>સામાન્ય → વિશેષ</td><td>વિશેષ → સામાન્ય</td></tr><tr><td>નિષ્કર્ષ</td><td>નિશ્ચિત (Certain)</td><td>સંભવિત (Probable)</td></tr><tr><td>મૂલ્યાંકન</td><td>Valid / Invalid</td><td>Strong / Weak</td></tr><tr><td>સારી દલીલ</td><td>Sound</td><td>Cogent</td></tr><tr><td>નવું જ્ઞાન</td><td>નહીં</td><td>હા</td></tr><tr><td>પ્રણેતા</td><td>Aristotle</td><td>Bacon</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: <b>D</b>eductive = <b>D</b>own (ઉપરથી નીચે – સામાન્યથી વિશેષ); <b>I</b>nductive = <b>I</b>ncrease (વિશેષથી વ્યાપક)</span></div>"],["Abductive અને Analogical તર્ક","<ul><li><b>Abductive (અપહરણ)</b>: <b>શ્રેષ્ઠ સમજૂતી તરફનું અનુમાન</b> (Inference to the best explanation) – <b>C.S. Peirce</b></li><li>ઉદાહરણ: રસ્તો ભીનો છે → કદાચ વરસાદ પડ્યો હશે</li><li>ડોક્ટરનું નિદાન, જાસૂસી તપાસ</li><li><b>Analogical (સાદૃશ્ય)</b>: બે વસ્તુઓમાં કેટલીક સમાનતા છે તેથી બીજી બાબતમાં પણ સમાન હશે</li><li>ઉદાહરણ: પૃથ્વી પર પાણી અને જીવન છે; મંગળ પર પાણી છે → કદાચ જીવન હશે</li><li>મજબૂતાઈ = સમાનતાની <b>સુસંગતતા (Relevance)</b> પર આધારિત</li></ul>"],["અન્ય તર્ક પ્રકારો","<ul><li><b>Critical reasoning</b>: દલીલનું મૂલ્યાંકન – ધારણા, મજબૂત/નબળી કરવી</li><li><b>Verbal reasoning</b>: શબ્દ આધારિત – સાદૃશ્ય, વર્ગીકરણ</li><li><b>Non-verbal reasoning</b>: આકૃતિ, પેટર્ન</li><li><b>Mathematical reasoning</b>: સંખ્યા, શ્રેણી, ગણતરી</li><li><b>Causal reasoning</b>: કારણ-અસર સંબંધ</li><li><b>Statistical reasoning</b>: નમૂના પરથી વસ્તી વિશે</li><li><b>Common sense reasoning</b>: રોજિંદા અનુભવ આધારિત</li></ul>"],["દલીલનું વિશ્લેષણ","<ul><li><b>આધારવિધાન (Premise)</b>: સમર્થન આપતું વિધાન</li><li><b>નિષ્કર્ષ (Conclusion)</b>: સમર્થિત દાવો</li><li><b>ધારણા (Assumption)</b>: ન લખેલું પણ જરૂરી આધારવિધાન</li><li><b>Enthymeme</b>: એક આધાર કે નિષ્કર્ષ છુપાયેલો હોય તેવું ન્યાયવાક્ય</li><li>દલીલ ≠ સમજૂતી (Explanation): દલીલ \"<b>શા માટે માનવું</b>\" બતાવે; સમજૂતી \"<b>શા માટે થયું</b>\" બતાવે</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: દરેક \"કારણ કે\" વાળું વાક્ય દલીલ નથી – ક્યારેક તે સમજૂતી હોય છે.</span></div>"],["Validity, Truth અને Soundness","<div class=\"tw\"><table><thead><tr><th>આધાર</th><th>નિષ્કર્ષ</th><th>Valid શક્ય?</th></tr></thead><tbody><tr><td>બધા સાચા</td><td>સાચો</td><td>હા</td></tr><tr><td>બધા સાચા</td><td>ખોટો</td><td><b>ક્યારેય નહીં</b></td></tr><tr><td>કોઈ ખોટો</td><td>સાચો</td><td>હા</td></tr><tr><td>કોઈ ખોટો</td><td>ખોટો</td><td>હા</td></tr></tbody></table></div><ul><li>Validity = <b>સ્વરૂપ (Form)</b> નો ગુણ; Truth = <b>વિધાન</b> નો ગુણ</li><li><b>Valid દલીલમાં સાચા આધાર અને ખોટો નિષ્કર્ષ અશક્ય</b></li></ul><div class=\"tk\"><i>★</i><span>\"Valid ≠ True\" – ખોટા આધારવાળી દલીલ પણ Valid હોઈ શકે</span></div>"],["પ્રશ્ન ઓળખવાની ટ્રિક્સ","<ul><li>\"<b>નિશ્ચિત, અનિવાર્ય, ચોક્કસ, જ અનુસરે</b>\" → નિગમન</li><li>\"<b>સંભવતઃ, મોટે ભાગે, અવલોકન, નમૂના</b>\" → આગમન</li><li>\"<b>શ્રેષ્ઠ સમજૂતી, કદાચ કારણ</b>\" → Abductive</li><li>\"<b>જેમ...તેમ, સમાન છે તેથી</b>\" → Analogical</li><li>સામાન્ય નિયમ → ચોક્કસ કિસ્સો = નિગમન</li><li>ઘણા કિસ્સા → સામાન્ય નિયમ = આગમન</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Deductive reasoning</b></td><td>General premises used for a necessary conclusion</td></tr><tr><td><b>Inductive reasoning</b></td><td>Observations used for a probable generalisation</td></tr><tr><td><b>Abductive reasoning</b></td><td>Inference to a plausible explanation</td></tr><tr><td><b>Analogy</b></td><td>Comparison based on relevant similarity</td></tr><tr><td><b>Premise</b></td><td>Statement offered in support of a conclusion</td></tr><tr><td><b>Conclusion</b></td><td>Claim supported by an argument</td></tr><tr><td><b>Valid deduction</b></td><td>True premises cannot yield a false conclusion</td></tr><tr><td><b>Sound argument</b></td><td>Valid deductive argument with true premises</td></tr><tr><td><b>Counterexample</b></td><td>Case disproving a universal claim</td></tr><tr><td><b>Pattern recognition</b></td><td>Identifying a regular relationship</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Deductive: સામાન્ય→વિશેષ, Certain, Valid/Invalid, Aristotle</li><li>Inductive: વિશેષ→સામાન્ય, Probable, Strong/Weak, Bacon</li><li>Abductive: Best explanation, C.S. Peirce</li><li>Sound = Valid + True premises; Cogent = Strong + True premises</li><li>Valid દલીલમાં સાચા આધાર → ખોટો નિષ્કર્ષ <b>અશક્ય</b></li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: આગમનમાં \"Valid\" શબ્દ વપરાતો નથી – \"Strong\" વપરાય છે.</span></div>"]],"5-1":[["શ્રેણી અને સંકેત – પરિચય","<p>આ વિભાગમાં પેટર્ન ઓળખવાની ક્ષમતા ચકાસાય છે:</p><ul><li><b>અંક શ્રેણી (Number series)</b></li><li><b>અક્ષર શ્રેણી (Letter series)</b> અને મિશ્ર શ્રેણી</li><li><b>સંકેતીકરણ-વિસંકેતીકરણ (Coding-Decoding)</b></li><li><b>સંબંધો (Blood relations)</b></li></ul><div class=\"nt\">પદ્ધતિ: પહેલાં તફાવત જુઓ → ગુણોત્તર જુઓ → વર્ગ/ઘન જુઓ → વૈકલ્પિક પેટર્ન જુઓ</div>"],["અંક શ્રેણી – મુખ્ય પેટર્ન","<div class=\"tw\"><table><thead><tr><th>પેટર્ન</th><th>ઉદાહરણ</th><th>નિયમ</th></tr></thead><tbody><tr><td>સમાંતર (+d)</td><td>3, 8, 13, 18, ?</td><td>+5 → 23</td></tr><tr><td>ગુણોત્તર (×r)</td><td>2, 6, 18, 54, ?</td><td>×3 → 162</td></tr><tr><td>વધતો તફાવત</td><td>2, 3, 5, 8, 12, ?</td><td>+1,+2,+3,+4,+5 → 17</td></tr><tr><td>વર્ગ</td><td>1, 4, 9, 16, ?</td><td>n² → 25</td></tr><tr><td>ઘન</td><td>1, 8, 27, 64, ?</td><td>n³ → 125</td></tr><tr><td>n² ± 1</td><td>2, 5, 10, 17, ?</td><td>n²+1 → 26</td></tr><tr><td>અવિભાજ્ય</td><td>2, 3, 5, 7, 11, ?</td><td>Prime → 13</td></tr><tr><td>Fibonacci</td><td>1, 1, 2, 3, 5, 8, ?</td><td>આગળના બેનો સરવાળો → 13</td></tr><tr><td>વૈકલ્પિક</td><td>1, 10, 2, 20, 3, ?</td><td>બે શ્રેણી → 30</td></tr></tbody></table></div>"],["અંક શ્રેણી – શોર્ટકટ ટ્રિક્સ","<ul><li>★ <b>ઝડપથી વધે</b> → ગુણાકાર અથવા વર્ગ/ઘન</li><li>★ <b>ધીમે વધે</b> → સરવાળો/બાદબાકી</li><li>★ <b>વધ-ઘટ</b> → વૈકલ્પિક (Alternate) શ્રેણી</li><li>★ તફાવતના તફાવત લો (Second difference) – બીજી વાર સમાન આવે તો દ્વિઘાત પેટર્ન</li><li>★ ×2+1, ×2−1, ×3+1 જેવા મિશ્ર નિયમ ચકાસો</li><li><b>ખોટી સંખ્યા શોધવી (Wrong term)</b>: નિયમ લાગુ કરી જે ન બેસે તે</li><li>યાદ રાખો: વર્ગ 1-30, ઘન 1-15, અવિભાજ્ય 1-100 (25 અવિભાજ્ય)</li></ul>"],["અક્ષર શ્રેણી – અક્ષર ક્રમાંક","<div class=\"tw\"><table><thead><tr><th>A1</th><th>B2</th><th>C3</th><th>D4</th><th>E5</th><th>F6</th><th>G7</th><th>H8</th><th>I9</th><th>J10</th><th>K11</th><th>L12</th><th>M13</th></tr></thead><tbody><tr><td>N14</td><td>O15</td><td>P16</td><td>Q17</td><td>R18</td><td>S19</td><td>T20</td><td>U21</td><td>V22</td><td>W23</td><td>X24</td><td>Y25</td><td>Z26</td></tr></tbody></table></div><ul><li>★ <b>EJOTY</b> ટ્રિક: E=5, J=10, O=15, T=20, Y=25</li><li>★ વિરુદ્ધ ક્રમાંક: <b>ઊલટો ક્રમ = 27 − ક્રમાંક</b> (A↔Z, B↔Y, M↔N)</li><li>★ વિરોધી જોડી: \"<b>AZ BY CX DW EV</b>...\" – સરવાળો હંમેશા 27</li><li>ઉદાહરણ: A, C, F, J, O, ? → +2,+3,+4,+5,+6 → <b>U</b></li></ul>"],["સંકેતીકરણ-વિસંકેતીકરણ (Coding-Decoding)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>અક્ષર ખસેડવો (+n)</td><td>CAT → DBU (+1)</td></tr><tr><td>ઊલટો ક્રમ</td><td>CAT → XZG (27 − ક્રમાંક)</td></tr><tr><td>ક્રમાંક</td><td>CAT → 3-1-20</td></tr><tr><td>ક્રમાંકનો સરવાળો</td><td>CAT = 3+1+20 = 24</td></tr><tr><td>શબ્દ ઊલટો</td><td>CAT → TAC</td></tr><tr><td>સાંકેતિક શબ્દ</td><td>\"sky is blue\" → \"la pa ta\" (સામાન્ય શબ્દ શોધો)</td></tr></tbody></table></div><ul><li>★ ટ્રિક: બંને બાજુ અક્ષર લખી તફાવત ગણો; જો તફાવત સમાન તો shift coding</li><li>★ વાક્ય coding: બે વાક્યમાં <b>સામાન્ય શબ્દ ↔ સામાન્ય સંકેત</b></li></ul>"],["સંબંધો (Blood Relations)","<ul><li><b>કુટુંબ વૃક્ષ (Family tree)</b> દોરો: પુરુષ = +/□, સ્ત્રી = −/○, પતિ-પત્ની = ═, ભાઈ-બહેન = ─, પેઢી = ઊભી રેખા</li><li>મહત્વના સંબંધ:</li><li>પિતાનો/માતાનો પિતા = દાદા/નાના</li><li>પિતાનો ભાઈ = કાકા; માતાનો ભાઈ = મામા</li><li>પિતાની બહેન = ફોઈ; માતાની બહેન = માસી</li><li>ભાઈની પત્ની = ભાભી; બહેનનો પતિ = બનેવી</li><li>પતિ/પત્નીનો ભાઈ = સાળો/દિયર/જેઠ</li><li>★ \"<b>એકમાત્ર પુત્ર/પુત્રી</b>\" જેવા શબ્દો મહત્વના – તે જ વ્યક્તિ પોતે હોઈ શકે</li><li>★ \"<b>મારા પિતાના એકમાત્ર પુત્ર</b>\" = હું પોતે (જો હું પુરુષ)</li></ul>"],["દિશા અને ક્રમ (Direction &amp; Ranking)","<ul><li>દિશા: ઉત્તર ઉપર; જમણે વળવું = ઘડિયાળની દિશા (Clockwise 90°)</li><li><b>પાયથાગોરસ</b>: અંતર = √(x² + y²) – દા.ત. 3 કિમી ઉત્તર, 4 કિમી પૂર્વ → 5 કિમી</li><li><b>ક્રમ (Ranking)</b>: કુલ = ઉપરથી ક્રમ + નીચેથી ક્રમ − 1</li><li>ઉદાહરણ: ઉપરથી 7મો, નીચેથી 12મો → કુલ = 7+12−1 = <b>18</b></li><li>★ સૂર્યોદય સમયે પડછાયો <b>પશ્ચિમ</b> તરફ; સાંજે <b>પૂર્વ</b> તરફ</li></ul>"],["ઘડિયાળ અને કેલેન્ડર શોર્ટકટ","<ul><li>ઘડિયાળના કાંટા વચ્ચેનો ખૂણો: <b>θ = |30H − 5.5M|</b></li><li>કાંટા દર <b>65 5/11 મિનિટે</b> ભેગા થાય; 12 કલાકમાં <b>11 વાર</b>, 24 કલાકમાં 22 વાર</li><li>કેલેન્ડર – <b>વિષમ દિવસો (Odd days)</b>: સામાન્ય વર્ષ = 1, લીપ વર્ષ = 2</li><li>100 વર્ષ = 5 odd days, 200 = 3, 300 = 1, 400 = 0</li><li>લીપ વર્ષ: 4 થી ભાગી શકાય; સદી વર્ષ 400 થી ભાગી શકાય (2000 લીપ, 1900 નહીં)</li></ul><div class=\"tk\"><i>★</i><span>સૂત્ર: <b>θ = 30H − 11M/2</b></span></div>"],["ઉકેલેલાં ઉદાહરણો (Solved Examples)","<ul><li><b>પ્રશ્ન 1</b>: 3, 7, 15, 31, 63, ? → દરેક પદ = આગળનું × 2 + 1 → <b>127</b></li><li><b>પ્રશ્ન 2</b>: 2, 6, 12, 20, 30, ? → n(n+1): 1×2, 2×3, 3×4... → <b>42</b></li><li><b>પ્રશ્ન 3</b>: B, E, H, K, ? → +3 → <b>N</b></li><li><b>પ્રશ્ન 4</b>: જો MANGO = NBOHP, તો APPLE = ? → દરેક અક્ષર +1 → <b>BQQMF</b></li><li><b>પ્રશ્ન 5</b>: A, B નો પિતા; C, A ની માતા; D, C નો ભાઈ → C, B ની દાદી છે; તેથી D = B ની <b>દાદીનો ભાઈ</b> (કુટુંબ વૃક્ષ દોરીને ચકાસો)</li><li><b>પ્રશ્ન 6</b>: 4:15 વાગ્યે કાંટા વચ્ચેનો ખૂણો = |30×4 − 5.5×15| = |120 − 82.5| = <b>37.5°</b></li><li><b>પ્રશ્ન 7</b>: વર્ગમાં રાહુલ ઉપરથી 9મો અને નીચેથી 16મો → કુલ = 9 + 16 − 1 = <b>24</b></li></ul><div class=\"tk\"><i>★</i><span>દરેક શ્રેણીમાં પહેલાં <b>તફાવત</b>, પછી <b>ગુણોત્તર</b>, પછી <b>n² / n³ / n(n+1)</b> ચકાસો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>EJOTY = 5,10,15,20,25; વિરોધી અક્ષર સરવાળો = 27</li><li>શ્રેણીમાં પહેલાં <b>તફાવત</b>, પછી <b>ગુણોત્તર</b>, પછી <b>વર્ગ/ઘન</b></li><li>ક્રમ: કુલ = ઉપરથી + નીચેથી − 1</li><li>ઘડિયાળ ખૂણો = |30H − 5.5M|</li><li>સંબંધ પ્રશ્નમાં હંમેશા <b>કુટુંબ વૃક્ષ</b> દોરો</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"A નો ભાઈ B છે\" થી B નું લિંગ (પુરુષ) ખબર પડે, પણ A નું લિંગ નહીં.</span></div>"]],"5-2":[["ગાણિતિક અભિયોગ્યતા – પરિચય","<p>આ વિભાગમાં સામાન્ય અંકગણિત (Arithmetic) ના પ્રશ્નો આવે છે:</p><ul><li><b>અપૂર્ણાંક, ગુણોત્તર-પ્રમાણ, શતમાન (ટકાવારી)</b></li><li><b>નફો-ખોટ, વ્યાજ (સાદું/ચક્રવૃદ્ધિ), વટાવ</b></li><li><b>સમય-અંતર, સમય-કાર્ય, સરેરાશ</b></li></ul><div class=\"nt\">સુવર્ણ નિયમ: સૂત્ર યાદ રાખો + વિકલ્પ પરથી ઉલટું ચકાસો (Back-solving)</div>"],["અપૂર્ણાંક અને ટકાવારી રૂપાંતર","<div class=\"tw\"><table><thead><tr><th>અપૂર્ણાંક</th><th>%</th><th>અપૂર્ણાંક</th><th>%</th></tr></thead><tbody><tr><td>1/2</td><td>50%</td><td>1/8</td><td>12.5%</td></tr><tr><td>1/3</td><td>33.33%</td><td>1/9</td><td>11.11%</td></tr><tr><td>1/4</td><td>25%</td><td>1/10</td><td>10%</td></tr><tr><td>1/5</td><td>20%</td><td>1/11</td><td>9.09%</td></tr><tr><td>1/6</td><td>16.67%</td><td>1/12</td><td>8.33%</td></tr><tr><td>1/7</td><td>14.28%</td><td>1/16</td><td>6.25%</td></tr></tbody></table></div><ul><li>★ આ કોષ્ટક યાદ રાખવાથી ગણતરી 3 ગણી ઝડપી</li><li>અપૂર્ણાંકની તુલના: ત્રાંસો ગુણાકાર (Cross multiply)</li></ul>"],["ટકાવારી (Percentage) – સૂત્રો અને ટ્રિક્સ","<ul><li>x નો y% = x × y / 100</li><li><b>% ફેરફાર</b> = (ફેરફાર ÷ મૂળ) × 100</li><li>★ <b>ક્રમિક ફેરફાર</b>: a% અને b% → કુલ = <b>a + b + ab/100</b></li><li>ઉદા: 10% વધારો પછી 10% ઘટાડો → 10 − 10 − 1 = <b>−1%</b> (1% ઘટાડો)</li><li>★ કિંમત r% વધે તો વપરાશ ઘટાડ = <b>r/(100+r) × 100</b></li><li>ઉદા: કિંમત 25% વધે → વપરાશ 25/125 × 100 = <b>20% ઘટાડવો</b></li><li>★ x% નો y% = y% નો x% (દા.ત. 8% of 50 = 50% of 8 = 4)</li></ul>"],["ગુણોત્તર અને પ્રમાણ","<ul><li>ગુણોત્તર a : b = a/b</li><li>રકમ ને a : b માં વહેંચવી → પ્રથમ = <b>a/(a+b) × રકમ</b></li><li>પ્રમાણ: a : b = c : d → <b>ad = bc</b> (આંત્ય પદોનો ગુણાકાર = મધ્ય પદોનો ગુણાકાર)</li><li><b>મધ્ય પ્રમાણ (Mean proportional)</b> of a, b = <b>√ab</b></li><li><b>તૃતીય પ્રમાણ</b> of a, b = b²/a</li><li>★ ગુણોત્તર A:B = 2:3, B:C = 4:5 → A:B:C = <b>8 : 12 : 15</b> (B ને સમાન કરો)</li><li>ભાગીદારી: નફો ∝ મૂડી × સમય</li></ul>"],["નફો-ખોટ અને વટાવ","<ul><li>નફો = વેચાણ કિંમત (SP) − પડતર કિંમત (CP); ખોટ = CP − SP</li><li><b>નફો% = (નફો ÷ CP) × 100</b> – હંમેશા CP પર</li><li>SP = CP × (100 + નફો%) / 100</li><li><b>વટાવ (Discount)</b> = છાપેલી કિંમત (MP) − SP; વટાવ% <b>MP પર</b></li><li>★ ક્રમિક વટાવ a% અને b% → કુલ = <b>a + b − ab/100</b></li><li>★ બે વસ્તુ સમાન SP પર, એક x% નફો, બીજી x% ખોટ → હંમેશા <b>ખોટ = x²/100 %</b></li><li>ઉદા: 20% નફો અને 20% ખોટ → 4% ખોટ</li></ul>"],["સાદું અને ચક્રવૃદ્ધિ વ્યાજ","<ul><li><b>સાદું વ્યાજ (SI) = P × R × T / 100</b></li><li><b>રકમ (A) ચક્રવૃદ્ધિ = P (1 + R/100)ᵀ</b>; CI = A − P</li><li>★ <b>2 વર્ષ માટે CI − SI = P (R/100)²</b></li><li>★ <b>3 વર્ષ માટે CI − SI = P (R/100)² (3 + R/100)</b></li><li>★ રકમ બમણી થવાનો સમય (SI) = <b>100 / R</b> વર્ષ</li><li>★ <b>Rule of 72</b> (CI): બમણી થવાનો સમય ≈ <b>72 / R</b></li><li>અર્ધવાર્ષિક: R/2 અને 2T વાપરો</li></ul>"],["સમય, અંતર અને ઝડપ","<ul><li><b>ઝડપ = અંતર ÷ સમય</b></li><li>કિમી/કલાક → મીટર/સેકન્ડ: × <b>5/18</b>; મી/સે → કિમી/ક: × <b>18/5</b></li><li>★ <b>સરેરાશ ઝડપ</b> (સમાન અંતર, ઝડપ x અને y) = <b>2xy / (x + y)</b></li><li>સાપેક્ષ ઝડપ: વિરુદ્ધ દિશા = x + y; સમાન દિશા = x − y</li><li>ટ્રેન થાંભલો પસાર કરે: અંતર = ટ્રેન લંબાઈ; પ્લેટફોર્મ: ટ્રેન + પ્લેટફોર્મ લંબાઈ</li><li>હોડી: પ્રવાહ સાથે (Downstream) = u + v; વિરુદ્ધ (Upstream) = u − v</li><li>★ 60 કિમી/કલાક = 1 કિમી/મિનિટ</li></ul>"],["સમય-કાર્ય અને સરેરાશ","<ul><li>A એક કામ a દિવસમાં, B b દિવસમાં → સાથે = <b>ab / (a + b)</b> દિવસ</li><li>★ LCM પદ્ધતિ: કુલ કામ = LCM(a, b) એકમ; દૈનિક કાર્યક્ષમતા ઉમેરો</li><li><b>M₁D₁H₁ / W₁ = M₂D₂H₂ / W₂</b> (માણસ-દિવસ-કલાક-કામ)</li><li>પાઈપ-ટાંકી: ભરતી પાઈપ +, ખાલી કરતી −</li><li><b>સરેરાશ = કુલ ÷ સંખ્યા</b></li><li>★ n ક્રમિક પ્રાકૃતિક સંખ્યાનો સરવાળો = <b>n(n+1)/2</b>; સરેરાશ = (n+1)/2</li><li>નવું સભ્ય ઉમેરતાં સરેરાશ ફેરફાર → કુલ ફેરફારનો ઉપયોગ કરો</li></ul>"],["ઉકેલેલાં ઉદાહરણો (Solved Examples)","<ul><li><b>પ્રશ્ન 1</b>: વસ્તુ 20% નફે ₹ 600 માં વેચી → CP = 600 × 100/120 = <b>₹ 500</b></li><li><b>પ્રશ્ન 2</b>: ₹ 5000 પર 10% વાર્ષિક દરે 2 વર્ષનું CI − SI = 5000 × (10/100)² = <b>₹ 50</b></li><li><b>પ્રશ્ન 3</b>: ભાવ 20% વધ્યો; ખર્ચ સમાન રાખવા વપરાશ ઘટાડ = 20/120 × 100 = <b>16.67%</b></li><li><b>પ્રશ્ન 4</b>: A કામ 12 દિવસમાં, B 18 દિવસમાં → સાથે = 12×18/30 = <b>7.2 દિવસ</b></li><li><b>પ્રશ્ન 5</b>: 72 કિમી/કલાક = 72 × 5/18 = <b>20 મી/સે</b></li><li><b>પ્રશ્ન 6</b>: 150 મી લાંબી ટ્રેન 54 કિમી/કલાક (15 મી/સે) થી થાંભલો પસાર કરે → 150/15 = <b>10 સેકન્ડ</b></li><li><b>પ્રશ્ન 7</b>: ₹ 1,200 ને 2 : 3 માં વહેંચો → 480 અને <b>720</b></li><li><b>પ્રશ્ન 8</b>: 10% અને 20% ક્રમિક વટાવ = 10 + 20 − 200/100 = <b>28%</b></li></ul><div class=\"tk\"><i>★</i><span>વિકલ્પો પરથી ઉલટું ચકાસવું (Back-solving) સૌથી ઝડપી પદ્ધતિ છે.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>ક્રમિક % ફેરફાર = a + b + ab/100 (ઘટાડા માટે ઋણ ચિહ્ન)</li><li>નફો% CP પર; વટાવ% MP પર</li><li>CI − SI (2 વર્ષ) = P(R/100)²</li><li>સરેરાશ ઝડપ = 2xy/(x+y) – સાદી સરેરાશ નહીં!</li><li>km/h → m/s = × 5/18</li><li>સાથે કામ = ab/(a+b)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: 40 અને 60 કિમી/કલાકની સરેરાશ ઝડપ 50 નહીં, પણ <b>48</b> કિમી/કલાક છે.</span></div>"]],"6-0":[["દલીલની રચના – પરિચય","<p>દલીલ (Argument) એટલે એવો વિધાન સમૂહ જેમાં એક કે વધુ <b>આધારવિધાનો (Premises)</b> એક <b>નિષ્કર્ષ (Conclusion)</b> ને સમર્થન આપે છે.</p><ul><li><b>પદ (Term)</b>: વિધાનમાં વિષય કે વિધેય</li><li><b>વિધાન (Proposition)</b>: સાચું કે ખોટું હોઈ શકે તેવું વાક્ય</li><li><b>ન્યાયવાક્ય (Syllogism)</b>: બે આધારવિધાન + એક નિષ્કર્ષ; ત્રણ પદ – <b>Aristotle</b></li><li>અભ્યાસક્રમ: Categorical વિધાનો, Mood &amp; Figure, ભ્રામકતા (Fallacies), ભાષાના ઉપયોગ, વાચ્યાર્થ-વ્યંગ્યાર્થ, Square of opposition</li></ul>"],["નિરપેક્ષ (Categorical) વિધાનના 4 પ્રકાર","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>સ્વરૂપ</th><th>ગુણ</th><th>પરિમાણ</th></tr></thead><tbody><tr><td><b>A</b></td><td>બધા S, P છે (All S are P)</td><td>હકારાત્મક</td><td>સાર્વત્રિક (Universal)</td></tr><tr><td><b>E</b></td><td>કોઈ S, P નથી (No S is P)</td><td>નકારાત્મક</td><td>સાર્વત્રિક</td></tr><tr><td><b>I</b></td><td>કેટલાક S, P છે (Some S are P)</td><td>હકારાત્મક</td><td>વિશિષ્ટ (Particular)</td></tr><tr><td><b>O</b></td><td>કેટલાક S, P નથી (Some S are not P)</td><td>નકારાત્મક</td><td>વિશિષ્ટ</td></tr></tbody></table></div><ul><li>A અને I = લેટિન \"<b>AffIrmo</b>\" (હું સ્વીકારું છું); E અને O = \"<b>nEgO</b>\" (હું નકારું છું)</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: <b>A</b>ffIrmo → A, I હકાર; n<b>E</b>g<b>O</b> → E, O નકાર</span></div>"],["પદ વ્યાપ્તિ (Distribution of Terms)","<div class=\"tw\"><table><thead><tr><th>વિધાન</th><th>વિષય (S)</th><th>વિધેય (P)</th></tr></thead><tbody><tr><td>A</td><td>વ્યાપ્ત ✓</td><td>અવ્યાપ્ત ✗</td></tr><tr><td>E</td><td>વ્યાપ્ત ✓</td><td>વ્યાપ્ત ✓</td></tr><tr><td>I</td><td>અવ્યાપ્ત ✗</td><td>અવ્યાપ્ત ✗</td></tr><tr><td>O</td><td>અવ્યાપ્ત ✗</td><td>વ્યાપ્ત ✓</td></tr></tbody></table></div><ul><li>★ ટ્રિક: \"<b>A</b>sebinop\" – <b>A</b>: <b>S</b>ubject, <b>E</b>: <b>B</b>oth, <b>I</b>: <b>N</b>one, <b>O</b>: <b>P</b>redicate</li><li>સાર્વત્રિક વિધાન → વિષય વ્યાપ્ત; નકારાત્મક વિધાન → વિધેય વ્યાપ્ત</li></ul>"],["ન્યાયવાક્યની રચના અને નિયમો","<ul><li><b>મુખ્ય પદ (Major term – P)</b>: નિષ્કર્ષનું વિધેય</li><li><b>ગૌણ પદ (Minor term – S)</b>: નિષ્કર્ષનો વિષય</li><li><b>મધ્ય પદ (Middle term – M)</b>: બંને આધારમાં, નિષ્કર્ષમાં નહીં</li><li><b>નિયમો</b>:</li><li>મધ્ય પદ ઓછામાં ઓછું એક વાર વ્યાપ્ત (નહીં તો <b>Undistributed middle</b>)</li><li>નિષ્કર્ષમાં વ્યાપ્ત પદ આધારમાં પણ વ્યાપ્ત (નહીં તો <b>Illicit major/minor</b>)</li><li>બે નકારાત્મક આધાર → કોઈ નિષ્કર્ષ નહીં (<b>Exclusive premises</b>)</li><li>એક આધાર નકારાત્મક → નિષ્કર્ષ નકારાત્મક</li><li>બે વિશિષ્ટ આધાર → કોઈ નિષ્કર્ષ નહીં</li></ul>"],["Mood અને Figure","<ul><li><b>Mood</b>: આધાર-આધાર-નિષ્કર્ષના A/E/I/O પ્રકારોનો ક્રમ (દા.ત. <b>AAA</b>, EIO)</li><li><b>Figure</b>: મધ્ય પદ (M) નું સ્થાન</li></ul><div class=\"tw\"><table><thead><tr><th>Figure</th><th>મુખ્ય આધાર</th><th>ગૌણ આધાર</th></tr></thead><tbody><tr><td>1</td><td>M – P</td><td>S – M</td></tr><tr><td>2</td><td>P – M</td><td>S – M</td></tr><tr><td>3</td><td>M – P</td><td>M – S</td></tr><tr><td>4</td><td>P – M</td><td>M – S</td></tr></tbody></table></div><ul><li>કુલ શક્ય સ્વરૂપ = 64 mood × 4 figure = <b>256</b>; યથાર્થ = <b>24</b> (Boolean દૃષ્ટિએ <b>15</b> બિનશરતી)</li><li>પ્રસિદ્ધ યથાર્થ: <b>Barbara (AAA-1)</b>, Celarent (EAE-1), Darii (AII-1), Ferio (EIO-1)</li></ul><div class=\"tk\"><i>★</i><span>Figure ટ્રિક: M નું સ્થાન → 1: \"<b>ઉપર ડાબે-નીચે જમણે</b>\", 4: ઊલટું</span></div>"],["વિરોધ ચોરસ (Square of Opposition)","<div class=\"tw\"><table><thead><tr><th>સંબંધ</th><th>વિધાનો</th><th>નિયમ</th></tr></thead><tbody><tr><td><b>વિરોધી (Contradictory)</b></td><td>A–O, E–I</td><td>એક સાચું તો બીજું ખોટું; બંને ક્યારેય સાથે સાચા/ખોટા નહીં</td></tr><tr><td><b>વિપરીત (Contrary)</b></td><td>A–E</td><td>બંને સાથે ખોટા હોઈ શકે, સાથે સાચા નહીં</td></tr><tr><td><b>ઉપવિપરીત (Sub-contrary)</b></td><td>I–O</td><td>બંને સાથે સાચા હોઈ શકે, સાથે ખોટા નહીં</td></tr><tr><td><b>ગૌણ/અધીન (Subalternation)</b></td><td>A→I, E→O</td><td>સાર્વત્રિક સાચું → વિશિષ્ટ સાચું</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: <b>ત્રાંસા = Contradictory</b>; ઉપર = Contrary; નીચે = Sub-contrary; ઊભા = Subaltern</span></div>"],["અનૌપચારિક ભ્રામકતાઓ (Informal Fallacies)","<div class=\"tw\"><table><thead><tr><th>ભ્રામકતા</th><th>અર્થ</th></tr></thead><tbody><tr><td><b>Ad hominem</b></td><td>દલીલ નહીં, વ્યક્તિ પર હુમલો</td></tr><tr><td><b>Straw man</b></td><td>વિરોધીના મતને વિકૃત કરી હુમલો</td></tr><tr><td><b>Ad populum</b></td><td>બહુમતી માને છે તેથી સાચું</td></tr><tr><td><b>Ad verecundiam</b></td><td>અયોગ્ય સત્તા/નિષ્ણાતનો આધાર</td></tr><tr><td><b>Ad ignorantiam</b></td><td>સાબિત નથી થયું તેથી ખોટું/સાચું</td></tr><tr><td><b>Ad baculum</b></td><td>બળ/ધમકીનો આધાર</td></tr><tr><td><b>Ad misericordiam</b></td><td>દયાની અપીલ</td></tr><tr><td><b>Circular / Begging the question</b></td><td>નિષ્કર્ષ જ આધારમાં</td></tr><tr><td><b>False dilemma</b></td><td>માત્ર બે વિકલ્પ બતાવવા</td></tr><tr><td><b>Slippery slope</b></td><td>નાના પગલાથી મોટી આપત્તિ</td></tr><tr><td><b>Hasty generalisation</b></td><td>ઓછા ઉદાહરણ પરથી સામાન્ય નિયમ</td></tr><tr><td><b>Post hoc</b></td><td>પછી થયું તેથી તેના કારણે થયું</td></tr><tr><td><b>Red herring</b></td><td>મુદ્દાથી ધ્યાન ભટકાવવું</td></tr><tr><td><b>Tu quoque</b></td><td>\"તું પણ એવું જ કરે છે\"</td></tr></tbody></table></div>"],["ભાષાના ઉપયોગ, વાચ્યાર્થ અને વ્યંગ્યાર્થ","<ul><li><b>ભાષાના ઉપયોગ (Irving Copi)</b>: માહિતીપ્રદ (Informative), અભિવ્યક્તિપ્રદ (Expressive), નિર્દેશાત્મક (Directive), ઔપચારિક/વિધિપરક (Ceremonial), કાર્યસાધક (Performative)</li><li><b>વાચ્યાર્થ (Denotation / Extension)</b>: પદ જે <b>વસ્તુઓ</b> ને લાગુ પડે તે સમૂહ</li><li><b>વ્યંગ્યાર્થ/ગુણાર્થ (Connotation / Intension)</b>: પદના <b>ગુણધર્મો/લક્ષણો</b></li><li>★ નિયમ: <b>Connotation વધે → Denotation ઘટે</b> (વ્યસ્ત પ્રમાણ)</li><li>ઉદા: \"પ્રાણી\" → \"માનવ\" (ગુણ વધ્યા, વસ્તુ ઘટી)</li><li><b>Ambiguity</b>: Equivocation (શબ્દના બે અર્થ), Amphiboly (વાક્ય રચનાથી બે અર્થ)</li></ul>"],["ઔપચારિક ભ્રામકતાઓ (Formal Fallacies)","<ul><li><b>Undistributed middle</b>: મધ્ય પદ એક પણ વાર વ્યાપ્ત નહીં</li><li><b>Illicit major / Illicit minor</b>: નિષ્કર્ષમાં વ્યાપ્ત પદ આધારમાં અવ્યાપ્ત</li><li><b>Exclusive premises</b>: બંને આધાર નકારાત્મક</li><li><b>Four terms</b>: ચાર પદ (ત્રણને બદલે)</li><li><b>Affirming the consequent</b>: જો P તો Q; Q છે → તેથી P (અયથાર્થ)</li><li><b>Denying the antecedent</b>: જો P તો Q; P નથી → તેથી Q નથી (અયથાર્થ)</li><li>યથાર્થ: <b>Modus Ponens</b> (P → Q, P ∴ Q), <b>Modus Tollens</b> (P → Q, ¬Q ∴ ¬P)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Universal affirmative</b></td><td>All S are P</td></tr><tr><td><b>Universal negative</b></td><td>No S are P</td></tr><tr><td><b>Particular affirmative</b></td><td>Some S are P</td></tr><tr><td><b>Particular negative</b></td><td>Some S are not P</td></tr><tr><td><b>Ad hominem</b></td><td>Attacking the person instead of the argument</td></tr><tr><td><b>Straw man</b></td><td>Distorting a view to attack it</td></tr><tr><td><b>Equivocation</b></td><td>Changing the meaning of a key word</td></tr><tr><td><b>False dilemma</b></td><td>Presenting unjustifiably limited alternatives</td></tr><tr><td><b>Denotation</b></td><td>Literal reference or meaning</td></tr><tr><td><b>Connotation</b></td><td>Associated implications of a word</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>A = All, E = No, I = Some, O = Some not</li><li>વ્યાપ્તિ: A-S, E-બંને, I-કોઈ નહીં, O-P</li><li>Contradictory = A-O, E-I (ત્રાંસા)</li><li>Barbara = AAA-1</li><li>Connotation ↑ → Denotation ↓</li><li>Ad hominem = વ્યક્તિ પર હુમલો; Straw man = વિકૃત રજૂઆત</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"Some S are P\" સાચું હોય તો \"Some S are not P\" પણ સાચું હોઈ શકે (Sub-contrary).</span></div>"]],"6-1":[["આગમન અને નિગમન – પુનરાવર્તન","<ul><li><b>નિગમન (Deduction)</b>: આધારવિધાનો નિષ્કર્ષને <b>અનિવાર્ય રીતે</b> સાબિત કરે – Valid/Invalid</li><li><b>આગમન (Induction)</b>: આધારવિધાનો નિષ્કર્ષને <b>સંભાવનાથી</b> સમર્થન આપે – Strong/Weak</li><li>આ એકમમાં: તેમનો <b>ભેદ</b> અને <b>મૂલ્યાંકન</b></li></ul><div class=\"nt\">નિગમનનો દાવો: \"નિષ્કર્ષ જ અનુસરે છે\"; આગમનનો દાવો: \"નિષ્કર્ષ સંભવિત છે\"</div>"],["નિગમનાત્મક દલીલોનું મૂલ્યાંકન","<ul><li><b>Validity (યથાર્થતા)</b>: આધાર સાચા માનીએ તો નિષ્કર્ષ ખોટો હોવો <b>અશક્ય</b></li><li><b>Soundness (સુદૃઢતા)</b>: Valid + <b>બધા આધાર ખરેખર સાચા</b></li><li>Validity <b>સ્વરૂપ (Form)</b> પર આધારિત, વિષયવસ્તુ પર નહીં</li><li><b>Counterexample method</b>: સમાન સ્વરૂપ પણ સાચા આધાર-ખોટા નિષ્કર્ષનું ઉદાહરણ મળે → Invalid</li><li>સાધનો: Venn diagram, Truth table, Rules of syllogism</li></ul><div class=\"tk\"><i>★</i><span>Sound = <b>Valid + True</b></span></div>"],["આગમનાત્મક દલીલોનું મૂલ્યાંકન","<ul><li><b>Strength (મજબૂતાઈ)</b>: આધાર સાચા હોય તો નિષ્કર્ષ <b>સંભવિત</b> કેટલો?</li><li><b>Cogency (પ્રતીતિજનકતા)</b>: Strong + <b>સાચા આધાર</b></li><li>મજબૂતાઈના માપદંડ:</li><li>નમૂનાનું <b>કદ (Size)</b> – મોટો નમૂનો</li><li>નમૂનાની <b>પ્રતિનિધિત્વ (Representativeness)</b></li><li><b>વૈવિધ્ય (Variety)</b> અને <b>વિરોધી પુરાવાનો અભાવ</b></li><li>નિષ્કર્ષની <b>મધ્યમતા</b> – \"કેટલાક\" વધુ મજબૂત, \"બધા\" ઓછું</li><li>આગમન <b>ખામીયુક્ત (Defeasible)</b> – નવો પુરાવો નિષ્કર્ષ બદલી શકે</li></ul>"],["આગમનના પ્રકારો","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>સામાન્યીકરણ (Generalisation)</b></td><td>નમૂના પરથી સમગ્ર વસ્તી</td></tr><tr><td><b>આગાહી (Prediction)</b></td><td>ભૂતકાળ પરથી ભવિષ્ય</td></tr><tr><td><b>સાદૃશ્ય (Analogy)</b></td><td>બે વસ્તુની સમાનતા પરથી</td></tr><tr><td><b>કારણાત્મક (Causal)</b></td><td>કારણ-અસર અનુમાન</td></tr><tr><td><b>આંકડાકીય (Statistical)</b></td><td>90% X છે; a, X છે</td></tr><tr><td><b>સત્તા આધારિત (Authority)</b></td><td>નિષ્ણાત કહે છે</td></tr><tr><td><b>શ્રેષ્ઠ સમજૂતી (Abduction)</b></td><td>અવલોકન માટે સૌથી સારો ખુલાસો</td></tr></tbody></table></div>"],["J.S. Mill ની કારણ શોધ પદ્ધતિઓ","<div class=\"tw\"><table><thead><tr><th>પદ્ધતિ</th><th>અર્થ</th></tr></thead><tbody><tr><td><b>Method of Agreement</b> (અન્વય)</td><td>અનેક કિસ્સામાં એક જ સામાન્ય પરિબળ → કારણ</td></tr><tr><td><b>Method of Difference</b> (વ્યતિરેક)</td><td>માત્ર એક પરિબળનો તફાવત → કારણ</td></tr><tr><td><b>Joint Method</b></td><td>Agreement + Difference</td></tr><tr><td><b>Method of Residues</b> (અવશેષ)</td><td>જાણીતા કારણ બાદ કરતાં બાકી</td></tr><tr><td><b>Concomitant Variation</b> (સહપરિવર્તન)</td><td>એક સાથે વધ-ઘટ</td></tr></tbody></table></div><ul><li>★ ટ્રિક: \"<b>A D J R C</b>\" – Agreement, Difference, Joint, Residues, Concomitant</li><li>Mill ની કૃતિ: \"A System of Logic\" (1843)</li></ul>"],["ભેદ ઓળખવાની ટ્રિક્સ","<div class=\"tw\"><table><thead><tr><th>સંકેત શબ્દ</th><th>પ્રકાર</th></tr></thead><tbody><tr><td>અનિવાર્ય, ચોક્કસ, જ, સાબિત</td><td>નિગમન</td></tr><tr><td>સંભવતઃ, મોટે ભાગે, કદાચ, શક્ય છે</td><td>આગમન</td></tr><tr><td>બધા X Y છે, a X છે → a Y છે</td><td>નિગમન</td></tr><tr><td>મોટાભાગના X Y છે, a X છે → a કદાચ Y છે</td><td>આગમન</td></tr><tr><td>ગણિત, ભૂમિતિ, વ્યાખ્યા આધારિત</td><td>નિગમન</td></tr><tr><td>સર્વે, અવલોકન, પ્રયોગ</td><td>આગમન</td></tr></tbody></table></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: વિશેષથી વિશેષ (Particular to particular) પણ આગમન (સાદૃશ્ય) હોઈ શકે.</span></div>"],["શરતી (Conditional) દલીલો","<div class=\"tw\"><table><thead><tr><th>સ્વરૂપ</th><th>નામ</th><th>યથાર્થ?</th></tr></thead><tbody><tr><td>P → Q, P ∴ Q</td><td><b>Modus Ponens</b></td><td>✓</td></tr><tr><td>P → Q, ¬Q ∴ ¬P</td><td><b>Modus Tollens</b></td><td>✓</td></tr><tr><td>P → Q, Q ∴ P</td><td>Affirming the consequent</td><td>✗</td></tr><tr><td>P → Q, ¬P ∴ ¬Q</td><td>Denying the antecedent</td><td>✗</td></tr><tr><td>P → Q, Q → R ∴ P → R</td><td><b>Hypothetical syllogism</b></td><td>✓</td></tr><tr><td>P ∨ Q, ¬P ∴ Q</td><td><b>Disjunctive syllogism</b></td><td>✓</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>\"<b>Ponens = હા પરથી હા; Tollens = ના પરથી ના</b>\"</span></div>"],["સત્ય કોષ્ટક (Truth Table) – મૂળભૂત","<div class=\"tw\"><table><thead><tr><th>P</th><th>Q</th><th>¬P</th><th>P ∧ Q</th><th>P ∨ Q</th><th>P → Q</th><th>P ↔ Q</th></tr></thead><tbody><tr><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td><td>T</td><td>T</td></tr><tr><td>T</td><td>F</td><td>F</td><td>F</td><td>T</td><td><b>F</b></td><td>F</td></tr><tr><td>F</td><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td><td>F</td></tr><tr><td>F</td><td>F</td><td>T</td><td>F</td><td>F</td><td>T</td><td>T</td></tr></tbody></table></div><ul><li>★ <b>P → Q માત્ર ત્યારે જ ખોટું</b> જ્યારે P સાચું અને Q ખોટું</li><li><b>Contrapositive</b>: P → Q ≡ ¬Q → ¬P (સમતુલ્ય)</li><li><b>Converse</b> (Q → P) અને <b>Inverse</b> (¬P → ¬Q) સમતુલ્ય નથી</li></ul>"],["આગમનની ભ્રામકતાઓ","<ul><li><b>Hasty generalisation</b>: ઓછા કિસ્સા પરથી નિયમ</li><li><b>Biased sample</b>: અપ્રતિનિધિ નમૂનો</li><li><b>Weak analogy</b>: અસંગત સમાનતા</li><li><b>Post hoc ergo propter hoc</b>: પછી થયું તેથી કારણ</li><li><b>Gambler's fallacy</b>: સ્વતંત્ર ઘટનાને આગળની ઘટના પર આધારિત માનવી</li><li><b>Slippery slope</b>: અપ્રમાણિત સાંકળ</li><li><b>Cherry picking</b>: માત્ર અનુકૂળ પુરાવા પસંદ કરવા</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Deduction</b></td><td>Conclusion claimed to follow necessarily</td></tr><tr><td><b>Induction</b></td><td>Conclusion supported with probability</td></tr><tr><td><b>Soundness</b></td><td>Validity together with true premises</td></tr><tr><td><b>Inductive strength</b></td><td>Degree of support supplied by premises</td></tr><tr><td><b>Cogency</b></td><td>Strong inductive argument with true premises</td></tr><tr><td><b>Generalisation</b></td><td>Inference from cases to a wider class</td></tr><tr><td><b>Causal inference</b></td><td>Inference about cause and effect</td></tr><tr><td><b>Statistical inference</b></td><td>Drawing population conclusions from data</td></tr><tr><td><b>Counterargument</b></td><td>Argument challenging another argument</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>નિગમન: Valid/Invalid, Sound; આગમન: Strong/Weak, Cogent</li><li>Modus Ponens અને Modus Tollens = યથાર્થ</li><li>Affirming consequent, Denying antecedent = અયથાર્થ</li><li>P → Q ખોટું માત્ર T → F માં</li><li>Mill: Agreement, Difference, Joint, Residues, Concomitant</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Invalid દલીલ પણ સાચો નિષ્કર્ષ ધરાવી શકે; Valid દલીલનો નિષ્કર્ષ ખોટો હોઈ શકે (જો આધાર ખોટા હોય).</span></div>"]],"6-2":[["સંબંધ ઘટાયક (Analogies) – પરિચય","<p>સાદૃશ્ય (Analogy) પ્રશ્નમાં બે શબ્દો/વસ્તુઓ વચ્ચેનો <b>સંબંધ</b> ઓળખી, તે જ સંબંધ બીજી જોડીમાં લાગુ કરવાનો હોય છે.</p><ul><li>સ્વરૂપ: <b>A : B :: C : ?</b></li><li>વાંચો: \"A નો B સાથે જે સંબંધ છે, તે જ C નો ? સાથે\"</li><li>પ્રકાર: <b>શાબ્દિક (Verbal)</b>, <b>અંક (Number)</b>, <b>અક્ષર (Letter)</b>, <b>આકૃતિ (Figural)</b></li></ul><div class=\"nt\">સુવર્ણ નિયમ: પહેલી જોડીનો સંબંધ <b>એક ચોક્કસ વાક્યમાં</b> બનાવો.</div>"],["શાબ્દિક સાદૃશ્યના મુખ્ય સંબંધો – ભાગ 1","<div class=\"tw\"><table><thead><tr><th>સંબંધ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>સમાનાર્થી</td><td>મોટું : વિશાળ</td></tr><tr><td>વિરોધી</td><td>ગરમ : ઠંડું</td></tr><tr><td>ભાગ : સંપૂર્ણ</td><td>પાંખડી : ફૂલ</td></tr><tr><td>કાર્યકર : સાધન</td><td>સુથાર : કરવત</td></tr><tr><td>કાર્યકર : કાર્યસ્થળ</td><td>ડોક્ટર : હોસ્પિટલ</td></tr><tr><td>કાર્યકર : ઉત્પાદન</td><td>કવિ : કવિતા</td></tr><tr><td>કારણ : અસર</td><td>વરસાદ : પૂર</td></tr><tr><td>સાધન : કાર્ય</td><td>પેન : લખવું</td></tr></tbody></table></div>"],["શાબ્દિક સાદૃશ્યના મુખ્ય સંબંધો – ભાગ 2","<div class=\"tw\"><table><thead><tr><th>સંબંધ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>પ્રાણી : બચ્ચું</td><td>ગાય : વાછરડું, સિંહ : બચ્ચું (Cub)</td></tr><tr><td>પ્રાણી : રહેઠાણ</td><td>મધમાખી : મધપૂડો, ઘોડો : તબેલો</td></tr><tr><td>પ્રાણી : અવાજ</td><td>સિંહ : ગર્જના, કૂતરો : ભસવું</td></tr><tr><td>દેશ : રાજધાની</td><td>ભારત : નવી દિલ્હી</td></tr><tr><td>દેશ : ચલણ</td><td>જાપાન : યેન</td></tr><tr><td>માપ : એકમ</td><td>લંબાઈ : મીટર, બળ : ન્યૂટન</td></tr><tr><td>સમૂહ : સભ્ય</td><td>ટોળું : ઘેટું</td></tr><tr><td>વધુ તીવ્રતા (Degree)</td><td>ગરમ : દઝાડતું</td></tr></tbody></table></div>"],["સાદૃશ્ય ઉકેલવાની પદ્ધતિ (સોપાનો)","<ul><li><b>1.</b> પહેલી જોડી વચ્ચે ચોક્કસ સંબંધ વાક્ય બનાવો: \"<b>___ વડે ___ થાય છે</b>\"</li><li><b>2.</b> એ જ વાક્ય દરેક વિકલ્પ પર લાગુ કરો</li><li><b>3.</b> એકથી વધુ વિકલ્પ બેસે તો વાક્ય <b>વધુ ચોક્કસ</b> બનાવો</li><li><b>4.</b> ક્રમ પર ધ્યાન આપો: A : B નો ક્રમ C : D માં પણ સમાન</li><li><b>5.</b> શબ્દની જાતિ (Part of speech) સમાન રાખો</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>Bridge sentence</b>\" – સંબંધને એક પુલ વાક્યમાં ફેરવો</span></div>"],["અંક સાદૃશ્ય (Number Analogy)","<div class=\"tw\"><table><thead><tr><th>સંબંધ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>વર્ગ</td><td>3 : 9 :: 5 : 25</td></tr><tr><td>ઘન</td><td>2 : 8 :: 4 : 64</td></tr><tr><td>n² + 1</td><td>3 : 10 :: 6 : 37</td></tr><tr><td>n³ − n</td><td>3 : 24 :: 4 : 60</td></tr><tr><td>ગુણાકાર</td><td>4 : 20 :: 6 : 30 (×5)</td></tr><tr><td>અવિભાજ્ય ક્રમ</td><td>2 : 3 :: 5 : 7</td></tr><tr><td>અંકોનો સરવાળો</td><td>23 : 5 :: 47 : 11</td></tr></tbody></table></div><ul><li>★ પહેલાં વર્ગ/ઘન ચકાસો, પછી ±1, પછી ગુણાકાર</li></ul>"],["અક્ષર સાદૃશ્ય (Letter Analogy)","<ul><li>અક્ષર ક્રમાંક (A=1 ... Z=26) અને <b>EJOTY</b> ટ્રિક વાપરો</li><li>ઉદા: <b>ACE : BDF :: GIK : ?</b> → દરેક +1 → <b>HJL</b></li><li>ઉદા: <b>AZ : BY :: CX : ?</b> → વિરોધી જોડી (સરવાળો 27) → <b>DW</b></li><li>ઉદા: <b>CAT : DBU :: DOG : ?</b> → +1 → <b>EPH</b></li><li>★ ઊલટો ક્રમ: 27 − ક્રમાંક</li></ul>"],["વર્ગીકરણ (Odd one out) – સંબંધિત પ્રકાર","<ul><li>આપેલા સમૂહમાંથી <b>જુદું (Odd)</b> શોધવું</li><li>ઉદા: ગુલાબ, કમળ, જાસૂદ, <b>તુલસી</b> (ફૂલ નહીં – છોડ)</li><li>ઉદા: 9, 25, 49, <b>63</b>, 81 (63 વર્ગ નથી)</li><li>ઉદા: AEI, OUA, <b>BCD</b>, IOU (BCD માં સ્વર નથી)</li><li>★ ટ્રિક: સૌથી <b>ચોક્કસ</b> સામાન્ય ગુણ શોધો, પછી જે ન બેસે તે</li></ul>"],["તાર્કિક સાદૃશ્ય દલીલ (Argument from Analogy)","<ul><li>સ્વરૂપ: A અને B માં ગુણ x, y, z છે; A માં w પણ છે → <b>B માં પણ w હશે</b></li><li>મજબૂતાઈના માપદંડ (Copi):</li><li>સરખાવેલી વસ્તુઓની <b>સંખ્યા</b></li><li>સમાનતાઓની <b>સંખ્યા અને વિવિધતા</b></li><li><b>સુસંગતતા (Relevance)</b> – સૌથી મહત્વનું</li><li><b>ભિન્નતા (Disanalogies)</b> ઓછી</li><li>નિષ્કર્ષની <b>મધ્યમતા</b></li><li><b>Weak analogy fallacy</b>: અસંગત સમાનતા પર આધાર</li></ul>"],["શબ્દ જોડીના વિશિષ્ટ સંબંધો","<ul><li><b>ભાષા : લિપિ</b> – ગુજરાતી : ગુજરાતી લિપિ, હિન્દી : દેવનાગરી</li><li><b>વિજ્ઞાન : અભ્યાસ</b> – Ornithology : પક્ષી, Entomology : કીટક, Seismology : ભૂકંપ, Numismatics : સિક્કા, Philately : ટપાલ ટિકિટ</li><li><b>રોગ : અંગ</b> – Hepatitis : યકૃત, Cataract : આંખ</li><li><b>સાધન : માપ</b> – Barometer : વાતાવરણીય દબાણ, Seismograph : ભૂકંપ, Hygrometer : ભેજ</li><li><b>ભય : વસ્તુ</b> – Hydrophobia : પાણી, Acrophobia : ઊંચાઈ</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Doctor</b></td><td>Treat: Profession and usual function</td></tr><tr><td><b>Pen</b></td><td>Write: Instrument and action</td></tr><tr><td><b>Eye</b></td><td>See: Sense organ and function</td></tr><tr><td><b>Bird</b></td><td>Nest: Animal and dwelling</td></tr><tr><td><b>Seed</b></td><td>Plant: Earlier and later growth stage</td></tr><tr><td><b>Wheel</b></td><td>Vehicle: Part and whole</td></tr><tr><td><b>Author</b></td><td>Book: Creator and creation</td></tr><tr><td><b>Hot</b></td><td>Cold: Opposite meanings</td></tr><tr><td><b>Teacher</b></td><td>Student: Complementary social roles</td></tr><tr><td><b>Kilogram</b></td><td>Mass: Unit and measured quantity</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>હંમેશા <b>સંબંધ વાક્ય (Bridge sentence)</b> બનાવો</li><li>ક્રમ (A:B) અને શબ્દ પ્રકાર સમાન રાખો</li><li>અંક સાદૃશ્ય: વર્ગ → ઘન → ±1 → ગુણાકાર</li><li>અક્ષર: EJOTY, વિરોધી જોડી સરવાળો 27</li><li>સાદૃશ્ય દલીલની મજબૂતાઈ = <b>સુસંગત સમાનતા</b></li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"ડોક્ટર : દર્દી\" (સેવા સંબંધ) અને \"ડોક્ટર : હોસ્પિટલ\" (કાર્યસ્થળ) જુદા સંબંધો છે.</span></div>"]],"6-3":[["વેન ડાયાગ્રામ – પરિચય","<p><b>John Venn (1880)</b> એ વર્તુળો દ્વારા વર્ગો (Classes) અને તેમના સંબંધો દર્શાવવાની પદ્ધતિ આપી.</p><ul><li>ઉપયોગ: (1) વર્ગ સંબંધ દર્શાવવા, (2) <b>ન્યાયવાક્ય (દલીલ) ની યથાર્થતા ચકાસવા</b>, (3) સમૂહ (Set) ગણતરી</li><li>Euler diagram (Leonhard Euler) – Venn નો પૂર્વગામી</li><li>Boolean દૃષ્ટિ: સાર્વત્રિક વિધાન (A, E) અસ્તિત્વ દર્શાવતા નથી</li></ul><div class=\"nt\">શેડિંગ (Shading) = <b>ખાલી (Empty)</b>; ચોકડી (X) = <b>ઓછામાં ઓછો એક સભ્ય છે</b></div>"],["ચાર વિધાનોનું Venn નિરૂપણ (બે વર્તુળ S અને P)","<div class=\"tw\"><table><thead><tr><th>વિધાન</th><th>નિરૂપણ</th></tr></thead><tbody><tr><td>A: બધા S, P છે</td><td>S નો P બહારનો ભાગ <b>શેડ</b></td></tr><tr><td>E: કોઈ S, P નથી</td><td>S ∩ P (વચ્ચેનો ભાગ) <b>શેડ</b></td></tr><tr><td>I: કેટલાક S, P છે</td><td>S ∩ P માં <b>X</b></td></tr><tr><td>O: કેટલાક S, P નથી</td><td>S નો P બહારનો ભાગ માં <b>X</b></td></tr></tbody></table></div><ul><li>★ સાર્વત્રિક (A, E) → <b>શેડિંગ</b>; વિશિષ્ટ (I, O) → <b>X</b></li><li>બે વર્તુળ → 4 વિસ્તાર (બહાર સહિત)</li></ul>"],["ત્રણ વર્તુળ વડે ન્યાયવાક્ય ચકાસણી","<ul><li>ત્રણ વર્તુળ: <b>S (ગૌણ), P (મુખ્ય), M (મધ્ય)</b> → <b>8 વિસ્તાર</b></li><li><b>સોપાનો</b>:</li><li><b>1.</b> ત્રણ પરસ્પર છેદતા વર્તુળ દોરો</li><li><b>2.</b> બંને આધારવિધાન નિરૂપિત કરો – <b>સાર્વત્રિક (શેડિંગ) પહેલાં</b>, પછી વિશિષ્ટ (X)</li><li><b>3.</b> X ને બે વિસ્તાર વચ્ચે મૂકવાનો હોય અને નક્કી ન થાય તો <b>રેખા પર</b> મૂકો</li><li><b>4.</b> નિષ્કર્ષ આકૃતિમાં <b>આપોઆપ દેખાય</b> છે? → <b>Valid</b>; નહીં તો <b>Invalid</b></li></ul><div class=\"tk\"><i>★</i><span>નિયમ: \"<b>Shade first, X later</b>\"</span></div>"],["ઉદાહરણ – યથાર્થ દલીલ","<ul><li>બધા M, P છે. બધા S, M છે. ∴ બધા S, P છે. (<b>AAA-1, Barbara</b>)</li><li>આધાર 1: M નો P બહારનો ભાગ શેડ</li><li>આધાર 2: S નો M બહારનો ભાગ શેડ</li><li>પરિણામ: S નો P બહારનો સમગ્ર ભાગ શેડ થઈ ગયો → નિષ્કર્ષ દેખાય છે → <b>Valid ✓</b></li></ul>"],["ઉદાહરણ – અયથાર્થ દલીલ","<ul><li>બધા P, M છે. બધા S, M છે. ∴ બધા S, P છે.</li><li>અહીં મધ્ય પદ M એક પણ વાર વ્યાપ્ત નથી (<b>Undistributed middle</b>)</li><li>Venn માં S નો P બહારનો ભાગ સંપૂર્ણ શેડ થતો નથી → <b>Invalid ✗</b></li><li>★ યાદ રાખો: નિષ્કર્ષ માટે <b>વધારાનું ચિત્ર દોરવું પડે</b> તો દલીલ Invalid</li></ul>"],["Venn આધારિત \"નિષ્કર્ષ અનુસરે છે?\" પ્રશ્નો","<ul><li>આધાર: \"બધા પુસ્તકો પેન છે. કેટલીક પેન પેન્સિલ છે.\"</li><li>નિષ્કર્ષ I: \"કેટલાક પુસ્તકો પેન્સિલ છે\" → <b>અનુસરતું નથી</b> (શક્ય છે, નિશ્ચિત નહીં)</li><li>નિષ્કર્ષ II: \"કેટલીક પેન પુસ્તકો છે\" → <b>અનુસરે છે</b> (A નું conversion → I)</li><li>★ <b>Either-or કેસ</b>: \"કેટલાક X Y છે\" અને \"કોઈ X Y નથી\" – બંને અલગ નિશ્ચિત ન હોય પણ એક સાચું હોવું જ જોઈએ (Complementary pair)</li><li>★ \"શક્યતા (Possibility)\" પ્રશ્નમાં: વિરોધ ન હોય તો શક્ય</li></ul>"],["Conversion, Obversion, Contraposition","<div class=\"tw\"><table><thead><tr><th>પ્રક્રિયા</th><th>A</th><th>E</th><th>I</th><th>O</th></tr></thead><tbody><tr><td>Conversion (વિષય-વિધેય અદલાબદલી)</td><td>I (મર્યાદિત)</td><td>E</td><td>I</td><td>✗ શક્ય નથી</td></tr><tr><td>Obversion (ગુણ બદલો + વિધેય નિષેધ)</td><td>E</td><td>A</td><td>O</td><td>I</td></tr><tr><td>Contraposition</td><td>A</td><td>O (મર્યાદિત)</td><td>✗</td><td>O</td></tr></tbody></table></div><ul><li>ઉદા: \"બધા S P છે\" → Conversion → \"કેટલાક P S છે\"</li><li>★ <b>O નું Conversion નથી</b>, <b>I નું Contraposition નથી</b></li></ul>"],["Venn – સમૂહ ગણતરી (Set problems)","<ul><li>બે સમૂહ: <b>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</b></li><li>ત્રણ સમૂહ: <b>n(A∪B∪C) = n(A)+n(B)+n(C) − n(A∩B) − n(B∩C) − n(A∩C) + n(A∩B∩C)</b></li><li>માત્ર A = n(A) − n(A∩B) − n(A∩C) + n(A∩B∩C)</li><li>કોઈ નહીં = કુલ − n(A∪B∪C)</li><li>ઉદા: 50 વિદ્યાર્થી; 30 ગણિત, 25 વિજ્ઞાન, 10 બંને → ઓછામાં ઓછું એક = 45; કોઈ નહીં = 5</li></ul>"],["વર્ગ સંબંધના આકૃતિ પ્રશ્નો","<ul><li><b>એક વર્ગ બીજામાં સંપૂર્ણ</b> (વર્તુળ અંદર વર્તુળ): શહેર ⊂ રાજ્ય ⊂ દેશ</li><li><b>આંશિક છેદ</b>: શિક્ષકો અને સંગીતકારો</li><li><b>સંપૂર્ણ અલગ</b>: કૂતરા અને બિલાડી</li><li>ઉદા: પુરુષ, પિતા, ડોક્ટર → પિતા ⊂ પુરુષ; ડોક્ટર બંનેને આંશિક છેદે</li><li>★ પહેલાં <b>સૌથી મોટો વર્ગ</b> ઓળખો</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Set</b></td><td>Collection of defined members</td></tr><tr><td><b>Subset</b></td><td>Set contained within another set</td></tr><tr><td><b>Intersection</b></td><td>Members common to sets</td></tr><tr><td><b>Union</b></td><td>Members belonging to either set</td></tr><tr><td><b>Disjoint sets</b></td><td>Sets with no common members</td></tr><tr><td><b>Complement</b></td><td>Members outside a set within the universe</td></tr><tr><td><b>Universal set</b></td><td>All members under consideration</td></tr><tr><td><b>Venn region</b></td><td>Area representing a membership combination</td></tr><tr><td><b>Some A are B</b></td><td>At least one member in the intersection</td></tr><tr><td><b>All A are B</b></td><td>A is contained in B</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Venn = John Venn (1880)</li><li>શેડ = ખાલી; X = અસ્તિત્વ</li><li>A, E → શેડ; I, O → X</li><li>\"Shade first, X later\"</li><li>3 વર્તુળ = 8 વિસ્તાર; નિષ્કર્ષ આપોઆપ દેખાય → Valid</li><li>n(A∪B) = n(A) + n(B) − n(A∩B)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Boolean (આધુનિક) દૃષ્ટિએ \"બધા S P છે\" પરથી \"કેટલાક S P છે\" અનુસરતું નથી (અસ્તિત્વ ધારણા નથી).</span></div>"]],"6-4":[["ભારતીય તર્ક – પરિચય","<p>ભારતીય તર્કશાસ્ત્ર (<b>ન્યાય / આન્વીક્ષિકી / હેતુવિદ્યા</b>) માં જ્ઞાનના માન્ય સાધનોને <b>પ્રમાણ</b> કહે છે.</p><ul><li><b>પ્રમા (Prama)</b>: યથાર્થ જ્ઞાન (Valid knowledge)</li><li><b>પ્રમાતા (Pramata)</b>: જાણનાર</li><li><b>પ્રમેય (Prameya)</b>: જાણવાનો વિષય</li><li><b>પ્રમાણ (Pramana)</b>: યથાર્થ જ્ઞાનનું સાધન</li><li><b>અપ્રમા</b>: અયથાર્થ જ્ઞાન – સંશય (Doubt), વિપર્યય (Error), તર્ક (Hypothetical)</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>પ્ર-મા-તા-મે-ણ</b>\" – Prama, Pramata, Prameya, Pramana</span></div>"],["ન્યાય દર્શન – પાયો","<ul><li>પ્રણેતા: <b>ગૌતમ (અક્ષપાદ)</b> – \"<b>ન્યાયસૂત્ર</b>\"</li><li>ભાષ્ય: <b>વાત્સ્યાયન</b> (ન્યાયભાષ્ય)</li><li><b>નવ્ય ન્યાય</b>: <b>ગંગેશ ઉપાધ્યાય</b> (13-14મી સદી, મિથિલા) – \"<b>તત્ત્વચિંતામણિ</b>\"</li><li>વૈશેષિક: <b>કણાદ</b> – પરમાણુવાદ; ન્યાય-વૈશેષિક સંયુક્ત દર્શન</li><li>ન્યાય ના <b>16 પદાર્થ</b> (પ્રમાણ, પ્રમેય, સંશય, પ્રયોજન, દૃષ્ટાંત, સિદ્ધાંત, અવયવ, તર્ક, નિર્ણય, વાદ, જલ્પ, વિતંડા, હેત્વાભાસ, છલ, જાતિ, નિગ્રહસ્થાન)</li><li>બૌદ્ધ તર્ક: <b>દિગ્નાગ, ધર્મકીર્તિ</b>; જૈન તર્ક: <b>સ્યાદ્વાદ, અનેકાંતવાદ</b></li></ul>"],["વિવિધ દર્શનો અને માન્ય પ્રમાણ","<div class=\"tw\"><table><thead><tr><th>દર્શન</th><th>પ્રમાણ સંખ્યા</th><th>પ્રમાણ</th></tr></thead><tbody><tr><td>ચાર્વાક</td><td>1</td><td>પ્રત્યક્ષ</td></tr><tr><td>બૌદ્ધ, વૈશેષિક</td><td>2</td><td>પ્રત્યક્ષ, અનુમાન</td></tr><tr><td>સાંખ્ય, યોગ, જૈન</td><td>3</td><td>પ્રત્યક્ષ, અનુમાન, શબ્દ</td></tr><tr><td>ન્યાય</td><td>4</td><td>+ ઉપમાન</td></tr><tr><td>પ્રભાકર મીમાંસા</td><td>5</td><td>+ અર્થાપત્તિ</td></tr><tr><td>ભાટ્ટ મીમાંસા, અદ્વૈત વેદાંત</td><td>6</td><td>+ અનુપલબ્ધિ</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>1-2-3-4-5-6</b>\" → <b>ચા-બૌ-સાં-ન્યા-પ્ર-ભા</b> (\"ચાબૌ સાંન્યા પ્રભા\")</span></div>"],["જ્ઞાનના પ્રકાર","<ul><li><b>પ્રત્યક્ષ જ્ઞાન</b>: ઇન્દ્રિય-વિષય સંપર્કથી</li><li><b>પરોક્ષ જ્ઞાન</b>: અનુમાન, ઉપમાન, શબ્દ વગેરેથી</li><li><b>સ્મૃતિ (Memory)</b>: ન્યાય મુજબ પ્રમા નથી (નવું જ્ઞાન નથી)</li><li><b>અનુભવ (Anubhava)</b>: નવું જ્ઞાન – પ્રમા અથવા અપ્રમા</li><li><b>સ્વતઃ પ્રામાણ્યવાદ</b> (મીમાંસા): જ્ઞાન સ્વયં માન્ય</li><li><b>પરતઃ પ્રામાણ્યવાદ</b> (ન્યાય): માન્યતા બાહ્ય ચકાસણીથી</li></ul>"],["જ્ઞાનના માધ્યમો – ટૂંકમાં","<div class=\"tw\"><table><thead><tr><th>પ્રમાણ</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>પ્રત્યક્ષ</td><td>ઇન્દ્રિય જ્ઞાન</td><td>આંખથી ઘડો જોવો</td></tr><tr><td>અનુમાન</td><td>લિંગ (ચિહ્ન) પરથી જ્ઞાન</td><td>ધુમાડો → અગ્નિ</td></tr><tr><td>ઉપમાન</td><td>સમાનતા પરથી નામ-વસ્તુ સંબંધ</td><td>ગાય જેવું ગવય (નીલગાય)</td></tr><tr><td>શબ્દ</td><td>વિશ્વસનીય વ્યક્તિ (આપ્ત) નું વચન</td><td>વેદ, નિષ્ણાત</td></tr><tr><td>અર્થાપત્તિ</td><td>ધારણા (Postulation)</td><td>દિવસે ન ખાતો જાડો દેવદત્ત → રાત્રે ખાય છે</td></tr><tr><td>અનુપલબ્ધિ</td><td>અભાવનું જ્ઞાન</td><td>ઓરડામાં ઘડો નથી</td></tr></tbody></table></div>"],["ભારતીય vs પાશ્ચાત્ય તર્ક","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>ભારતીય તર્ક</th><th>પાશ્ચાત્ય તર્ક</th></tr></thead><tbody><tr><td>હેતુ</td><td>મોક્ષ, યથાર્થ જ્ઞાન</td><td>સત્ય, યથાર્થતા</td></tr><tr><td>અનુમાન</td><td><b>5 અવયવ</b> (પરાર્થ)</td><td><b>3 અવયવ</b> (Syllogism)</td></tr><tr><td>ઉદાહરણ</td><td>અનુમાનનો ભાગ (દૃષ્ટાંત)</td><td>જરૂરી નહીં</td></tr><tr><td>સ્વરૂપ</td><td>મનોવૈજ્ઞાનિક + તાર્કિક</td><td>ઔપચારિક (Formal)</td></tr><tr><td>આધાર</td><td>વ્યાપ્તિ</td><td>પદ વ્યાપ્તિ</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ભારતીય = \"<b>વાસ્તવિક ઉદાહરણ સાથે તર્ક</b>\"</span></div>"],["વાદ પરંપરા (Debate tradition)","<ul><li><b>વાદ</b>: સત્ય શોધ માટે પ્રામાણિક ચર્ચા</li><li><b>જલ્પ</b>: જીતવા માટેની ચર્ચા (છલ, જાતિનો ઉપયોગ)</li><li><b>વિતંડા</b>: માત્ર વિરોધીનું ખંડન, પોતાનો મત સ્થાપવો નહીં</li><li><b>છલ</b>: શબ્દના અર્થ સાથે છેતરપિંડી</li><li><b>જાતિ</b>: ખોટું ખંડન (Futile rejoinder)</li><li><b>નિગ્રહસ્થાન</b>: પરાજયનું સ્થાન</li></ul><div class=\"tk\"><i>★</i><span>\"<b>વા-જ-વિ</b>\" = સત્ય, જીત, માત્ર ખંડન</span></div>"],["મુખ્ય ગ્રંથો અને વિચારકો","<div class=\"tw\"><table><thead><tr><th>ગ્રંથ</th><th>લેખક</th></tr></thead><tbody><tr><td>ન્યાયસૂત્ર</td><td>ગૌતમ (અક્ષપાદ)</td></tr><tr><td>ન્યાયભાષ્ય</td><td>વાત્સ્યાયન (પક્ષિલસ્વામી)</td></tr><tr><td>ન્યાયવાર્તિક</td><td>ઉદ્યોતકર</td></tr><tr><td>ન્યાયકુસુમાંજલિ</td><td>ઉદયન</td></tr><tr><td>તત્ત્વચિંતામણિ</td><td>ગંગેશ ઉપાધ્યાય (નવ્ય ન્યાય)</td></tr><tr><td>તર્કસંગ્રહ</td><td>અન્નંભટ્ટ</td></tr><tr><td>પ્રમાણસમુચ્ચય</td><td>દિગ્નાગ (બૌદ્ધ)</td></tr><tr><td>પ્રમાણવાર્તિક</td><td>ધર્મકીર્તિ (બૌદ્ધ)</td></tr><tr><td>વૈશેષિકસૂત્ર</td><td>કણાદ</td></tr></tbody></table></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Pramana</b></td><td>Means of valid knowledge</td></tr><tr><td><b>Pratyaksha</b></td><td>Perceptual knowledge</td></tr><tr><td><b>Anumana</b></td><td>Inferential knowledge</td></tr><tr><td><b>Upamana</b></td><td>Knowledge through comparison</td></tr><tr><td><b>Shabda</b></td><td>Knowledge from reliable testimony</td></tr><tr><td><b>Arthapatti</b></td><td>Postulation explaining otherwise incompatible facts</td></tr><tr><td><b>Anupalabdhi</b></td><td>Knowledge of absence by non-apprehension</td></tr><tr><td><b>Prama</b></td><td>Valid cognition</td></tr><tr><td><b>Prameya</b></td><td>Object of knowledge</td></tr><tr><td><b>Pramata</b></td><td>Knower or knowing subject</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>ચાર્વાક 1, બૌદ્ધ 2, સાંખ્ય 3, ન્યાય 4, પ્રભાકર 5, ભાટ્ટ/વેદાંત 6</li><li>ન્યાયસૂત્ર = ગૌતમ; નવ્ય ન્યાય = ગંગેશ</li><li>સ્મૃતિ = પ્રમા નથી (ન્યાય)</li><li>વાદ = સત્ય માટે; જલ્પ = જીત માટે; વિતંડા = માત્ર ખંડન</li><li>ભારતીય અનુમાન = 5 અવયવ; પાશ્ચાત્ય = 3</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: વૈશેષિક 2 પ્રમાણ (પ્રત્યક્ષ, અનુમાન) માને છે – ન્યાયની જેમ 4 નહીં.</span></div>"]],"6-5":[["પ્રમાણ – વિગતવાર પરિચય","<p>પ્રમાણ એટલે <b>પ્રમાનું કરણ</b> (યથાર્થ જ્ઞાનનું વિશિષ્ટ કારણ). અભ્યાસક્રમમાં છ પ્રમાણ:</p><ul><li><b>પ્રત્યક્ષ (Perception)</b></li><li><b>અનુમાન (Inference)</b></li><li><b>ઉપમાન (Comparison)</b></li><li><b>શબ્દ (Verbal testimony)</b></li><li><b>અર્થાપત્તિ (Postulation / Presumption)</b></li><li><b>અનુપલબ્ધિ (Non-apprehension / Non-cognition)</b></li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>પ્ર-અ-ઉ-શ-અ-અ</b>\" – \"પ્રભુ અમને ઉપર શરણ અર્થ અનુપમ\"</span></div>"],["પ્રત્યક્ષ પ્રમાણ (Perception)","<ul><li><b>ઇન્દ્રિય-અર્થ સન્નિકર્ષ</b> (ઇન્દ્રિય અને વિષયના સંપર્ક) થી ઉત્પન્ન જ્ઞાન</li><li>ન્યાયસૂત્ર: ઇન્દ્રિયાર્થ સન્નિકર્ષોત્પન્નં જ્ઞાનં <b>અવ્યપદેશ્યમ્ અવ્યભિચારિ વ્યવસાયાત્મકં</b> પ્રત્યક્ષમ્</li></ul><div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th></tr></thead><tbody><tr><td>નિર્વિકલ્પક</td><td>નામ-ગુણ વગરનું પ્રાથમિક જ્ઞાન (\"કંઈક છે\")</td></tr><tr><td>સવિકલ્પક</td><td>નામ-ગુણ સહિત (\"આ ઘડો છે\")</td></tr><tr><td>લૌકિક</td><td>સામાન્ય – 6 ઇન્દ્રિય (5 બાહ્ય + મન)</td></tr><tr><td>અલૌકિક</td><td>અસામાન્ય – સામાન્ય લક્ષણ, જ્ઞાન લક્ષણ, યોગજ</td></tr></tbody></table></div><ul><li>6 લૌકિક સન્નિકર્ષ: સંયોગ, સંયુક્ત-સમવાય, સંયુક્ત-સમવેત-સમવાય, સમવાય, સમવેત-સમવાય, વિશેષણતા</li></ul>"],["અનુમાન પ્રમાણ (Inference)","<ul><li><b>અનુ + માન</b> = પછીનું જ્ઞાન; <b>લિંગ (ચિહ્ન/હેતુ)</b> ના જ્ઞાન પરથી <b>સાધ્ય</b> નું જ્ઞાન</li><li>આધાર: <b>વ્યાપ્તિ</b> (હેતુ અને સાધ્યનો અવિનાભાવ સંબંધ)</li><li>પરંપરાગત ઉદાહરણ: <b>પર્વત પર ધુમાડો છે → પર્વત પર અગ્નિ છે</b></li></ul><div class=\"tw\"><table><thead><tr><th>પદ</th><th>ઉદાહરણમાં</th></tr></thead><tbody><tr><td>પક્ષ (Minor term)</td><td>પર્વત</td></tr><tr><td>સાધ્ય (Major term)</td><td>અગ્નિ</td></tr><tr><td>હેતુ/લિંગ (Middle term)</td><td>ધુમાડો</td></tr></tbody></table></div><ul><li>વિગત: આગળના વિષય (અનુમાનની રચના) માં</li></ul>"],["ઉપમાન પ્રમાણ (Comparison)","<ul><li><b>સાદૃશ્ય (Similarity)</b> પરથી <b>સંજ્ઞા-સંજ્ઞી સંબંધ</b> (નામ અને વસ્તુનો સંબંધ) નું જ્ઞાન</li><li>ઉદાહરણ: વનવાસી કહે \"<b>ગવય (નીલગાય) ગાય જેવું હોય છે</b>\"; જંગલમાં ગાય જેવું પ્રાણી જોઈ ઓળખવું \"આ ગવય છે\"</li><li>ન્યાય દર્શન તેને <b>સ્વતંત્ર પ્રમાણ</b> માને છે</li><li>બૌદ્ધ અને વૈશેષિક: ઉપમાન = પ્રત્યક્ષ + અનુમાન (સ્વતંત્ર નહીં)</li><li>સાંખ્ય: ઉપમાન ને પ્રત્યક્ષ/અનુમાન/શબ્દમાં સમાવે</li></ul><div class=\"tk\"><i>★</i><span>ઉપમાન = \"<b>ગાય-ગવય</b>\" ઉદાહરણ</span></div>"],["શબ્દ પ્રમાણ (Verbal Testimony)","<ul><li><b>આપ્તવાક્ય</b>: વિશ્વસનીય વ્યક્તિ (<b>આપ્ત</b>) નું વચન</li><li>ન્યાય: <b>આપ્તોપદેશઃ શબ્દઃ</b></li></ul><div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th></tr></thead><tbody><tr><td>લૌકિક</td><td>સામાન્ય વિશ્વસનીય વ્યક્તિનું કથન</td></tr><tr><td>વૈદિક</td><td>વેદ વચન (અપૌરુષેય – મીમાંસા)</td></tr><tr><td>દૃષ્ટાર્થ</td><td>અનુભવી શકાય તેવા વિષય વિશે</td></tr><tr><td>અદૃષ્ટાર્થ</td><td>અનુભવ બહારના (સ્વર્ગ, ધર્મ)</td></tr></tbody></table></div><ul><li>વાક્યાર્થ જ્ઞાનની શરતો: <b>આકાંક્ષા</b> (પરસ્પર અપેક્ષા), <b>યોગ્યતા</b> (અર્થની સુસંગતતા), <b>સન્નિધિ/આસત્તિ</b> (નિકટતા), <b>તાત્પર્ય</b> (વક્તાનો હેતુ)</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>આ-યો-સ-તા</b>\"</span></div>"],["અર્થાપત્તિ પ્રમાણ (Postulation)","<ul><li>બે દેખીતી રીતે વિરોધી હકીકતોને સમજાવવા <b>અનિવાર્ય ધારણા</b> કરવી</li><li>શાસ્ત્રીય ઉદાહરણ: \"<b>દેવદત્ત જાડો છે પણ દિવસે ખાતો નથી</b>\" → <b>તે રાત્રે ખાય છે</b></li><li>બીજું ઉદાહરણ: દેવદત્ત જીવંત છે પણ ઘરે નથી → તે બહાર છે</li><li>પ્રકાર: <b>દૃષ્ટાર્થાપત્તિ</b> (જોયેલી હકીકત પરથી), <b>શ્રુતાર્થાપત્તિ</b> (સાંભળેલા વચન પરથી)</li><li>સ્વીકારનાર: <b>મીમાંસા (પ્રભાકર, ભાટ્ટ)</b> અને <b>અદ્વૈત વેદાંત</b></li><li>ન્યાય: અર્થાપત્તિ = અનુમાનનો જ પ્રકાર (વ્યતિરેકી અનુમાન)</li></ul>"],["અનુપલબ્ધિ પ્રમાણ (Non-apprehension)","<ul><li><b>અભાવ (Non-existence)</b> નું પ્રત્યક્ષ જ્ઞાન</li><li>ઉદાહરણ: \"<b>ઓરડામાં ઘડો નથી</b>\", \"ટેબલ પર પુસ્તક નથી\"</li><li>શરત: વસ્તુ હાજર હોત તો ચોક્કસ દેખાત (<b>યોગ્યાનુપલબ્ધિ</b>)</li><li>સ્વીકારનાર: <b>ભાટ્ટ મીમાંસા (કુમારિલ ભટ્ટ)</b> અને <b>અદ્વૈત વેદાંત</b></li><li>ન્યાય: અભાવનું જ્ઞાન <b>પ્રત્યક્ષ</b> થી (વિશેષણતા સન્નિકર્ષ)</li><li>પ્રભાકર મીમાંસા અનુપલબ્ધિ સ્વીકારતું નથી (5 પ્રમાણ)</li></ul><div class=\"tk\"><i>★</i><span>અનુપલબ્ધિ = \"<b>ભાટ્ટ + વેદાંત = 6ઠ્ઠું પ્રમાણ</b>\"</span></div>"],["છ પ્રમાણ – એક નજરે","<div class=\"tw\"><table><thead><tr><th>પ્રમાણ</th><th>વિષય</th><th>સ્વીકારનાર (મુખ્ય)</th></tr></thead><tbody><tr><td>પ્રત્યક્ષ</td><td>ઇન્દ્રિય જ્ઞાન</td><td>બધા દર્શન</td></tr><tr><td>અનુમાન</td><td>વ્યાપ્તિ આધારિત</td><td>ચાર્વાક સિવાય બધા</td></tr><tr><td>શબ્દ</td><td>આપ્ત વચન</td><td>સાંખ્ય, ન્યાય, મીમાંસા, વેદાંત, જૈન</td></tr><tr><td>ઉપમાન</td><td>સાદૃશ્ય</td><td>ન્યાય, મીમાંસા, વેદાંત</td></tr><tr><td>અર્થાપત્તિ</td><td>ધારણા</td><td>મીમાંસા, વેદાંત</td></tr><tr><td>અનુપલબ્ધિ</td><td>અભાવ</td><td>ભાટ્ટ મીમાંસા, વેદાંત</td></tr></tbody></table></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Perception example</b></td><td>Seeing an object directly</td></tr><tr><td><b>Inference example</b></td><td>Inferring fire from smoke</td></tr><tr><td><b>Comparison example</b></td><td>Identifying an unfamiliar animal through similarity</td></tr><tr><td><b>Testimony example</b></td><td>Learning from a reliable statement</td></tr><tr><td><b>Postulation example</b></td><td>Inferring an unobserved fact needed to explain observations</td></tr><tr><td><b>Non-apprehension example</b></td><td>Knowing a pot is absent where it should be visible</td></tr><tr><td><b>Reliable witness</b></td><td>Competent and trustworthy informant</td></tr><tr><td><b>Sense contact</b></td><td>Contact underlying ordinary perception</td></tr><tr><td><b>Inferential sign</b></td><td>Observed indicator used in inference</td></tr><tr><td><b>Known similarity</b></td><td>Basis supporting comparison</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>ધુમાડો → અગ્નિ = <b>અનુમાન</b></li><li>ગાય → ગવય = <b>ઉપમાન</b></li><li>જાડો દેવદત્ત, દિવસે ન ખાય = <b>અર્થાપત્તિ</b></li><li>ઘડો નથી = <b>અનુપલબ્ધિ</b></li><li>વેદ/નિષ્ણાત વચન = <b>શબ્દ</b></li><li>નિર્વિકલ્પક = નામ વગર; સવિકલ્પક = નામ સાથે</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: ચાર્વાક અનુમાનને પ્રમાણ માનતું નથી – માત્ર પ્રત્યક્ષ.</span></div>"]],"6-6":[["અનુમાન (Inference) – રચના","<p><b>અનુમાન</b> = અનુ (પછી) + માન (જ્ઞાન). <b>વ્યાપ્તિ</b> જ્ઞાન અને <b>પક્ષધર્મતા</b> પરથી સાધ્યનું જ્ઞાન.</p><ul><li><b>પક્ષ (Paksha)</b>: જ્યાં સાધ્ય સિદ્ધ કરવું છે – પર્વત (Minor term)</li><li><b>સાધ્ય (Sadhya)</b>: સિદ્ધ કરવાનું – અગ્નિ (Major term)</li><li><b>હેતુ/લિંગ/સાધન (Hetu)</b>: ચિહ્ન – ધુમાડો (Middle term)</li><li><b>પક્ષધર્મતા</b>: હેતુ પક્ષમાં હાજર છે (પર્વત પર ધુમાડો)</li><li><b>પરામર્શ</b>: વ્યાપ્તિ + પક્ષધર્મતાનું સંયુક્ત જ્ઞાન → અનુમિતિ</li></ul><div class=\"tk\"><i>★</i><span>પક્ષ = <b>પર્વત</b>, સાધ્ય = <b>અગ્નિ</b>, હેતુ = <b>ધુમાડો</b></span></div>"],["પંચાવયવ વાક્ય (Five-membered Syllogism)","<div class=\"tw\"><table><thead><tr><th>ક્રમ</th><th>અવયવ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>1</td><td><b>પ્રતિજ્ઞા</b> (Proposition)</td><td>પર્વત પર અગ્નિ છે</td></tr><tr><td>2</td><td><b>હેતુ</b> (Reason)</td><td>કારણ કે ત્યાં ધુમાડો છે</td></tr><tr><td>3</td><td><b>ઉદાહરણ</b> (Example)</td><td>જ્યાં ધુમાડો ત્યાં અગ્નિ, જેમ રસોડામાં</td></tr><tr><td>4</td><td><b>ઉપનય</b> (Application)</td><td>પર્વત પર પણ અગ્નિ-વ્યાપ્ત ધુમાડો છે</td></tr><tr><td>5</td><td><b>નિગમન</b> (Conclusion)</td><td>તેથી પર્વત પર અગ્નિ છે</td></tr></tbody></table></div><ul><li>★ ટ્રિક: \"<b>પ્ર-હે-ઉ-ઉ-નિ</b>\" – \"<b>પ્રહેલા ઉઠો ઉપર નીચે</b>\"</li><li>પાશ્ચાત્ય Syllogism ના 3 ભાગ સાથે: ઉદાહરણ = Major premise, ઉપનય = Minor premise</li><li>બૌદ્ધ (દિગ્નાગ) અવયવ ઘટાડી <b>3</b> કર્યા</li></ul>"],["અનુમાનના પ્રકાર – ઉદ્દેશ આધારે","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th></tr></thead><tbody><tr><td><b>સ્વાર્થાનુમાન</b> (Inference for oneself)</td><td>પોતાના જ્ઞાન માટે – અવયવની જરૂર નથી</td></tr><tr><td><b>પરાર્થાનુમાન</b> (Inference for others)</td><td>બીજાને સમજાવવા – <b>5 અવયવ</b> જરૂરી</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>સ્વ = <b>પોતા માટે</b>, પર = <b>બીજા માટે (પંચાવયવ)</b></span></div>"],["અનુમાનના પ્રકાર – ન્યાયસૂત્ર (ગૌતમ)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>પૂર્વવત્</b></td><td>કારણ પરથી કાર્ય</td><td>ઘેરા વાદળ → વરસાદ થશે</td></tr><tr><td><b>શેષવત્</b></td><td>કાર્ય પરથી કારણ</td><td>નદીમાં પૂર → ઉપરવાસ વરસાદ થયો</td></tr><tr><td><b>સામાન્યતોદૃષ્ટ</b></td><td>સામાન્ય અવલોકન (કાર્ય-કારણ નહીં)</td><td>સૂર્યનું સ્થાન બદલાય → ગતિ કરે છે</td></tr></tbody></table></div><ul><li><b>નવ્ય ન્યાય</b> – વ્યાપ્તિ આધારે:</li><li><b>કેવલાન્વયી</b>: માત્ર અન્વય વ્યાપ્તિ (વિરોધી ઉદાહરણ નથી)</li><li><b>કેવલવ્યતિરેકી</b>: માત્ર વ્યતિરેક વ્યાપ્તિ</li><li><b>અન્વય-વ્યતિરેકી</b>: બંને (ધુમાડો-અગ્નિ)</li></ul>"],["વ્યાપ્તિ (Invariable Concomitance)","<ul><li><b>હેતુ અને સાધ્ય વચ્ચેનો અવિનાભાવ (નિયત) સંબંધ</b> – \"જ્યાં જ્યાં ધુમાડો, ત્યાં ત્યાં અગ્નિ\"</li><li><b>અન્વય વ્યાપ્તિ</b>: હેતુ હોય ત્યાં સાધ્ય હોય (ધુમાડો → અગ્નિ)</li><li><b>વ્યતિરેક વ્યાપ્તિ</b>: સાધ્ય ન હોય ત્યાં હેતુ ન હોય (અગ્નિ નથી → ધુમાડો નથી)</li><li><b>સમવ્યાપ્તિ</b>: બંને દિશામાં સમાન (નામ-વસ્તુ)</li><li><b>વિષમવ્યાપ્તિ</b>: એક દિશામાં (ધુમાડો → અગ્નિ, પણ અગ્નિ → ધુમાડો નહીં, દા.ત. લાલ ગરમ લોખંડ)</li><li>વ્યાપ્તિ ગ્રહણ: ભૂયોદર્શન (વારંવાર અવલોકન), વ્યભિચાર અદર્શન, <b>ઉપાધિ</b> નિરાસ</li></ul><div class=\"tk\"><i>★</i><span>\"<b>ધુમાડો હોય ત્યાં અગ્નિ, પણ અગ્નિ હોય ત્યાં ધુમાડો હોવો જરૂરી નથી</b>\"</span></div>"],["ઉપાધિ અને સારા હેતુના લક્ષણ","<ul><li><b>ઉપાધિ</b>: વ્યાપ્તિને દૂષિત કરતી શરત – દા.ત. \"અગ્નિ → ધુમાડો\" માં <b>ભીનું બળતણ (આર્દ્રેંધન)</b> ઉપાધિ છે</li><li><b>સદ્ હેતુના 5 લક્ષણ</b>:</li><li><b>પક્ષસત્ત્વ</b>: હેતુ પક્ષમાં હાજર</li><li><b>સપક્ષસત્ત્વ</b>: સમાન ઉદાહરણોમાં હાજર (રસોડું)</li><li><b>વિપક્ષાસત્ત્વ</b>: વિરોધી ઉદાહરણોમાં ગેરહાજર (સરોવર)</li><li><b>અબાધિતવિષયત્વ</b>: બીજા પ્રમાણથી વિરોધ ન થાય</li><li><b>અસત્પ્રતિપક્ષત્વ</b>: સમાન બળવાન વિરોધી હેતુ ન હોય</li></ul>"],["હેત્વાભાસ (Fallacies of Inference) – 5 પ્રકાર","<div class=\"tw\"><table><thead><tr><th>હેત્વાભાસ</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>સવ્યભિચાર</b> (અનૈકાંતિક)</td><td>હેતુ સાધ્ય અને તેના અભાવ બંને સાથે</td><td>પર્વત અગ્નિવાળો છે કારણ કે જ્ઞેય છે</td></tr><tr><td><b>વિરુદ્ધ</b></td><td>હેતુ સાધ્યના વિરુદ્ધને સિદ્ધ કરે</td><td>શબ્દ નિત્ય છે કારણ કે ઉત્પન્ન થાય છે</td></tr><tr><td><b>સત્પ્રતિપક્ષ</b> (પ્રકરણસમ)</td><td>સમાન બળવાન વિરોધી હેતુ હોય</td><td>શબ્દ નિત્ય (શ્રાવ્ય) vs અનિત્ય (કાર્ય)</td></tr><tr><td><b>અસિદ્ધ</b> (સાધ્યસમ)</td><td>હેતુ પોતે અસિદ્ધ</td><td>આકાશકમળ સુગંધી છે કારણ કે કમળ છે</td></tr><tr><td><b>બાધિત</b> (કાલાતીત)</td><td>બીજા પ્રમાણથી સાધ્ય બાધિત</td><td>અગ્નિ ઠંડો છે કારણ કે દ્રવ્ય છે</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>સ-વિ-સ-અ-બા</b>\" – \"<b>સવિતા સંગે અબાધ</b>\"</span></div>"],["સવ્યભિચાર અને અસિદ્ધના પેટા પ્રકાર","<ul><li><b>સવ્યભિચાર</b> ના 3 પ્રકાર:</li><li><b>સાધારણ</b>: હેતુ સપક્ષ અને વિપક્ષ બંનેમાં</li><li><b>અસાધારણ</b>: હેતુ માત્ર પક્ષમાં, સપક્ષ-વિપક્ષ ક્યાંય નહીં</li><li><b>અનુપસંહારી</b>: પક્ષ સર્વવ્યાપી, ઉદાહરણ જ ન મળે</li><li><b>અસિદ્ધ</b> ના 3 પ્રકાર:</li><li><b>આશ્રયાસિદ્ધ</b>: પક્ષ જ અસ્તિત્વમાં નથી (આકાશકમળ)</li><li><b>સ્વરૂપાસિદ્ધ</b>: હેતુ પક્ષમાં નથી (શબ્દ ગુણ છે કારણ કે દૃશ્ય છે)</li><li><b>વ્યાપ્યત્વાસિદ્ધ</b>: વ્યાપ્તિ ઉપાધિયુક્ત</li></ul>"],["પાશ્ચાત્ય સાથે તુલના","<div class=\"tw\"><table><thead><tr><th>ભારતીય</th><th>પાશ્ચાત્ય</th></tr></thead><tbody><tr><td>પક્ષ</td><td>Minor term</td></tr><tr><td>સાધ્ય</td><td>Major term</td></tr><tr><td>હેતુ</td><td>Middle term</td></tr><tr><td>વ્યાપ્તિ</td><td>Major premise નો આધાર</td></tr><tr><td>હેત્વાભાસ</td><td>Material fallacies</td></tr><tr><td>સવ્યભિચાર</td><td>Undistributed middle જેવું</td></tr><tr><td>અસિદ્ધ</td><td>Begging the question જેવું</td></tr></tbody></table></div><ul><li>ભારતીય અનુમાન = <b>નિગમનાત્મક + આગમનાત્મક</b> બંને (ઉદાહરણ દ્વારા)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Paksha</b></td><td>Subject under consideration in inference</td></tr><tr><td><b>Sadhya</b></td><td>Property to be established</td></tr><tr><td><b>Hetu</b></td><td>Reason or inferential mark</td></tr><tr><td><b>Vyapti</b></td><td>Invariable concomitance used in inference</td></tr><tr><td><b>Pratijna</b></td><td>Statement of the proposition</td></tr><tr><td><b>Udaharana</b></td><td>Illustrative example in an argument</td></tr><tr><td><b>Upanaya</b></td><td>Application of the relation to the subject</td></tr><tr><td><b>Nigamana</b></td><td>Conclusion of the inference</td></tr><tr><td><b>Hetvabhasa</b></td><td>Fallacious inferential reason</td></tr><tr><td><b>Sapaksha</b></td><td>Similar instance possessing the target property</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>પંચાવયવ: પ્રતિજ્ઞા → હેતુ → ઉદાહરણ → ઉપનય → નિગમન</li><li>સ્વાર્થ = પોતા માટે; પરાર્થ = બીજા માટે (5 અવયવ)</li><li>પૂર્વવત્ = કારણ → કાર્ય; શેષવત્ = કાર્ય → કારણ</li><li>વ્યાપ્તિ = હેતુ-સાધ્યનો નિયત સંબંધ</li><li>5 હેત્વાભાસ: સવ્યભિચાર, વિરુદ્ધ, સત્પ્રતિપક્ષ, અસિદ્ધ, બાધિત</li><li>\"અગ્નિ ઠંડો છે\" = બાધિત (પ્રત્યક્ષથી બાધ)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: પંચાવયવનો 5મો અવયવ \"નિગમન\" (Conclusion) છે – પાશ્ચાત્ય \"Deduction (નિગમન તર્ક)\" સાથે ભેળવશો નહીં.</span></div>"]],"7-0":[["માહિતી (Data) – પરિચય","<p><b>માહિતી (Data)</b> એટલે હકીકતો, આંકડા, અવલોકનોનો કાચો સંગ્રહ; પ્રક્રિયા કર્યા પછી તે <b>સૂચના (Information)</b> બને અને સમજ પછી <b>જ્ઞાન (Knowledge)</b>.</p><ul><li><b>DIKW પિરામિડ</b>: Data → Information → Knowledge → Wisdom</li><li>Data શબ્દ લેટિન \"Datum\" (આપેલું) નું બહુવચન</li><li>માહિતી વ્યવસ્થાપનના સોપાન: <b>એકત્રીકરણ → સંપાદન → વર્ગીકરણ → કોષ્ટકીકરણ → વિશ્લેષણ → અર્થઘટન</b></li></ul><div class=\"tk\"><i>★</i><span>DIKW = \"<b>ડેટા → ઇન્ફો → નોલેજ → વિઝડમ</b>\"</span></div>"],["માહિતીના સ્રોત (Sources of Data)","<div class=\"tw\"><table><thead><tr><th>સ્રોત</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>પ્રાથમિક (Primary)</b></td><td>સંશોધક જાતે પ્રથમ વાર એકઠી કરે</td><td>સર્વે, મુલાકાત, પ્રયોગ, અવલોકન</td></tr><tr><td><b>ગૌણ (Secondary)</b></td><td>બીજાએ એકઠી કરેલી, પહેલેથી ઉપલબ્ધ</td><td>વસ્તી ગણતરી, RBI અહેવાલ, સામયિક</td></tr><tr><td><b>તૃતીયક (Tertiary)</b></td><td>પ્રાથમિક-ગૌણનું સંકલન</td><td>જ્ઞાનકોશ, શબ્દકોશ, Handbook</td></tr></tbody></table></div><ul><li>પ્રાથમિક: વધુ વિશ્વસનીય, ચોક્કસ હેતુ માટે, પણ ખર્ચાળ અને સમય લે</li><li>ગૌણ: સસ્તી, ઝડપી, પણ હેતુ સાથે સંપૂર્ણ મેળ ન પણ હોય</li></ul>"],["ભારતમાં ગૌણ માહિતીના મુખ્ય સ્રોત","<ul><li><b>વસ્તી ગણતરી (Census)</b>: દર 10 વર્ષે – Registrar General &amp; Census Commissioner (ગૃહ મંત્રાલય); પ્રથમ સંપૂર્ણ સમન્વિત 1881</li><li><b>NSO</b> (National Statistical Office) – MoSPI; NSS (1950) અને CSO (1951) નું 2019 માં વિલીનીકરણ</li><li><b>PLFS</b> (Periodic Labour Force Survey) – રોજગાર</li><li><b>NFHS</b> (National Family Health Survey) – આરોગ્ય</li><li><b>RBI</b>, <b>Economic Survey</b> (નાણા મંત્રાલય), <b>AISHE</b> (ઉચ્ચ શિક્ષણ), <b>UDISE+</b> (શાળા શિક્ષણ)</li><li><b>data.gov.in</b> – Open Government Data Platform</li></ul><div class=\"tk\"><i>★</i><span>Census = \"<b>10 વર્ષે, ગૃહ મંત્રાલય</b>\"</span></div>"],["માહિતી પ્રાપ્તિ (Acquisition) ની પદ્ધતિઓ","<ul><li><b>સર્વે</b>: પ્રશ્નાવલિ (Questionnaire) – ઉત્તરદાતા ભરે; અનુસૂચિ (Schedule) – ગણતરીકાર ભરે</li><li><b>મુલાકાત (Interview)</b>: વ્યક્તિગત, ટેલિફોન, Online</li><li><b>અવલોકન (Observation)</b>: સહભાગી/બિન-સહભાગી</li><li><b>પ્રયોગ (Experiment)</b></li><li><b>Online/Digital</b>: Web forms, Sensors, IoT, Social media, Transaction data</li><li><b>Census vs Sample survey</b>: સમગ્ર વસ્તી vs નમૂનો</li></ul>"],["વસ્તી, નમૂનો અને ગણતરી","<ul><li><b>વસ્તી (Population/Universe)</b>: અભ્યાસના તમામ એકમો</li><li><b>નમૂનો (Sample)</b>: વસ્તીનો પ્રતિનિધિ ભાગ</li><li><b>ગણતરી (Census/Complete enumeration)</b>: બધા એકમોનો સમાવેશ</li></ul><div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>Census</th><th>Sample</th></tr></thead><tbody><tr><td>આવરણ</td><td>બધા એકમ</td><td>થોડા એકમ</td></tr><tr><td>ખર્ચ, સમય</td><td>વધુ</td><td>ઓછો</td></tr><tr><td>ચોકસાઈ</td><td>વધુ (sampling error નહીં)</td><td>sampling error શક્ય</td></tr><tr><td>યોગ્ય</td><td>નાની વસ્તી, ચોક્કસ જરૂર</td><td>મોટી વસ્તી, ઝડપ</td></tr></tbody></table></div><ul><li><b>Parameter</b> = વસ્તીનું માપ; <b>Statistic</b> = નમૂનાનું માપ</li></ul>"],["માહિતીનું વર્ગીકરણ (Classification)","<ul><li>માહિતીને સમાન લક્ષણો મુજબ <b>જૂથમાં ગોઠવવી</b></li></ul><div class=\"tw\"><table><thead><tr><th>આધાર</th><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>ભૌગોલિક (Spatial)</td><td>સ્થળ આધારિત</td><td>રાજ્યવાર ઉત્પાદન</td></tr><tr><td>કાલક્રમિક (Chronological)</td><td>સમય આધારિત</td><td>વર્ષવાર વેચાણ</td></tr><tr><td>ગુણાત્મક (Qualitative)</td><td>લક્ષણ આધારિત</td><td>લિંગ, ધર્મ, શિક્ષણ</td></tr><tr><td>સંખ્યાત્મક (Quantitative)</td><td>મૂલ્ય આધારિત</td><td>આવક, ઉંમર, ગુણ</td></tr></tbody></table></div><ul><li>★ ટ્રિક: \"<b>ભૌ-કા-ગુ-સં</b>\" – Geographical, Chronological, Qualitative, Quantitative</li></ul>"],["આવૃત્તિ વિતરણ (Frequency Distribution)","<ul><li><b>વર્ગ અંતરાલ (Class interval)</b>: 0-10, 10-20...</li><li><b>વર્ગ મર્યાદા</b>: નીચલી (Lower) અને ઉપલી (Upper)</li><li><b>વર્ગ ચિહ્ન/મધ્યબિંદુ</b> = (નીચલી + ઉપલી) ÷ 2</li><li><b>વર્ગ લંબાઈ (Width)</b> = ઉપલી − નીચલી</li><li><b>Exclusive</b> (10-20, 20-30: ઉપલી મર્યાદા બાકાત) vs <b>Inclusive</b> (10-19, 20-29)</li><li><b>સંચયી આવૃત્તિ (Cumulative frequency)</b>: \"થી ઓછી\" (Less than) અને \"થી વધુ\" (More than)</li><li><b>Sturges rule</b>: વર્ગોની સંખ્યા k = 1 + 3.322 log N</li></ul>"],["કોષ્ટકીકરણ (Tabulation)","<ul><li>માહિતીને <b>હાર (Rows)</b> અને <b>સ્તંભ (Columns)</b> માં ગોઠવવી</li><li>કોષ્ટકના ભાગ: <b>કોષ્ટક ક્રમાંક, શીર્ષક (Title), મથાળું (Caption – સ્તંભ શીર્ષક), હાર શીર્ષક (Stub), મુખ્ય ભાગ (Body), પાદટીપ (Footnote), સ્રોત (Source)</b></li><li>પ્રકાર: સાદું (Simple – એક લક્ષણ), દ્વિમાર્ગી (Two-way), બહુમાર્ગી (Manifold)</li><li>★ <b>Caption = સ્તંભ શીર્ષક</b>; <b>Stub = હાર શીર્ષક</b></li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Primary data</b></td><td>Data collected first-hand for the study</td></tr><tr><td><b>Secondary data</b></td><td>Data already collected by others</td></tr><tr><td><b>Population</b></td><td>Entire set of units of interest</td></tr><tr><td><b>Sample</b></td><td>Subset selected from a population</td></tr><tr><td><b>Census</b></td><td>Enumeration of all population units</td></tr><tr><td><b>Classification</b></td><td>Arranging data into meaningful categories</td></tr><tr><td><b>Frequency</b></td><td>Number of occurrences</td></tr><tr><td><b>Questionnaire</b></td><td>Structured set of data-collection questions</td></tr><tr><td><b>Observation</b></td><td>Recording directly observed phenomena</td></tr><tr><td><b>Interview</b></td><td>Collecting information through questioning</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>જાતે એકઠી = <b>પ્રાથમિક</b>; પહેલેથી પ્રકાશિત = <b>ગૌણ</b>; જ્ઞાનકોશ = <b>તૃતીયક</b></li><li>Census = 10 વર્ષે; NSO = 2019 (NSS + CSO)</li><li>Parameter = વસ્તી; Statistic = નમૂનો</li><li>વર્ગ મધ્યબિંદુ = (L + U)/2</li><li>Caption = સ્તંભ; Stub = હાર</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: પ્રશ્નાવલિ ઉત્તરદાતા જાતે ભરે; અનુસૂચિ ગણતરીકાર ભરે.</span></div>"]],"7-1":[["સંખ્યાત્મક અને ગુણાત્મક માહિતી – પરિચય","<ul><li><b>સંખ્યાત્મક (Quantitative)</b>: સંખ્યામાં માપી શકાય – ઉંમર, આવક, ગુણ, ઊંચાઈ</li><li><b>ગુણાત્મક (Qualitative / Categorical)</b>: લક્ષણ કે વર્ગ – લિંગ, રંગ, ધર્મ, અભિપ્રાય</li><li>સંખ્યાત્મક → \"<b>કેટલું?</b>\" (How much/many); ગુણાત્મક → \"<b>કયું/કેવું?</b>\" (What kind)</li></ul><div class=\"tk\"><i>★</i><span>\"<b>Quantity = જથ્થો</b>\", \"<b>Quality = ગુણ</b>\"</span></div>"],["સંખ્યાત્મક માહિતીના પ્રકાર","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>અસતત (Discrete)</b></td><td>ગણી શકાય, પૂર્ણાંક મૂલ્ય</td><td>વિદ્યાર્થીઓની સંખ્યા, બાળકો, કાર</td></tr><tr><td><b>સતત (Continuous)</b></td><td>કોઈ પણ મૂલ્ય (અપૂર્ણાંક પણ)</td><td>ઊંચાઈ, વજન, તાપમાન, સમય</td></tr></tbody></table></div><ul><li>★ ટ્રિક: <b>ગણાય → Discrete; મપાય → Continuous</b></li><li>\"2.5 બાળકો\" શક્ય નથી → Discrete; \"165.4 સેમી\" શક્ય → Continuous</li></ul>"],["માપન સ્તર (Levels of Measurement) – S.S. Stevens (1946)","<div class=\"tw\"><table><thead><tr><th>સ્તર</th><th>લક્ષણ</th><th>ઉદાહરણ</th><th>આંકડાકીય માપ</th></tr></thead><tbody><tr><td><b>નામિક (Nominal)</b></td><td>માત્ર વર્ગ/નામ, ક્રમ નહીં</td><td>લિંગ, ધર્મ, રોલ નંબર</td><td>Mode</td></tr><tr><td><b>ક્રમિક (Ordinal)</b></td><td>ક્રમ છે, અંતર સમાન નહીં</td><td>ક્રમાંક, ગ્રેડ, Likert</td><td>Median, Percentile</td></tr><tr><td><b>અંતરાલ (Interval)</b></td><td>સમાન અંતર, <b>શૂન્ય કાલ્પનિક</b></td><td>તાપમાન (°C), IQ</td><td>Mean, SD</td></tr><tr><td><b>ગુણોત્તર (Ratio)</b></td><td>સમાન અંતર + <b>વાસ્તવિક શૂન્ય</b></td><td>ઊંચાઈ, વજન, આવક</td><td>બધા (Geometric mean પણ)</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>NOIR</b>\" (ફ્રેન્ચમાં કાળો) – Nominal, Ordinal, Interval, Ratio</span></div>"],["માપન સ્તર – ઓળખવાની ટ્રિક્સ","<ul><li>★ \"<b>0 °C = ગરમી નથી</b>\" એવું નથી → °C <b>Interval</b> (શૂન્ય કાલ્પનિક)</li><li>★ <b>Kelvin</b> તાપમાન = <b>Ratio</b> (નિરપેક્ષ શૂન્ય)</li><li>★ \"40 kg એ 20 kg કરતાં બમણું\" કહી શકાય → <b>Ratio</b></li><li>★ \"40°C એ 20°C કરતાં બમણું ગરમ\" ન કહી શકાય → <b>Interval</b></li><li>★ જર્સી નંબર, પિન કોડ, મોબાઇલ નંબર → <b>Nominal</b> (સંખ્યા છે, પણ માત્ર ઓળખ)</li><li>★ પ્રથમ, દ્વિતીય, તૃતીય ક્રમ → <b>Ordinal</b></li></ul>"],["ગુણાત્મક માહિતીના પ્રકાર","<ul><li><b>નામિક (Nominal)</b>: ક્રમ વગરના વર્ગ – લોહીનું જૂથ (A, B, AB, O), રાજ્ય</li><li><b>ક્રમિક (Ordinal)</b>: ક્રમવાળા વર્ગ – સામાજિક-આર્થિક સ્તર (નીચું/મધ્યમ/ઊંચું), સંતોષ સ્તર</li><li><b>દ્વિભાજી (Binary/Dichotomous)</b>: માત્ર બે વર્ગ – હા/ના, પાસ/નાપાસ</li><li><b>ગુણાત્મક સંશોધન માહિતી</b>: મુલાકાત લખાણ (Transcripts), ક્ષેત્ર નોંધ, વીડિયો, દસ્તાવેજ</li><li>વિશ્લેષણ: <b>Thematic analysis</b>, Content analysis, Coding</li></ul>"],["કેન્દ્રીય વલણના માપ (Central Tendency)","<div class=\"tw\"><table><thead><tr><th>માપ</th><th>અર્થ</th><th>ક્યારે યોગ્ય</th></tr></thead><tbody><tr><td><b>સરેરાશ (Mean)</b></td><td>સરવાળો ÷ સંખ્યા</td><td>સંખ્યાત્મક, સમમિત માહિતી</td></tr><tr><td><b>મધ્યસ્થ (Median)</b></td><td>ક્રમમાં ગોઠવતાં વચ્ચેનું મૂલ્ય</td><td>ત્રાંસી (Skewed) માહિતી, આવક</td></tr><tr><td><b>બહુલક (Mode)</b></td><td>સૌથી વધુ વખત આવતું</td><td>નામિક માહિતી</td></tr></tbody></table></div><ul><li>★ <b>અનુભવ સિદ્ધ સંબંધ (Karl Pearson)</b>: <b>Mode = 3 Median − 2 Mean</b></li><li>સમમિત વિતરણમાં: Mean = Median = Mode</li><li>Mean પર <b>આત્યંતિક મૂલ્યો (Outliers)</b> ની સૌથી વધુ અસર</li></ul>"],["વિચલનના માપ (Dispersion)","<ul><li><b>વિસ્તાર (Range)</b> = મહત્તમ − ન્યૂનતમ</li><li><b>ચતુર્થક વિચલન (QD)</b> = (Q₃ − Q₁) / 2</li><li><b>સરેરાશ વિચલન (Mean Deviation)</b></li><li><b>પ્રમાણિત વિચલન (Standard Deviation – σ)</b> – Karl Pearson; સૌથી વધુ વપરાતું</li><li><b>વિચરણ (Variance)</b> = σ²</li><li><b>ચલનાંક (Coefficient of Variation)</b> = (σ / Mean) × 100 – બે જૂથની <b>સ્થિરતા</b> સરખાવવા; CV ઓછો → વધુ સ્થિર</li></ul><div class=\"tk\"><i>★</i><span>CV ઓછો = <b>વધુ સુસંગત (Consistent)</b></span></div>"],["વિતરણનો આકાર","<ul><li><b>સામાન્ય વિતરણ (Normal distribution)</b>: ઘંટ આકાર, સમમિત – Gauss</li><li>Mean ± 1σ = <b>68.27%</b>, ± 2σ = <b>95.45%</b>, ± 3σ = <b>99.73%</b></li><li><b>ધન ત્રાંસુ (Positive skew)</b>: જમણી બાજુ લાંબી પૂંછડી; <b>Mean &gt; Median &gt; Mode</b></li><li><b>ઋણ ત્રાંસુ (Negative skew)</b>: ડાબી બાજુ લાંબી પૂંછડી; <b>Mean &lt; Median &lt; Mode</b></li><li><b>Kurtosis</b>: શિખરતા – Leptokurtic (ઊંચું), Mesokurtic (સામાન્ય), Platykurtic (સપાટ)</li></ul><div class=\"tk\"><i>★</i><span>68-95-99.7 નિયમ</span></div>"],["સહસંબંધ (Correlation)","<ul><li>બે ચલ વચ્ચેના સંબંધની દિશા અને તીવ્રતા</li><li><b>r નો વિસ્તાર: −1 થી +1</b></li><li>+1 = સંપૂર્ણ ધન; −1 = સંપૂર્ણ ઋણ; 0 = કોઈ રેખીય સંબંધ નહીં</li><li><b>Pearson r</b>: Interval/Ratio માહિતી; <b>Spearman ρ (rank)</b>: Ordinal માહિતી</li><li><b>Scatter diagram</b> થી દૃશ્ય રજૂઆત</li><li>★ સહસંબંધ ≠ કારણ (Correlation is not causation)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Quantitative data</b></td><td>Numerical measurement or counts</td></tr><tr><td><b>Qualitative data</b></td><td>Categories or descriptive information</td></tr><tr><td><b>Discrete variable</b></td><td>Variable taking countable distinct values</td></tr><tr><td><b>Continuous variable</b></td><td>Variable varying over a continuum</td></tr><tr><td><b>Nominal scale</b></td><td>Categories without inherent order</td></tr><tr><td><b>Ordinal scale</b></td><td>Categories with an order</td></tr><tr><td><b>Interval scale</b></td><td>Equal intervals without a meaningful absolute zero</td></tr><tr><td><b>Ratio scale</b></td><td>Equal intervals with a meaningful zero</td></tr><tr><td><b>Binary variable</b></td><td>Variable with two categories</td></tr><tr><td><b>Likert response</b></td><td>Ordered response expressing level of agreement</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>ગણાય = Discrete; મપાય = Continuous</li><li>NOIR: Nominal-Ordinal-Interval-Ratio</li><li>°C = Interval; ઊંચાઈ/વજન/આવક = Ratio</li><li>નામિક → Mode; ક્રમિક → Median; Interval/Ratio → Mean</li><li>Mode = 3 Median − 2 Mean</li><li>r: −1 થી +1</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: રોલ નંબર સંખ્યા હોવા છતાં <b>Nominal</b> છે – તેનો સરવાળો/સરેરાશ અર્થહીન.</span></div>"]],"7-2":[["આલેખીય રજૂઆત – પરિચય","<p><b>આલેખ (Graph/Chart)</b> માહિતીને દૃશ્ય સ્વરૂપે રજૂ કરી ઝડપી સમજ, તુલના અને પ્રવાહ (Trend) ઓળખમાં મદદ કરે.</p><ul><li>GSET માં <b>Data Interpretation (DI)</b>: આલેખ/કોષ્ટક આપી 5 પ્રશ્નો</li><li>મુખ્ય પ્રકાર: <b>સ્તંભ આલેખ (Bar), સ્તંભાલેખ (Histogram), વર્તુળાલેખ (Pie), રેખા આલેખ (Line), કોષ્ટક (Table)</b></li><li><b>William Playfair</b> (18મી સદી) – Bar, Line, Pie chart ના શોધક</li></ul>"],["સ્તંભ આલેખ (Bar Chart)","<ul><li><b>અલગ (Discrete) વર્ગો</b> ની તુલના; સ્તંભ વચ્ચે <b>ખાલી જગ્યા</b></li></ul><div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉપયોગ</th></tr></thead><tbody><tr><td>સાદો (Simple)</td><td>એક ચલ – રાજ્યવાર વસ્તી</td></tr><tr><td>બહુવિધ/જૂથ (Multiple/Grouped)</td><td>બે-ત્રણ ચલ બાજુબાજુમાં – વર્ષવાર નિકાસ-આયાત</td></tr><tr><td>ઘટક/વિભાજિત (Stacked/Component)</td><td>કુલ અને તેના ભાગ – ખર્ચના ઘટક</td></tr><tr><td>ટકાવાર (Percentage bar)</td><td>દરેક સ્તંભ 100%</td></tr><tr><td>ઊભા/આડા (Vertical/Horizontal)</td><td>લાંબા નામ હોય તો આડા</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>Bar = \"<b>અલગ વર્ગ, જગ્યા સાથે</b>\"</span></div>"],["સ્તંભાલેખ (Histogram)","<ul><li><b>સતત (Continuous) વર્ગ અંતરાલ</b> ની આવૃત્તિ; સ્તંભ વચ્ચે <b>જગ્યા નથી</b></li><li>X-અક્ષ: વર્ગ અંતરાલ; Y-અક્ષ: આવૃત્તિ</li><li>સ્તંભનું <b>ક્ષેત્રફળ</b> આવૃત્તિ દર્શાવે (અસમાન વર્ગ લંબાઈમાં ખાસ)</li><li>Histogram પરથી <b>બહુલક (Mode)</b> આલેખીય રીતે શોધી શકાય</li><li><b>આવૃત્તિ બહુકોણ (Frequency polygon)</b>: મધ્યબિંદુઓ જોડવાથી</li><li><b>તોરણ (Ogive)</b>: સંચયી આવૃત્તિ વક્ર – <b>મધ્યસ્થ (Median)</b> શોધવા; Less than અને More than ogive છેદે ત્યાં Median</li></ul>"],["Bar vs Histogram – તુલના","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>Bar Chart</th><th>Histogram</th></tr></thead><tbody><tr><td>માહિતી</td><td>અલગ (Discrete/Categorical)</td><td>સતત (Continuous)</td></tr><tr><td>સ્તંભ વચ્ચે જગ્યા</td><td>હા</td><td>ના</td></tr><tr><td>X-અક્ષ</td><td>વર્ગ/નામ</td><td>વર્ગ અંતરાલ</td></tr><tr><td>પહોળાઈ</td><td>મહત્વની નથી</td><td>અર્થપૂર્ણ</td></tr><tr><td>ક્રમ બદલી શકાય</td><td>હા</td><td>ના</td></tr></tbody></table></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: Ogive થી Median; Histogram થી Mode; Frequency polygon માટે મધ્યબિંદુ.</span></div>"],["વર્તુળાલેખ (Pie Chart)","<ul><li>સમગ્રના <b>ભાગોનું પ્રમાણ</b> (Part-to-whole) દર્શાવે; કુલ = <b>360°</b> = 100%</li><li>★ <b>ખૂણો = (ઘટક મૂલ્ય ÷ કુલ) × 360°</b></li><li>★ <b>1% = 3.6°</b>; 10% = 36°; 25% = 90°; 50% = 180°</li><li>★ ઘટક મૂલ્ય = (ખૂણો ÷ 360) × કુલ</li><li>ઉદા: ₹ 72,000 ના બજેટમાં ખોરાક 90° → 90/360 × 72000 = <b>₹ 18,000</b></li><li>મર્યાદા: 5-6 થી વધુ ભાગ હોય તો અસ્પષ્ટ; સમય સાથેનો ફેરફાર દર્શાવી ન શકે</li><li><b>Doughnut chart</b>: વચ્ચે ખાલી Pie</li></ul>"],["રેખા આલેખ (Line Graph)","<ul><li><b>સમય સાથે ફેરફાર (Trend)</b> દર્શાવવા શ્રેષ્ઠ – કાલશ્રેણી (Time series)</li><li>X-અક્ષ: સમય (વર્ષ, મહિનો); Y-અક્ષ: મૂલ્ય</li><li><b>ઢાળ (Slope)</b>: ઊભો ઢાળ = ઝડપી ફેરફાર</li><li>એકથી વધુ રેખા → તુલના</li><li>★ \"સૌથી વધુ વૃદ્ધિ\" = <b>સૌથી ઊભો ચઢાણ</b> (વધુ તફાવત) – પણ \"% વૃદ્ધિ\" માટે મૂળ મૂલ્ય પણ જુઓ</li><li><b>Area chart</b>: રેખા નીચેનો ભાગ ભરેલો</li></ul>"],["કોષ્ટક (Table) અને અન્ય આલેખ","<ul><li><b>કોષ્ટક</b>: ચોક્કસ મૂલ્યો માટે શ્રેષ્ઠ; DI માં સૌથી સામાન્ય</li><li><b>Scatter plot</b>: બે ચલ વચ્ચેનો સંબંધ (સહસંબંધ)</li><li><b>Box plot</b> (John Tukey): Min, Q₁, Median, Q₃, Max – પાંચ-સંખ્યા સારાંશ</li><li><b>Pictogram</b>: ચિત્રો દ્વારા</li><li><b>Cartogram / Choropleth map</b>: નકશા પર</li><li><b>Radar/Spider chart</b>: અનેક ચલ</li><li><b>Gantt chart</b>: પ્રોજેક્ટ સમયપત્રક (Henry Gantt)</li></ul>"],["કયો આલેખ ક્યારે?","<div class=\"tw\"><table><thead><tr><th>હેતુ</th><th>યોગ્ય આલેખ</th></tr></thead><tbody><tr><td>વર્ગોની તુલના</td><td>Bar chart</td></tr><tr><td>સમયનો પ્રવાહ</td><td>Line graph</td></tr><tr><td>સમગ્રના ભાગ</td><td>Pie chart</td></tr><tr><td>સતત આવૃત્તિ વિતરણ</td><td>Histogram</td></tr><tr><td>બે ચલનો સંબંધ</td><td>Scatter plot</td></tr><tr><td>ચોક્કસ મૂલ્યો</td><td>Table</td></tr><tr><td>Median શોધવો</td><td>Ogive</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>તુલના-Bar, ટ્રેન્ડ-Line, ભાગ-Pie, વિતરણ-Histogram</b>\"</span></div>"],["DI ગણતરીની ઝડપી ટ્રિક્સ","<ul><li>★ <b>% વૃદ્ધિ</b> = (નવું − જૂનું) / જૂનું × 100</li><li>★ <b>સરેરાશ વાર્ષિક વૃદ્ધિ</b> ≈ કુલ % વૃદ્ધિ ÷ વર્ષ (સાદી); ચોક્કસ = <b>CAGR = (અંતિમ/પ્રારંભિક)^(1/n) − 1</b></li><li>★ ગુણોત્તર તુલનામાં <b>approximation</b> વાપરો (દા.ત. 49.8 ≈ 50)</li><li>★ વિકલ્પો વચ્ચે મોટો તફાવત હોય તો ચોક્કસ ગણતરી ન કરો</li><li>★ \"<b>લગભગ</b>\" (approximately) શબ્દ = અંદાજિત ગણતરી ચાલશે</li><li>★ પહેલાં <b>એકમ (Units)</b> જુઓ – લાખ, કરોડ, હજાર, %</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Bar chart</b></td><td>Separated bars comparing categories</td></tr><tr><td><b>Histogram</b></td><td>Adjacent bars showing numerical intervals</td></tr><tr><td><b>Pie chart</b></td><td>Sectors showing parts of a whole</td></tr><tr><td><b>Line chart</b></td><td>Connected points showing a trend</td></tr><tr><td><b>Scatter plot</b></td><td>Points showing two-variable relationships</td></tr><tr><td><b>Table</b></td><td>Information organised in rows and columns</td></tr><tr><td><b>Vertical axis</b></td><td>Axis usually showing values</td></tr><tr><td><b>Horizontal axis</b></td><td>Axis usually showing categories or time</td></tr><tr><td><b>Legend</b></td><td>Explanation of chart symbols or colours</td></tr><tr><td><b>Frequency polygon</b></td><td>Joined midpoints of frequency-class values</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Bar = અલગ વર્ગ (જગ્યા સાથે); Histogram = સતત (જગ્યા વગર)</li><li>Pie: 1% = 3.6°, કુલ 360°</li><li>Line = સ
