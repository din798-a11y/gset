<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="GSET Paper I — Teaching & Research Aptitude. 10,578 MCQs with instant answer checking, mock tests and progress tracking. Authors: Prin. Dr R. N. Desai, Dr J. K. Patel, Dr D. N. Patel.">
<link rel="preload" href="bank.json" as="fetch" crossorigin="anonymous">
<meta name="theme-color" content="#13306b">
<title>GSET Paper I Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&family=Noto+Serif+Gujarati:wght@600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea;--paper:#ffffff;--paper2:#fbf9f4;--line:#e3ddcf;--line2:#d4ccb9;
  --ink:#1a2340;--ink2:#2e3a5c;--muted:#5d667c;--dim:#8a91a3;
  --navy:#13306b;--navy2:#1f4fa6;--navy3:#e8eef9;--maroon:#8a1c2b;--gold:#b38427;--gold2:#d8b260;--gold3:#fbf3df;
  --ok:#11795a;--ok2:#e5f5ee;--okb:#7fcbb0;--bad:#b83228;--bad2:#fdecea;--badb:#ef9d95;
  --serif:"Playfair Display","Noto Serif Gujarati",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Noto Sans Gujarati","Nirmala UI","Shruti",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;--sh:0 1px 2px rgba(20,30,60,.05),0 10px 30px rgba(20,30,60,.07);--sh2:0 2px 6px rgba(20,30,60,.06),0 22px 48px rgba(20,30,60,.12);
  --gradN:linear-gradient(120deg,#13306b,#1f4fa6);
  --gradG:linear-gradient(100deg,#9a6f1c,#d8b260 40%,#b38427 60%,#e6c77f 80%,#9a6f1c);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.gu{line-height:1.7}
button{font-family:inherit;color:inherit}
::selection{background:#d8b26055}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cfc6b2;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

/* ---------- background ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx .wash{position:absolute;inset:0;background:radial-gradient(1000px 600px at 0% 0%,rgba(31,79,166,.09),transparent 60%),radial-gradient(900px 600px at 100% 0%,rgba(179,132,39,.10),transparent 60%),radial-gradient(900px 700px at 50% 110%,rgba(138,28,43,.05),transparent 60%)}
.bgfx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(19,48,107,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(19,48,107,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%)}
.bgfx .shape{position:absolute;border:1.5px solid rgba(179,132,39,.22);border-radius:50%;animation:orbit 40s linear infinite}
.bgfx .shape.s1{width:520px;height:520px;left:-160px;top:-180px}
.bgfx .shape.s2{width:380px;height:380px;right:-120px;bottom:-120px;border-color:rgba(19,48,107,.14);animation-duration:55s;animation-direction:reverse}
.bgfx .shape.s3{width:220px;height:220px;right:12%;top:8%;border-style:dashed;border-color:rgba(19,48,107,.12);animation-duration:70s}
.bgfx .shape:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold2);top:-6px;left:50%;box-shadow:0 0 12px rgba(216,178,96,.7)}
.bgfx .shape.s2:after{background:var(--navy2);box-shadow:0 0 12px rgba(31,79,166,.5)}
@keyframes orbit{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ---------- shared animation ---------- */
.rise{opacity:0;transform:translateY(18px)}
.on .rise,.rise.go{animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:200% center}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
@keyframes blink{50%{opacity:.25}}
.gt{background:var(--gradG);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}

/* ---------- language switch ---------- */
.langsw{display:inline-flex;padding:3px;border-radius:999px;background:var(--paper);border:1px solid var(--line2);box-shadow:var(--sh);position:relative}
.langsw button{border:0;background:none;cursor:pointer;padding:.42em 1em;border-radius:999px;font-weight:700;font-size:.92em;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.langsw button.on{color:#fff}
.langsw .knob{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--gradN);box-shadow:0 4px 12px rgba(19,48,107,.3);transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}

/* ================= LOGIN ================= */
#login{position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto 1fr auto;gap:2vh;padding:2.4vh 3.2vw 2vh;font-size:clamp(10px,min(1.02vw,1.66vh),17px);overflow:hidden;transition:opacity .6s,transform .6s,visibility .6s}
#login.out{opacity:0;transform:scale(.98);visibility:hidden}
#login.out,#login.out *{visibility:hidden!important;pointer-events:none!important}
#login>*{position:relative;z-index:1}
#login>.lg-top{position:absolute;z-index:3}
body.gu #login{font-size:clamp(10px,min(.95vw,1.5vh),16px)}
body.gu .lg-head h1{font-size:2.55em}
.lg-top{position:absolute;top:2vh;right:2.4vw;z-index:3}
.lg-head{display:flex;align-items:center;justify-content:center;gap:1.6em;text-align:left}
.seal{width:6.6em;height:6.6em;position:relative;flex-shrink:0}
.seal .r1{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px rgba(179,132,39,.35)}
.seal .r2{position:absolute;inset:-.55em;border-radius:50%;border:1.5px dashed rgba(19,48,107,.35);animation:spin 26s linear infinite}
.seal .r2:after{content:"";position:absolute;top:-.3em;left:50%;width:.6em;height:.6em;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold2)}
.seal .core{position:absolute;inset:.55em;border-radius:50%;background:radial-gradient(circle at 35% 25%,#2a5bb8,#13306b 70%);display:grid;place-items:center;text-align:center;color:#fff;box-shadow:0 8px 22px rgba(19,48,107,.35)}
.seal .core b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.35em;letter-spacing:.06em;line-height:1}
.seal .core small{display:block;font-size:.58em;letter-spacing:.3em;color:#e6c77f;font-weight:700;margin-top:.25em}
.kicker{display:inline-flex;align-items:center;gap:.6em;font-size:.82em;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--maroon)}
body.gu .kicker{letter-spacing:.06em;font-size:.95em}
.kicker:before,.kicker:after{content:"";width:2.2em;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
.kicker:after{background:linear-gradient(90deg,var(--gold),transparent)}
.lg-head h1{font-family:var(--serif);font-size:3em;line-height:1.08;margin:.15em 0 .12em;color:var(--navy);font-weight:800;letter-spacing:-.01em}
body.gu .lg-head h1{font-size:2.7em;line-height:1.25}
.lg-head .sub{font-size:1.18em;color:var(--muted);margin:0}
.lg-mid{display:grid;grid-template-columns:1.18fr 1fr;gap:2em;align-items:center;min-height:0}
.lg-left{display:grid;gap:1.1em;min-height:0}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em}
.st{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.9em 1em;box-shadow:var(--sh);position:relative;overflow:hidden}
.st:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gradN)}
.st:nth-child(even):before{background:linear-gradient(var(--gold),var(--gold2))}
.st:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(216,178,96,.18) 50%,transparent 65%);animation:sweep 5s ease-in-out infinite;animation-delay:var(--sd,0s)}
.st .n{font-family:"Playfair Display",Georgia,serif;font-size:2.05em;font-weight:800;color:var(--navy);line-height:1.1}
.st .l{font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
body.gu .st .l{letter-spacing:0;font-size:.92em}
.cards2{display:grid;grid-template-columns:.92fr 1.18fr;gap:1em}
.pc{font-size:1.06em;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1em 1.2em;box-shadow:var(--sh);position:relative;overflow:hidden}
.pc:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--gold2),var(--maroon))}
.pc h4{margin:0 0 .55em;font-family:var(--serif);font-size:1.18em;color:var(--navy);display:flex;align-items:center;gap:.45em}
.pc ul{list-style:none;margin:0;padding:0}
.pc li{display:flex;justify-content:space-between;gap:.8em;padding:.42em 0;border-bottom:1px dashed var(--line);font-size:.98em}
.pc li:last-child{border:0}
.pc li span{color:var(--muted)}
.pc li b{text-align:right;color:var(--ink2)}
.ulist{display:grid;grid-template-columns:1fr 1fr;gap:.3em .9em}
.ulist div{display:flex;align-items:center;gap:.5em;font-size:.88em;line-height:1.25;padding:.3em 0;border-bottom:1px dashed var(--line);color:var(--ink2)}
.ulist i{font-style:normal;flex-shrink:0;width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;font-size:.78em;font-weight:800;color:#fff;background:var(--gradN)}
.ulist div:nth-child(even) i{background:linear-gradient(135deg,var(--gold),#8f6517)}
/* login card */
.lcw{position:relative;border-radius:20px;padding:2px;overflow:hidden;overflow:clip;box-shadow:var(--sh2)}
.lcw:before{content:"";position:absolute;inset:-70%;background:conic-gradient(from 0deg,#13306b,#d8b260,#8a1c2b,#1f4fa6,#d8b260,#13306b);animation:spin 7s linear infinite}
.lc{position:relative;background:var(--paper);border-radius:18px;padding:1.7em 2.2em 1.3em;font-size:1.16em}
.lc .lock{width:3.2em;height:3.2em;margin:0 auto .5em;border-radius:50%;display:grid;place-items:center;background:var(--navy3);border:1px solid #cfdaf0;animation:float 3.2s ease-in-out infinite;transition:background .4s,transform .4s;font-size:1.6em}
.lc .lock.ok{background:var(--ok2);border-color:var(--okb);animation:bounce .7s}
.lc h3{text-align:center;margin:0;font-family:var(--serif);font-size:1.75em;color:var(--navy)}
.lc .msg{text-align:center;color:var(--muted);margin:.15em 0 1em;font-size:1em}
.inp{position:relative;margin-bottom:.8em}
.inp input{width:100%;padding:1.35em 3em .5em 3em;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper2);color:var(--ink);font:inherit;font-size:1.08em;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.inp input:focus{border-color:var(--navy2);background:#fff;box-shadow:0 0 0 4px rgba(31,79,166,.12)}
.inp label{position:absolute;left:3.1em;top:1em;color:var(--muted);font-size:1.02em;pointer-events:none;transition:.2s cubic-bezier(.2,.8,.2,1)}
.inp input:focus+label,.inp input:not(:placeholder-shown)+label{top:.4em;font-size:.72em;color:var(--navy2);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.inp .ico{position:absolute;left:1em;top:50%;transform:translateY(-50%);font-size:1.1em;opacity:.75}
.inp .eye{position:absolute;right:.6em;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:1.05em;padding:.35em;border-radius:8px;opacity:.7}
.inp .eye:hover{opacity:1;background:var(--navy3)}
.lrow{display:flex;justify-content:space-between;align-items:center;margin:.2em 0 1.1em;font-size:.95em;color:var(--muted)}
.lbtn{width:100%;justify-content:center;padding:.95em;font-size:1.08em!important}
.lbtn .spin{width:1.1em;height:1.1em;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.lbtn.busy .spin{display:inline-block}
.lload{text-align:center;font-size:.88em;color:var(--navy2);margin-top:.6em;font-weight:600;animation:blink 1.4s infinite}
.lerr{min-height:1.5em;text-align:center;font-size:.92em;color:var(--bad);margin-top:.7em;font-weight:600}
.lc.shake{animation:shake .5s}
.lc .lfoot{text-align:center;font-size:.8em;color:var(--dim);border-top:1px dashed var(--line);padding-top:.8em;margin-top:.4em}
#lform{transition:opacity .35s,transform .35s}
#lform.gone{opacity:0;transform:scale(.95);pointer-events:none}
.lok{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;transform:scale(.9);transition:.45s cubic-bezier(.3,1.4,.5,1)}
.lok.on{opacity:1;visibility:visible;transform:none}
.lok .big{width:5em;height:5em;border-radius:50%;display:grid;place-items:center;font-size:1.9em;color:#fff;background:linear-gradient(135deg,#0e6b4f,#17a074);animation:bounce .7s,okring 1.4s .3s infinite}
@keyframes okring{0%{box-shadow:0 0 0 0 rgba(17,121,90,.45)}100%{box-shadow:0 0 0 24px rgba(17,121,90,0)}}
.lok b{font-family:var(--serif);font-size:1.5em;color:var(--navy);margin-top:.7em}
.lok small{color:var(--muted);font-size:.95em}
.lok .bar{width:12em;height:4px;border-radius:4px;background:var(--line);margin-top:1em;overflow:hidden}
.lok .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--gold2))}
.lok.on .bar i{animation:fill 1.7s linear forwards}
@keyframes fill{to{width:100%}}
/* authors row on login */
.lg-auth-h{display:flex;align-items:center;gap:1em;font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.12em;margin-bottom:.6em}
.lg-auth-h:before,.lg-auth-h:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.lg-auth-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em}
.la{display:flex;gap:.8em;align-items:center;font-size:.94em;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.85em 1em;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .35s,box-shadow .35s,border-color .35s}
.la:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--gold2)}
.la:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.ph{width:4.9em;height:4.9em;flex-shrink:0;border-radius:50%;position:relative}
.ph .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--ac),var(--gold2),var(--ac));animation:spin 8s linear infinite}
.ph .face{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid #fff;background:var(--navy3);display:grid;place-items:center}
.ph .face span{font-family:var(--serif);font-weight:800;color:var(--navy);font-size:1.4em}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.ph .num{position:absolute;right:-.2em;bottom:-.1em;width:1.6em;height:1.6em;border-radius:50%;background:var(--ac);color:#fff;font-size:.72em;font-weight:800;display:grid;place-items:center;border:2px solid #fff;z-index:2}
.la .tx b{display:block;font-family:var(--serif);color:var(--navy);font-size:1.12em;line-height:1.2}
.la .tx .d{font-size:.74em;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ac);margin-top:.15em}
body.gu .la .tx .d{letter-spacing:0;font-size:.85em}
.la .tx .i{font-size:.88em;color:var(--ink2);line-height:1.35}
.la .tx .q{font-size:.78em;color:var(--muted);margin-top:.15em}

/* ================= APP ================= */
#app{position:relative;z-index:2;opacity:0;visibility:hidden;transition:opacity .7s}
#app.on{opacity:1;visibility:visible}
#app:not(.on){height:0;overflow:hidden}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(20,30,60,.05)}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),var(--navy2),var(--gold2),transparent);background-size:200% 100%;animation:shine 8s linear infinite;opacity:.7}
.topin{max-width:1320px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0}
.brand .seal{font-size:6.6px;width:6.6em;height:6.6em}
.brand .bt b{display:block;font-family:var(--serif);font-size:17px;color:var(--navy);line-height:1.15}
.brand .bt small{color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:600}
body.gu .brand .bt small{letter-spacing:0;font-size:12px}
.nav{display:flex;gap:2px;margin-left:auto;background:var(--paper2);border:1px solid var(--line);padding:4px;border-radius:12px;position:relative}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted);position:relative;z-index:1;transition:color .25s;white-space:nowrap}
.nav button.on{color:#fff}
.nav .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--gradN);box-shadow:0 4px 14px rgba(19,48,107,.28);transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.topbar .langsw{font-size:13px;flex-shrink:0}
.logout{border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s;flex-shrink:0}
.logout:hover{color:var(--bad);border-color:var(--badb)}
.wrap{max-width:1320px;margin:auto;padding:26px 20px 90px}
.view{display:none}
.view.on{display:block;animation:viewin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.h-sec{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:36px 0 14px;flex-wrap:wrap}
.h-sec h3{margin:0;font-family:var(--serif);font-size:24px;color:var(--navy)}
.h-sec p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.h-sec h3:after{content:"";display:block;width:46px;height:3px;border-radius:3px;margin-top:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}

.dhero{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
.welcome{padding:28px 30px;position:relative;overflow:hidden;background:linear-gradient(135deg,#13306b,#1f4fa6 70%,#2b5fbf);color:#fff;border:0}
.welcome:before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(230,199,127,.35);animation:pulse 6s ease-in-out infinite}
.welcome:after{content:"";position:absolute;right:30px;bottom:-90px;width:200px;height:200px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.2);animation:spin 40s linear infinite}
.welcome .tag{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:#e6c77f;font-weight:700}
body.gu .welcome .tag{letter-spacing:0;font-size:14px}
.welcome h2{font-family:var(--serif);font-size:clamp(23px,3vw,32px);margin:8px 0 6px;line-height:1.25}
.welcome p{color:#dbe5fb;margin:0 0 20px;max-width:580px;position:relative;z-index:1}
.qa{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
.btn{border:1px solid var(--line2);background:var(--paper);padding:10px 17px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:all .2s;color:var(--ink2);position:relative;overflow:hidden}
.btn:hover{border-color:var(--navy2);color:var(--navy);transform:translateY(-2px);box-shadow:0 6px 16px rgba(19,48,107,.12)}
.btn.pri{background:var(--gradN);border:0;color:#fff;box-shadow:0 6px 18px rgba(19,48,107,.28)}
.btn.pri:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%)}
.btn.pri:hover{color:#fff}.btn.pri:hover:after{animation:sweep 1s ease}
.btn.gold{background:linear-gradient(120deg,#a8781f,#d8b260);border:0;color:#fff}
.welcome .btn:not(.gold){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.welcome .btn:not(.gold):hover{background:rgba(255,255,255,.18)}
.btn.ok{background:linear-gradient(120deg,#0e6b4f,#17a074);border:0;color:#fff}
.btn.bad{background:var(--bad2);border-color:var(--badb);color:var(--bad)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.statpanel{padding:24px;display:flex;gap:22px;align-items:center}
.ringwrap{position:relative;width:150px;height:150px;flex-shrink:0}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:11}
.ringwrap .trk{stroke:#eee8da}
.ringwrap .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringwrap .mid b{font-family:"Playfair Display",Georgia,serif;font-size:32px;color:var(--navy);line-height:1}
.ringwrap .mid small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:5px;font-weight:600}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.ms{padding:12px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--line)}
.ms b{font-family:"Playfair Display",Georgia,serif;font-size:23px;display:block;line-height:1.2;color:var(--navy)}
.ms small{color:var(--muted);font-size:13px}
.ms.g b{color:var(--ok)}.ms.r b{color:var(--bad)}.ms.y b{color:var(--gold)}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mode{padding:22px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.mode:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--gold2));transform:scaleX(0);transform-origin:left;transition:transform .4s}
.mode:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.mode:hover:before{transform:scaleX(1)}
.mode .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--navy3);margin-bottom:12px;transition:transform .4s}
.mode:nth-child(2) .ic{background:var(--gold3)}.mode:nth-child(3) .ic{background:#f8e9eb}
.mode:hover .ic{transform:rotate(-8deg) scale(1.1)}
.mode h4{margin:0 0 4px;font-family:var(--serif);font-size:19px;color:var(--navy)}
.mode p{margin:0;color:var(--muted);font-size:14.5px}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.unit{padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;opacity:0;animation:cardin .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes cardin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.unit:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.unit:hover{transform:translateY(-5px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.unit .top{display:flex;justify-content:space-between;align-items:start}
.unit .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 12%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);transition:transform .4s}
.unit:hover .ic{transform:rotate(-8deg) scale(1.1)}
.unit .no{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--c)}
.unit h4{margin:13px 0 2px;font-family:var(--serif);font-size:17.5px;color:var(--navy);line-height:1.3;min-height:46px}
.unit .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 0 7px}
.unit .meta b{color:var(--ink2)}
.bar{height:7px;border-radius:7px;background:#efe9dc;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--c,var(--navy));transition:width 1.4s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sweep 2.5s infinite}
.unit .go{position:absolute;right:18px;top:62px;opacity:0;transform:translateX(-8px);transition:.3s;color:var(--c);font-weight:700;font-size:13.5px}
.unit:hover .go{opacity:1;transform:none}

/* authors (dashboard) */
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.acard{padding:24px 22px;position:relative;overflow:hidden;transition:transform .35s,box-shadow .35s;text-align:center}
.acard:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--ac),var(--gold2))}
.acard:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.acard .ph{width:118px;height:118px;margin:4px auto 14px;font-size:14px}
.acard .ph .face span{font-size:34px}
.acard .ph .num{font-size:11px;width:28px;height:28px}
.acard h4{margin:0;font-family:var(--serif);font-size:21px;color:var(--navy)}
.acard .d{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ac);margin-top:6px}
body.gu .acard .d{letter-spacing:0;font-size:14px}
.acard .i{font-size:14.5px;color:var(--ink2);font-weight:600;min-height:42px;margin-top:2px}
.acard .q{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 12px}
.acard .q span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line2);color:var(--ink2)}
.acard .s4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acard .s4 div{padding:8px 4px;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.acard .s4 b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:19px;color:var(--ac);line-height:1.2}
.acard .s4 small{display:block;font-size:10.5px;color:var(--muted);line-height:1.25}
.acard ul{list-style:none;padding:0;margin:12px 0 0;text-align:left;display:grid;gap:6px}
.acard li{font-size:13.5px;color:var(--ink2);padding-left:20px;position:relative;line-height:1.45}
.acard li:before{content:"◆";position:absolute;left:2px;top:1px;color:var(--gold);font-size:10px}

/* practice */
.pgrid>*,.mgrid>*,.dhero>*{min-width:0}
.pgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.side{padding:20px;position:sticky;top:84px}
.side h4{margin:0 0 14px;font-family:var(--serif);font-size:18px;color:var(--navy)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
select,input[type=search],input[type=number]{min-width:0;max-width:100%;text-overflow:ellipsis;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink);font:inherit;font-size:14.5px;outline:none;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(31,79,166,.12)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;margin:10px 0;cursor:pointer;user-select:none;color:var(--ink2)}
.tog input{display:none}
.tog i{width:40px;height:23px;border-radius:23px;background:#ddd5c4;position:relative;transition:.25s;flex-shrink:0}
.tog i:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+i{background:var(--navy2)}
.tog input:checked+i:after{left:20px}
.sess{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.sess div{text-align:center;padding:10px 4px;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.sess b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:21px;color:var(--navy)}
.sess small{font-size:11.5px;color:var(--muted);font-weight:600}
.sess .g b{color:var(--ok)}.sess .r b{color:var(--bad)}
.kbd{font-size:12.5px;color:var(--dim);margin-top:16px;line-height:2}
.kbd kbd{display:inline-block;padding:0 7px;border-radius:6px;border:1px solid var(--line2);background:var(--paper2);font-family:inherit;font-size:11.5px;color:var(--ink2)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qhead h3{margin:0;font-family:var(--serif);font-size:22px;color:var(--navy)}
.qhead .sub{color:var(--muted);font-size:14px}
.qprog{height:6px;border-radius:6px;background:#ebe4d4;overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--navy2),var(--gold2));width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qcard{padding:26px 28px;position:relative;overflow:hidden}
.qcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--navy),var(--gold2))}
.qcard.enter{animation:qin .5s cubic-bezier(.2,.8,.2,1)}
.qcard.enter.back{animation:qinb .5s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes qinb{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.qmeta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}
.chip{font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--navy3);color:var(--navy);border:1px solid #cfdaf0}
.chip.t{background:var(--gold3);color:#7a5813;border-color:#ecd9a8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.st-ok{background:var(--ok2);color:var(--ok);border-color:var(--okb)}
.chip.st-bad{background:var(--bad2);color:var(--bad);border-color:var(--badb)}
.bmk{margin-left:auto;background:var(--paper);border:1px solid var(--line2);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:17px;display:grid;place-items:center;transition:.2s;color:var(--dim)}
.bmk:hover{border-color:var(--gold)}
.bmk.on{color:var(--gold);border-color:var(--gold2);background:var(--gold3);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.3)}}
.qtext{font-size:clamp(17px,2vw,20px);font-weight:700;line-height:1.65;margin:0 0 18px;color:var(--ink)}
.qtext .qn{color:var(--maroon);margin-right:6px;font-family:"Playfair Display",Georgia,serif}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);cursor:pointer;font-size:15.5px;line-height:1.5;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden;opacity:0;animation:optin .45s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*70ms + 80ms);color:var(--ink)}
@keyframes optin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt:hover:not(:disabled){border-color:var(--navy2);background:#f6f9ff;transform:translateX(4px);box-shadow:0 4px 12px rgba(19,48,107,.08)}
.opt .lt{width:33px;height:33px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--paper2);border:1.5px solid var(--line2);color:var(--navy);transition:.3s}
.opt .tx{flex:1}
.opt .mk{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;opacity:0;transform:scale(0);transition:.4s cubic-bezier(.3,1.6,.5,1);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5!important}
.opt.correct{border-color:var(--ok);background:var(--ok2);opacity:1!important}
.opt.correct .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.correct .mk{opacity:1;transform:scale(1);background:var(--ok)}
.opt.correct.picked{animation:okpulse .8s ease}
@keyframes okpulse{0%{box-shadow:0 0 0 0 rgba(17,121,90,.45)}100%{box-shadow:0 0 0 16px rgba(17,121,90,0)}}
.opt.wrong{border-color:var(--bad);background:var(--bad2);opacity:1!important;animation:shake .5s ease}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .mk{opacity:1;transform:scale(1);background:var(--bad)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.opt.sel{border-color:var(--navy2);background:#eef3fd}
.opt.sel .lt{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.opt .rip{position:absolute;border-radius:50%;background:rgba(31,79,166,.18);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.verdict{margin-top:16px;border-radius:12px;padding:13px 17px;display:flex;align-items:center;gap:14px;animation:vin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.verdict .vi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;flex-shrink:0;color:#fff;animation:bounce .7s}
@keyframes bounce{0%{transform:scale(0)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.verdict b{font-size:17px;display:block}
.verdict small{color:var(--ink2);font-size:14px}
.verdict.ok{background:var(--ok2);border:1px solid var(--okb)}.verdict.ok .vi{background:var(--ok)}.verdict.ok b{color:var(--ok)}
.verdict.bad{background:var(--bad2);border:1px solid var(--badb)}.verdict.bad .vi{background:var(--bad)}.verdict.bad b{color:var(--bad)}
.verdict strong{color:var(--ok)}
.explain{margin-top:12px;padding:13px 17px;border-radius:12px;background:#f4f7fd;border:1px solid #d6e1f5;border-left:4px solid var(--navy2);font-size:15px;color:var(--ink2);animation:vin .6s .1s both}
.explain b{color:var(--navy2);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
body.gu .explain b{letter-spacing:0;font-size:14px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.qnav .glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(31,79,166,.15),0 6px 18px rgba(19,48,107,.28)}}
.cf{position:fixed;z-index:100;pointer-events:none;width:9px;height:9px;border-radius:2px;animation:cf 1s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.floater{position:fixed;z-index:101;pointer-events:none;font-weight:800;font-size:21px;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-64px) scale(1.15)}}

/* mock */
.mock-setup{padding:34px;text-align:center;max-width:780px;margin:0 auto}
.mock-setup .big{font-size:52px;display:inline-block;animation:float 3s ease-in-out infinite}
.mock-setup h2{margin:6px 0;font-family:var(--serif);font-size:32px;color:var(--navy)}
.mock-setup p{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.rules div{padding:14px 8px;border-radius:12px;background:var(--paper2);border:1px solid var(--line)}
.rules b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:24px;color:var(--navy)}
.rules small{color:var(--muted);font-size:12.5px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.timer{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.timer .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:blink 1s infinite}
.timer.warn{color:var(--gold)}.timer.warn .dot{background:var(--gold)}
.timer.crit{color:var(--bad);animation:blink 1s infinite}.timer.crit .dot{background:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:14px 0}
.palette button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line2);background:var(--paper2);cursor:pointer;font-weight:700;font-size:13px;transition:.2s;color:var(--ink2)}
.palette button:hover{border-color:var(--navy2)}
.palette button.ans{background:var(--navy2);border-color:var(--navy2);color:#fff}
.palette button.flag{box-shadow:inset 0 0 0 2.5px var(--gold)}
.palette button.cur{outline:2px solid var(--gold);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c);border:1px solid var(--line2)}
.result{padding:32px;text-align:center}
.result .ringwrap{width:190px;height:190px;margin:10px auto}
.result .ringwrap .mid b{font-size:42px}
.grade{font-family:var(--serif);font-size:30px;font-weight:800;margin:8px 0 4px;color:var(--navy)}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.ubreak{display:grid;gap:10px;text-align:left;margin-top:10px}
.ubreak .row{display:grid;grid-template-columns:230px 1fr 60px;gap:12px;align-items:center;font-size:14.5px}
.ubreak .row .bar{height:9px}
/* bank */
.filterbar{padding:16px;display:grid;grid-template-columns:2fr 1.2fr 1.6fr auto;gap:12px;align-items:end;position:sticky;top:70px;z-index:5}
.blist{display:grid;gap:14px;margin-top:16px}
.blist .qcard{padding:20px 22px;animation:cardin .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.blist .qtext{font-size:16.5px;margin-bottom:13px}
.blist .opt{padding:10px 13px;font-size:14.5px}
.blist .opt .lt{width:29px;height:29px;font-size:13px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.pager .pinfo{color:var(--muted);font-size:14.5px;padding:0 8px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .e{font-size:44px;margin-bottom:8px}
mark{background:#f6e3b0;color:inherit;border-radius:3px;padding:0 2px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:11px;background:var(--paper2);border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:7px 15px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14.5px}
.tabs button.on{background:var(--gradN);color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:120;background:var(--navy);color:#fff;padding:11px 20px;border-radius:11px;font-weight:600;font-size:14.5px;transition:.35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:13.5px;padding:28px 16px 6px;border-top:1px solid var(--line);margin-top:48px}
.foot b{color:var(--navy)}
.bnav{display:none}


/* ===== 3D BUTTON SYSTEM ===== */
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #cfc5ae,0 7px 16px rgba(20,30,60,.10);transition:transform .14s cubic-bezier(.3,1.4,.5,1),box-shadow .14s,background .2s,color .2s;will-change:transform}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 0 #c4b89c,0 12px 22px rgba(20,30,60,.14)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 #c4b89c,0 2px 6px rgba(20,30,60,.12);transition-duration:.05s}
.btn.pri{background:linear-gradient(180deg,#2c62c4 0%,#1a3f8a 55%,#13306b 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 0 #0a1d44,0 9px 20px rgba(19,48,107,.38)}

/* ===== STUDY (topics) ===== */

/* ===== THEORY READER ===== */

@media (max-width:720px){

}
/* ===== PRACTICE SIDE compact (mobile/tablet) ===== */
@media (max-width:1080px){

/* ===== CONTINUOUS THEORY ===== */
.th-sticky{position:sticky;top:64px;z-index:6;background:linear-gradient(var(--bg) 70%,transparent);padding:6px 0 10px;margin-bottom:6px}

.tdoc{min-width:0}
.ts{position:relative;background:linear-gradient(90deg,#f3eee2 0,#fffdf8 16px,#fffdf8 100%);border:1px solid var(--line);border-radius:6px 18px 18px 6px;padding:26px 32px 22px 44px;margin-bottom:18px;box-shadow:0 2px 0 #e7e0cf,0 4px 0 #ddd4bf,0 14px 30px rgba(20,30,60,.10);scroll-margin-top:120px;opacity:0;transform:translateY(34px) rotateX(6deg);transform-origin:top;transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl=(s,term)=>{const e=esc(s);if(!term)return e;const r=esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return e.replace(new RegExp(r,'gi'),m=>'<mark>'+m+'</mark>')}catch(_){return e}};

function countUp(el,to,dur=1400,suf=''){const st=performance.now();const f=now=>{const p=Math.min(1,(now-st)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(to*e))+suf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

/* particles (subtle, navy + gold) */
(function(){const c=$('fx'),x=c.getContext('2d');let W,H,P=[],D=Math.min(2,devicePixelRatio||1);const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function rs(){W=c.width=innerWidth*D;H=c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';const n=Math.min(60,Math.round(innerWidth*innerHeight/26000));P=Array.from({length:n},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25*D,vy:(Math.random()-.5)*.25*D,r:(Math.random()*1.6+.8)*D,g:i%4===0}))}
rs();addEventListener('resize',rs);
(function draw(){x.clearRect(0,0,W,H);const R=120*D;for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<R){x.strokeStyle=`rgba(19,48,107,${(1-d/R)*.12})`;x.lineWidth=D*.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
x.fillStyle=a.g?'rgba(179,132,39,.55)':'rgba(19,48,107,.35)';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}
if(!reduce)requestAnimationFrame(draw)})()})();

function confetti(cx,cy){const cols=['#13306b','#1f4fa6','#d8b260','#b38427','#8a1c2b','#11795a'];for(let i=0;i<26;i++){const d=document.createElement('i');d.className='cf';const a=Math.random()*Math.PI*2,v=60+Math.random()*120;
d.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%6]};--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v-40}px;--r:${Math.random()*720-360}deg;${Math.random()>.5?'border-radius:50%;':''}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}}
function floater(cx,cy,txt,col){const d=document.createElement('div');d.className='floater';d.textContent=txt;d.style.cssText=`left:${cx}px;top:${cy-20}px;color:${col}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1150)}
function ripple(btn,e){const r=btn.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${(e&&e.clientX?e.clientX:r.left+r.width/2)-r.left-s/2}px;top:${(e&&e.clientY?e.clientY:r.top+r.height/2)-r.top-s/2}px`;btn.appendChild(d);setTimeout(()=>d.remove(),650)}

 return `<article class="card qcard ${o.cls||''}" data-qid="${x.id}" style="${o.style||''}">

function reveal(card,x,j,fresh,e){const btns=card.querySelectorAll('.opt');
 btns.forEach((b,k)=>{b.disabled=true;b.style.animation='none';b.style.opacity=1;
  if(k===x.a){b.classList.add('correct');b.querySelector('.mk').textContent='✓';if(fresh&&k===j)b.style.animation=''}
  else if(k===j){b.classList.add('wrong');b.querySelector('.mk').textContent='✗';if(fresh)b.style.animation=''}else b.classList.add('dim')});
 const ok=j===x.a,cb=btns[ok?x.a:j];if(fresh&&ok)cb.classList.add('picked');
 card.querySelector('.fb').innerHTML=`<div class="verdict ${ok?'ok':'bad'}"><div class="vi">${ok?'✓':'✗'}</div><div><b>${ok?pick(t('v_ok')):t('v_bad')}</b><small>${ok?t('v_ok_sub',L[x.a]):t('v_bad_sub',L[j],L[x.a],esc(x.o[x.a]))}</small></div></div>${x.e?`<div class="explain"><b>${t('explain')}</b>${esc(x.e)}</div>`:''}`;
 if(fresh){const r=cb.getBoundingClientRect(),cx=e&&e.clientX?e.clientX:r.left+r.width/2,cy=e&&e.clientY?e.clientY:r.top+r.height/2;
  if(ok){confetti(cx,cy);floater(cx,cy,'+1 ✓','#11795a')}else floater(cx,cy,'✗','#b83228')}
 return ok}

 $('pSub').textContent=n?t('q_of',P.i+1,fmt(n),P.sub):'';$('pBar').style.width=n?((P.i+1)/n*100)+'%':'0';$('pJump').max=n;

 $('mCard').after(box);box.scrollIntoView({behavior:'smooth',block:'center'});$('cYes').onclick=mSubmit;$('cNo').onclick=()=>box.remove()}
function mSubmit(){if(!M.active)return;M.active=false;M.done=true;clearInterval(M.tick);let ok=0,bad=0;const per={};

const TH_DATA={"1-0":[["અધ્યાપન એટલે શું? (Concept of Teaching)","<p>અધ્યાપન એ શિક્ષક, અધ્યેતા અને વિષયવસ્તુ વચ્ચેની <b>હેતુલક્ષી, આયોજિત અને આંતરક્રિયાત્મક પ્રક્રિયા</b> છે, જેનો ઉદ્દેશ અધ્યેતાના વર્તનમાં ઇચ્છનીય પરિવર્તન લાવવાનો છે.</p><ul><li>અધ્યાપન = કલા (Art) + વિજ્ઞાન (Science)</li><li>તે ત્રિધ્રુવી પ્રક્રિયા છે: શિક્ષક – અધ્યેતા – અભ્યાસક્રમ (Triangular process)</li><li>અધ્યાપનનું અંતિમ માપ = <b>અધ્યયન (Learning) થયું કે નહીં</b></li><li>આધુનિક દૃષ્ટિ: શિક્ષક \"માહિતી આપનાર\" નહીં, પણ <b>સગવડકર્તા (Facilitator)</b></li></ul><div class=\"nt\">યાદ રાખો: Teaching is successful only when learning takes place.</div>"],["અધ્યાપનની જાણીતી વ્યાખ્યાઓ","<ul><li><b>H.C. Morrison</b>: અધ્યાપન એ પરિપક્વ વ્યક્તિત્વ અને ઓછા પરિપક્વ વ્યક્તિત્વ વચ્ચેનો ગાઢ સંપર્ક છે.</li><li><b>N.L. Gage</b>: અધ્યાપન એ બીજાના વર્તનની શક્યતાઓ બદલવા માટેનો આંતરવ્યક્તિક પ્રભાવ છે.</li><li><b>B.O. Smith</b>: અધ્યાપન એ અધ્યયન લાવવા માટેની ક્રિયાઓની પ્રણાલી છે.</li><li><b>Edmund Amidon</b>: અધ્યાપન એ વર્ગખંડમાં થતી આંતરક્રિયાત્મક પ્રક્રિયા છે (Interaction Analysis).</li><li><b>John Brubacher</b>: અધ્યાપન એટલે એવી પરિસ્થિતિ ગોઠવવી જેમાં અધ્યેતા જાતે શીખી શકે.</li></ul><div class=\"tk\"><i>★</i><span>Morrison = \"Personality contact\", Gage = \"Influence\", Smith = \"System of actions\"</span></div>"],["અધ્યાપનના હેતુઓ (Objectives) – Bloom Taxonomy","<p>Benjamin Bloom (1956) એ શૈક્ષણિક હેતુઓને ત્રણ ક્ષેત્રોમાં વહેંચ્યા:</p><div class=\"tw\"><table><thead><tr><th>ક્ષેત્ર (Domain)</th><th>સંબંધ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>જ્ઞાનાત્મક (Cognitive)</td><td>વિચાર, બુદ્ધિ</td><td>સમજાવો, વિશ્લેષણ કરો</td></tr><tr><td>ભાવાત્મક (Affective)</td><td>લાગણી, વલણ, મૂલ્ય</td><td>રસ, કદર, સહકાર</td></tr><tr><td>મનોક્રિયાત્મક (Psychomotor)</td><td>શારીરિક કૌશલ્ય</td><td>પ્રયોગ, ચિત્ર, ટાઈપિંગ</td></tr></tbody></table></div><ul><li>Cognitive domain – Bloom (1956)</li><li>Affective domain – Krathwohl, Bloom &amp; Masia (1964)</li><li>Psychomotor domain – Simpson (1972), Harrow (1972), Dave (1970)</li></ul>"],["સુધારેલી Bloom Taxonomy (2001)","<p><b>Anderson અને Krathwohl (2001)</b> એ Cognitive domain સુધારી; નામ (Noun) ને બદલે ક્રિયાપદ (Verb) વાપર્યા.</p><div class=\"tw\"><table><thead><tr><th>ક્રમ</th><th>મૂળ (1956)</th><th>સુધારેલી (2001)</th></tr></thead><tbody><tr><td>1</td><td>Knowledge</td><td>Remembering</td></tr><tr><td>2</td><td>Comprehension</td><td>Understanding</td></tr><tr><td>3</td><td>Application</td><td>Applying</td></tr><tr><td>4</td><td>Analysis</td><td>Analysing</td></tr><tr><td>5</td><td>Synthesis</td><td>Evaluating</td></tr><tr><td>6</td><td>Evaluation</td><td><b>Creating (સૌથી ઊંચું)</b></td></tr></tbody></table></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: 2001 માં Synthesis નું નામ \"Creating\" થયું અને તે Evaluating ની ઉપર ગયું.</span></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>R U A A E C</b>\" – \"Rāmu Unche Aakash ma Aaje Chadhyo\"</span></div>"],["અધ્યાપનના સ્તરો (Levels of Teaching)","<div class=\"tw\"><table><thead><tr><th>સ્તર</th><th>પ્રવર્તક</th><th>મુખ્ય ભાર</th></tr></thead><tbody><tr><td>સ્મૃતિ સ્તર (Memory)</td><td>Herbart</td><td>હકીકતો યાદ રાખવી, ગોખણપટ્ટી</td></tr><tr><td>સમજ સ્તર (Understanding)</td><td>Morrison</td><td>અર્થ, સંબંધ, સામાન્યીકરણ</td></tr><tr><td>ચિંતન સ્તર (Reflective)</td><td>Hunt (Bigge)</td><td>સમસ્યા ઉકેલ, વિવેચનાત્મક વિચાર</td></tr></tbody></table></div><ul><li>ક્રમ: Memory → Understanding → Reflective (સાદાથી જટિલ)</li><li>સ્મૃતિ સ્તર = <b>વિચારહીન (Thoughtless)</b>, ચિંતન સ્તર = <b>સૌથી વિચારશીલ</b></li><li>ચિંતન સ્તર = અધ્યેતા કેન્દ્રિત; સ્મૃતિ સ્તર = શિક્ષક કેન્દ્રિત</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>HMH</b>\" → Herbart-Memory, Morrison-Understanding, Hunt-Reflective</span></div>"],["Herbart ના પાંચ સોપાન અને Morrison ના સોપાન","<p><b>Herbart (સ્મૃતિ સ્તર)</b> ના પાંચ સોપાન:</p><ul><li>તૈયારી (Preparation) → રજૂઆત (Presentation) → તુલના/સંબંધ (Association) → સામાન્યીકરણ (Generalisation) → ઉપયોજન (Application)</li></ul><p><b>Morrison (સમજ સ્તર)</b> – Mastery learning પર ભાર:</p><ul><li>સંશોધન (Exploration) → રજૂઆત (Presentation) → આત્મસાતીકરણ (Assimilation) → વ્યવસ્થાપન (Organisation) → પાઠ પઠન (Recitation)</li></ul><p><b>Hunt (ચિંતન સ્તર)</b>: સમસ્યા ઊભી થવી → ઉત્કલ્પના → ચકાસણી → નિષ્કર્ષ</p><div class=\"tk\"><i>★</i><span>Herbart = \"<b>P P A G A</b>\", Morrison = \"<b>E P A O R</b>\"</span></div>"],["અધ્યાપનના તબક્કા (Phases) – P.W. Jackson","<div class=\"tw\"><table><thead><tr><th>તબક્કો</th><th>ક્યારે</th><th>પ્રવૃત્તિ</th></tr></thead><tbody><tr><td>પૂર્વ-સક્રિય (Pre-active)</td><td>વર્ગ પહેલાં</td><td>આયોજન, હેતુ નક્કી કરવા, સામગ્રી પસંદગી</td></tr><tr><td>આંતર-સક્રિય (Interactive)</td><td>વર્ગ દરમિયાન</td><td>રજૂઆત, પ્રશ્નો, પ્રતિપોષણ</td></tr><tr><td>ઉત્તર-સક્રિય (Post-active)</td><td>વર્ગ પછી</td><td>મૂલ્યાંકન, પ્રતિબિંબ, સુધારણા</td></tr></tbody></table></div><ul><li>આ વર્ગીકરણ <b>Philip W. Jackson (1968)</b> નું છે.</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"પાઠ આયોજન\" હંમેશા Pre-active; \"test લેવી\" Post-active.</span></div>"],["અધ્યાપનની લાક્ષણિકતાઓ અને મૂળભૂત જરૂરિયાતો","<p><b>લાક્ષણિકતાઓ</b>:</p><ul><li>હેતુલક્ષી, આયોજિત, નિદાનાત્મક અને ઉપચારાત્મક (Diagnostic &amp; Remedial)</li><li>આંતરક્રિયાત્મક અને સંવાદાત્મક; લોકશાહી</li><li>માપી શકાય તેવી (Measurable) અને સુધારી શકાય તેવી</li><li>અધ્યેતાની જરૂરિયાત અનુસાર લવચીક</li></ul><p><b>મૂળભૂત જરૂરિયાતો</b>:</p><ul><li>સ્પષ્ટ હેતુઓ, અધ્યેતાની તૈયારી (Readiness), પ્રેરણા</li><li>યોગ્ય પદ્ધતિ, સહાયક સામગ્રી, અનુકૂળ વાતાવરણ, પ્રતિપોષણ (Feedback)</li></ul>"],["મહત્વની પરિભાષા (Key Terms)","<ul><li><b>Scaffolding</b> (Bruner/Vygotsky): કામચલાઉ ટેકો જે ધીમે ધીમે દૂર કરાય</li><li><b>ZPD</b> (Vygotsky): જાતે કરી શકે અને મદદથી કરી શકે તે વચ્ચેનો ગાળો</li><li><b>Diagnostic teaching</b>: અધ્યયન મુશ્કેલીઓ ઓળખવી</li><li><b>Remedial teaching</b>: ઓળખાયેલી મુશ્કેલી દૂર કરવી</li><li><b>Micro teaching</b>: Dwight Allen (1961, Stanford), 5-10 મિનિટ, 5-10 વિદ્યાર્થી, એક કૌશલ્ય</li><li><b>Teaching objective</b>: અપેક્ષિત અધ્યયન પરિણામ (Intended learning outcome)</li><li><b>Feedback</b>: કામગીરી અંગેની માહિતી જે સુધારામાં મદદ કરે</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Memory level</b></td><td>Recall of learned information</td></tr><tr><td><b>Understanding level</b></td><td>Explaining meaning and relationships</td></tr><tr><td><b>Reflective level</b></td><td>Critical problem solving</td></tr><tr><td><b>Teaching objective</b></td><td>Intended learning outcome</td></tr><tr><td><b>Diagnostic teaching</b></td><td>Identifying learning difficulties</td></tr><tr><td><b>Scaffolding</b></td><td>Temporary support gradually removed</td></tr><tr><td><b>Constructivism</b></td><td>Learners actively construct meaning</td></tr><tr><td><b>Bloom remembering</b></td><td>Retrieving prior knowledge</td></tr><tr><td><b>Bloom applying</b></td><td>Using knowledge in a situation</td></tr><tr><td><b>Bloom creating</b></td><td>Producing a new coherent product</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>પ્રશ્નમાં \"<b>સમસ્યા ઉકેલ / વિવેચન / નિર્ણય</b>\" → ચિંતન સ્તર</li><li>\"<b>અર્થ, સંબંધ, પોતાના શબ્દોમાં</b>\" → સમજ સ્તર</li><li>\"<b>યાદ, ગોખવું, પુનરાવર્તન</b>\" → સ્મૃતિ સ્તર</li><li>\"<b>નવી પરિસ્થિતિમાં નિયમ વાપર્યો</b>\" → Applying</li><li>\"<b>નવી રચના / design / યોજના બનાવી</b>\" → Creating</li><li>Micro teaching ચક્ર: Plan → Teach → Feedback → Re-plan → Re-teach → Re-feedback (36 મિનિટ, ભારતીય મોડેલ)</li></ul><div class=\"tk\"><i>★</i><span>સૂત્ર: સારું અધ્યાપન = સ્પષ્ટ હેતુ + સક્રિય અધ્યેતા + તાત્કાલિક પ્રતિપોષણ</span></div>"]],"1-1":[["અધ્યેતા (Learner) – પરિચય","<p>અધ્યેતા અધ્યાપન પ્રક્રિયાનું <b>કેન્દ્ર</b> છે. તેની ઉંમર, પૂર્વજ્ઞાન, રસ, ક્ષમતા અને સામાજિક-સાંવેગિક સ્થિતિ અધ્યયનને સીધું અસર કરે છે.</p><ul><li>ઉચ્ચ શિક્ષણમાં મુખ્યત્વે બે પ્રકારના અધ્યેતા: <b>તરુણ (Adolescent)</b> અને <b>પુખ્ત (Adult)</b></li><li>દરેક અધ્યેતા અનન્ય છે → <b>વ્યક્તિગત તફાવત (Individual differences)</b></li><li>અધ્યેતાની લાક્ષણિકતા જાણ્યા વગર અસરકારક અધ્યાપન શક્ય નથી</li></ul><div class=\"nt\">શિક્ષકે \"શું ભણાવવું\" સાથે \"કોને ભણાવવું\" પણ જાણવું જોઈએ.</div>"],["તરુણ અધ્યેતા (Adolescent Learner)","<ul><li>ઉંમર: આશરે <b>12 થી 18/19 વર્ષ</b>; Stanley Hall એ તરુણાવસ્થાને \"<b>તોફાન અને તણાવ (Storm and Stress)</b>\" નો સમય કહ્યો</li><li>ઝડપી શારીરિક, માનસિક, સાંવેગિક ફેરફારો</li><li>ઓળખ શોધ: Erik Erikson – \"<b>Identity vs Role Confusion</b>\"</li><li>Piaget: <b>ઔપચારિક ક્રિયાત્મક અવસ્થા (Formal Operational, 11+ વર્ષ)</b> – અમૂર્ત વિચાર શક્ય</li><li>સમવયસ્ક જૂથ (Peer group) નો પ્રભાવ ખૂબ વધુ</li><li>સ્વતંત્રતાની ઇચ્છા, આદર્શવાદ, કલ્પનાશીલતા</li></ul>"],["પુખ્ત અધ્યેતા (Adult Learner) – Andragogy","<p><b>Malcolm Knowles</b> એ પુખ્ત શિક્ષણ માટે \"<b>Andragogy</b>\" શબ્દ લોકપ્રિય બનાવ્યો (બાળ શિક્ષણ = Pedagogy).</p><p>Knowles ની પુખ્ત અધ્યેતાની ધારણાઓ:</p><ul><li><b>સ્વ-સંકલ્પના</b>: સ્વ-નિર્દેશિત (Self-directed)</li><li><b>અનુભવ</b>: અનુભવ એ અધ્યયનનો સમૃદ્ધ સ્રોત</li><li><b>તૈયારી</b>: સામાજિક ભૂમિકા સંબંધિત જરૂરિયાત મુજબ શીખે</li><li><b>અભિમુખતા</b>: સમસ્યા કેન્દ્રિત (Problem-centred), તાત્કાલિક ઉપયોગ</li><li><b>પ્રેરણા</b>: આંતરિક પ્રેરણા (Internal motivation)</li><li><b>જાણવાની જરૂર</b>: \"શા માટે શીખવું\" તે જાણવું જરૂરી</li></ul><div class=\"tk\"><i>★</i><span>Pedagogy = બાળક (Paidos), Andragogy = પુખ્ત (Andros), Heutagogy = સ્વ-નિર્ધારિત (Self-determined)</span></div>"],["તરુણ vs પુખ્ત અધ્યેતા – તુલના","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>તરુણ</th><th>પુખ્ત</th></tr></thead><tbody><tr><td>નિર્ભરતા</td><td>શિક્ષક પર વધુ</td><td>સ્વ-નિર્દેશિત</td></tr><tr><td>અનુભવ</td><td>ઓછો</td><td>સમૃદ્ધ</td></tr><tr><td>પ્રેરણા</td><td>બાહ્ય (ગુણ, ઇનામ)</td><td>આંતરિક</td></tr><tr><td>અભિમુખતા</td><td>વિષય કેન્દ્રિત</td><td>સમસ્યા કેન્દ્રિત</td></tr><tr><td>શિક્ષણ શાસ્ત્ર</td><td>Pedagogy</td><td>Andragogy</td></tr><tr><td>ભૂમિકા</td><td>ઓળખ શોધ</td><td>જવાબદારીઓ (કુટુંબ, કારકિર્દી)</td></tr></tbody></table></div>"],["શૈક્ષણિક પરિબળો (Academic Factors)","<ul><li><b>પૂર્વજ્ઞાન (Prior knowledge)</b>: નવું જ્ઞાન જૂના જ્ઞાન પર બંધાય (Ausubel – Meaningful learning)</li><li><b>બુદ્ધિ અને અભિયોગ્યતા (Intelligence &amp; Aptitude)</b></li><li><b>અધ્યયન શૈલી (Learning style)</b>: VARK – Visual, Auditory, Read/Write, Kinesthetic (Neil Fleming)</li><li><b>અભ્યાસ ટેવો, સમય વ્યવસ્થાપન</b></li><li><b>ભાષા પ્રાવીણ્ય</b> અને શૈક્ષણિક પૃષ્ઠભૂમિ</li><li><b>Gardner</b> – બહુવિધ બુદ્ધિ (Multiple Intelligences, 1983): 8 પ્રકાર</li></ul><div class=\"tk\"><i>★</i><span>VARK = \"<b>V</b>ision <b>A</b>udio <b>R</b>eading <b>K</b>ina (કામ)\"</span></div>"],["સામાજિક પરિબળો (Social Factors)","<ul><li>કુટુંબ: આર્થિક સ્થિતિ, માતાપિતાનું શિક્ષણ, અપેક્ષાઓ</li><li>સમવયસ્ક જૂથ (Peer group) અને મિત્રવર્તુળ</li><li>સામાજિક-આર્થિક દરજ્જો (SES), જાતિ, લિંગ, પ્રાદેશિકતા</li><li>ભાષા અને સંસ્કૃતિ; ગ્રામ્ય-શહેરી પૃષ્ઠભૂમિ</li><li><b>Bandura</b> – સામાજિક અધ્યયન સિદ્ધાંત: અવલોકન અને અનુકરણ (Modelling)</li><li><b>Vygotsky</b> – સામાજિક-સાંસ્કૃતિક સિદ્ધાંત: અધ્યયન સામાજિક આંતરક્રિયાથી થાય</li></ul>"],["સાંવેગિક પરિબળો (Emotional Factors)","<ul><li>ચિંતા (Anxiety), ભય, તણાવ → અધ્યયનમાં અવરોધ</li><li>આત્મવિશ્વાસ, સ્વ-સંકલ્પના (Self-concept), સ્વ-આદર</li><li><b>સાંવેગિક બુદ્ધિ (EQ)</b>: Daniel Goleman (1995) – 5 ઘટકો: સ્વ-જાગૃતિ, સ્વ-નિયમન, પ્રેરણા, સહાનુભૂતિ, સામાજિક કૌશલ્ય</li><li><b>Maslow</b> – જરૂરિયાતોનો વંશવેલો: શારીરિક → સલામતી → પ્રેમ/સંબંધ → આદર → <b>સ્વ-સાક્ષાત્કાર (Self-actualisation)</b></li><li>સુરક્ષિત, ભયમુક્ત વર્ગખંડ = વધુ સારું અધ્યયન</li></ul><div class=\"tk\"><i>★</i><span>Maslow ટ્રિક: \"<b>શા સ પ્રે આ સ્વ</b>\" – શારીરિક, સલામતી, પ્રેમ, આદર, સ્વ-સાક્ષાત્કાર</span></div>"],["જ્ઞાનાત્મક પરિબળો (Cognitive Factors)","<ul><li>ધ્યાન (Attention), ગ્રહણશક્તિ (Perception), સ્મૃતિ (Memory), વિચાર (Thinking)</li><li><b>Piaget ની 4 અવસ્થાઓ</b>: Sensorimotor (0-2) → Pre-operational (2-7) → Concrete operational (7-11) → Formal operational (11+)</li><li><b>Metacognition</b> (John Flavell): \"વિચાર વિશે વિચાર\" – પોતાના અધ્યયન પર દેખરેખ</li><li><b>Cognitive load theory</b> (John Sweller): કાર્યકારી સ્મૃતિ મર્યાદિત</li><li><b>Information processing</b>: Input → Processing → Storage → Output</li></ul><div class=\"tk\"><i>★</i><span>Piaget ટ્રિક: \"<b>S P C F</b>\" – \"Sona Pe Chandi Fit\"</span></div>"],["વ્યક્તિગત તફાવત અને સમાવેશી અભિગમ","<ul><li>અધ્યેતાઓ ગતિ, શૈલી, ક્ષમતા, રસમાં ભિન્ન હોય છે</li><li><b>Differentiated instruction</b>: જુદા જુદા અધ્યેતા માટે જુદી પ્રવૃત્તિઓ</li><li><b>Universal Design for Learning (UDL)</b>: રજૂઆત, અભિવ્યક્તિ અને સહભાગિતાની અનેક રીતો</li><li><b>સમાવેશી શિક્ષણ (Inclusive education)</b>: દિવ્યાંગ અને વંચિત અધ્યેતાઓનો સમાવેશ</li><li>પ્રતિભાશાળી (Gifted) અને ધીમું શીખનાર (Slow learner) બંને માટે આયોજન</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Adult learning</b></td><td>Learning drawing on prior experience</td></tr><tr><td><b>Self-directed learning</b></td><td>Learner manages learning goals</td></tr><tr><td><b>Cognitive characteristics</b></td><td>Thinking and information processing</td></tr><tr><td><b>Emotional characteristics</b></td><td>Feelings and emotional regulation</td></tr><tr><td><b>Social characteristics</b></td><td>Interaction with other people</td></tr><tr><td><b>Prior knowledge</b></td><td>Knowledge held before instruction</td></tr><tr><td><b>Learning readiness</b></td><td>Preparedness for new learning</td></tr><tr><td><b>Individual differences</b></td><td>Variation among learners</td></tr><tr><td><b>Metacognition</b></td><td>Awareness and regulation of thinking</td></tr><tr><td><b>Intrinsic motivation</b></td><td>Interest arising within the learner</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>\"અનુભવ આધારિત, સ્વ-નિર્દેશિત, સમસ્યા કેન્દ્રિત\" → <b>પુખ્ત અધ્યેતા / Andragogy</b></li><li>\"ઓળખ સંકટ, સમવયસ્ક પ્રભાવ, Storm &amp; Stress\" → <b>તરુણ અધ્યેતા</b></li><li>\"લાગણી, ચિંતા, આત્મવિશ્વાસ\" → <b>સાંવેગિક પરિબળ</b></li><li>\"ધ્યાન, સ્મૃતિ, વિચાર\" → <b>જ્ઞાનાત્મક પરિબળ</b></li><li>\"કુટુંબ, મિત્રો, સમાજ\" → <b>સામાજિક પરિબળ</b></li><li>\"પૂર્વજ્ઞાન, અભ્યાસ ટેવ\" → <b>શૈક્ષણિક પરિબળ</b></li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Andragogy શબ્દ Alexander Kapp (1833) એ પ્રથમ વાપર્યો, પણ લોકપ્રિય Knowles એ બનાવ્યો.</span></div>"]],"1-2":[["અધ્યાપનને અસર કરતા પરિબળો – પરિચય","<p>અધ્યાપનની અસરકારકતા અનેક પરિબળો પર આધાર રાખે છે. UGC NET/GSET અભ્યાસક્રમમાં મુખ્ય પાંચ પરિબળો છે:</p><ul><li><b>શિક્ષક (Teacher)</b></li><li><b>અધ્યેતા (Learner)</b></li><li><b>સહાયક સામગ્રી (Support material)</b></li><li><b>શૈક્ષણિક સગવડો (Instructional facilities)</b></li><li><b>અધ્યયન પર્યાવરણ (Learning environment)</b> અને <b>સંસ્થા (Institution)</b></li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>શિ અ સ સ પ</b>\" – શિક્ષક, અધ્યેતા, સામગ્રી, સગવડ, પર્યાવરણ</span></div>"],["શિક્ષક સંબંધિત પરિબળો","<ul><li><b>વિષય પ્રભુત્વ (Subject mastery)</b> અને સતત અધ્યયન</li><li><b>પ્રત્યાયન કૌશલ્ય</b>: સ્પષ્ટતા, અવાજ, ભાષા, ઉદાહરણો</li><li><b>વ્યક્તિત્વ</b>: ઉત્સાહ, ધીરજ, ન્યાયીપણું, રમૂજ</li><li><b>વલણ</b>: અધ્યેતા પ્રત્યે સકારાત્મક અપેક્ષા (Pygmalion / Rosenthal effect)</li><li><b>શિક્ષણ શાસ્ત્રીય જ્ઞાન</b> (Pedagogical knowledge) અને ટેકનોલોજી કૌશલ્ય</li><li><b>TPACK</b> (Mishra &amp; Koehler, 2006): Technology + Pedagogy + Content Knowledge</li><li>વર્ગ વ્યવસ્થાપન અને નેતૃત્વ</li></ul>"],["અધ્યેતા સંબંધિત પરિબળો","<ul><li><b>પ્રેરણા (Motivation)</b>: આંતરિક (Intrinsic) અને બાહ્ય (Extrinsic)</li><li><b>તૈયારી (Readiness)</b> – Thorndike નો Law of Readiness</li><li>પૂર્વજ્ઞાન, બુદ્ધિ, અભિયોગ્યતા, રસ</li><li>શારીરિક અને માનસિક સ્વાસ્થ્ય</li><li>સામાજિક-આર્થિક પૃષ્ઠભૂમિ</li><li><b>Thorndike ના નિયમો</b>: તત્પરતા (Readiness), અભ્યાસ (Exercise), અસર (Effect)</li></ul><div class=\"tk\"><i>★</i><span>Thorndike = \"<b>R E E</b>\" – Ready, Exercise, Effect</span></div>"],["સહાયક સામગ્રી (Support Material)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>દૃશ્ય (Visual)</td><td>ચાર્ટ, નકશા, ચિત્ર, મોડેલ, બ્લેકબોર્ડ</td></tr><tr><td>શ્રાવ્ય (Audio)</td><td>રેડિયો, પોડકાસ્ટ, ઓડિયો રેકોર્ડિંગ</td></tr><tr><td>દૃશ્ય-શ્રાવ્ય (AV)</td><td>વીડિયો, ફિલ્મ, ટીવી, સ્માર્ટ બોર્ડ</td></tr><tr><td>ડિજિટલ</td><td>PPT, e-content, MOOCs, સિમ્યુલેશન</td></tr><tr><td>છાપેલી</td><td>પાઠ્યપુસ્તક, હેન્ડઆઉટ, મોડ્યુલ</td></tr></tbody></table></div><ul><li><b>Edgar Dale – અનુભવ શંકુ (Cone of Experience, 1946)</b>: નીચે પ્રત્યક્ષ અનુભવ (સૌથી મૂર્ત), ટોચ પર શાબ્દિક પ્રતીકો (સૌથી અમૂર્ત)</li></ul>"],["Edgar Dale નો અનુભવ શંકુ","<p>ક્રમ (નીચેથી ઉપર – મૂર્તથી અમૂર્ત):</p><ul><li>1. પ્રત્યક્ષ હેતુલક્ષી અનુભવ (Direct purposeful experience)</li><li>2. કૃત્રિમ અનુભવ (Contrived – મોડેલ)</li><li>3. નાટ્યકરણ (Dramatised)</li><li>4. નિદર્શન (Demonstration)</li><li>5. ક્ષેત્ર પ્રવાસ (Field trip)</li><li>6. પ્રદર્શન (Exhibits)</li><li>7. ટીવી / ગતિશીલ ચિત્રો (Motion pictures)</li><li>8. રેકોર્ડિંગ, રેડિયો, સ્થિર ચિત્ર</li><li>9. દૃશ્ય પ્રતીકો (Visual symbols)</li><li>10. શાબ્દિક પ્રતીકો (Verbal symbols) – સૌથી અમૂર્ત</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: શંકુની ટોચ = શાબ્દિક પ્રતીકો (Verbal), તળિયે = પ્રત્યક્ષ અનુભવ.</span></div>"],["શૈક્ષણિક સગવડો (Instructional Facilities)","<ul><li>વર્ગખંડ: બેઠક વ્યવસ્થા, પ્રકાશ, હવા-ઉજાસ, ધ્વનિ વ્યવસ્થા</li><li>પ્રયોગશાળા, પુસ્તકાલય, કમ્પ્યુટર લેબ, ભાષા લેબ</li><li>ICT માળખું: પ્રોજેક્ટર, સ્માર્ટ ક્લાસ, Wi-Fi, LMS</li><li>ખેલકૂદ, છાત્રાલય, આરોગ્ય સેવા</li><li>દિવ્યાંગ મૈત્રીપૂર્ણ સગવડો (Ramps, screen readers)</li><li>વિદ્યાર્થી-શિક્ષક ગુણોત્તર (Pupil-Teacher Ratio – PTR)</li></ul>"],["અધ્યયન પર્યાવરણ (Learning Environment)","<ul><li><b>ભૌતિક પર્યાવરણ</b>: સ્વચ્છતા, જગ્યા, ઘોંઘાટ મુક્ત</li><li><b>મનોવૈજ્ઞાનિક પર્યાવરણ</b>: ભયમુક્ત, સલામત, આદરપૂર્ણ</li><li><b>સામાજિક પર્યાવરણ</b>: સહકાર, જૂથ કાર્ય, લોકશાહી વાતાવરણ</li><li><b>શૈક્ષણિક પર્યાવરણ</b>: ઊંચી અપેક્ષા, પડકારજનક કાર્ય</li><li><b>Flanders Interaction Analysis (FIACS)</b>: વર્ગખંડ આંતરક્રિયાના <b>10 વર્ગો</b> (7 શિક્ષક વાણી, 2 વિદ્યાર્થી વાણી, 1 મૌન/ગૂંચવણ)</li></ul><div class=\"tk\"><i>★</i><span>FIACS: \"<b>7-2-1</b>\" = શિક્ષક 7, વિદ્યાર્થી 2, મૌન 1</span></div>"],["સંસ્થાકીય પરિબળો","<ul><li>સંસ્થાનું નેતૃત્વ અને વહીવટ</li><li>અભ્યાસક્રમ અને સમયપત્રક</li><li>મૂલ્યાંકન પદ્ધતિ (CBCS, CCE)</li><li>શિક્ષક વિકાસ કાર્યક્રમ (FDP, Orientation, Refresher)</li><li>સંસ્થાકીય સંસ્કૃતિ, મૂલ્યો અને નીતિઓ</li><li>NAAC માન્યતા અને ગુણવત્તા ખાતરી (IQAC)</li></ul>"],["વર્ગખંડ પ્રબંધન અને શિક્ષક વર્તન","<ul><li><b>Kounin</b>: \"Withitness\" – શિક્ષક વર્ગમાં બધું જ જાણે છે એવી જાગૃતિ</li><li><b>Ripple effect</b>: એક વિદ્યાર્થીને આપેલી સૂચનાની બીજા પર અસર</li><li><b>Pygmalion effect</b>: ઊંચી અપેક્ષા → ઊંચી સિદ્ધિ</li><li><b>Hawthorne effect</b>: અવલોકન થાય છે તે જાણવાથી વર્તન બદલાય</li><li><b>Halo effect</b>: એક ગુણના આધારે સમગ્ર વ્યક્તિનું મૂલ્યાંકન</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Pygmalion = અપેક્ષા, Hawthorne = અવલોકન, Halo = પૂર્વગ્રહ</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Teacher competence</b></td><td>Subject knowledge and pedagogical skill</td></tr><tr><td><b>Learner readiness</b></td><td>Preparation to undertake learning</td></tr><tr><td><b>Teaching aids</b></td><td>Materials supporting instruction</td></tr><tr><td><b>Learning environment</b></td><td>Conditions surrounding learning</td></tr><tr><td><b>Institutional support</b></td><td>Organisational resources for teaching</td></tr><tr><td><b>Feedback</b></td><td>Information about learning performance</td></tr><tr><td><b>Classroom climate</b></td><td>Social and emotional classroom atmosphere</td></tr><tr><td><b>Time on task</b></td><td>Time engaged in a learning activity</td></tr><tr><td><b>Inclusive practice</b></td><td>Removing barriers to participation</td></tr><tr><td><b>Clear objectives</b></td><td>Explicit intended learning results</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>\"<b>પ્રોજેક્ટર, લેબ, પુસ્તકાલય</b>\" → શૈક્ષણિક સગવડ</li><li>\"<b>ચાર્ટ, વીડિયો, PPT</b>\" → સહાયક સામગ્રી</li><li>\"<b>ભયમુક્ત વાતાવરણ, સહકાર</b>\" → અધ્યયન પર્યાવરણ</li><li>\"<b>વિષય પ્રભુત્વ, પ્રત્યાયન</b>\" → શિક્ષક પરિબળ</li><li>\"<b>પ્રેરણા, તૈયારી, પૂર્વજ્ઞાન</b>\" → અધ્યેતા પરિબળ</li><li>Dale Cone: મૂર્ત → અમૂર્ત; FIACS = 10 વર્ગ</li></ul><div class=\"tk\"><i>★</i><span>સૂત્ર: અસરકારક અધ્યાપન = સક્ષમ શિક્ષક × તૈયાર અધ્યેતા × યોગ્ય પર્યાવરણ</span></div>"]],"1-3":[["અધ્યાપન પદ્ધતિઓ – પરિચય","<p>ઉચ્ચ શિક્ષણમાં અધ્યાપન પદ્ધતિઓને મુખ્યત્વે બે જૂથમાં વહેંચાય છે:</p><ul><li><b>શિક્ષક કેન્દ્રિત (Teacher-centred)</b>: શિક્ષક મુખ્ય, અધ્યેતા નિષ્ક્રિય શ્રોતા</li><li><b>અધ્યેતા કેન્દ્રિત (Learner-centred)</b>: અધ્યેતા સક્રિય, શિક્ષક સગવડકર્તા</li><li>વિતરણ માધ્યમ મુજબ: <b>Offline (પ્રત્યક્ષ)</b>, <b>Online</b>, <b>Blended (મિશ્ર)</b></li></ul><div class=\"nt\">NEP 2020 અધ્યેતા કેન્દ્રિત, અનુભવાત્મક અને ટેકનોલોજી સંકલિત શિક્ષણ પર ભાર મૂકે છે.</div>"],["શિક્ષક કેન્દ્રિત પદ્ધતિઓ","<div class=\"tw\"><table><thead><tr><th>પદ્ધતિ</th><th>લક્ષણ</th></tr></thead><tbody><tr><td>વ્યાખ્યાન (Lecture)</td><td>મોટા વર્ગ માટે, ઝડપી, એક-માર્ગી પ્રત્યાયન</td></tr><tr><td>નિદર્શન (Demonstration)</td><td>શિક્ષક કરી બતાવે, વિદ્યાર્થી નિરીક્ષણ કરે</td></tr><tr><td>પ્રશ્નોત્તર (Question-answer)</td><td>Socratic method</td></tr><tr><td>પાઠ્યપુસ્તક પદ્ધતિ</td><td>પુસ્તક આધારિત</td></tr><tr><td>વાર્તા કથન (Storytelling)</td><td>ભાષા, ઇતિહાસ માટે</td></tr></tbody></table></div><ul><li>ફાયદા: સમય બચે, મોટા વર્ગ, વ્યવસ્થિત રજૂઆત</li><li>મર્યાદા: નિષ્ક્રિય અધ્યેતા, સ્મૃતિ સ્તર સુધી સીમિત</li></ul>"],["અધ્યેતા કેન્દ્રિત પદ્ધતિઓ","<ul><li><b>પ્રોજેક્ટ પદ્ધતિ</b>: W.H. Kilpatrick (1918), John Dewey ના વિચાર પર આધારિત</li><li><b>સમસ્યા ઉકેલ / PBL</b> (Problem-based learning)</li><li><b>શોધ/અન્વેષણ પદ્ધતિ</b> (Discovery – Jerome Bruner, Inquiry)</li><li><b>સહકારી અધ્યયન</b> (Cooperative learning): Jigsaw (Elliot Aronson), Think-Pair-Share (Frank Lyman)</li><li><b>Seminar, Workshop, Case study, Role play, Brainstorming</b> (Alex Osborn)</li><li><b>Flipped classroom</b>: ઘરે વીડિયો, વર્ગમાં પ્રવૃત્તિ (Bergmann &amp; Sams)</li><li><b>Heuristic method</b>: H.E. Armstrong (વિદ્યાર્થી શોધક બને)</li></ul><div class=\"tk\"><i>★</i><span>\"<b>Kilpatrick = Project</b>, <b>Armstrong = Heuristic</b>, <b>Osborn = Brainstorming</b>\"</span></div>"],["તુલના: શિક્ષક કેન્દ્રિત vs અધ્યેતા કેન્દ્રિત","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>શિક્ષક કેન્દ્રિત</th><th>અધ્યેતા કેન્દ્રિત</th></tr></thead><tbody><tr><td>શિક્ષકની ભૂમિકા</td><td>માહિતી આપનાર</td><td>સગવડકર્તા, માર્ગદર્શક</td></tr><tr><td>અધ્યેતા</td><td>નિષ્ક્રિય</td><td>સક્રિય સહભાગી</td></tr><tr><td>પ્રત્યાયન</td><td>એક-માર્ગી</td><td>બહુ-માર્ગી</td></tr><tr><td>ભાર</td><td>વિષયવસ્તુ</td><td>પ્રક્રિયા અને કૌશલ્ય</td></tr><tr><td>મૂલ્યાંકન</td><td>અંતિમ (Summative)</td><td>સતત (Formative)</td></tr><tr><td>ઉદાહરણ</td><td>વ્યાખ્યાન</td><td>પ્રોજેક્ટ, PBL, Seminar</td></tr></tbody></table></div>"],["Offline, Online અને Blended શિક્ષણ","<ul><li><b>Offline</b>: પ્રત્યક્ષ વર્ગખંડ (Face-to-face)</li><li><b>Online Synchronous</b>: એક જ સમયે જીવંત – Zoom, Google Meet, Webinar</li><li><b>Online Asynchronous</b>: પોતાની ગતિએ – રેકોર્ડેડ વીડિયો, ફોરમ, e-mail</li><li><b>Blended/Hybrid learning</b>: offline + online નું મિશ્રણ; UGC એ 40% સુધી online અભ્યાસની મંજૂરી આપી છે (SWAYAM ક્રેડિટ)</li><li><b>MOOC</b> = Massive Open Online Course (શબ્દ: Dave Cormier, 2008)</li></ul><div class=\"tk\"><i>★</i><span>Synchronous = \"<b>Same time</b>\", Asynchronous = \"<b>Any time</b>\"</span></div>"],["SWAYAM – મુખ્ય હકીકતો","<ul><li>પૂરું નામ: <b>Study Webs of Active-Learning for Young Aspiring Minds</b></li><li>શરૂઆત: <b>9 જુલાઈ 2017</b>, શિક્ષણ મંત્રાલય (તત્કાલીન MHRD), ભારત સરકાર</li><li>ધોરણ 9 થી અનુસ્નાતક સુધીના અભ્યાસક્રમો, <b>મફત</b> (પ્રમાણપત્ર માટે નાની ફી)</li><li>દરેક કોર્સના <b>4 ચતુર્થાંશ (Four quadrants)</b>: e-Tutorial (વીડિયો), e-Content (વાંચન), Self-assessment (ક્વિઝ), Discussion forum</li><li>પ્લેટફોર્મ: Microsoft ના સહયોગથી વિકસાવેલ; AICTE સંચાલિત</li><li>UGC Credit Framework (2016/2021): SWAYAM કોર્સની ક્રેડિટ ટ્રાન્સફર</li></ul>"],["SWAYAM ના National Coordinators","<div class=\"tw\"><table><thead><tr><th>સંસ્થા</th><th>ક્ષેત્ર</th></tr></thead><tbody><tr><td>NPTEL (IITs)</td><td>ઇજનેરી</td></tr><tr><td>UGC</td><td>અનુસ્નાતક સિવાયના બિન-તકનિકી</td></tr><tr><td>CEC</td><td>સ્નાતક (Undergraduate)</td></tr><tr><td>NCERT</td><td>શાળા (ધો. 9-12)</td></tr><tr><td>NIOS</td><td>શાળા (ઓપન સ્કૂલિંગ)</td></tr><tr><td>IGNOU</td><td>ઓપન લર્નિંગ, સ્નાતકોત્તર બહાર</td></tr><tr><td>IIMB</td><td>મેનેજમેન્ટ</td></tr><tr><td>NITTTR</td><td>શિક્ષક તાલીમ</td></tr><tr><td>AICTE</td><td>સ્વ-ગતિ (Self-paced) કોર્સ</td></tr></tbody></table></div><ul><li>SWAYAM Prabha: <b>DTH દ્વારા 24×7 શૈક્ષણિક ચેનલો</b> (શરૂઆતમાં 32, હવે વધુ)</li></ul>"],["અન્ય ડિજિટલ પહેલો (ટૂંકમાં)","<ul><li><b>NPTEL</b>: IITs અને IISc નો કાર્યક્રમ (2003)</li><li><b>e-PG Pathshala</b>: UGC-INFLIBNET, અનુસ્નાતક e-content</li><li><b>NDLI</b>: National Digital Library of India (IIT Kharagpur)</li><li><b>DIKSHA</b>: શિક્ષકો/શાળા માટે પ્લેટફોર્મ</li><li><b>Virtual Labs</b>: ઇજનેરી પ્રયોગો online</li><li><b>NEAT</b>: National Educational Alliance for Technology</li><li><b>Spoken Tutorial</b>: IIT Bombay</li></ul>"],["અધ્યાપન વ્યૂહરચનાઓ અને પ્રવિધિઓ","<ul><li><b>પદ્ધતિ (Method)</b>: સમગ્ર પાઠની રીત (Lecture, Project)</li><li><b>વ્યૂહરચના (Strategy)</b>: પદ્ધતિના અમલનું આયોજન (Brainstorming, Role play)</li><li><b>પ્રવિધિ (Technique/Device)</b>: નાની યુક્તિ (પ્રશ્ન પૂછવા, ઉદાહરણ, વર્ણન)</li><li><b>Team teaching</b>: બે કે વધુ શિક્ષકો સાથે મળીને</li><li><b>Programmed instruction</b>: B.F. Skinner (Linear), Norman Crowder (Branching)</li><li><b>Keller Plan (PSI)</b>: Personalized System of Instruction</li></ul><div class=\"tk\"><i>★</i><span>Linear = <b>Skinner</b>, Branching = <b>Crowder</b>, Mathetics = <b>Gilbert</b></span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Lecture</b></td><td>Mainly teacher-led oral presentation</td></tr><tr><td><b>Project method</b></td><td>Learning through an extended task</td></tr><tr><td><b>Problem-based learning</b></td><td>Learning organised around a problem</td></tr><tr><td><b>Collaborative learning</b></td><td>Learners working towards shared goals</td></tr><tr><td><b>MOOC</b></td><td>Massive Open Online Course</td></tr><tr><td><b>Blended learning</b></td><td>Combining face-to-face and online learning</td></tr><tr><td><b>Synchronous learning</b></td><td>Learning interaction at the same time</td></tr><tr><td><b>Asynchronous learning</b></td><td>Learning at different times</td></tr><tr><td><b>Flipped classroom</b></td><td>Initial content before in-class application</td></tr><tr><td><b>Discussion method</b></td><td>Learning through exchange of ideas</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>\"<b>અધ્યેતા જાતે શોધે, પ્રોજેક્ટ, PBL, seminar</b>\" → અધ્યેતા કેન્દ્રિત</li><li>\"<b>મોટો વર્ગ, ઓછો સમય, એક-માર્ગી</b>\" → વ્યાખ્યાન</li><li>SWAYAM: 2017, 4 quadrants, ધો. 9 થી PG, મફત</li><li>Engineering = NPTEL, UG = CEC, School = NCERT/NIOS, Management = IIMB</li><li>Flipped classroom = ઘરે વાંચો/જુઓ, વર્ગમાં ચર્ચા/પ્રવૃત્તિ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: SWAYAM Prabha = TV/DTH ચેનલો; SWAYAM = online MOOC પ્લેટફોર્મ.</span></div>"]],"1-4":[["અધ્યાપન સહાયક પ્રક્રિયા – પરિચય","<p>અધ્યાપન સહાયક પ્રણાલી (Teaching Support System) એટલે એવા સાધનો, સામગ્રી અને ટેકનોલોજી જે અધ્યાપનને <b>અસરકારક, રસપ્રદ અને સમજવામાં સરળ</b> બનાવે.</p><ul><li>ત્રણ પ્રકાર: <b>પરંપરાગત (Traditional)</b>, <b>આધુનિક (Modern)</b>, <b>ICT આધારિત</b></li><li>હેતુ: અમૂર્ત સંકલ્પનાને મૂર્ત બનાવવી</li><li>વધુ ઇન્દ્રિયો સામેલ → વધુ અને લાંબું અધ્યયન</li></ul><div class=\"nt\">\"I hear and I forget; I see and I remember; I do and I understand.\" – Confucius (પરંપરાગત રીતે)</div>"],["પરંપરાગત સહાયક સામગ્રી","<ul><li><b>બ્લેકબોર્ડ / ચોકબોર્ડ</b> – સૌથી જૂનું અને સૌથી વધુ વપરાતું સાધન</li><li>ચાર્ટ, નકશા, ગ્લોબ, ચિત્રો, ફ્લેશ કાર્ડ</li><li>મોડેલ, નમૂના (Specimen), વાસ્તવિક વસ્તુઓ</li><li><b>ફ્લેનલ બોર્ડ, બુલેટિન બોર્ડ</b></li><li>પાઠ્યપુસ્તક, નોંધ, હેન્ડઆઉટ</li><li>કઠપૂતળી (Puppet), નાટક, લોકકલા</li></ul>"],["આધુનિક સહાયક સામગ્રી","<ul><li><b>OHP</b> (Overhead Projector), Slide projector, Epidiascope</li><li>રેડિયો, ટેપ રેકોર્ડર, ટેલિવિઝન</li><li><b>LCD / LED પ્રોજેક્ટર</b>, વ્હાઇટબોર્ડ</li><li>વીડિયો, ફિલ્મ, CCTV</li><li>ભાષા પ્રયોગશાળા (Language lab)</li><li><b>Epidiascope</b>: અપારદર્શક (Opaque) અને પારદર્શક બંને સામગ્રી બતાવી શકે</li></ul><div class=\"tk\"><i>★</i><span>Episcope = અપારદર્શક, Diascope = પારદર્શક, Epidiascope = બંને</span></div>"],["ICT આધારિત સહાયક પ્રક્રિયા","<ul><li><b>સ્માર્ટ બોર્ડ / Interactive Whiteboard</b></li><li><b>PowerPoint, Prezi</b>, e-content, Animation, Simulation</li><li><b>LMS</b> (Learning Management System): Moodle, Google Classroom, Canvas, Blackboard</li><li>MOOCs: SWAYAM, NPTEL, Coursera, edX</li><li>Video conferencing: Zoom, Google Meet, MS Teams</li><li><b>AR/VR</b> (Augmented/Virtual Reality), <b>AI tools</b>, Chatbots</li><li><b>OER</b> (Open Educational Resources): મુક્ત રીતે વાપરી શકાય તેવી સામગ્રી – UNESCO (2002) શબ્દ</li></ul>"],["સહાયક સામગ્રીનું વર્ગીકરણ – ઇન્દ્રિય આધારે","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td>દૃશ્ય (Visual)</td><td>ચાર્ટ, નકશો, મોડેલ, સ્લાઇડ</td></tr><tr><td>શ્રાવ્ય (Audio)</td><td>રેડિયો, ઓડિયો, પોડકાસ્ટ</td></tr><tr><td>દૃશ્ય-શ્રાવ્ય (AV)</td><td>ટીવી, ફિલ્મ, વીડિયો</td></tr><tr><td>પ્રવૃત્તિ આધારિત</td><td>પ્રયોગ, ક્ષેત્ર પ્રવાસ, નાટક</td></tr></tbody></table></div><ul><li><b>Projected aids</b>: OHP, LCD, slide projector</li><li><b>Non-projected aids</b>: ચાર્ટ, બોર્ડ, મોડેલ</li></ul>"],["Hardware, Software અને Systems Approach","<ul><li><b>Hardware approach</b> (Silverman – \"Relative technology\"): મશીનો – પ્રોજેક્ટર, કમ્પ્યુટર, TV</li><li><b>Software approach</b> (\"Constructive technology\"): અધ્યયન સિદ્ધાંતો, programmed instruction, સામગ્રી</li><li><b>Systems approach</b>: Input → Process → Output → Feedback; સમગ્ર પ્રક્રિયાને પ્રણાલી તરીકે જોવી</li><li>શૈક્ષણિક ટેકનોલોજી = Hardware + Software + Systems</li></ul><div class=\"tk\"><i>★</i><span>Hardware = \"<b>મશીન</b>\", Software = \"<b>મન/સિદ્ધાંત</b>\"</span></div>"],["સહાયક સામગ્રી પસંદગીના સિદ્ધાંતો","<ul><li>હેતુ સાથે સુસંગત (Relevance)</li><li>અધ્યેતાની ઉંમર અને સ્તર અનુસાર</li><li>સરળ, સ્પષ્ટ, આકર્ષક અને ચોક્કસ</li><li>ઉપલબ્ધતા અને ખર્ચ</li><li>શિક્ષકની કુશળતા</li><li><b>ASSURE model</b> (Heinich, Molenda, Russell): Analyse learners, State objectives, Select media, Utilise, Require participation, Evaluate</li></ul><div class=\"tk\"><i>★</i><span>ASSURE = \"<b>A S S U R E</b>\" – ટેકનોલોજી સંકલિત પાઠ આયોજન</span></div>"],["ICT આધારિત અધ્યાપનના ફાયદા અને મર્યાદાઓ","<div class=\"tw\"><table><thead><tr><th>ફાયદા</th><th>મર્યાદાઓ</th></tr></thead><tbody><tr><td>કોઈ પણ સમયે, ક્યાંય પણ</td><td>ડિજિટલ વિભાજન (Digital divide)</td></tr><tr><td>સ્વ-ગતિએ અધ્યયન</td><td>ઇન્ટરનેટ/વીજળીની સમસ્યા</td></tr><tr><td>મલ્ટીમીડિયા – રસપ્રદ</td><td>Screen fatigue</td></tr><tr><td>વિશાળ પહોંચ</td><td>સામાજિક આંતરક્રિયા ઓછી</td></tr><tr><td>તાત્કાલિક પ્રતિપોષણ</td><td>Cyber security, plagiarism</td></tr></tbody></table></div>"],["e-Content અને Instructional Design","<ul><li><b>ADDIE model</b>: Analysis → Design → Development → Implementation → Evaluation</li><li><b>Gagne ના 9 શૈક્ષણિક પ્રસંગો</b> (Nine events of instruction): ધ્યાન મેળવો, હેતુ જણાવો, પૂર્વજ્ઞાન યાદ કરાવો, સામગ્રી રજૂ કરો, માર્ગદર્શન, કામગીરી, પ્રતિપોષણ, મૂલ્યાંકન, ધારણ અને સ્થાનાંતર</li><li><b>Mayer ના મલ્ટીમીડિયા સિદ્ધાંતો</b>: ચિત્ર + શબ્દ સાથે વધુ અસરકારક</li><li>Accessibility: Captions, alt-text, screen reader</li></ul><div class=\"tk\"><i>★</i><span>ADDIE = \"<b>A D D I E</b>\" – દરેક e-course ની રચના</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Chalkboard</b></td><td>Reusable traditional writing aid</td></tr><tr><td><b>Printed handout</b></td><td>Paper-based learning material</td></tr><tr><td><b>Presentation slides</b></td><td>Sequential visual teaching display</td></tr><tr><td><b>Simulation</b></td><td>Model of a system for learning</td></tr><tr><td><b>Learning management system</b></td><td>Platform managing courses and activities</td></tr><tr><td><b>Interactive whiteboard</b></td><td>Touch-responsive digital teaching board</td></tr><tr><td><b>Educational video</b></td><td>Recorded audiovisual learning material</td></tr><tr><td><b>Quiz feedback</b></td><td>Response explaining learning performance</td></tr><tr><td><b>Screen reader</b></td><td>Software reading screen content aloud</td></tr><tr><td><b>Virtual laboratory</b></td><td>Digital environment for practical experimentation</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>બ્લેકબોર્ડ, ચાર્ટ, મોડેલ → <b>પરંપરાગત</b></li><li>OHP, TV, રેડિયો, LCD → <b>આધુનિક</b></li><li>Smart board, LMS, MOOC, AR/VR → <b>ICT આધારિત</b></li><li>Moodle = Open-source LMS</li><li>Hardware = મશીન; Software = સિદ્ધાંત/સામગ્રી</li><li>Epidiascope = પારદર્શક + અપારદર્શક બંને</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: OER શ
