મય સાથેનો ટ્રેન્ડ</li><li>Ogive = Median; Histogram = Mode</li><li>Box plot = Tukey; Bar/Line/Pie = Playfair</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Pie chart માં ખૂણા પરથી % = ખૂણો ÷ 3.6 (દા.ત. 72° = 20%).</span></div>"]],"7-3":[["માહિતીનું અર્થઘટન (Data Interpretation) – પરિચય","<p><b>Data Interpretation (DI)</b> એટલે આપેલા કોષ્ટક/આલેખ પરથી <b>અર્થપૂર્ણ નિષ્કર્ષ</b> કાઢવા, ગણતરી કરવી અને પ્રવાહ ઓળખવો.</p><ul><li>GSET પેપર-I માં: એક કોષ્ટક/આલેખ + <b>5 પ્રશ્નો (10 ગુણ)</b></li><li>જરૂરી કૌશલ્ય: ટકાવારી, ગુણોત્તર, સરેરાશ, વૃદ્ધિ દર, approximation</li></ul><div class=\"nt\">સુવર્ણ નિયમ: પ્રશ્ન પહેલાં <b>શીર્ષક, એકમ, પાદટીપ</b> વાંચો.</div>"],["DI પ્રશ્ન ઉકેલવાની વ્યૂહરચના","<ul><li><b>1.</b> શીર્ષક, અક્ષ લેબલ, <b>એકમ (₹ કરોડ, લાખ ટન, %)</b> ધ્યાનથી વાંચો</li><li><b>2.</b> પાંચેય પ્રશ્નો ઝડપથી જુઓ – કઈ ગણતરી વારંવાર આવે છે?</li><li><b>3.</b> વારંવાર વપરાતા <b>કુલ (Total)</b> અને <b>સરેરાશ</b> એક જ વાર ગણી રાખો</li><li><b>4.</b> <b>Approximation</b> – વિકલ્પો દૂર હોય તો ગોળ આંકડા</li><li><b>5.</b> <b>Elimination</b> – અશક્ય વિકલ્પો કાઢો</li><li><b>6.</b> ગણતરી પછી <b>તાર્કિક ચકાસણી</b> – જવાબ વાસ્તવિક લાગે છે?</li></ul><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>શી-એ-પ્ર-કુ-અં-નિ</b>\" – શીર્ષક, એકમ, પ્રશ્ન, કુલ, અંદાજ, નિવારણ</span></div>"],["મુખ્ય સૂત્રો – ટકાવારી અને વૃદ્ધિ","<ul><li><b>% ફેરફાર</b> = (નવું − જૂનું) / જૂનું × 100</li><li><b>% હિસ્સો</b> = (ભાગ / કુલ) × 100</li><li><b>% બિંદુ (Percentage point)</b> ફેરફાર = બે ટકાવારીનો સીધો તફાવત</li><li>ઉદા: 20% → 25% = <b>5 percentage points</b>, પણ <b>25% વધારો</b></li><li><b>CAGR</b> = (અંતિમ / પ્રારંભિક)^(1/n) − 1</li><li><b>સરેરાશ</b> = કુલ ÷ સંખ્યા</li><li><b>ભારિત સરેરાશ (Weighted mean)</b> = Σ(w × x) / Σw</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"Percentage points\" અને \"Percent\" ભેળવશો નહીં.</span></div>"],["ગુણોત્તર અને તુલનાના પ્રશ્નો","<ul><li>\"A નો B સાથે ગુણોત્તર\" = <b>A : B</b> (ક્રમ મહત્વનો)</li><li>\"A, B કરતાં કેટલા % વધુ\" = (A − B) / <b>B</b> × 100</li><li>\"B, A કરતાં કેટલા % ઓછું\" = (A − B) / <b>A</b> × 100</li><li>★ A, B કરતાં 25% વધુ → B, A કરતાં <b>20% ઓછું</b> (25/125)</li><li>★ A, B કરતાં 50% વધુ → B, A કરતાં <b>33.33% ઓછું</b></li><li>★ સૂત્ર: x% વધુ → x/(100+x) × 100 % ઓછું</li></ul>"],["Approximation ની ટ્રિક્સ","<ul><li>★ ભાગાકાર: 4987 ÷ 25 ≈ 5000 ÷ 25 = <b>200</b></li><li>★ ગુણાકાર: 19.8 × 51 ≈ 20 × 50 = <b>1000</b></li><li>★ ટકાવારી: 347 નો 23% ≈ 350 × 0.23 ≈ <b>80.5</b></li><li>★ 10% = દશાંશ ચિહ્ન એક સ્થાન ડાબે; 5% = 10% નું અડધું; 1% = બે સ્થાન ડાબે</li><li>★ 15% = 10% + 5%; 12.5% = 1/8; 33.33% = 1/3</li><li>★ અપૂર્ણાંક તુલના: 47/89 vs 53/97 → બંને ≈ 0.53, 0.55 → બીજું મોટું</li></ul>"],["પ્રવાહ (Trend) ઓળખ","<ul><li><b>સતત વધારો (Increasing trend)</b>: દરેક વર્ષે વધે</li><li><b>સતત ઘટાડો (Decreasing)</b></li><li><b>વધ-ઘટ (Fluctuating)</b></li><li>\"<b>સૌથી વધુ % વૃદ્ધિ</b>\" → દરેક વર્ષ માટે (ફેરફાર ÷ આગલા વર્ષનું મૂલ્ય) – માત્ર તફાવત નહીં</li><li>\"<b>સૌથી વધુ નિરપેક્ષ (Absolute) વૃદ્ધિ</b>\" → સૌથી મોટો તફાવત</li><li>★ નાના આધાર પર નાનો વધારો પણ મોટો % હોઈ શકે</li></ul>"],["કોષ્ટક આધારિત DI – ઉદાહરણ","<div class=\"tw\"><table><thead><tr><th>વર્ષ</th><th>ઉત્પાદન (લાખ ટન)</th><th>વેચાણ (લાખ ટન)</th></tr></thead><tbody><tr><td>2020</td><td>40</td><td>32</td></tr><tr><td>2021</td><td>50</td><td>45</td></tr><tr><td>2022</td><td>60</td><td>48</td></tr></tbody></table></div><ul><li>2020→2021 ઉત્પાદન % વૃદ્ધિ = 10/40 × 100 = <b>25%</b></li><li>2021→2022 = 10/50 × 100 = <b>20%</b> → સમાન વધારો છતાં % ઓછો</li><li>2022 માં ન વેચાયેલ = 60 − 48 = <b>12 લાખ ટન</b></li><li>3 વર્ષનું સરેરાશ ઉત્પાદન = 150/3 = <b>50 લાખ ટન</b></li><li>વેચાણ/ઉત્પાદન ગુણોત્તર 2021 = 45/50 = <b>0.9 (90%)</b></li></ul>"],["Pie + Table સંયુક્ત DI","<ul><li>ઘણી વાર કુલ મૂલ્ય કોષ્ટકમાં અને ભાગ Pie માં</li><li>★ ઘટક મૂલ્ય = કુલ × (ખૂણો / 360) અથવા કુલ × (% / 100)</li><li>★ બે ઘટકનો ગુણોત્તર = ખૂણાનો ગુણોત્તર (કુલ સમાન હોય તો)</li><li>★ બે જુદા વર્ષની Pie તુલના કરતાં <b>કુલ</b> પણ બદલાયું હોય તો સીધી ખૂણા તુલના ખોટી</li><li>ઉદા: 2021 કુલ ₹ 200 કરોડ, શિક્ષણ 18% = ₹ 36 કરોડ; 2022 કુલ ₹ 250 કરોડ, શિક્ષણ 16% = ₹ 40 કરોડ → % ઘટ્યો પણ રકમ <b>વધી</b></li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Arithmetic mean</b></td><td>Sum divided by number of observations</td></tr><tr><td><b>Median</b></td><td>Middle value in ordered data</td></tr><tr><td><b>Mode</b></td><td>Most frequent value</td></tr><tr><td><b>Range</b></td><td>Maximum minus minimum</td></tr><tr><td><b>Percentage</b></td><td>Fraction expressed per hundred</td></tr><tr><td><b>Percentage change</b></td><td>Change divided by original value times one hundred</td></tr><tr><td><b>Ratio</b></td><td>Comparison by division</td></tr><tr><td><b>Weighted mean</b></td><td>Average incorporating specified weights</td></tr><tr><td><b>Trend</b></td><td>Broad direction of change</td></tr><tr><td><b>Outlier</b></td><td>Observation markedly different from others</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>પહેલાં <b>એકમ અને શીર્ષક</b> વાંચો</li><li>% ફેરફાર = ફેરફાર ÷ <b>મૂળ</b> × 100</li><li>x% વધુ → x/(100+x) × 100 % ઓછું</li><li>Percentage point ≠ Percent</li><li>કુલ બદલાય ત્યારે માત્ર % પરથી રકમનો નિષ્કર્ષ ન કાઢો</li><li>Approximation = સમય બચાવે</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: \"Can be determined?\" જેવા પ્રશ્નમાં પૂરતી માહિતી ન હોય તો \"નક્કી કરી શકાય નહીં\" સાચો જવાબ છે.</span></div>"]],"7-4":[["માહિતી અને શાસન (Data and Governance) – પરિચય","<p><b>માહિતી શાસન (Data Governance)</b> એટલે માહિતીની <b>ગુણવત્તા, સુરક્ષા, ગોપનીયતા, ઉપલબ્ધતા અને જવાબદાર ઉપયોગ</b> માટેની નીતિઓ, ધોરણો અને પ્રક્રિયાઓ.</p><ul><li>સાથે <b>Data for governance</b>: નીતિ ઘડતર, આયોજન અને સેવા વિતરણ માટે માહિતીનો ઉપયોગ</li><li><b>પુરાવા આધારિત નીતિ (Evidence-based policy)</b></li><li>પારદર્શિતા, જવાબદારી અને નાગરિક સશક્તિકરણ</li></ul><div class=\"nt\">\"In God we trust; all others must bring data.\" – W. Edwards Deming (આભારી)</div>"],["સારા શાસનમાં માહિતીની ભૂમિકા","<ul><li><b>આયોજન</b>: વસ્તી, આરોગ્ય, શિક્ષણ આંકડા પરથી યોજનાઓ</li><li><b>લક્ષ્યીકરણ (Targeting)</b>: લાભાર્થી ઓળખ – Aadhaar, DBT</li><li><b>દેખરેખ અને મૂલ્યાંકન (M&amp;E)</b>: યોજનાની પ્રગતિ – Dashboards</li><li><b>પારદર્શિતા</b>: Open data, RTI</li><li><b>જવાબદારી (Accountability)</b>: Social audit</li><li><b>આપત્તિ વ્યવસ્થાપન</b>: વાસ્તવિક સમયની માહિતી</li><li>★ <b>DBT</b> (Direct Benefit Transfer): 2013 થી – લીકેજ ઘટાડ્યું</li></ul>"],["ભારતમાં માહિતી સંબંધિત મુખ્ય કાયદા/નીતિઓ","<div class=\"tw\"><table><thead><tr><th>કાયદો/નીતિ</th><th>વર્ષ</th><th>મુખ્ય મુદ્દો</th></tr></thead><tbody><tr><td><b>માહિતી અધિકાર (RTI) અધિનિયમ</b></td><td><b>2005</b></td><td>નાગરિકોને સરકારી માહિતી મેળવવાનો અધિકાર; 30 દિવસમાં જવાબ (જીવન-સ્વતંત્રતા: 48 કલાક)</td></tr><tr><td><b>IT Act</b></td><td><b>2000</b></td><td>ઇલેક્ટ્રોનિક વ્યવહાર, સાયબર ગુનો (સુધારો 2008)</td></tr><tr><td><b>NDSAP</b></td><td><b>2012</b></td><td>National Data Sharing and Accessibility Policy → data.gov.in</td></tr><tr><td><b>Aadhaar Act</b></td><td><b>2016</b></td><td>12 અંકનો અનન્ય ઓળખ નંબર – UIDAI</td></tr><tr><td><b>DPDP Act</b></td><td><b>2023</b></td><td>Digital Personal Data Protection – વ્યક્તિગત ડિજિટલ માહિતી સુરક્ષા</td></tr></tbody></table></div>"],["ગોપનીયતા અને ડેટા સુરક્ષા","<ul><li><b>K.S. Puttaswamy vs Union of India (2017)</b>: સર્વોચ્ચ અદાલત (9 ન્યાયાધીશ) – <b>ગોપનીયતા મૂળભૂત અધિકાર</b> (અનુચ્છેદ 21)</li><li><b>Justice B.N. Srikrishna સમિતિ (2018)</b>: ડેટા સુરક્ષા કાયદાનો મુસદ્દો</li><li><b>DPDP Act 2023</b>: Data Principal (વ્યક્તિ), Data Fiduciary (માહિતી પ્રક્રિયા કરનાર), <b>Data Protection Board of India</b></li><li><b>GDPR</b> (યુરોપિયન યુનિયન, 2018): વિશ્વનો પ્રભાવશાળી ડેટા સુરક્ષા કાયદો</li><li>સિદ્ધાંતો: સંમતિ, હેતુ મર્યાદા, ડેટા ન્યૂનતમીકરણ, સંગ્રહ મર્યાદા</li></ul><div class=\"tk\"><i>★</i><span>Puttaswamy = \"<b>Privacy = Article 21</b>\"</span></div>"],["Open Government Data","<ul><li><b>data.gov.in</b>: Open Government Data (OGD) Platform India – NDSAP હેઠળ, NIC દ્વારા</li><li>Open data ના લક્ષણ: <b>મુક્ત ઉપલબ્ધ, મશીન વાંચી શકાય (Machine-readable), પુનઃઉપયોગ યોગ્ય</b></li><li><b>Open Government Partnership</b> (2011) – વૈશ્વિક પહેલ</li><li><b>National Data Governance Framework Policy</b> (2022, MeitY): India Datasets Program</li><li><b>India Data Management Office (IDMO)</b></li></ul>"],["મોટી માહિતી (Big Data) અને AI શાસનમાં","<ul><li><b>Big Data ના V</b>: <b>Volume</b> (જથ્થો), <b>Velocity</b> (ઝડપ), <b>Variety</b> (વિવિધતા) – Doug Laney (2001); પછી <b>Veracity</b> (સચ્ચાઈ), <b>Value</b> (મૂલ્ય)</li><li>ઉપયોગ: કર ચોરી શોધ, ટ્રાફિક વ્યવસ્થાપન, આરોગ્ય સર્વેલન્સ, હવામાન આગાહી</li><li><b>Predictive analytics</b>, <b>GIS</b> આધારિત આયોજન</li><li>AI ના જોખમ: <b>Algorithmic bias</b>, પારદર્શિતાનો અભાવ, ગોપનીયતા</li><li><b>Responsible AI</b> – NITI Aayog (2021) સિદ્ધાંતો</li></ul><div class=\"tk\"><i>★</i><span>Big Data = \"<b>3V → 5V</b>\" (Volume, Velocity, Variety, Veracity, Value)</span></div>"],["ભારતના ડેટા આધારિત શાસન પોર્ટલ","<ul><li><b>PRAGATI</b> (2015): Pro-Active Governance and Timely Implementation – PM દ્વારા સમીક્ષા</li><li><b>e-Office</b>, <b>PFMS</b> (Public Financial Management System)</li><li><b>PM Gati Shakti</b> (2021): માળખાકીય આયોજન માટે GIS પ્લેટફોર્મ</li><li><b>CoWIN</b> (રસીકરણ), <b>Aarogya Setu</b></li><li><b>UDISE+</b>, <b>AISHE</b>, <b>NIRF</b> – શિક્ષણ માહિતી</li><li><b>eSanjeevani</b> (ટેલિમેડિસિન)</li></ul>"],["ડેટા ગુણવત્તા અને નીતિશાસ્ત્ર","<ul><li><b>ડેટા ગુણવત્તાના પરિમાણો</b>: ચોકસાઈ (Accuracy), સંપૂર્ણતા (Completeness), સમયસરતા (Timeliness), સુસંગતતા (Consistency), માન્યતા (Validity)</li><li><b>Metadata</b>: માહિતી વિશેની માહિતી</li><li><b>Data ethics</b>: સંમતિ, ન્યાયીપણું, પારદર્શિતા, જવાબદારી</li><li><b>Digital divide</b> અને ડેટા અસમાનતા</li><li><b>Data sovereignty / localisation</b>: દેશની માહિતી દેશમાં સંગ્રહ</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Open data</b></td><td>Data available for permitted public reuse</td></tr><tr><td><b>Transparency</b></td><td>Visibility of relevant decisions and information</td></tr><tr><td><b>Accountability</b></td><td>Responsibility to explain actions</td></tr><tr><td><b>Data quality</b></td><td>Fitness of data for its intended use</td></tr><tr><td><b>Data privacy</b></td><td>Appropriate protection of personal information</td></tr><tr><td><b>Data governance</b></td><td>Rules and responsibilities for managing data</td></tr><tr><td><b>Evidence-based policy</b></td><td>Policy informed by relevant evidence</td></tr><tr><td><b>Metadata</b></td><td>Information describing a dataset</td></tr><tr><td><b>Data minimisation</b></td><td>Collecting only necessary personal information</td></tr><tr><td><b>Audit trail</b></td><td>Record enabling actions to be traced</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>RTI = 2005; IT Act = 2000; Aadhaar Act = 2016; DPDP = 2023</li><li>Puttaswamy (2017) = ગોપનીયતા મૂળભૂત અધિકાર (અનુ. 21)</li><li>NDSAP = 2012 → data.gov.in</li><li>Big Data: Volume, Velocity, Variety (+ Veracity, Value)</li><li>GDPR = EU, 2018</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: RTI હેઠળ સામાન્ય જવાબ સમય 30 દિવસ; જીવન અને સ્વતંત્રતા સંબંધિત માહિતી 48 કલાકમાં.</span></div>"]],"8-0":[["ICT – પરિચય","<p><b>ICT</b> = <b>Information and Communication Technology</b> – માહિતી મેળવવા, સંગ્રહ, પ્રક્રિયા, પ્રસારણ અને આદાનપ્રદાન માટેની તમામ ટેકનોલોજી.</p><ul><li>ઘટકો: <b>Hardware, Software, Network, Data, People</b></li><li>કમ્પ્યુટરના પિતા: <b>Charles Babbage</b> (Analytical Engine)</li><li>પ્રથમ પ્રોગ્રામર: <b>Ada Lovelace</b></li><li>આધુનિક કમ્પ્યુટર વિજ્ઞાનના પિતા: <b>Alan Turing</b></li></ul><div class=\"tk\"><i>★</i><span>ICT = IT + Communication</span></div>"],["કમ્પ્યુટરના મૂળભૂત ઘટકો","<div class=\"tw\"><table><thead><tr><th>ઘટક</th><th>પૂરું નામ / કાર્ય</th></tr></thead><tbody><tr><td><b>CPU</b></td><td>Central Processing Unit – કમ્પ્યુટરનું \"મગજ\"</td></tr><tr><td><b>ALU</b></td><td>Arithmetic Logic Unit – ગણતરી અને તાર્કિક ક્રિયા</td></tr><tr><td><b>CU</b></td><td>Control Unit – નિયંત્રણ</td></tr><tr><td><b>RAM</b></td><td>Random Access Memory – <b>અસ્થાયી (Volatile)</b>, વીજળી જતાં માહિતી જાય</td></tr><tr><td><b>ROM</b></td><td>Read Only Memory – <b>સ્થાયી (Non-volatile)</b>, BIOS</td></tr><tr><td><b>HDD / SSD</b></td><td>Hard Disk Drive / Solid State Drive – સંગ્રહ</td></tr><tr><td><b>GPU</b></td><td>Graphics Processing Unit</td></tr><tr><td><b>BIOS</b></td><td>Basic Input Output System</td></tr></tbody></table></div>"],["સંગ્રહ એકમો (Storage Units)","<div class=\"tw\"><table><thead><tr><th>એકમ</th><th>મૂલ્ય</th></tr></thead><tbody><tr><td>1 Bit</td><td>0 અથવા 1 (Binary digit)</td></tr><tr><td>1 Nibble</td><td>4 Bits</td></tr><tr><td>1 Byte</td><td>8 Bits</td></tr><tr><td>1 KB</td><td>1024 Bytes</td></tr><tr><td>1 MB</td><td>1024 KB</td></tr><tr><td>1 GB</td><td>1024 MB</td></tr><tr><td>1 TB</td><td>1024 GB</td></tr><tr><td>1 PB</td><td>1024 TB</td></tr></tbody></table></div><ul><li>ક્રમ ટ્રિક: ★ \"<b>K M G T P E Z Y</b>\" – Kilo, Mega, Giga, Tera, Peta, Exa, Zetta, Yotta</li><li>દશાંશ (SI) માં 1 KB = 1000 Bytes; Binary માં <b>KiB</b> = 1024</li></ul>"],["ઇનપુટ, આઉટપુટ અને મેમરી ક્રમ","<ul><li><b>Input devices</b>: Keyboard, Mouse, Scanner, Microphone, Webcam, <b>OMR, OCR, MICR</b>, Barcode reader, Light pen</li><li><b>Output devices</b>: Monitor, Printer, Speaker, Projector, Plotter</li><li><b>બંને</b>: Touch screen, Modem, Headset</li><li><b>મેમરી ઝડપ ક્રમ</b> (ઝડપીથી ધીમી): <b>Register &gt; Cache &gt; RAM &gt; SSD &gt; HDD &gt; Optical/Tape</b></li><li><b>MICR</b>: બેંક ચેક પર ચુંબકીય શાહી; <b>OMR</b>: પરીક્ષા જવાબ પત્રક</li></ul><div class=\"tk\"><i>★</i><span>ઝડપ: \"<b>R C R S H</b>\" – Register, Cache, RAM, SSD, HDD</span></div>"],["મહત્વના સંક્ષેપો – ઇન્ટરનેટ","<div class=\"tw\"><table><thead><tr><th>સંક્ષેપ</th><th>પૂરું નામ</th></tr></thead><tbody><tr><td><b>URL</b></td><td>Uniform Resource Locator</td></tr><tr><td><b>HTTP / HTTPS</b></td><td>HyperText Transfer Protocol (Secure)</td></tr><tr><td><b>HTML</b></td><td>HyperText Markup Language</td></tr><tr><td><b>WWW</b></td><td>World Wide Web</td></tr><tr><td><b>IP</b></td><td>Internet Protocol</td></tr><tr><td><b>TCP</b></td><td>Transmission Control Protocol</td></tr><tr><td><b>DNS</b></td><td>Domain Name System</td></tr><tr><td><b>ISP</b></td><td>Internet Service Provider</td></tr><tr><td><b>FTP</b></td><td>File Transfer Protocol</td></tr><tr><td><b>SMTP</b></td><td>Simple Mail Transfer Protocol</td></tr><tr><td><b>POP3 / IMAP</b></td><td>Post Office Protocol / Internet Message Access Protocol</td></tr><tr><td><b>VoIP</b></td><td>Voice over Internet Protocol</td></tr></tbody></table></div>"],["મહત્વના સંક્ષેપો – સામાન્ય","<div class=\"tw\"><table><thead><tr><th>સંક્ષેપ</th><th>પૂરું નામ</th></tr></thead><tbody><tr><td><b>LAN / MAN / WAN</b></td><td>Local / Metropolitan / Wide Area Network</td></tr><tr><td><b>PAN</b></td><td>Personal Area Network</td></tr><tr><td><b>Wi-Fi</b></td><td>Wireless Fidelity</td></tr><tr><td><b>USB</b></td><td>Universal Serial Bus</td></tr><tr><td><b>PDF</b></td><td>Portable Document Format</td></tr><tr><td><b>GIF / JPEG / PNG</b></td><td>Graphics Interchange Format / Joint Photographic Experts Group / Portable Network Graphics</td></tr><tr><td><b>OS</b></td><td>Operating System</td></tr><tr><td><b>GUI / CLI</b></td><td>Graphical / Command Line User Interface</td></tr><tr><td><b>AI / ML / IoT</b></td><td>Artificial Intelligence / Machine Learning / Internet of Things</td></tr><tr><td><b>LMS / MOOC</b></td><td>Learning Management System / Massive Open Online Course</td></tr><tr><td><b>OTP / CAPTCHA</b></td><td>One Time Password / Completely Automated Public Turing test to tell Computers and Humans Apart</td></tr></tbody></table></div>"],["Software અને Operating System","<ul><li><b>System software</b>: OS (Windows, Linux, macOS, Android, iOS), Device drivers, Utilities</li><li><b>Application software</b>: MS Office, Browser, Media player</li><li><b>Open-source</b>: Linux, LibreOffice, Firefox, Moodle, Python</li><li><b>Freeware</b> (મફત પણ કોડ બંધ), <b>Shareware</b> (ટ્રાયલ), <b>Proprietary</b> (માલિકી)</li><li><b>Compiler</b> (આખો પ્રોગ્રામ એકસાથે અનુવાદ) vs <b>Interpreter</b> (લાઇન દર લાઇન)</li><li><b>Linux</b>: Linus Torvalds (1991); <b>Android</b>: Linux આધારિત (Google)</li></ul>"],["નંબર સિસ્ટમ અને અન્ય પરિભાષા","<div class=\"tw\"><table><thead><tr><th>સિસ્ટમ</th><th>આધાર (Base)</th><th>અંક</th></tr></thead><tbody><tr><td>Binary</td><td>2</td><td>0, 1</td></tr><tr><td>Octal</td><td>8</td><td>0-7</td></tr><tr><td>Decimal</td><td>10</td><td>0-9</td></tr><tr><td>Hexadecimal</td><td>16</td><td>0-9, A-F</td></tr></tbody></table></div><ul><li>★ ઉદા: (1010)₂ = 8 + 0 + 2 + 0 = <b>10</b></li><li><b>Cloud computing</b>: SaaS (Software), PaaS (Platform), IaaS (Infrastructure as a Service)</li><li><b>Malware</b>: Virus, Worm, Trojan, Ransomware, Spyware</li><li><b>Firewall</b>: અનધિકૃત પ્રવેશ રોકે</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>CPU</b></td><td>Central Processing Unit</td></tr><tr><td><b>RAM</b></td><td>Random Access Memory</td></tr><tr><td><b>ROM</b></td><td>Read Only Memory</td></tr><tr><td><b>URL</b></td><td>Uniform Resource Locator</td></tr><tr><td><b>HTTP</b></td><td>Hypertext Transfer Protocol</td></tr><tr><td><b>HTML</b></td><td>Hypertext Markup Language</td></tr><tr><td><b>LAN</b></td><td>Local Area Network</td></tr><tr><td><b>WAN</b></td><td>Wide Area Network</td></tr><tr><td><b>USB</b></td><td>Universal Serial Bus</td></tr><tr><td><b>PDF</b></td><td>Portable Document Format</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>RAM = Volatile; ROM = Non-volatile</li><li>1 Byte = 8 Bits; 1 KB = 1024 Bytes</li><li>HTTP = HyperText Transfer Protocol; URL = Uniform Resource Locator</li><li>ઝડપ: Register &gt; Cache &gt; RAM &gt; HDD</li><li>SMTP = મોકલવા; POP3/IMAP = મેળવવા</li><li>Binary 2, Octal 8, Hex 16</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: HTML એ પ્રોગ્રામિંગ ભાષા નથી – તે <b>Markup</b> ભાષા છે.</span></div>"]],"8-1":[["ઇન્ટરનેટ – પરિચય","<p><b>ઇન્ટરનેટ</b> = વિશ્વભરના કમ્પ્યુટર નેટવર્કોનું <b>નેટવર્ક (Network of networks)</b>, જે <b>TCP/IP</b> પ્રોટોકોલથી જોડાયેલું છે.</p><ul><li>પૂર્વજ: <b>ARPANET (1969)</b> – US Department of Defense</li><li><b>TCP/IP</b>: Vint Cerf અને Bob Kahn (1974) – \"Fathers of the Internet\"; ARPANET એ 1 જાન્યુઆરી 1983 થી અપનાવ્યો</li><li><b>WWW</b>: <b>Tim Berners-Lee (1989-91, CERN)</b> – HTML, HTTP, URL ના શોધક</li><li>ભારતમાં જાહેર ઇન્ટરનેટ: <b>VSNL, 15 ઓગસ્ટ 1995</b></li></ul><div class=\"tk\"><i>★</i><span>Internet ≠ WWW; WWW ઇન્ટરનેટ પરની એક સેવા છે.</span></div>"],["Internet, Intranet અને Extranet","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>પહોંચ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>Internet</b></td><td>જાહેર, વિશ્વવ્યાપી</td><td>Google, Wikipedia</td></tr><tr><td><b>Intranet</b></td><td>માત્ર સંસ્થાના અંદરના સભ્યો – <b>ખાનગી</b></td><td>કોલેજનું આંતરિક પોર્ટલ</td></tr><tr><td><b>Extranet</b></td><td>Intranet + <b>પસંદગીના બાહ્ય ભાગીદારો</b></td><td>સપ્લાયર પોર્ટલ</td></tr></tbody></table></div><ul><li>બધામાં TCP/IP અને Web ટેકનોલોજીનો ઉપયોગ</li></ul><div class=\"tk\"><i>★</i><span>Intra = <b>અંદર</b>, Extra = <b>બહારના પસંદગીના</b>, Inter = <b>બધા</b></span></div>"],["IP Address અને DNS","<ul><li><b>IP Address</b>: નેટવર્ક પર દરેક ઉપકરણનું અનન્ય સરનામું</li><li><b>IPv4</b>: <b>32-bit</b>, 4 ભાગ (દા.ત. 192.168.1.1) – આશરે 4.3 અબજ સરનામાં</li><li><b>IPv6</b>: <b>128-bit</b>, Hexadecimal (દા.ત. 2001:0db8::1)</li><li><b>DNS (Domain Name System)</b>: Domain name (google.com) ને IP address માં ફેરવે – \"ઇન્ટરનેટની ફોનબુક\"</li><li><b>Domain</b>: .com (વ્યાપારી), .edu (શૈક્ષણિક), .gov (સરકારી), .org (સંસ્થા), .in (ભારત), .ac.in (ભારતીય શૈક્ષણિક)</li><li><b>ICANN</b>: ડોમેન નામ વ્યવસ્થાપન</li></ul>"],["World Wide Web અને બ્રાઉઝર","<ul><li><b>Web page</b> → <b>Website</b> → <b>Web server</b></li><li><b>Browser</b>: Chrome, Firefox, Safari, Edge – પ્રથમ ગ્રાફિકલ લોકપ્રિય: <b>Mosaic (1993)</b></li><li><b>Search engine</b>: Google (1998 – Larry Page, Sergey Brin), Bing, DuckDuckGo</li><li><b>Hyperlink</b>: એક પાનાથી બીજા પાને જોડાણ</li><li><b>Cookies</b>: વેબસાઇટ દ્વારા બ્રાઉઝરમાં સંગ્રહિત નાની ફાઇલ</li><li><b>Cache</b>: ઝડપ માટે અસ્થાયી સંગ્રહ</li><li><b>Web 1.0</b> (વાંચો), <b>Web 2.0</b> (વાંચો-લખો, સોશિયલ), <b>Web 3.0</b> (Semantic/Decentralised)</li></ul>"],["ઇ-મેઇલ (E-mail)","<ul><li>શોધક: <b>Ray Tomlinson (1971)</b> – <b>@</b> ચિહ્નનો ઉપયોગ શરૂ કર્યો</li><li>સરનામું: <b>username@domain</b> (દા.ત. student@gmail.com)</li><li><b>To</b>: મુખ્ય પ્રાપ્તકર્તા; <b>CC</b> (Carbon Copy): બધા જોઈ શકે; <b>BCC</b> (Blind Carbon Copy): છુપા પ્રાપ્તકર્તા</li><li><b>Protocols</b>: <b>SMTP</b> (મોકલવા), <b>POP3</b> (ડાઉનલોડ કરી સર્વર પરથી દૂર), <b>IMAP</b> (સર્વર પર રાખી સિંક)</li><li><b>Attachment</b>, <b>Spam</b> (અનિચ્છનીય મેઇલ), <b>Signature</b></li></ul><div class=\"tk\"><i>★</i><span>BCC = \"<b>છુપી નકલ</b>\" – બીજા પ્રાપ્તકર્તા જોઈ શકતા નથી</span></div>"],["દૃશ્ય-શ્રાવ્ય Conferencing","<ul><li><b>Audio conferencing</b>: ફોન/VoIP દ્વારા બહુ-પક્ષીય વાતચીત</li><li><b>Video conferencing</b>: Zoom, Google Meet, Microsoft Teams, Cisco Webex, Jitsi (Open-source)</li><li><b>Webinar</b>: Web + Seminar – એક-થી-અનેક પ્રસ્તુતિ</li><li>જરૂરિયાત: કેમેરા, માઇક, સ્પીકર, <b>પૂરતી Bandwidth</b>, સોફ્ટવેર</li><li>સુવિધાઓ: Screen sharing, Chat, Recording, Breakout rooms, Whiteboard, Polls</li><li><b>Latency</b> (વિલંબ) અને <b>Bandwidth</b> ગુણવત્તા નક્કી કરે</li></ul>"],["નેટવર્કના પ્રકાર અને Topology","<div class=\"tw\"><table><thead><tr><th>નેટવર્ક</th><th>વિસ્તાર</th></tr></thead><tbody><tr><td>PAN</td><td>વ્યક્તિગત (Bluetooth) – થોડા મીટર</td></tr><tr><td>LAN</td><td>એક ઇમારત/કેમ્પસ</td></tr><tr><td>MAN</td><td>શહેર</td></tr><tr><td>WAN</td><td>દેશ/વિશ્વ (ઇન્ટરનેટ = સૌથી મોટું WAN)</td></tr></tbody></table></div><ul><li><b>Topology</b>: <b>Bus, Star</b> (સૌથી સામાન્ય, Hub/Switch કેન્દ્રમાં), <b>Ring, Mesh</b> (સૌથી વિશ્વસનીય), <b>Tree, Hybrid</b></li><li>ઉપકરણ: <b>Router</b> (નેટવર્ક જોડે), <b>Switch</b>, <b>Hub</b>, <b>Modem</b> (Modulator-Demodulator), <b>Repeater</b>, <b>Gateway</b></li></ul>"],["ઇન્ટરનેટ જોડાણના પ્રકાર","<ul><li><b>Dial-up</b> (જૂનું, ધીમું), <b>DSL/Broadband</b>, <b>Fibre (FTTH)</b> – સૌથી ઝડપી સ્થિર</li><li><b>Mobile</b>: 2G, 3G, <b>4G (LTE)</b>, <b>5G</b> (ભારતમાં 1 ઓક્ટોબર 2022 થી)</li><li><b>Wi-Fi</b>, <b>Satellite internet</b></li><li><b>Bandwidth</b>: bps (bits per second) – Kbps, Mbps, Gbps</li><li><b>BharatNet</b>: ગ્રામ પંચાયતોને ઓપ્ટિકલ ફાઇબર</li><li><b>NKN</b> (National Knowledge Network, 2010): શૈક્ષણિક-સંશોધન સંસ્થાઓનું ઉચ્ચ ઝડપ નેટવર્ક</li></ul>"],["સાયબર સુરક્ષા (Cyber Security)","<div class=\"tw\"><table><thead><tr><th>ખતરો</th><th>અર્થ</th></tr></thead><tbody><tr><td><b>Phishing</b></td><td>નકલી ઇમેઇલ/વેબસાઇટથી પાસવર્ડ ચોરી</td></tr><tr><td><b>Malware</b></td><td>હાનિકારક સોફ્ટવેર</td></tr><tr><td><b>Ransomware</b></td><td>ફાઇલ લૉક કરી ખંડણી</td></tr><tr><td><b>Spam</b></td><td>અનિચ્છનીય સામૂહિક સંદેશ</td></tr><tr><td><b>Hacking</b></td><td>અનધિકૃત પ્રવેશ</td></tr><tr><td><b>DoS/DDoS</b></td><td>સર્વર પર અતિશય ટ્રાફિકથી સેવા બંધ</td></tr><tr><td><b>Identity theft</b></td><td>ઓળખ ચોરી</td></tr></tbody></table></div><ul><li>સુરક્ષા: મજબૂત પાસવર્ડ, <b>2FA</b>, Antivirus, Firewall, HTTPS, Encryption, Backup</li><li>ભારત: <b>CERT-In</b> (Indian Computer Emergency Response Team), <b>Cyber crime helpline 1930</b></li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Internet</b></td><td>Worldwide interconnected network of networks</td></tr><tr><td><b>Intranet</b></td><td>Private internal organisational network</td></tr><tr><td><b>Email</b></td><td>Electronic exchange of messages</td></tr><tr><td><b>Browser</b></td><td>Software accessing web content</td></tr><tr><td><b>Search engine</b></td><td>Service finding indexed online information</td></tr><tr><td><b>Video conference</b></td><td>Remote interaction using video and audio</td></tr><tr><td><b>Attachment</b></td><td>File included with a message</td></tr><tr><td><b>Spam</b></td><td>Unsolicited bulk electronic messages</td></tr><tr><td><b>Phishing</b></td><td>Deceptive attempt to obtain sensitive information</td></tr><tr><td><b>HTTPS</b></td><td>HTTP carried over a secured connection</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>ARPANET = 1969; WWW = Tim Berners-Lee (CERN)</li><li>Intranet = ખાનગી, સંસ્થા અંદર</li><li>IPv4 = 32 bit; IPv6 = 128 bit</li><li>DNS = નામ → IP</li><li>SMTP = મોકલવું; POP3/IMAP = મેળવવું</li><li>BCC = છુપી નકલ; @ = Ray Tomlinson</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Phishing એ ઇમેઇલ/વેબસાઇટ છેતરપિંડી છે; Vishing = Voice (ફોન), Smishing = SMS.</span></div>"]],"8-2":[["ઉચ્ચ શિક્ષણમાં ડિજિટલ પહેલ – પરિચય","<p>ભારત સરકાર (શિક્ષણ મંત્રાલય, UGC, AICTE, INFLIBNET) એ ઉચ્ચ શિક્ષણમાં <b>પહોંચ (Access), સમાનતા (Equity) અને ગુણવત્તા (Quality)</b> વધારવા અનેક ડિજિટલ પહેલો શરૂ કરી છે.</p><ul><li>મૂળ ઢાંચો: <b>NMEICT</b> (National Mission on Education through ICT, <b>2009</b>)</li><li>NEP 2020: ટેકનોલોજી સંકલિત શિક્ષણ, <b>NETF</b> (National Educational Technology Forum)</li><li><b>Digital India</b> (1 જુલાઈ 2015)</li></ul><div class=\"tk\"><i>★</i><span>ત્રણ સ્તંભ: Access – Equity – Quality</span></div>"],["SWAYAM, SWAYAM Prabha અને NPTEL","<div class=\"tw\"><table><thead><tr><th>પહેલ</th><th>વિગત</th></tr></thead><tbody><tr><td><b>SWAYAM</b></td><td>MOOC પ્લેટફોર્મ, 9 જુલાઈ 2017; ધો. 9 થી PG; 4 quadrants</td></tr><tr><td><b>SWAYAM Prabha</b></td><td>DTH દ્વારા 24×7 શૈક્ષણિક TV ચેનલો (શરૂઆતમાં 32) – GSAT-15 ઉપગ્રહ; BISAG-N, ગાંધીનગર</td></tr><tr><td><b>NPTEL</b></td><td>IITs + IISc, 2003 – ઇજનેરી અને વિજ્ઞાન કોર્સ</td></tr><tr><td><b>e-PG Pathshala</b></td><td>UGC-INFLIBNET – 70+ વિષયોમાં અનુસ્નાતક e-content</td></tr><tr><td><b>CEC</b></td><td>Consortium for Educational Communication – સ્નાતક e-content, Vyas ચેનલ</td></tr></tbody></table></div><ul><li>UGC: SWAYAM કોર્સ દ્વારા સત્રમાં <b>40% સુધી</b> ક્રેડિટ</li></ul>"],["પુસ્તકાલય અને સંશોધન પહેલ (INFLIBNET)","<ul><li><b>Shodhganga</b>: Ph.D શોધનિબંધ ભંડાર</li><li><b>Shodhgangotri</b>: સંશોધન પ્રસ્તાવ/Synopsis</li><li><b>e-ShodhSindhu</b>: e-journals consortium (UGC-INFONET + NLIST + INDEST નું વિલીનીકરણ)</li><li><b>ONOS – One Nation One Subscription</b> (નવેમ્બર 2024 મંજૂર, 2025 થી): વૈશ્વિક સામયિકોની રાષ્ટ્રીય સ્તરે મફત પહોંચ</li><li><b>NDLI</b> (National Digital Library of India): IIT Kharagpur</li><li><b>Vidwan</b>: નિષ્ણાત ડેટાબેઝ; <b>IRINS</b>: સંસ્થાકીય સંશોધન માહિતી</li><li><b>INFLIBNET</b>: ગાંધીનગર (1991)</li></ul>"],["શૈક્ષણિક વહીવટ અને ક્રેડિટ પહેલ","<ul><li><b>ABC (Academic Bank of Credits)</b>: 2021 – ડિજિટલ ક્રેડિટ સંગ્રહ; બહુવિધ પ્રવેશ-નિર્ગમન (Multiple entry-exit)</li><li><b>APAAR ID</b>: Automated Permanent Academic Account Registry – \"One Nation One Student ID\"</li><li><b>DigiLocker / NAD</b>: National Academic Depository – ડિજિટલ પ્રમાણપત્રો</li><li><b>Samarth e-Gov</b>: યુનિવર્સિટી વહીવટ માટે ERP (દિલ્હી યુનિવર્સિટી)</li><li><b>NIRF</b> (2015, પ્રથમ ક્રમાંક 2016): સંસ્થાઓનો રાષ્ટ્રીય ક્રમાંક</li><li><b>AISHE</b>: All India Survey on Higher Education (2010-11 થી)</li></ul><div class=\"tk\"><i>★</i><span>ABC = \"<b>ક્રેડિટની બેંક</b>\", APAAR = \"<b>વિદ્યાર્થીનો કાયમી ID</b>\"</span></div>"],["શિક્ષક અને વિદ્યાર્થી સહાય પહેલ","<ul><li><b>ARPIT</b> (2018): Annual Refresher Programme in Teaching – SWAYAM દ્વારા શિક્ષકો માટે</li><li><b>PMMMNMTT</b>: Pandit Madan Mohan Malaviya National Mission on Teachers and Teaching (2014)</li><li><b>DIKSHA</b> (2017): શિક્ષકો/શાળા માટે ડિજિટલ પ્લેટફોર્મ – \"One Nation One Digital Platform\"</li><li><b>PM eVIDYA</b> (2020): ડિજિટલ/ઓનલાઇન શિક્ષણનું એકીકરણ</li><li><b>NEAT</b> (2019): AICTE – EdTech સાથે ભાગીદારી</li><li><b>Virtual Labs</b>: IITs – online પ્રયોગશાળા</li><li><b>Spoken Tutorial</b>: IIT Bombay – IT કૌશલ્ય</li></ul>"],["જોડાણ અને માળખું","<ul><li><b>NKN (National Knowledge Network)</b>: 2010 – સંશોધન અને શૈક્ષણિક સંસ્થાઓનું ઉચ્ચ ઝડપ નેટવર્ક</li><li><b>Baadal</b>: IIT Delhi cloud; <b>MeghRaj</b>: સરકારી cloud</li><li><b>Aakash tablet</b> (2011): સસ્તું ટેબ્લેટ (NMEICT)</li><li><b>e-Yantra</b>: IIT Bombay – Robotics</li><li><b>FOSSEE</b>: Free/Libre Open Source Software for Education – IIT Bombay</li><li><b>Talk to a Teacher</b>: IIT Bombay</li></ul>"],["નવા પ્રયાસો (NEP 2020 પછી)","<ul><li><b>National Digital University</b> ની જાહેરાત (Budget 2022)</li><li><b>Online degree</b>: UGC (2020/2022) – NAAC A+ / NIRF ટોપ-100 સંસ્થાઓ online degree આપી શકે</li><li><b>Bhashini / Anuvadini</b>: ભારતીય ભાષાઓમાં અનુવાદ (AI)</li><li><b>SWAYAM Plus</b> (2024): ઉદ્યોગ સાથે રોજગારલક્ષી કોર્સ</li><li><b>PM e-Vidya – One Class One Channel</b></li><li><b>NETF</b>: ટેકનોલોજી પર સલાહ (NEP 2020)</li></ul>"],["યાદ રાખવાનું કોષ્ટક","<div class=\"tw\"><table><thead><tr><th>પહેલ</th><th>સંસ્થા/વર્ષ</th></tr></thead><tbody><tr><td>NMEICT</td><td>2009</td></tr><tr><td>NPTEL</td><td>IITs + IISc, 2003</td></tr><tr><td>SWAYAM</td><td>2017</td></tr><tr><td>NKN</td><td>2010</td></tr><tr><td>Shodhganga</td><td>INFLIBNET (2011 આસપાસ)</td></tr><tr><td>NDLI</td><td>IIT Kharagpur</td></tr><tr><td>ARPIT</td><td>2018</td></tr><tr><td>DIKSHA</td><td>2017</td></tr><tr><td>ABC</td><td>2021</td></tr><tr><td>NIRF</td><td>2015</td></tr></tbody></table></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>SWAYAM</b></td><td>Indian platform for online courses</td></tr><tr><td><b>SWAYAM Prabha</b></td><td>Educational television broadcasting initiative</td></tr><tr><td><b>LMS</b></td><td>Learning Management System</td></tr><tr><td><b>Digital library</b></td><td>Managed collection of digital resources</td></tr><tr><td><b>Open educational resources</b></td><td>Learning resources with open-use permissions</td></tr><tr><td><b>Virtual lab</b></td><td>Digital environment for practical work</td></tr><tr><td><b>Accessibility</b></td><td>Usability for people with diverse abilities</td></tr><tr><td><b>Asynchronous course</b></td><td>Course allowing participation at different times</td></tr><tr><td><b>Blended course</b></td><td>Course combining online and face-to-face learning</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>SWAYAM = MOOC (2017); SWAYAM Prabha = DTH TV ચેનલો</li><li>NPTEL = ઇજનેરી (IITs); e-PG Pathshala = UGC-INFLIBNET</li><li>Shodhganga = Ph.D thesis; INFLIBNET = ગાંધીનગર</li><li>ABC = ક્રેડિટ બેંક; APAAR = વિદ્યાર્થી ID</li><li>ARPIT = શિક્ષક refresher (SWAYAM પર)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: DIKSHA મુખ્યત્વે <b>શાળા શિક્ષકો</b> માટે છે; ARPIT ઉચ્ચ શિક્ષણ શિક્ષકો માટે.</span></div>"]],"8-3":[["ICT અને શાસન (e-Governance) – પરિચય","<p><b>ઇ-શાસન (e-Governance)</b> એટલે સરકારી સેવાઓ, માહિતી અને વ્યવહારો નાગરિકો, વ્યવસાયો અને સરકારી વિભાગો સુધી ICT દ્વારા પહોંચાડવા.</p><ul><li>હેતુ: <b>SMART</b> શાસન – <b>S</b>imple, <b>M</b>oral, <b>A</b>ccountable, <b>R</b>esponsive, <b>T</b>ransparent</li><li>ફાયદા: પારદર્શિતા, ઝડપ, ભ્રષ્ટાચાર ઘટાડો, ખર્ચ ઘટાડો, ગમે ત્યાંથી સેવા</li></ul><div class=\"tk\"><i>★</i><span>SMART = \"<b>સરળ, નૈતિક, જવાબદાર, પ્રતિભાવશીલ, પારદર્શક</b>\"</span></div>"],["ઇ-શાસનના મોડેલ (Interaction types)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>G2C</b></td><td>Government to Citizen</td><td>પાસપોર્ટ, DigiLocker, UMANG</td></tr><tr><td><b>G2B</b></td><td>Government to Business</td><td>GST, GeM, MCA21</td></tr><tr><td><b>G2G</b></td><td>Government to Government</td><td>e-Office, PFMS</td></tr><tr><td><b>G2E</b></td><td>Government to Employee</td><td>પગાર, HRMS, iGOT</td></tr></tbody></table></div><ul><li>★ ટ્રિક: \"<b>C B G E</b>\" – Citizen, Business, Government, Employee</li></ul>"],["ભારતમાં ઇ-શાસનનો વિકાસ","<ul><li><b>NIC</b> (National Informatics Centre): <b>1976</b> – સરકારી ICT નો આધાર</li><li><b>NeGP</b> (National e-Governance Plan): <b>2006</b> – 27 (પછી 31) <b>Mission Mode Projects (MMPs)</b></li><li><b>Digital India</b>: <b>1 જુલાઈ 2015</b> – 9 સ્તંભ (Pillars)</li><li><b>IT Act 2000</b>: ઇલેક્ટ્રોનિક રેકોર્ડ અને ડિજિટલ સહીને કાનૂની માન્યતા</li><li><b>CSC</b> (Common Service Centres): ગ્રામ્ય સ્તરે ડિજિટલ સેવા કેન્દ્રો</li><li>ગુજરાત: <b>e-Gram</b>, <b>SWAGAT</b> (2003 – ફરિયાદ નિવારણ, વીડિયો કોન્ફરન્સ)</li></ul>"],["Digital India – ત્રણ દૃષ્ટિ ક્ષેત્રો","<ul><li><b>1.</b> દરેક નાગરિક માટે <b>ઉપયોગિતા તરીકે ડિજિટલ માળખું</b> (Digital infrastructure as a utility)</li><li><b>2.</b> <b>માંગ પર શાસન અને સેવાઓ</b> (Governance &amp; services on demand)</li><li><b>3.</b> <b>નાગરિકોનું ડિજિટલ સશક્તિકરણ</b> (Digital empowerment)</li><li>9 સ્તંભ: Broadband highways, Universal mobile access, Public internet access, e-Governance, <b>e-Kranti</b>, Information for all, Electronics manufacturing, IT for jobs, Early harvest</li><li><b>e-Kranti</b>: NeGP 2.0</li></ul>"],["India Stack અને મુખ્ય પ્લેટફોર્મ","<div class=\"tw\"><table><thead><tr><th>પ્લેટફોર્મ</th><th>ઉપયોગ</th></tr></thead><tbody><tr><td><b>Aadhaar</b> (UIDAI, 2009)</td><td>12 અંકનો બાયોમેટ્રિક ID</td></tr><tr><td><b>UPI</b> (NPCI, 2016)</td><td>ત્વરિત ડિજિટલ ચુકવણી</td></tr><tr><td><b>DigiLocker</b> (2015)</td><td>ડિજિટલ દસ્તાવેજ સંગ્રહ</td></tr><tr><td><b>UMANG</b> (2017)</td><td>Unified Mobile App for New-age Governance – અનેક સેવા એક એપમાં</td></tr><tr><td><b>e-Sign</b></td><td>ઓનલાઇન ડિજિટલ સહી</td></tr><tr><td><b>DBT</b> (2013)</td><td>સીધા લાભાર્થીના ખાતામાં રકમ</td></tr><tr><td><b>JAM Trinity</b></td><td>Jan Dhan – Aadhaar – Mobile</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>India Stack = \"<b>ઓળખ (Aadhaar) + ચુકવણી (UPI) + દસ્તાવેજ (DigiLocker)</b>\"</span></div>"],["G2B અને G2G મુખ્ય પહેલ","<ul><li><b>GSTN</b>: GST નેટવર્ક (GST અમલ 1 જુલાઈ 2017)</li><li><b>GeM</b> (Government e-Marketplace, 2016): સરકારી ખરીદી</li><li><b>MCA21</b>: કંપની નોંધણી</li><li><b>e-Procurement / CPPP</b></li><li><b>e-Office</b>: કાગળ રહિત કચેરી</li><li><b>PFMS</b>: જાહેર નાણાકીય વ્યવસ્થાપન</li><li><b>iGOT Karmayogi</b> (Mission Karmayogi, 2020): સરકારી કર્મચારી ક્ષમતા નિર્માણ</li></ul>"],["નાગરિક ફરિયાદ અને સહભાગિતા","<ul><li><b>CPGRAMS</b>: Centralised Public Grievance Redress and Monitoring System</li><li><b>MyGov</b> (2014): નાગરિક સહભાગિતા પ્લેટફોર્મ</li><li><b>RTI Online</b> પોર્ટલ</li><li><b>e-Courts</b>, <b>National Judicial Data Grid (NJDG)</b></li><li><b>PRAGATI</b> (2015): PM દ્વારા યોજના સમીક્ષા</li><li><b>e-Panchayat / eGramSwaraj</b></li><li><b>Social media</b> દ્વારા સરકારી પ્રત્યાયન</li></ul>"],["ઇ-શાસનના પડકારો","<ul><li><b>Digital divide</b>: ગ્રામ્ય-શહેરી, લિંગ, આવક આધારિત તફાવત</li><li><b>ડિજિટલ સાક્ષરતા</b> નો અભાવ – PMGDISHA (ગ્રામીણ ડિજિટલ સાક્ષરતા)</li><li><b>સાયબર સુરક્ષા</b> અને ડેટા ગોપનીયતા</li><li>માળખાકીય સમસ્યા: વીજળી, ઇન્ટરનેટ</li><li>ભાષા અવરોધ – <b>Bhashini</b> (ભારતીય ભાષા AI)</li><li>વિભાગો વચ્ચે <b>Interoperability</b> નો અભાવ</li><li>કાયદાકીય માળખું – <b>DPDP Act 2023</b></li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>E-governance</b></td><td>ICT use in public administration and services</td></tr><tr><td><b>Digital divide</b></td><td>Unequal access to digital resources and use</td></tr><tr><td><b>G2C</b></td><td>Government-to-Citizen interaction</td></tr><tr><td><b>G2B</b></td><td>Government-to-Business interaction</td></tr><tr><td><b>G2G</b></td><td>Government-to-Government interaction</td></tr><tr><td><b>Authentication</b></td><td>Verifying a claimed identity</td></tr><tr><td><b>Authorisation</b></td><td>Granting permitted access</td></tr><tr><td><b>Encryption</b></td><td>Encoding information to restrict readable access</td></tr><tr><td><b>Digital signature</b></td><td>Cryptographic authentication and integrity mechanism</td></tr><tr><td><b>Service portal</b></td><td>Online gateway to available services</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>NIC = 1976; NeGP = 2006; Digital India = 2015</li><li>G2C = નાગરિક; G2B = વ્યવસાય (GST, GeM); G2G = સરકાર-સરકાર</li><li>UMANG = અનેક સેવા એક એપ; DigiLocker = દસ્તાવેજ</li><li>JAM = Jan Dhan, Aadhaar, Mobile</li><li>SMART શાસન = Simple, Moral, Accountable, Responsive, Transparent</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: e-Kranti = NeGP 2.0 (Digital India નો સ્તંભ); e-Governance અને e-Government સમાન નથી – Governance વધુ વ્યાપક છે.</span></div>"]],"9-0":[["વિકાસ અને પર્યાવરણ – પરિચય","<p><b>વિકાસ (Development)</b> એટલે માનવ કલ્યાણ, આર્થિક વૃદ્ધિ અને જીવન ગુણવત્તામાં સુધારો. <b>પર્યાવરણ (Environment)</b> = જીવંત (Biotic) અને નિર્જીવ (Abiotic) ઘટકોનું સંયોજન.</p><ul><li>વિકાસ અને પર્યાવરણ વચ્ચે <b>સંતુલન</b> જરૂરી</li><li><b>માનવ વિકાસ સૂચકાંક (HDI)</b>: UNDP (1990) – <b>Mahbub ul Haq</b> અને <b>Amartya Sen</b>; ત્રણ પરિમાણ: <b>આરોગ્ય (આયુષ્ય), શિક્ષણ, જીવનધોરણ (માથાદીઠ GNI)</b></li><li>Environment શબ્દ ફ્રેન્ચ \"<b>Environner</b>\" (ઘેરવું) પરથી</li></ul><div class=\"tk\"><i>★</i><span>HDI = \"<b>આ-શિ-આ</b>\" – આયુષ્ય, શિક્ષણ, આવક</span></div>"],["ટકાઉ વિકાસ (Sustainable Development)","<ul><li><b>Brundtland Report – \"Our Common Future\" (1987)</b>: \"એવો વિકાસ જે <b>વર્તમાન પેઢીની જરૂરિયાત</b> પૂરી કરે અને <b>ભાવિ પેઢીની</b> પોતાની જરૂરિયાત પૂરી કરવાની ક્ષમતા સાથે સમાધાન ન કરે\"</li><li>અધ્યક્ષ: <b>Gro Harlem Brundtland</b> (નોર્વે) – WCED (World Commission on Environment and Development)</li><li><b>ત્રણ સ્તંભ (Triple Bottom Line)</b>: <b>આર્થિક (Economic), સામાજિક (Social), પર્યાવરણીય (Environmental)</b> – \"<b>3P: People, Planet, Profit/Prosperity</b>\" (John Elkington)</li><li><b>આંતર-પેઢી સમાનતા (Intergenerational equity)</b></li></ul><div class=\"tk\"><i>★</i><span>Brundtland = \"<b>1987, Our Common Future</b>\"</span></div>"],["Millennium Development Goals (MDGs)","<ul><li><b>સપ્ટેમ્બર 2000</b> – UN Millennium Summit; સમયમર્યાદા <b>2015</b></li><li><b>8 ધ્યેયો</b>:</li><li>1. અત્યંત ગરીબી અને ભૂખમરો નાબૂદી</li><li>2. સાર્વત્રિક પ્રાથમિક શિક્ષણ</li><li>3. લિંગ સમાનતા અને મહિલા સશક્તિકરણ</li><li>4. બાળ મૃત્યુદર ઘટાડો</li><li>5. માતૃ આરોગ્ય સુધારણા</li><li>6. HIV/AIDS, મેલેરિયા અને અન્ય રોગો સામે લડત</li><li>7. પર્યાવરણીય ટકાઉપણું</li><li>8. વિકાસ માટે વૈશ્વિક ભાગીદારી</li></ul><div class=\"tk\"><i>★</i><span>MDG = \"<b>8 ધ્યેય, 2000-2015</b>\"</span></div>"],["Sustainable Development Goals (SDGs)","<ul><li><b>25 સપ્ટેમ્બર 2015</b> – UN General Assembly, \"<b>Transforming our World: The 2030 Agenda</b>\"</li><li><b>17 ધ્યેયો, 169 લક્ષ્યો (Targets)</b>, 231 અનન્ય સૂચકો (Indicators); સમયમર્યાદા <b>2030</b></li><li>મૂળ સિદ્ધાંત: \"<b>Leave No One Behind</b>\"</li><li><b>5P</b>: People, Planet, Prosperity, Peace, Partnership</li><li>ભારતમાં નોડલ સંસ્થા: <b>NITI Aayog</b> – <b>SDG India Index</b> (2018 થી)</li></ul><div class=\"tk\"><i>★</i><span>SDG = \"<b>17 – 169 – 2030</b>\"</span></div>"],["17 SDGs – યાદી","<div class=\"tw\"><table><thead><tr><th>ક્રમ</th><th>ધ્યેય</th><th>ક્રમ</th><th>ધ્યેય</th></tr></thead><tbody><tr><td>1</td><td>ગરીબી નાબૂદી (No Poverty)</td><td>10</td><td>અસમાનતા ઘટાડો</td></tr><tr><td>2</td><td>ભૂખમરો નાબૂદી (Zero Hunger)</td><td>11</td><td>ટકાઉ શહેરો અને સમુદાયો</td></tr><tr><td>3</td><td>સારું આરોગ્ય અને કલ્યાણ</td><td>12</td><td>જવાબદાર વપરાશ અને ઉત્પાદન</td></tr><tr><td>4</td><td><b>ગુણવત્તાયુક્ત શિક્ષણ</b></td><td>13</td><td><b>આબોહવા કાર્યવાહી (Climate Action)</b></td></tr><tr><td>5</td><td>લિંગ સમાનતા</td><td>14</td><td>જળ નીચેનું જીવન (Life Below Water)</td></tr><tr><td>6</td><td>સ્વચ્છ પાણી અને સ્વચ્છતા</td><td>15</td><td>જમીન પરનું જીવન (Life on Land)</td></tr><tr><td>7</td><td>સસ્તી અને સ્વચ્છ ઊર્જા</td><td>16</td><td>શાંતિ, ન્યાય અને મજબૂત સંસ્થાઓ</td></tr><tr><td>8</td><td>યોગ્ય કામ અને આર્થિક વૃદ્ધિ</td><td>17</td><td>ધ્યેયો માટે ભાગીદારી</td></tr><tr><td>9</td><td>ઉદ્યોગ, નવીનતા અને માળખું</td><td></td><td></td></tr></tbody></table></div>"],["MDGs vs SDGs – તુલના","<div class=\"tw\"><table><thead><tr><th>મુદ્દો</th><th>MDGs</th><th>SDGs</th></tr></thead><tbody><tr><td>વર્ષ</td><td>2000 – 2015</td><td>2015 – 2030</td></tr><tr><td>ધ્યેય</td><td>8</td><td>17</td></tr><tr><td>લક્ષ્ય</td><td>21</td><td>169</td></tr><tr><td>લાગુ</td><td>મુખ્યત્વે વિકાસશીલ દેશો</td><td><b>બધા દેશો (સાર્વત્રિક)</b></td></tr><tr><td>રચના</td><td>ઉપરથી (નિષ્ણાતો)</td><td><b>સહભાગી</b> (વ્યાપક ચર્ચા)</td></tr><tr><td>પર્યાવરણ</td><td>1 ધ્યેય</td><td>અનેક ધ્યેય (6, 7, 12-15)</td></tr></tbody></table></div><div class=\"tp\"><i>!</i><span>ટ્રેપ: SDGs માત્ર વિકાસશીલ નહીં, વિકસિત દેશોને પણ લાગુ પડે છે.</span></div>"],["પૃથ્વી પરિષદો અને મુખ્ય સીમાચિહ્નો","<div class=\"tw\"><table><thead><tr><th>વર્ષ</th><th>ઘટના</th></tr></thead><tbody><tr><td>1972</td><td><b>Stockholm</b> – UN Conference on Human Environment; <b>UNEP</b> સ્થાપના; <b>5 જૂન = વિશ્વ પર્યાવરણ દિવસ</b></td></tr><tr><td>1972</td><td><b>Club of Rome – \"Limits to Growth\"</b></td></tr><tr><td>1987</td><td>Brundtland Report</td></tr><tr><td>1992</td><td><b>Rio Earth Summit</b> – Agenda 21, UNFCCC, CBD</td></tr><tr><td>2002</td><td><b>Johannesburg</b> – World Summit on Sustainable Development (Rio+10)</td></tr><tr><td>2012</td><td><b>Rio+20</b> – \"The Future We Want\"; SDG પ્રક્રિયા શરૂ</td></tr><tr><td>2015</td><td>SDGs, Paris Agreement, Sendai Framework</td></tr></tbody></table></div>"],["વિકાસના વૈકલ્પિક દૃષ્ટિકોણ અને સૂચકો","<ul><li><b>ગાંધીજી</b>: \"પૃથ્વી દરેકની <b>જરૂરિયાત</b> પૂરી કરી શકે, <b>લાલચ</b> નહીં\"</li><li><b>E.F. Schumacher</b>: \"<b>Small is Beautiful</b>\" (1973)</li><li><b>Green GDP</b>: પર્યાવરણીય નુકસાન બાદ કરેલું GDP</li><li><b>Gross National Happiness</b>: ભૂતાન</li><li><b>Ecological footprint</b>, <b>Carbon footprint</b></li><li><b>Circular economy</b>: Reduce, Reuse, Recycle</li><li><b>LiFE</b> (Lifestyle for Environment): ભારત, COP26 (2021) માં PM મોદી દ્વારા રજૂ</li><li><b>Planetary boundaries</b> (Johan Rockström, 2009): 9 સીમાઓ</li></ul>"],["ભારત અને SDGs","<ul><li><b>NITI Aayog</b>: SDG India Index (2018 થી) – રાજ્યોનો ક્રમાંક</li><li>ભારતની યોજનાઓ: <b>સ્વચ્છ ભારત (2014) – SDG 6</b>, <b>ઉજ્જ્વલા – SDG 7</b>, <b>જલ જીવન મિશન – SDG 6</b>, <b>બેટી બચાવો બેટી પઢાવો – SDG 5</b>, <b>આયુષ્માન ભારત – SDG 3</b>, <b>NEP 2020 – SDG 4</b></li><li><b>Voluntary National Review (VNR)</b>: UN HLPF માં ભારતની પ્રગતિ રજૂઆત</li><li><b>Net Zero</b> લક્ષ્ય: <b>2070</b> (COP26, ગ્લાસગો)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Sustainable development</b></td><td>Meeting present needs without undermining future generations</td></tr><tr><td><b>SDGs</b></td><td>Seventeen goals in the UN 2030 Agenda</td></tr><tr><td><b>MDGs</b></td><td>Eight development goals preceding the SDGs</td></tr><tr><td><b>Intergenerational equity</b></td><td>Fairness between present and future generations</td></tr><tr><td><b>Social sustainability</b></td><td>Long-term wellbeing and social inclusion</td></tr><tr><td><b>Economic sustainability</b></td><td>Viable long-term economic activity</td></tr><tr><td><b>Environmental sustainability</b></td><td>Maintaining ecological systems and resources</td></tr><tr><td><b>Poverty reduction</b></td><td>Lowering deprivation and lack of basic needs</td></tr><tr><td><b>Responsible consumption</b></td><td>Reducing wasteful resource use</td></tr><tr><td><b>Sustainable cities</b></td><td>Settlements integrating social and environmental needs</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Brundtland = 1987, \"Our Common Future\", ટકાઉ વિકાસ વ્યાખ્યા</li><li>MDGs = 8 ધ્યેય, 2000-2015; SDGs = 17 ધ્યેય, 169 લક્ષ્ય, 2015-2030</li><li>SDG 4 = ગુણવત્તાયુક્ત શિક્ષણ; SDG 13 = આબોહવા કાર્યવાહી</li><li>Stockholm 1972 = UNEP, પર્યાવરણ દિવસ 5 જૂન</li><li>HDI = UNDP 1990 – Mahbub ul Haq</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Rio 1992 માં Agenda 21 અપનાવાયો – Agenda 2030 (SDGs) 2015 માં.</span></div>"]],"9-1":[["માનવ-પર્યાવરણ આંતરક્રિયા – પરિચય","<p>માનવ અને પર્યાવરણ વચ્ચે <b>પરસ્પર સંબંધ</b> છે: પર્યાવરણ માનવ જીવનને આકાર આપે અને માનવ પ્રવૃત્તિઓ પર્યાવરણને બદલે છે.</p><ul><li><b>પર્યાવરણીય નિયતિવાદ (Determinism)</b>: પર્યાવરણ માનવને નિયંત્રિત કરે – Ratzel, Ellen Semple</li><li><b>સંભાવનાવાદ (Possibilism)</b>: માનવ પર્યાવરણમાં પસંદગી કરી શકે – <b>Vidal de la Blache</b> (ફ્રાન્સ)</li><li><b>નવ-નિયતિવાદ (Stop-and-go determinism)</b>: <b>Griffith Taylor</b></li><li><b>Anthropocene</b>: માનવ પ્રભુત્વ ધરાવતો ભૂસ્તરીય યુગ – Paul Crutzen</li></ul><div class=\"tk\"><i>★</i><span>નિયતિ = <b>Ratzel</b>; સંભાવના = <b>Vidal de la Blache</b></span></div>"],["માનવ પ્રવૃત્તિઓ – પ્રકાર","<div class=\"tw\"><table><thead><tr><th>પ્રવૃત્તિ</th><th>પર્યાવરણીય અસર</th></tr></thead><tbody><tr><td><b>કૃષિ</b></td><td>વનનાશ, જમીન ધોવાણ, રાસાયણિક ખાતર-જંતુનાશક, જળ પ્રદૂષણ, મિથેન (ડાંગર)</td></tr><tr><td><b>ઉદ્યોગ</b></td><td>હવા-જળ પ્રદૂષણ, ઘન કચરો, ઝેરી રસાયણો</td></tr><tr><td><b>શહેરીકરણ</b></td><td>Heat island, ગીચતા, કચરો, કોંક્રિટીકરણ</td></tr><tr><td><b>ખાણકામ</b></td><td>જમીન ક્ષય, વનનાશ, Acid mine drainage</td></tr><tr><td><b>પરિવહન</b></td><td>હવા પ્રદૂષણ, ઘોંઘાટ, CO₂</td></tr><tr><td><b>ઊર્જા ઉત્પાદન</b></td><td>અશ્મિભૂત બળતણ – ગ્રીનહાઉસ વાયુ</td></tr><tr><td><b>પ્રવાસન</b></td><td>કચરો, જૈવ વિવિધતા પર દબાણ</td></tr></tbody></table></div>"],["વનનાશ (Deforestation)","<ul><li><b>કારણો</b>: કૃષિ વિસ્તરણ, લાકડું, ખાણકામ, શહેરીકરણ, બંધ, ઝૂમ ખેતી (Shifting cultivation)</li><li><b>અસરો</b>: જૈવ વિવિધતા નાશ, જમીન ધોવાણ, પૂર, વરસાદમાં ફેરફાર, આબોહવા પરિવર્તન (CO₂ શોષણ ઘટે)</li><li>ભારતમાં વન આવરણ: <b>ISFR (India State of Forest Report)</b> – FSI, દ્વિવાર્ષિક; વન + વૃક્ષ આવરણ આશરે <b>25%</b></li><li>રાષ્ટ્રીય વન નીતિ <b>1988</b>: <b>33%</b> વિસ્તાર વન/વૃક્ષ હેઠળ લક્ષ્ય</li><li><b>Chipko Andolan (1973)</b>: ઉત્તરાખંડ – સુંદરલાલ બહુગુણા, ચંડીપ્રસાદ ભટ્ટ, ગૌરા દેવી</li></ul><div class=\"tk\"><i>★</i><span>વન નીતિ = \"<b>33% લક્ષ્ય</b>\"</span></div>"],["જમીન ઉપયોગ પરિવર્તન અને આવાસ વિભાજન","<ul><li><b>Land-use change</b>: વન → ખેતી → શહેર</li><li><b>Habitat fragmentation</b>: રસ્તા, રેલ, બંધથી આવાસ ટુકડામાં વહેંચાય → પ્રાણીઓની ગતિ અવરોધાય</li><li><b>Edge effect</b>: ટુકડાની ધાર પર જુદી પરિસ્થિતિ</li><li><b>Wildlife corridors</b>: આવાસ જોડવા</li><li><b>જૈવ વિવિધતા નાશના મુખ્ય કારણો – \"HIPPO\"</b>: <b>H</b>abitat loss, <b>I</b>nvasive species, <b>P</b>ollution, <b>P</b>opulation, <b>O</b>verexploitation (E.O. Wilson)</li></ul><div class=\"tk\"><i>★</i><span>HIPPO = જૈવ વિવિધતાના 5 દુશ્મન</span></div>"],["અતિશોષણ અને જળ સંસાધન","<ul><li><b>Overexploitation</b>: પુનઃપૂર્તિ કરતાં વધુ ઉપયોગ – અતિ માછીમારી, ભૂગર્ભજળ, શિકાર</li><li><b>Tragedy of the Commons</b> (<b>Garrett Hardin, 1968</b>): સહિયારા સંસાધનનો વ્યક્તિગત સ્વાર્થથી નાશ</li><li><b>Elinor Ostrom</b> (નોબેલ 2009): સમુદાય દ્વારા સહિયારા સંસાધનનું સફળ સંચાલન</li><li>ભૂગર્ભજળ: ભારત વિશ્વમાં <b>સૌથી વધુ</b> ભૂગર્ભજળ ઉપયોગકર્તા</li><li><b>Desertification</b>: શુષ્ક વિસ્તારમાં જમીન ક્ષય – UNCCD (1994)</li><li><b>Waterlogging અને Salinisation</b>: વધુ સિંચાઈથી</li></ul>"],["અશ્મિભૂત બળતણ દહન અને ઔદ્યોગિકીકરણ","<ul><li>કોલસો, પેટ્રોલિયમ, કુદરતી ગેસ → <b>CO₂, SO₂, NOx, PM</b></li><li><b>ગ્રીનહાઉસ અસર</b> → વૈશ્વિક તાપમાન વધારો</li><li><b>એસિડ વર્ષા</b>: SO₂ અને NOx → H₂SO₄, HNO₃; pH &lt; <b>5.6</b></li><li><b>Industrial Revolution</b> (18મી સદી, ઇંગ્લેન્ડ) થી CO₂ માં તીવ્ર વધારો; પૂર્વ-ઔદ્યોગિક ~280 ppm → હાલ <b>420+ ppm</b></li><li><b>Keeling Curve</b>: Mauna Loa (હવાઈ) – CO₂ માપન (1958 થી)</li></ul>"],["શહેરીકરણની અસરો","<ul><li><b>Urban Heat Island</b>: શહેર આસપાસના ગ્રામ્ય વિસ્તાર કરતાં ગરમ</li><li><b>Urban sprawl</b>: અનિયોજિત વિસ્તરણ</li><li>ઝૂંપડપટ્ટી, ગીચતા, ટ્રાફિક, કચરો</li><li><b>Urban flooding</b>: કોંક્રિટથી પાણી શોષાય નહીં</li><li>ભારત: <b>Smart Cities Mission (2015)</b>, <b>AMRUT (2015)</b>, <b>સ્વચ્છ ભારત (2014)</b></li><li>વિશ્વની 50% થી વધુ વસ્તી શહેરોમાં (2007 થી)</li></ul>"],["પરિસ્થિતિ તંત્ર (Ecosystem) ની મૂળભૂત સમજ","<ul><li><b>Ecosystem</b> શબ્દ: <b>A.G. Tansley (1935)</b></li><li><b>Ecology</b> શબ્દ: <b>Ernst Haeckel (1866)</b></li><li>ઘટકો: <b>ઉત્પાદક (Producers)</b> → <b>ઉપભોક્તા (Consumers)</b> → <b>વિઘટકો (Decomposers)</b></li><li><b>ઊર્જા પ્રવાહ</b>: એક-દિશામાં; <b>10% નિયમ</b> (Lindeman) – દરેક પોષક સ્તરે માત્ર 10% ઊર્જા આગળ</li><li><b>Biomagnification</b>: ખોરાક શૃંખલામાં ઉપર જતાં ઝેરી પદાર્થ (DDT, પારો) ની સાંદ્રતા વધે</li><li><b>Carrying capacity</b>: પર્યાવરણ ટકાવી શકે તેવી મહત્તમ વસ્તી</li></ul><div class=\"tk\"><i>★</i><span>Lindeman = \"<b>10% ઊર્જા નિયમ</b>\"</span></div>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Deforestation</b></td><td>Removal of forest cover</td></tr><tr><td><b>Urbanisation</b></td><td>Growth of urban settlements</td></tr><tr><td><b>Habitat fragmentation</b></td><td>Division of habitat into separated areas</td></tr><tr><td><b>Land-use change</b></td><td>Alteration of how land is used</td></tr><tr><td><b>Fossil-fuel combustion</b></td><td>Burning fuels such as coal and petroleum</td></tr><tr><td><b>Overexploitation</b></td><td>Use exceeding replenishment capacity</td></tr><tr><td><b>Conservation</b></td><td>Protection and responsible resource use</td></tr><tr><td><b>Afforestation</b></td><td>Establishing forest on non-forest land</td></tr><tr><td><b>Carbon footprint</b></td><td>Greenhouse-gas emissions associated with an activity</td></tr><tr><td><b>Ecological restoration</b></td><td>Assisting recovery of damaged ecosystems</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Possibilism = Vidal de la Blache; Determinism = Ratzel</li><li>Tragedy of Commons = Garrett Hardin (1968)</li><li>HIPPO = જૈવ વિવિધતા નાશના 5 કારણ</li><li>વન નીતિ 1988 = 33% લક્ષ્ય; Chipko = 1973</li><li>એસિડ વર્ષા pH &lt; 5.6</li><li>Ecosystem = Tansley; Ecology = Haeckel</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Biomagnification (ખોરાક શૃંખલામાં વધારો) અને Bioaccumulation (એક જીવમાં સમય સાથે સંચય) જુદા છે.</span></div>"]],"9-2":[["પર્યાવરણીય સમસ્યાઓ – પરિચય","<p>પર્યાવરણીય સમસ્યાઓ ત્રણ સ્તરે જોવા મળે છે:</p><ul><li><b>સ્થાનિક (Local)</b>: ગામ/શહેરનો કચરો, ઘોંઘાટ, તળાવ પ્રદૂષણ</li><li><b>પ્રાદેશિક (Regional)</b>: એસિડ વર્ષા, નદી પ્રદૂષણ (ગંગા), ધુમ્મસ (Smog), દુષ્કાળ</li><li><b>વૈશ્વિક (Global)</b>: આબોહવા પરિવર્તન, ઓઝોન ક્ષય, જૈવ વિવિધતા નાશ, સમુદ્ર પ્રદૂષણ</li></ul><div class=\"tk\"><i>★</i><span>\"<b>Think globally, act locally</b>\" – René Dubos</span></div>"],["હવા પ્રદૂષણ (Air Pollution)","<div class=\"tw\"><table><thead><tr><th>પ્રદૂષક</th><th>સ્રોત</th></tr></thead><tbody><tr><td><b>PM₁₀ / PM₂.₅</b></td><td>વાહન, બાંધકામ, ધૂળ, પરાળી બાળવી</td></tr><tr><td><b>SO₂</b></td><td>કોલસા આધારિત વીજ મથક</td></tr><tr><td><b>NOx</b></td><td>વાહન, ઉદ્યોગ</td></tr><tr><td><b>CO</b></td><td>અપૂર્ણ દહન</td></tr><tr><td><b>O₃ (ભૂમિ સ્તરે)</b></td><td>ગૌણ પ્રદૂષક – NOx + VOC + સૂર્યપ્રકાશ</td></tr><tr><td><b>Lead (Pb)</b></td><td>જૂનું પેટ્રોલ, બેટરી</td></tr></tbody></table></div><ul><li><b>પ્રાથમિક</b> (સીધા ઉત્સર્જિત) vs <b>ગૌણ</b> (વાતાવરણમાં રચાય – O₃, PAN, એસિડ વર્ષા)</li><li><b>NAAQS</b> માં <b>12 પ્રદૂષકો</b>; <b>AQI</b> માં 8 પ્રદૂષકો – 6 શ્રેણી</li><li><b>NCAP</b> (National Clean Air Programme): <b>2019</b></li></ul>"],["AQI શ્રેણીઓ (ભારત, CPCB)","<div class=\"tw\"><table><thead><tr><th>AQI</th><th>શ્રેણી</th></tr></thead><tbody><tr><td>0 – 50</td><td>સારું (Good)</td></tr><tr><td>51 – 100</td><td>સંતોષકારક (Satisfactory)</td></tr><tr><td>101 – 200</td><td>મધ્યમ (Moderate)</td></tr><tr><td>201 – 300</td><td>ખરાબ (Poor)</td></tr><tr><td>301 – 400</td><td>ખૂબ ખરાબ (Very Poor)</td></tr><tr><td>401 – 500</td><td>ગંભીર (Severe)</td></tr></tbody></table></div><ul><li>AQI શરૂઆત: <b>2014</b> (Swachh Bharat હેઠળ)</li><li>AQI ના 8 પ્રદૂષક: PM₁₀, PM₂.₅, NO₂, SO₂, CO, O₃, NH₃, Pb</li></ul><div class=\"tk\"><i>★</i><span>\"<b>50-100-200-300-400-500</b>\"</span></div>"],["જળ અને જમીન પ્રદૂષણ","<ul><li><b>જળ પ્રદૂષણ સ્રોત</b>: ગટર, ઔદ્યોગિક કચરો, કૃષિ વહેણ (ખાતર), તેલ ઢોળાવ</li><li><b>BOD (Biochemical Oxygen Demand)</b>: કાર્બનિક પ્રદૂષણ માપ; <b>BOD વધુ → પ્રદૂષણ વધુ</b></li><li><b>DO (Dissolved Oxygen)</b>: ઓછો DO → જળચર જીવન જોખમમાં</li><li><b>Eutrophication</b>: નાઇટ્રેટ-ફોસ્ફેટથી લીલ (Algal bloom) વધે → ઓક્સિજન ઘટે</li><li><b>જમીન પ્રદૂષણ</b>: જંતુનાશક, ભારે ધાતુ, પ્લાસ્ટિક, ઔદ્યોગિક કચરો</li><li><b>Namami Gange (2014)</b>: ગંગા સફાઈ</li></ul><div class=\"tk\"><i>★</i><span>BOD ↑ = <b>પ્રદૂષણ ↑</b>; DO ↓ = <b>પ્રદૂષણ ↑</b></span></div>"],["ઘન કચરો (Solid Waste)","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>જૈવ વિઘટનીય (Biodegradable)</b></td><td>રસોડાનો કચરો, કાગળ</td></tr><tr><td><b>અવિઘટનીય (Non-biodegradable)</b></td><td>પ્લાસ્ટિક, કાચ, ધાતુ</td></tr><tr><td><b>જોખમી (Hazardous)</b></td><td>રસાયણ, બેટરી</td></tr><tr><td><b>ઇ-કચરો (E-waste)</b></td><td>કમ્પ્યુટર, મોબાઇલ – પારો, સીસું, કેડમિયમ</td></tr><tr><td><b>જૈવ-તબીબી (Bio-medical)</b></td><td>હોસ્પિટલનો કચરો</td></tr></tbody></table></div><ul><li>નિયમો: <b>SWM Rules 2016</b>, <b>Plastic Waste Management Rules 2016</b> (Single-use plastic પ્રતિબંધ 1 જુલાઈ 2022), <b>E-Waste Rules 2016/2022</b>, <b>Bio-Medical Waste Rules 2016</b></li><li><b>5R</b>: Refuse, Reduce, Reuse, Repurpose, Recycle</li><li><b>EPR</b> (Extended Producer Responsibility): ઉત્પાદકની જવાબદારી</li></ul>"],["આબોહવા પરિવર્તન (Climate Change)","<ul><li><b>ગ્રીનહાઉસ વાયુ (GHGs)</b>: <b>CO₂, CH₄ (મિથેન), N₂O, HFCs, PFCs, SF₆</b> (Kyoto ના 6) + જળ બાષ્પ</li><li><b>Global Warming Potential (GWP)</b>: CO₂ = 1; CH₄ ≈ 28; N₂O ≈ 265; SF₆ સૌથી વધુ (~23,500)</li><li><b>IPCC</b> (1988): UNEP + WMO; AR6 (2021-23) – પૂર્વ-ઔદ્યોગિક કરતાં આશરે <b>1.1°C</b> વધારો</li><li>અસરો: હિમનદી પીગળવી, <b>સમુદ્ર સપાટી વધારો</b>, આત્યંતિક હવામાન, <b>સમુદ્ર એસિડીકરણ</b>, Coral bleaching, ખોરાક સુરક્ષા જોખમ</li><li><b>Mitigation</b> (ઉત્સર્જન ઘટાડો) vs <b>Adaptation</b> (અસરો સાથે અનુકૂલન)</li></ul><div class=\"tk\"><i>★</i><span>CO₂ = સૌથી વધુ પ્રમાણ; SF₆ = સૌથી વધુ GWP</span></div>"],["ઓઝોન ક્ષય (Ozone Depletion)","<ul><li>ઓઝોન સ્તર: <b>સમતાપ મંડળ (Stratosphere)</b>, 15-35 કિમી – UV-B કિરણોથી રક્ષણ</li><li>માપ: <b>Dobson Unit (DU)</b>; 220 DU થી ઓછું = <b>ઓઝોન છિદ્ર</b></li><li>મુખ્ય કારણ: <b>CFCs</b> (Chlorofluorocarbons) – એક Cl પરમાણુ હજારો O₃ નાશ કરે; Halons, CCl₄</li><li>ઓઝોન છિદ્ર: <b>એન્ટાર્કટિકા</b> ઉપર (1985 માં શોધ – Farman, Gardiner, Shanklin)</li><li><b>Vienna Convention (1985)</b> અને <b>Montreal Protocol (1987)</b></li><li><b>16 સપ્ટેમ્બર</b> = વિશ્વ ઓઝોન દિવસ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: ભૂમિ સ્તરનો ઓઝોન (Troposphere) = <b>પ્રદૂષક</b>; સમતાપ મંડળનો = <b>રક્ષક</b>.</span></div>"],["અન્ય પર્યાવરણીય સમસ્યાઓ","<ul><li><b>ઘોંઘાટ પ્રદૂષણ</b>: Decibel (dB) – WHO મુજબ 65 dB થી વધુ હાનિકારક; Noise Rules 2000</li><li><b>થર્મલ પ્રદૂષણ</b>: વીજ મથકનું ગરમ પાણી</li><li><b>કિરણોત્સર્ગી પ્રદૂષણ</b>: ચેર્નોબિલ (1986), ફુકુશિમા (2011)</li><li><b>પ્રકાશ પ્રદૂષણ</b></li><li><b>સમુદ્રી પ્લાસ્ટિક</b>: Great Pacific Garbage Patch</li><li><b>જૈવ વિવિધતા નાશ</b>: છઠ્ઠું સામૂહિક વિલોપન (Sixth mass extinction)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Air pollution</b></td><td>Harmful contamination of the atmosphere</td></tr><tr><td><b>Water pollution</b></td><td>Harmful contamination of water bodies</td></tr><tr><td><b>Soil pollution</b></td><td>Harmful contamination of soil</td></tr><tr><td><b>Noise pollution</b></td><td>Unwanted or excessive sound</td></tr><tr><td><b>Eutrophication</b></td><td>Excess nutrients causing aquatic ecological imbalance</td></tr><tr><td><b>Biomedical waste</b></td><td>Waste from healthcare-related activities</td></tr><tr><td><b>Electronic waste</b></td><td>Discarded electrical or electronic equipment</td></tr><tr><td><b>Hazardous waste</b></td><td>Waste with properties posing significant harm</td></tr><tr><td><b>Climate change</b></td><td>Long-term change in climatic conditions</td></tr><tr><td><b>Acid rain</b></td><td>Acidic deposition associated with certain air pollutants</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>સ્થાનિક = કચરો; પ્રાદેશિક = એસિડ વર્ષા; વૈશ્વિક = આબોહવા પરિવર્તન, ઓઝોન</li><li>AQI 0-50 સારું, 401-500 ગંભીર; NCAP = 2019</li><li>BOD વધુ = પ્રદૂષણ વધુ</li><li>CFC = ઓઝોન ક્ષય; Dobson Unit</li><li>IPCC = 1988 (UNEP + WMO)</li><li>6 GHGs (Kyoto): CO₂, CH₄, N₂O, HFCs, PFCs, SF₆</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: CFCs ઓઝોન નાશ કરે છે અને ગ્રીનહાઉસ વાયુ પણ છે; પણ CO₂ ઓઝોન નાશ કરતો નથી.</span></div>"]],"9-3":[["પ્રદૂષણ અને માનવ સ્વાસ્થ્ય – પરિચય","<p>પર્યાવરણીય પ્રદૂષણ માનવ સ્વાસ્થ્ય માટે <b>મોટું જોખમ</b> છે. WHO મુજબ હવા પ્રદૂષણથી દર વર્ષે લગભગ <b>70 લાખ (7 મિલિયન)</b> વહેલા મૃત્યુ થાય છે.</p><ul><li>અસર માર્ગ: <b>શ્વાસ (Inhalation), ખોરાક-પાણી (Ingestion), ત્વચા સંપર્ક (Dermal)</b></li><li>સૌથી વધુ જોખમી: બાળકો, વૃદ્ધો, સગર્ભા સ્ત્રીઓ, પહેલેથી બીમાર</li><li><b>Lancet Commission on Pollution and Health (2017)</b>: પ્રદૂષણ = વિશ્વમાં વહેલા મૃત્યુનું સૌથી મોટું પર્યાવરણીય કારણ</li></ul>"],["હવા પ્રદૂષકો અને સ્વાસ્થ્ય અસર","<div class=\"tw\"><table><thead><tr><th>પ્રદૂષક</th><th>સ્વાસ્થ્ય અસર</th></tr></thead><tbody><tr><td><b>PM₂.₅</b></td><td>ફેફસાંમાં ઊંડે અને લોહીમાં – હૃદય રોગ, ફેફસાંનું કેન્સર, સ્ટ્રોક</td></tr><tr><td><b>PM₁₀</b></td><td>શ્વસન માર્ગ, દમ (Asthma)</td></tr><tr><td><b>CO</b></td><td>હિમોગ્લોબિન સાથે જોડાઈ <b>Carboxyhaemoglobin</b> – ઓક્સિજન પરિવહન ઘટે</td></tr><tr><td><b>SO₂</b></td><td>શ્વસન તકલીફ, બ્રોન્કાઇટિસ</td></tr><tr><td><b>NO₂</b></td><td>ફેફસાંમાં સોજો, શ્વસન ચેપ</td></tr><tr><td><b>O₃ (ભૂમિ)</b></td><td>આંખ-ગળામાં બળતરા, ફેફસાં કાર્ય ઘટે</td></tr><tr><td><b>Lead (સીસું)</b></td><td>બાળકોમાં મગજ વિકાસ પર અસર, IQ ઘટે</td></tr><tr><td><b>Benzene</b></td><td>લ્યુકેમિયા (લોહીનું કેન્સર)</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>CO = \"<b>સાયલન્ટ કિલર</b>\" (રંગહીન, ગંધહીન)</span></div>"],["ઘરની અંદરનું હવા પ્રદૂષણ (Indoor Air Pollution)","<ul><li>સ્રોત: <b>ચૂલામાં લાકડું, છાણ, કોલસો</b> (Solid fuels), તમાકુનો ધુમાડો, Radon, ફૂગ</li><li><b>Sick Building Syndrome</b>: બંધ ઇમારતમાં માથાનો દુખાવો, થાક</li><li><b>Radon</b>: કિરણોત્સર્ગી વાયુ – ફેફસાંના કેન્સરનું બીજું મુખ્ય કારણ</li><li><b>Formaldehyde</b>: ફર્નિચર, રંગ</li><li>ઉકેલ: <b>PM ઉજ્જ્વલા યોજના (2016)</b> – LPG જોડાણ, હવા-ઉજાસ</li></ul>"],["જળ પ્રદૂષણ અને સ્વાસ્થ્ય","<div class=\"tw\"><table><thead><tr><th>પ્રદૂષક</th><th>રોગ/અસર</th></tr></thead><tbody><tr><td><b>પારો (Mercury)</b></td><td><b>મીનામાટા રોગ</b> (જાપાન, 1956) – ચેતાતંત્ર</td></tr><tr><td><b>કેડમિયમ (Cadmium)</b></td><td><b>ઇટાઇ-ઇટાઇ રોગ</b> (જાપાન) – હાડકાં, કિડની</td></tr><tr><td><b>આર્સેનિક (Arsenic)</b></td><td><b>Arsenicosis</b> – ત્વચા જખમ, કેન્સર (પશ્ચિમ બંગાળ, બાંગ્લાદેશ)</td></tr><tr><td><b>ફ્લોરાઇડ (વધુ)</b></td><td><b>Fluorosis</b> – દાંત અને હાડકાં (ગુજરાત, રાજસ્થાન)</td></tr><tr><td><b>નાઇટ્રેટ</b></td><td><b>Blue Baby Syndrome</b> (Methaemoglobinaemia)</td></tr><tr><td><b>સીસું (Lead)</b></td><td>ચેતાતંત્ર, એનીમિયા</td></tr><tr><td>જૈવિક (બેક્ટેરિયા/વાયરસ)</td><td>કોલેરા, ટાઇફોઇડ, ઝાડા, કમળો (Hepatitis A/E)</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>ટ્રિક: \"<b>પા-મી, કે-ઇટા, ના-બ્લૂ, ફ્લો-હાડકાં</b>\"</span></div>"],["ઘોંઘાટ, કિરણોત્સર્ગ અને અન્ય","<ul><li><b>ઘોંઘાટ</b>: બહેરાશ, ઊંઘમાં ખલેલ, હાઇ બ્લડ પ્રેશર, તણાવ; 80-85 dB થી વધુ લાંબો સમય હાનિકારક</li><li><b>કિરણોત્સર્ગ (Radiation)</b>: કેન્સર, આનુવંશિક ખામી – ચેર્નોબિલ (1986)</li><li><b>UV કિરણો</b> (ઓઝોન ક્ષયથી): ત્વચા કેન્સર, મોતિયો (Cataract), રોગપ્રતિકારક શક્તિ ઘટે</li><li><b>Asbestos</b>: <b>Asbestosis</b>, Mesothelioma (ફેફસાં)</li><li><b>Silica dust</b>: <b>Silicosis</b> (ખાણ, પથ્થર ઉદ્યોગ – ગુજરાતમાં ખંભાત અકીક ઉદ્યોગ)</li><li><b>કોલસાની ધૂળ</b>: <b>Black lung disease</b> (Pneumoconiosis)</li></ul>"],["ઔદ્યોગિક દુર્ઘટનાઓ","<div class=\"tw\"><table><thead><tr><th>દુર્ઘટના</th><th>વર્ષ</th><th>પદાર્થ</th></tr></thead><tbody><tr><td><b>ભોપાલ ગેસ દુર્ઘટના</b></td><td><b>2-3 ડિસેમ્બર 1984</b></td><td><b>MIC (Methyl Isocyanate)</b> – Union Carbide</td></tr><tr><td>મીનામાટા</td><td>1956</td><td>પારો</td></tr><tr><td>ચેર્નોબિલ (યુક્રેન)</td><td>1986</td><td>કિરણોત્સર્ગ</td></tr><tr><td>લંડન Smog</td><td>1952</td><td>SO₂ + ધુમાડો</td></tr><tr><td>Love Canal (USA)</td><td>1978</td><td>ઝેરી રાસાયણિક કચરો</td></tr><tr><td>Seveso (ઇટાલી)</td><td>1976</td><td>Dioxin</td></tr><tr><td>વિશાખાપટ્ટનમ LG Polymers</td><td>2020</td><td>Styrene</td></tr></tbody></table></div><ul><li>ભોપાલ પછી: <b>Environment Protection Act 1986</b>, Public Liability Insurance Act 1991</li></ul>"],["જંતુનાશક અને રસાયણો","<ul><li><b>DDT</b>: Biomagnification; પક્ષીઓના ઈંડાના કવચ પાતળા – <b>Rachel Carson, \"Silent Spring\" (1962)</b></li><li><b>POPs (Persistent Organic Pollutants)</b>: લાંબા સમય ટકે – <b>Stockholm Convention (2001)</b></li><li><b>Endocrine disruptors</b>: અંતઃસ્ત્રાવ તંત્ર પર અસર (BPA)</li><li><b>Endosulfan</b>: કેરળ (કાસરગોડ) માં આરોગ્ય સમસ્યા; ભારતમાં 2011 માં પ્રતિબંધ</li><li><b>Microplastics</b>: ખોરાક-પાણી દ્વારા શરીરમાં</li></ul>"],["સ્વાસ્થ્ય રક્ષણના ઉપાયો","<ul><li>સ્વચ્છ ઇંધણ (LPG, વીજળી), જાહેર પરિવહન, EV</li><li>પીવાના પાણીનું શુદ્ધિકરણ – <b>જલ જીવન મિશન (2019)</b>: \"હર ઘર જલ\"</li><li><b>સ્વચ્છ ભારત મિશન (2014)</b>: ખુલ્લામાં શૌચ મુક્તિ</li><li><b>NCAP (2019)</b>: શહેરોમાં PM ઘટાડો</li><li>માસ્ક (N95), AQI ચેતવણી</li><li>વ્યવસાયિક સુરક્ષા: PPE, ધૂળ નિયંત્રણ</li><li><b>WHO Air Quality Guidelines (2021)</b>: PM₂.₅ વાર્ષિક 5 µg/m³</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>PM2.5</b></td><td>Fine particulate matter with diameter up to 2.5 micrometres</td></tr><tr><td><b>Carbon monoxide</b></td><td>Gas impairing oxygen transport in the body</td></tr><tr><td><b>Lead exposure</b></td><td>Toxic exposure affecting multiple body systems</td></tr><tr><td><b>Noise exposure</b></td><td>Exposure potentially damaging hearing</td></tr><tr><td><b>Contaminated drinking water</b></td><td>Water posing infection or toxic exposure risks</td></tr><tr><td><b>Heat stress</b></td><td>Illness risk from excessive heat</td></tr><tr><td><b>Respiratory irritation</b></td><td>Airway discomfort from pollutants</td></tr><tr><td><b>Exposure route</b></td><td>Pathway by which a substance reaches the body</td></tr><tr><td><b>Dose</b></td><td>Amount of substance received</td></tr><tr><td><b>Vulnerable population</b></td><td>Group more susceptible to harmful effects</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>મીનામાટા = પારો; ઇટાઇ-ઇટાઇ = કેડમિયમ; Blue baby = નાઇટ્રેટ</li><li>Fluorosis = વધુ ફ્લોરાઇડ; Arsenicosis = આર્સેનિક</li><li>ભોપાલ 1984 = MIC; Silent Spring = Rachel Carson (DDT)</li><li>CO = Carboxyhaemoglobin; PM₂.₅ = લોહી સુધી પહોંચે</li><li>Silicosis = સિલિકા; Asbestosis = એસ્બેસ્ટોસ</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Blue Baby Syndrome નાઇટ્રેટથી થાય છે – ફ્લોરાઇડથી નહીં.</span></div>"]],"9-4":[["કુદરતી અને ઊર્જા સ્રોતો – પરિચય","<p><b>કુદરતી સંસાધન (Natural Resources)</b> = પ્રકૃતિમાંથી મળતા ઉપયોગી પદાર્થો.</p><div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>અર્થ</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>પુનઃપ્રાપ્ય (Renewable)</b></td><td>કુદરતી રીતે ફરી ભરાય</td><td>સૂર્ય, પવન, પાણી, જંગલ, biomass</td></tr><tr><td><b>અપુનઃપ્રાપ્ય (Non-renewable)</b></td><td>મર્યાદિત, ફરી બનતા લાખો વર્ષ લાગે</td><td>કોલસો, પેટ્રોલિયમ, કુદરતી ગેસ, યુરેનિયમ</td></tr><tr><td><b>અખૂટ (Inexhaustible)</b></td><td>ખૂટે નહીં</td><td>સૂર્ય પ્રકાશ, પવન</td></tr></tbody></table></div><ul><li><b>પરંપરાગત (Conventional)</b>: કોલસો, તેલ, ગેસ, જળવિદ્યુત; <b>બિનપરંપરાગત (Non-conventional)</b>: સૌર, પવન, ભૂતાપીય, ભરતી, biomass</li></ul>"],["સૌર ઊર્જા (Solar Energy)","<ul><li><b>Photovoltaic (PV)</b>: સૂર્યપ્રકાશ → સીધી વીજળી (સિલિકોન સેલ)</li><li><b>Solar thermal / CSP</b>: ગરમી દ્વારા વીજળી, સોલાર કુકર, વોટર હીટર</li><li><b>National Solar Mission (JNNSM)</b>: <b>2010</b> – NAPCC નું એક મિશન</li><li><b>ISA (International Solar Alliance)</b>: <b>2015</b> (COP21, પેરિસ) – ભારત-ફ્રાન્સ; મુખ્યાલય <b>ગુરુગ્રામ</b></li><li>ગુજરાત: <b>ચારણકા સોલાર પાર્ક</b> (પાટણ, 2012); <b>ખાવડા</b> (કચ્છ) – વિશ્વનો સૌથી મોટો નવીનીકરણીય ઊર્જા પાર્ક (નિર્માણાધીન, ~30 GW)</li><li><b>PM-KUSUM</b> (ખેડૂતો માટે સોલાર પંપ), <b>PM Surya Ghar</b> (2024, છત પર સોલાર)</li><li>★ <b>\"One Sun One World One Grid\" (OSOWOG)</b></li></ul>"],["પવન ઊર્જા (Wind Energy)","<ul><li>પવનચક્કી (Wind turbine) – ગતિ ઊર્જા → વીજળી</li><li>ભારતની સ્થાપિત પવન ક્ષમતા: વિશ્વમાં <b>ચોથું</b> સ્થાન (આસપાસ)</li><li>અગ્રણી રાજ્યો: <b>ગુજરાત, તમિલનાડુ</b>, કર્ણાટક, મહારાષ્ટ્ર, રાજસ્થાન</li><li><b>Muppandal</b> (તમિલનાડુ): ભારતના મોટા પવન ફાર્મમાંથી એક</li><li><b>Offshore wind</b>: સમુદ્રમાં – ગુજરાત અને તમિલનાડુ કાંઠે સંભાવના</li><li><b>NIWE</b>: National Institute of Wind Energy, ચેન્નઈ</li><li>મર્યાદા: પવનની અનિયમિતતા, પક્ષીઓ પર અસર, ઘોંઘાટ</li></ul>"],["જળ, ભૂતાપીય અને ભરતી ઊર્જા","<ul><li><b>જળવિદ્યુત (Hydropower)</b>: બંધમાંથી પાણી → ટર્બાઇન; મોટા (&gt;25 MW) અને નાના; સૌથી મોટો નવીનીકરણીય સ્રોત (વિશ્વમાં)</li><li>ભારત: <b>ટિહરી</b> (ઉત્તરાખંડ – સૌથી ઊંચો બંધ), <b>ભાખરા-નાંગલ</b>, <b>સરદાર સરોવર</b> (ગુજરાત)</li><li><b>ભૂતાપીય (Geothermal)</b>: પૃથ્વીની આંતરિક ગરમી – ભારતમાં <b>પુગા ખીણ (લદ્દાખ)</b>, Manikaran (હિમાચલ)</li><li><b>ભરતી ઊર્જા (Tidal)</b>: <b>ખંભાતનો અખાત અને કચ્છનો અખાત</b> (ગુજરાત), સુંદરવન</li><li><b>તરંગ ઊર્જા (Wave)</b>, <b>OTEC</b> (Ocean Thermal Energy Conversion)</li></ul><div class=\"tk\"><i>★</i><span>ભરતી ઊર્જા = \"<b>ખંભાત અને કચ્છ</b>\"</span></div>"],["Biomass અને Bioenergy","<ul><li>કૃષિ અવશેષ, લાકડું, છાણ, કચરો → ઊર્જા</li><li><b>બાયોગેસ</b>: મુખ્યત્વે <b>મિથેન (CH₄) ~50-70%</b> + CO₂; છાણ/કચરાનું <b>અવાયુ વિઘટન (Anaerobic digestion)</b></li><li><b>Biofuels</b>: <b>Ethanol</b> (શેરડી, મકાઈ), <b>Biodiesel</b> (જેટ્રોફા)</li><li><b>National Policy on Biofuels (2018, સુધારો 2022)</b>: <b>2025-26 સુધીમાં 20% ઇથેનોલ મિશ્રણ (E20)</b></li><li><b>GOBAR-Dhan</b> (2018): છાણમાંથી બાયોગેસ</li><li><b>SATAT</b> (2018): Compressed Bio-Gas (CBG)</li><li>★ પ્રથમ પેઢી = ખોરાક પાક; બીજી = અવશેષ; ત્રીજી = લીલ (Algae)</li></ul>"],["પરમાણુ ઊર્જા (Nuclear Energy)","<ul><li><b>વિખંડન (Fission)</b>: ભારે પરમાણુ (U-235) તૂટે → ઊર્જા (હાલના રિએક્ટર)</li><li><b>સંલયન (Fusion)</b>: હલકા પરમાણુ જોડાય – સૂર્યમાં; <b>ITER</b> (ફ્રાન્સ) પ્રાયોગિક</li><li>ભારતના <b>ત્રણ તબક્કા કાર્યક્રમ</b> (<b>Homi J. Bhabha</b>): PHWR (કુદરતી યુરેનિયમ) → FBR (પ્લુટોનિયમ) → <b>થોરિયમ</b> આધારિત</li><li>ભારત પાસે વિશ્વના મોટા <b>થોરિયમ</b> ભંડાર (કેરળ મોનાઝાઇટ રેતી)</li><li>મથકો: <b>તારાપુર (1969 – પ્રથમ)</b>, <b>કાકરાપાર (ગુજરાત)</b>, કુડનકુલમ (સૌથી મોટું), રાવતભાટા, કૈગા, નરોરા</li><li>સંસ્થાઓ: <b>DAE, BARC, NPCIL, AERB</b></li></ul>"],["જમીન, પાણી અને જંગલ સંસાધન","<ul><li><b>જમીન (Land/Soil)</b>: કૃષિ, રહેઠાણ – ધોવાણ, રણીકરણ, લવણતા મુખ્ય ખતરા</li><li><b>Soil Health Card યોજના (2015)</b></li><li><b>પાણી</b>: પૃથ્વી પરનું માત્ર ~<b>2.5%</b> મીઠું પાણી; તેમાંથી મોટાભાગ હિમનદીમાં; ભારતમાં વિશ્વની ~18% વસ્તી પણ ~4% મીઠું પાણી</li><li><b>જલ શક્તિ અભિયાન – Catch the Rain</b>, <b>અટલ ભૂજલ યોજના (2019)</b></li><li><b>જંગલ</b>: ઇમારતી લાકડું, ઔષધિ, કાર્બન સિંક, જળચક્ર, જૈવ વિવિધતા</li><li><b>Green India Mission</b> (NAPCC નું મિશન)</li></ul>"],["ભારતના ઊર્જા લક્ષ્યો","<ul><li><b>Panchamrit</b> (COP26, ગ્લાસગો, 2021):</li><li>2030 સુધી <b>500 GW</b> બિન-અશ્મિભૂત ઊર્જા ક્ષમતા</li><li>2030 સુધી ઊર્જા જરૂરિયાતનો <b>50%</b> નવીનીકરણીય સ્રોતમાંથી</li><li>2030 સુધી <b>1 અબજ ટન</b> કાર્બન ઉત્સર્જન ઘટાડો</li><li>2030 સુધી અર્થતંત્રની <b>કાર્બન તીવ્રતા 45%</b> ઘટાડો (2005 ની તુલનામાં)</li><li><b>2070 સુધી Net Zero</b></li><li><b>National Green Hydrogen Mission (2023)</b>: 2030 સુધી વાર્ષિક 5 MMT ગ્રીન હાઇડ્રોજન</li><li>મંત્રાલય: <b>MNRE</b> (Ministry of New and Renewable Energy)</li></ul><div class=\"tk\"><i>★</i><span>Panchamrit = \"<b>500 – 50% – 1 અબજ – 45% – 2070</b>\"</span></div>"],["ઊર્જા સંરક્ષણ અને કાર્યક્ષમતા","<ul><li><b>Energy Conservation Act 2001</b> → <b>BEE</b> (Bureau of Energy Efficiency, 2002)</li><li><b>Star rating</b> (ઉપકરણો પર ઊર્જા લેબલ)</li><li><b>UJALA (2015)</b>: LED બલ્બ વિતરણ</li><li><b>PAT</b> (Perform, Achieve and Trade): ઉદ્યોગ ઊર્જા કાર્યક્ષમતા</li><li><b>ECBC</b>: Energy Conservation Building Code</li><li><b>Electric vehicles</b>: FAME યોજના (2015)</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Solar energy</b></td><td>Energy obtained from sunlight</td></tr><tr><td><b>Wind energy</b></td><td>Energy obtained from moving air</td></tr><tr><td><b>Hydropower</b></td><td>Energy obtained from flowing or falling water</td></tr><tr><td><b>Geothermal energy</b></td><td>Energy from the Earth&#x27;s internal heat</td></tr><tr><td><b>Biomass</b></td><td>Organic material used as an energy resource</td></tr><tr><td><b>Nuclear fission</b></td><td>Splitting nuclei to release energy</td></tr><tr><td><b>Coal</b></td><td>Carbon-rich fossil fuel</td></tr><tr><td><b>Petroleum</b></td><td>Liquid fossil-fuel mixture</td></tr><tr><td><b>Natural gas</b></td><td>Gaseous fossil fuel mainly containing methane</td></tr><tr><td><b>Forest resource</b></td><td>Goods and ecological services supplied by forests</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>પુનઃપ્રાપ્ય: સૂર્ય, પવન, પાણી, biomass, ભૂતાપીય; અપુનઃપ્રાપ્ય: કોલસો, તેલ, ગેસ, યુરેનિયમ</li><li>ISA = 2015, ગુરુગ્રામ; Solar Mission = 2010</li><li>બાયોગેસ = મુખ્યત્વે મિથેન</li><li>ભૂતાપીય = પુગા (લદ્દાખ); ભરતી = ખંભાત/કચ્છ</li><li>તારાપુર = પ્રથમ પરમાણુ મથક; ત્રીજો તબક્કો = થોરિયમ</li><li>Net Zero = 2070; 500 GW = 2030</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: પરમાણુ ઊર્જા ઓછી કાર્બન છે પણ <b>અપુનઃપ્રાપ્ય</b> છે (યુરેનિયમ મર્યાદિત).</span></div>"]],"9-5":[["કુદરતી જોખમો અને આપત્તિઓ – પરિચય","<ul><li><b>જોખમ (Hazard)</b>: નુકસાન કરી શકે તેવી સંભવિત ઘટના (ભૂકંપ, વાવાઝોડું)</li><li><b>આપત્તિ (Disaster)</b>: જોખમ જ્યારે સમુદાયની <b>સામનો કરવાની ક્ષમતા</b> કરતાં વધુ નુકસાન કરે</li><li><b>સંવેદનશીલતા (Vulnerability)</b>: નુકસાન સહન કરવાની નબળાઈ</li><li><b>જોખમ સૂત્ર</b>: ★ <b>Risk = Hazard × Vulnerability ÷ Capacity</b></li><li>UNDRR (UN Office for Disaster Risk Reduction) વ્યાખ્યા</li></ul><div class=\"tk\"><i>★</i><span>\"જોખમ ≠ આપત્તિ; સંવેદનશીલતા જોખમને આપત્તિમાં ફેરવે\"</span></div>"],["આપત્તિઓનું વર્ગીકરણ","<div class=\"tw\"><table><thead><tr><th>પ્રકાર</th><th>ઉદાહરણ</th></tr></thead><tbody><tr><td><b>ભૂસ્તરીય (Geological)</b></td><td>ભૂકંપ, જ્વાળામુખી, ભૂસ્ખલન, ત્સુનામી</td></tr><tr><td><b>જળ-હવામાન (Hydro-meteorological)</b></td><td>પૂર, દુષ્કાળ, વાવાઝોડું (Cyclone), ગરમ લહેર, વાદળ ફાટવું, વીજળી</td></tr><tr><td><b>જૈવિક (Biological)</b></td><td>રોગચાળો (COVID-19), તીડ આક્રમણ</td></tr><tr><td><b>માનવસર્જિત (Man-made)</b></td><td>ઔદ્યોગિક દુર્ઘટના, આગ, આતંકવાદ, તેલ ઢોળાવ</td></tr></tbody></table></div><ul><li><b>ઝડપી (Rapid onset)</b>: ભૂકંપ, પૂર; <b>ધીમી (Slow onset)</b>: દુષ્કાળ, રણીકરણ</li><li>ભારત: ~<b>59%</b> વિસ્તાર ભૂકંપ સંવેદનશીલ; ~<b>12%</b> પૂર સંવેદનશીલ; ~<b>68%</b> ખેતીલાયક જમીન દુષ્કાળ સંવેદનશીલ; ~5,700 કિમી કાંઠો વાવાઝોડા સંવેદનશીલ</li></ul>"],["ભૂકંપ (Earthquake)","<ul><li>કારણ: ટેક્ટોનિક પ્લેટોની ગતિ</li><li><b>કેન્દ્ર (Focus/Hypocentre)</b>: ભૂગર્ભમાં ઉદ્ભવ સ્થાન; <b>અધિકેન્દ્ર (Epicentre)</b>: તેની બરાબર ઉપર સપાટી પર</li><li>માપ: <b>Richter scale</b> (તીવ્રતા – Magnitude, લઘુગણકીય), <b>Moment magnitude</b>, <b>Mercalli scale</b> (અસર – Intensity)</li><li>સાધન: <b>Seismograph</b></li><li>ભારતમાં <b>4 ભૂકંપ ઝોન (II, III, IV, V)</b>; ઝોન V = સૌથી જોખમી (કચ્છ, ઉત્તર-પૂર્વ, હિમાલય, આંદામાન)</li><li><b>ભુજ ભૂકંપ</b>: <b>26 જાન્યુઆરી 2001</b> – તીવ્રતા 7.7</li></ul><div class=\"tk\"><i>★</i><span>Richter = તીવ્રતા (Magnitude); Mercalli = અસર (Intensity)</span></div>"],["વાવાઝોડું, પૂર અને ત્સુનામી","<ul><li><b>ચક્રવાત (Cyclone)</b>: હિંદ મહાસાગરમાં Cyclone, એટલાન્ટિકમાં <b>Hurricane</b>, પેસિફિકમાં <b>Typhoon</b></li><li>ભારતમાં ચેતવણી: <b>IMD</b>; બંગાળની ખાડીમાં વધુ (ઓડિશા સુપર સાયક્લોન 1999, Phailin 2013, ગુજરાતમાં <b>તૌકતે 2021, બિપરજોય 2023</b>)</li><li><b>પૂર</b>: ભારે વરસાદ, વાદળ ફાટવું, બંધ તૂટવો – આસામ, બિહાર સૌથી પૂર સંવેદનશીલ</li><li><b>ત્સુનામી</b>: સમુદ્રી ભૂકંપથી વિશાળ તરંગ – <b>26 ડિસેમ્બર 2004</b> (હિંદ મહાસાગર)</li><li><b>INCOIS</b> (હૈદરાબાદ): ત્સુનામી ચેતવણી કેન્દ્ર (2007)</li></ul>"],["દુષ્કાળ, ભૂસ્ખલન અને ગરમ લહેર","<ul><li><b>દુષ્કાળ પ્રકાર</b>: <b>હવામાનશાસ્ત્રીય</b> (વરસાદની ઉણપ), <b>જળશાસ્ત્રીય</b> (જળ સ્રોત ઘટે), <b>કૃષિ</b> (જમીનમાં ભેજ ઘટે), સામાજિક-આર્થિક</li><li>IMD મુજબ સામાન્ય કરતાં <b>25% થી વધુ ઓછો</b> વરસાદ = દુષ્કાળ (માપદંડ મુજબ)</li><li><b>ભૂસ્ખલન (Landslide)</b>: પશ્ચિમ ઘાટ, હિમાલય – વનનાશ અને ભારે વરસાદ</li><li><b>ગરમ લહેર (Heat wave)</b>: મેદાની વિસ્તારમાં મહત્તમ તાપમાન ≥ 40°C અને સામાન્ય કરતાં 4.5°C+ વધુ</li><li><b>અમદાવાદ Heat Action Plan (2013)</b>: દક્ષિણ એશિયાનો પ્રથમ</li><li><b>વીજળી (Lightning)</b>: ભારતમાં કુદરતી આપત્તિના મૃત્યુનું મોટું કારણ</li></ul>"],["આપત્તિ વ્યવસ્થાપન ચક્ર","<div class=\"tw\"><table><thead><tr><th>તબક્કો</th><th>પ્રવૃત્તિ</th></tr></thead><tbody><tr><td><b>શમન (Mitigation)</b></td><td>જોખમ ઘટાડવું – ભૂકંપ પ્રતિરોધક બાંધકામ, બંધ</td></tr><tr><td><b>સજ્જતા (Preparedness)</b></td><td>ચેતવણી પ્રણાલી, તાલીમ, મોક ડ્રિલ</td></tr><tr><td><b>પ્રતિભાવ (Response)</b></td><td>બચાવ, રાહત, તબીબી સહાય</td></tr><tr><td><b>પુનઃપ્રાપ્તિ (Recovery)</b></td><td>પુનર્વસન, પુનર્નિર્માણ – <b>Build Back Better</b></td></tr></tbody></table></div><ul><li>પૂર્વ-આપત્તિ: શમન + સજ્જતા; પશ્ચાત-આપત્તિ: પ્રતિભાવ + પુનઃપ્રાપ્તિ</li><li>અભિગમ પરિવર્તન: <b>રાહત-કેન્દ્રિત → જોખમ ઘટાડા (DRR) કેન્દ્રિત</b></li></ul><div class=\"tk\"><i>★</i><span>ચક્ર = \"<b>શ-સ-પ્ર-પુ</b>\"</span></div>"],["શમનની વ્યૂહરચનાઓ","<ul><li><b>માળખાકીય (Structural)</b>: ભૂકંપ પ્રતિરોધક ઇમારત (BIS કોડ), બંધ, પાળા, ચક્રવાત આશ્રયસ્થાન, Retrofitting</li><li><b>બિન-માળખાકીય (Non-structural)</b>: જમીન ઉપયોગ આયોજન, બિલ્ડિંગ કોડ અમલ, <b>વહેલી ચેતવણી (Early warning)</b>, જાગૃતિ, વીમો, સમુદાય આધારિત DRR (CBDRM)</li><li><b>મેન્ગ્રોવ</b> અને કાંઠાના જંગલો – ત્સુનામી/ચક્રવાત સામે કુદરતી રક્ષણ</li><li><b>Nature-based solutions</b></li><li><b>Hazard zonation mapping</b>, GIS, ઉપગ્રહ (ISRO)</li></ul>"],["કાનૂની અને સંસ્થાકીય માળખું","<ul><li><b>Disaster Management Act, 2005</b> (સુધારો 2025) → <b>NDMA</b> (અધ્યક્ષ: <b>વડાપ્રધાન</b>), SDMA (મુખ્યમંત્રી), DDMA (કલેક્ટર)</li><li><b>NDRF</b> (National Disaster Response Force): 2006</li><li><b>NIDM</b> (National Institute of Disaster Management): તાલીમ-સંશોધન</li><li><b>NDMP</b> (National Disaster Management Plan): 2016 – Sendai Framework અનુરૂપ</li><li><b>GSDMA</b> (Gujarat State Disaster Management Authority): 2001 ભૂકંપ પછી; <b>Gujarat State DM Act 2003</b> – દેશનો પ્રથમ રાજ્ય કાયદો</li><li><b>CDRI</b> (Coalition for Disaster Resilient Infrastructure): ભારત, <b>2019</b></li></ul>"],["આંતરરાષ્ટ્રીય માળખું","<div class=\"tw\"><table><thead><tr><th>માળખું</th><th>વર્ષ</th></tr></thead><tbody><tr><td>IDNDR (International Decade for Natural Disaster Reduction)</td><td>1990-1999</td></tr><tr><td>Yokohama Strategy</td><td>1994</td></tr><tr><td><b>Hyogo Framework for Action</b></td><td><b>2005-2015</b></td></tr><tr><td><b>Sendai Framework for DRR</b></td><td><b>2015-2030</b> – 7 લક્ષ્યો, 4 પ્રાથમિકતા</td></tr></tbody></table></div><ul><li><b>13 ઓક્ટોબર</b> = આંતરરાષ્ટ્રીય આપત્તિ જોખમ ઘટાડો દિવસ</li><li>Sendai ના 4 પ્રાથમિકતા: જોખમ સમજવું, જોખમ શાસન મજબૂત કરવું, DRR માં રોકાણ, સજ્જતા અને Build Back Better</li></ul>"],["મુખ્ય વ્યાખ્યાઓ (Key Definitions)","<p>પ્રશ્ન બેંકમાં વારંવાર પૂછાતી મુખ્ય પરિભાષા અને તેનો અર્થ:</p><div class=\"tw\"><table><thead><tr><th>પરિભાષા (Term)</th><th>અર્થ (Meaning)</th></tr></thead><tbody><tr><td><b>Hazard</b></td><td>Potentially damaging event or condition</td></tr><tr><td><b>Disaster</b></td><td>Serious disruption exceeding coping capacity</td></tr><tr><td><b>Vulnerability</b></td><td>Susceptibility to adverse effects</td></tr><tr><td><b>Exposure</b></td><td>People or assets located in hazard-prone areas</td></tr><tr><td><b>Mitigation</b></td><td>Reducing potential disaster impacts</td></tr><tr><td><b>Preparedness</b></td><td>Planning and readiness before an event</td></tr><tr><td><b>Response</b></td><td>Immediate action during or after an event</td></tr><tr><td><b>Recovery</b></td><td>Restoring and improving affected systems</td></tr><tr><td><b>Early warning</b></td><td>Timely information enabling protective action</td></tr><tr><td><b>Resilience</b></td><td>Capacity to withstand and recover from shocks</td></tr></tbody></table></div><div class=\"tk\"><i>★</i><span>આ પરિભાષા MCQ માં સીધી પૂછાય છે – યાદ રાખો.</span></div>"],["પરીક્ષા ટિપ્સ અને ઝડપી પુનરાવર્તન","<ul><li>Risk = Hazard × Vulnerability ÷ Capacity</li><li>Richter = Magnitude; Mercalli = Intensity; ઝોન V = સૌથી જોખમી</li><li>DM Act 2005; NDMA અધ્યક્ષ = PM; NDRF = 2006</li><li>Sendai = 2015-2030; Hyogo = 2005-2015</li><li>ભુજ = 26 જાન્યુ 2001; ત્સુનામી = 26 ડિસે 2004</li><li>INCOIS = ત્સુનામી ચેતવણી (હૈદરાબાદ)</li></ul><div class=\"tp\"><i>!</i><span>ટ્રેપ: Hurricane, Typhoon અને Cyclone એક જ ઘટના છે – માત્ર સમુદ્ર/સ્થાન પ્રમાણે નામ જુદા.</span></div>"]],"9-6":[["પર્યાવરણ સંરક્ષણ – પરિચય","<p>પર્યાવરણ સંરક્ષણ માટે <b>રાષ્ટ્રીય કાયદા, નીતિઓ અને આંતરરાષ્ટ્રીય કરારો</b> મહત્વના છે.</p><ul><li><b>બંધારણીય જોગવાઈ</b>:</li><li><b>અનુચ્છેદ 48A</b> (રાજ્યનીતિના માર્ગદર્શક સિદ્ધાંત): રાજ્ય પર્યાવરણ, જંગલ અને વન્યજીવનું રક્ષણ-સુધારણા કરશે</li><li><b>અનુચ્છેદ 51A(g)</b> (મૂળભૂત ફરજ): નાગરિક પર્યાવરણનું રક્ષણ કરશે</li><li>આ બંને <b>42મા બંધારણ સુધારા (1976)</b> થી ઉમેરાયા</li><li><b>અનુચ્છેદ 21</b>: સ્વચ્છ પર્યાવરણનો અધિકાર (ન્યાયિક અર્થઘટન)</li></ul><div class=\"tk\"><i>★</i><span>48A = <b>રાજ્યની</b> ફરજ; 51A(g) = <b>નાગરિકની</b> ફરજ</span></div>"],["પર્યાવરણ સંરક્ષણ ધારો 1986 (EPA)","<ul><li><b>ભોપાલ ગેસ દુર્ઘટના (1984)</b> પછી ઘડાયો</li><li><b>Umbrella Act</b>: કેન્દ્ર સરકારને વ્યાપક સત્તા</li><li>અમલ: <b>19 નવેમ્બર 1986</b></li><li><b>અનુચ્છેદ 253</b> હેઠળ (Stockholm 1972 ના નિર્ણયો અમલ કરવા)</li><li>કેન્દ્ર સરકારને ધોરણો નક્કી કરવા, ઉદ્યોગ બંધ કરાવવા, નિરીક્ષણ કરવાની સત્તા</li><li><b>EIA Notification</b> (1994, 2006) આ જ ધારા હેઠળ</li><li><b>CRZ</b> (Coastal Regulation Zone) Notification (1991, 2011, 2019)</li><li>દંડ: 5 વર્ષ સુધી કેદ અને/અથવા ₹1 લાખ સુધી દંડ (મૂળ જોગવાઈ; 2023 જન વિશ
